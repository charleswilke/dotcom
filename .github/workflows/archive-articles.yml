name: Preserve Substack articles
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: article-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tools/sync-article-archive.js --backfill
      - run: node tools/build-article-archive.js
      - run: node --test tests/article-archive.test.cjs tests/related-articles.test.cjs
      - name: Commit retained articles
        run: |
          git add articles/archive.json cache_substack_feed.json sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve latest Substack articles'
          git push origin HEAD:main
