    title: cfg.title,
    alive: true,
    phase: 1,
    frame: 0,
    coreExposed: false,
    attackTimer: 0,
    entered: false,
    stageNum,
    // Meteor slam: summons two asteroids that converge and fire as a merged projectile
    slamTimer: 480,
    slamState: 'idle',    // 'idle' | 'telegraphing' | 'converging'
    slamProgress: 0,
    slamAsteroids: []     // [{x,y,tx,ty,verts,rotation,rotSpeed}] — two phantom rocks
  };
}

function updateBoss() {
  if (!boss || !boss.alive) return;
  boss.frame++;

  // Entrance
  if (!boss.entered) {
    boss.x -= 1.5;
    if (boss.x <= CONFIG.width - 120) {
      boss.entered = true;
      boss.attackTimer = 60;
    }
    return;
  }

  // Gentle vertical hover
  boss.y = CONFIG.height / 2 + Math.sin(boss.frame * 0.02) * 60;

  // Phase check
  const hpPct = boss.hp / boss.maxHp;
  if (hpPct < 0.5 && boss.phase === 1) {
    boss.phase = 2;
    boss.attackTimer = 0;
    spawnExplosion(boss.x, boss.y, 15, ['#ffffff', '#ff00aa']);
  }

  // Attack pattern
  boss.attackTimer--;
  if (boss.attackTimer <= 0) {
    if (boss.phase === 1) {
      // Spiral shots
      boss.coreExposed = false;
      const shots = 12;
      for (let i = 0; i < shots; i++) {
        const angle = (boss.frame * 0.05) + (i / shots) * Math.PI * 2;
        spawnEnemyBullet(boss.x, boss.y,
          Math.cos(angle) * 3,
          Math.sin(angle) * 3
        );
      }
      boss.attackTimer = 40;
      // Core exposed between attacks
      setTimeout(() => { if (boss) boss.coreExposed = true; }, 500);
      setTimeout(() => { if (boss) boss.coreExposed = false; }, 1500);
    } else {
      // Phase 2: faster spiral + ring bursts
      boss.coreExposed = false;
      const shots = 16;
      for (let i = 0; i < shots; i++) {
        const angle = (boss.frame * 0.08) + (i / shots) * Math.PI * 2;
        spawnEnemyBullet(boss.x, boss.y,
          Math.cos(angle) * 4,
          Math.sin(angle) * 4
        );
      }
      // Ring burst
      if (boss.frame % 3 === 0) {
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          spawnEnemyBullet(boss.x, boss.y,
            Math.cos(angle) * 2.5,
            Math.sin(angle) * 2.5
          );
        }
      }
      boss.attackTimer = 25;
      setTimeout(() => { if (boss) boss.coreExposed = true; }, 300);
      setTimeout(() => { if (boss) boss.coreExposed = false; }, 1000);
    }
  }

  // === METEOR SLAM — two phantom rocks converge and launch ===
  if (boss.slamState === 'idle') {
    boss.slamTimer--;
    if (boss.slamTimer <= 0) {
      // Spawn two phantom asteroids flanking the boss
      const d1 = generateAsteroidData(14), d2 = generateAsteroidData(14);
      boss.slamAsteroids = [
        { x: boss.x, y: boss.y - 90, verts: d1.verts, cracks: d1.cracks, rotation: 0, rotSpeed: 0.05 },
        { x: boss.x, y: boss.y + 90, verts: d2.verts, cracks: d2.cracks, rotation: 0, rotSpeed: -0.05 }
      ];
      boss.slamState = 'converging';
      boss.slamProgress = 0;
    }
  } else if (boss.slamState === 'converging') {
    boss.slamProgress += 1 / 70;
    for (const sa of boss.slamAsteroids) sa.rotation += sa.rotSpeed;
    if (boss.slamProgress >= 1) {
      // Launch merged asteroid — exits right first, then slams back in
      spawnLocalFlash(boss.x, boss.y, 55);
      const mergedData = generateAsteroidData(20);
      enemyBullets.push({
        x: boss.x, y: boss.y,
        vx: 13, vy: 0,
        radius: 18, alive: true,
        verts: mergedData.verts, cracks: mergedData.cracks,
        rotation: 0, rotSpeed: 0.06,
        isMerged: true, phase: 'exiting'
      });
      boss.slamAsteroids = [];
      boss.slamState = 'idle';
      boss.slamTimer = boss.phase === 1 ? 420 : 280;
    }
  }
}

function drawBoss() {
  if (!boss || !boss.alive) return;

  ctx.save();
  ctx.shadowColor = CONFIG.colors.boss;
  ctx.shadowBlur = 15;

  // Main sphere body
  ctx.fillStyle = CONFIG.colors.enemy;
  ctx.beginPath();
  ctx.arc(boss.x, boss.y, 40, 0, Math.PI * 2);
  ctx.fill();

  // Outer ring
  ctx.strokeStyle = CONFIG.colors.enemy;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(boss.x, boss.y, 50 + Math.sin(boss.frame * 0.05) * 5, 0, Math.PI * 2);
  ctx.stroke();

  // Core — glows when exposed
  if (boss.coreExposed) {
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffffff';
  } else {
    ctx.fillStyle = '#660044';
  }
  ctx.beginPath();
  ctx.arc(boss.x, boss.y, 12, 0, Math.PI * 2);
  ctx.fill();

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  for (let sy = boss.y - 40; sy < boss.y + 40; sy += 4) {
    ctx.fillRect(boss.x - 40, sy, 80, 2);
  }

  // HP bar
  ctx.fillStyle = '#330022';
  ctx.fillRect(boss.x - 40, boss.y - 60, 80, 6);
  ctx.fillStyle = boss.hp / boss.maxHp > 0.5 ? '#ff00aa' : '#ff4400';
  ctx.fillRect(boss.x - 40, boss.y - 60, 80 * (boss.hp / boss.maxHp), 6);

  // Slam asteroids — two converging red rocks during slamState = 'converging'
  if (boss.slamState === 'converging' && boss.slamAsteroids.length === 2) {
    const p = boss.slamProgress;
    for (const sa of boss.slamAsteroids) {
      // Lerp toward boss center
      const drawX = sa.x + (boss.x - sa.x) * p;
      const drawY = sa.y + (boss.y - sa.y) * p;
      ctx.save();
      ctx.translate(drawX, drawY);
      ctx.rotate(sa.rotation);
      ctx.shadowColor = '#ff2200';
      ctx.shadowBlur = 14 + p * 22;
      ctx.fillStyle = '#2a0000';
      ctx.beginPath();
      ctx.moveTo(sa.verts[0].x, sa.verts[0].y);
      for (let vi = 1; vi < sa.verts.length; vi++) ctx.lineTo(sa.verts[vi].x, sa.verts[vi].y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = `rgb(255,${Math.floor(80 * (1 - p))},0)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }

  ctx.restore();
}

function destroyBoss() {
  boss.alive = false;
  score += 5000;
  // Big explosion
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      spawnExplosion(
        boss.x + (Math.random() - 0.5) * 60,
        boss.y + (Math.random() - 0.5) * 60,
        20, explosionColors
      );
    }, i * 200);
  }
  // Screen flash
  screenFlash = 30;
  // Transition to stage clear after explosions
  setTimeout(() => {
    gameState = 'STAGE_CLEAR';
  }, 1500);
}

let screenFlash = 0;

// === MID-BOSS SYSTEM: THE SHEPHERD (enhanced gravwell) ===
let midBoss = null;
let midBossWarningTimer = 0;
let preMidBoss = false;   // true while waiting for mid-boss — asteroids get sucked right

function spawnMidBoss() {
  preMidBoss = false;   // suction phase ends when Shepherd arrives
  const orbData = [];
  // Inner ring: 4 small, fast
  for (let i = 0; i < 4; i++) {
    const d = generateAsteroidData(10);
    orbData.push({
      angle: (i / 4) * Math.PI * 2 + 0.3,
      orbitRadius: 52, orbitSpeed: 0.026,
      verts: d.verts, cracks: d.cracks,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() * 0.04 + 0.02) * (Math.random() < 0.5 ? 1 : -1),
      alive: true, respawnTimer: 0, respawnFrames: 280,
      merging: false, mergeProgress: 0
    });
  }
  // Outer ring: 3 larger, slower
  for (let i = 0; i < 3; i++) {
    const d = generateAsteroidData(15);
    orbData.push({
      angle: (i / 3) * Math.PI * 2,
      orbitRadius: 80, orbitSpeed: 0.014,
      verts: d.verts, cracks: d.cracks,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() * 0.03 + 0.01) * (Math.random() < 0.5 ? 1 : -1),
      alive: true, respawnTimer: 0, respawnFrames: 340,
      merging: false, mergeProgress: 0
    });
  }

  midBoss = {
    x: CONFIG.width + 80,
    y: CONFIG.height / 2,
    startY: CONFIG.height / 2,
    targetX: CONFIG.width - 200,
    hp: 40, maxHp: 40,
    alive: true,
    frame: 0,
    entered: false,
    flingTimer: 220,
    mergeTimer: 380,         // frames until first merge
    mergeState: 'idle',      // 'idle' | 'converging' | 'charging'
    mergeProgress: 0,        // 0→1 during converging
    mergeTargets: [],        // indices of the two merging asteroids
    mergeMidX: 0, mergeMidY: 0,  // world-space convergence point
    orbitingAsteroids: orbData,
    energy: 0, maxEnergy: 100,
    coreExposed: false,
    phase: 1,
    inboundTimer: 840,
    pendingInbounds: [],
    hitFlash: 0,
    displayHp: 40,
    // Gravity pulse wave (bullet pushback)
    gravityPulses: [],
    gravPulseTimer: 360,
    gravPulseCooldown: 360,
    gravPulseTelegraph: 0,
    // Gravity well pull (player tug — phase 2 only)
    gravWellPullTimer: 0,
    gravWellPullActive: false,
    gravWellPullDuration: 0,
    gravWellPullTelegraph: 0,
    // Shotgun fling tracking
    flingCount: 0
  };
}

// Begin the grab telegraph — asteroid wiggles for ~35 frames then exits right
function midBossFling() {
  if (!midBoss || !player.alive) return;
  const live = midBoss.orbitingAsteroids.filter(oa => oa.alive && !oa.merging && !oa.grabbed);
  if (live.length === 0) return;
  const oa = live[Math.floor(Math.random() * live.length)];
  oa.grabbed = true;
  oa.grabTimer = 38;
}

// Shotgun fling — grab 3-4 asteroids with spread aiming
function midBossShotgunFling() {
  if (!midBoss || !player.alive) return;
  const live = midBoss.orbitingAsteroids.filter(oa => oa.alive && !oa.merging && !oa.grabbed);
  const count = Math.min(live.length, 3 + Math.floor(Math.random() * 2));
  if (count < 2) { midBossFling(); return; }
  const shuffled = live.sort(() => Math.random() - 0.5).slice(0, count);
  shuffled.forEach((oa, idx) => {
    oa.grabbed = true;
    oa.grabTimer = 25 + idx * 4;
    oa.shotgunIndex = idx;
    oa.shotgunTotal = count;
  });
}

// Trigger the merge sequence on two live, non-merging asteroids
function startMidBossMerge() {
  if (!midBoss || !player.alive) return;
  const live = midBoss.orbitingAsteroids
    .map((oa, i) => ({ oa, i }))
    .filter(({ oa }) => oa.alive && !oa.merging);
  if (live.length < 2) return;

  // Pick two (prefer one from each ring for visual drama)
  const shuffle = live.sort(() => Math.random() - 0.5);
  const a = shuffle[0], b = shuffle[1];
  a.oa.merging = true; a.oa.mergeProgress = 0;
  b.oa.merging = true; b.oa.mergeProgress = 0;
  midBoss.mergeTargets = [a.i, b.i];
  midBoss.mergeState = 'converging';
  midBoss.mergeProgress = 0;
}

function updateMidBoss() {
  if (!midBoss || !midBoss.alive) return;
  midBoss.frame++;

  // Entrance glide
  if (!midBoss.entered) {
    midBoss.x -= 2;
    if (midBoss.x <= midBoss.targetX) {
      midBoss.entered = true;
      midBoss.coreExposed = true;
    }
    // Still spin orbits during entrance
    for (const oa of midBoss.orbitingAsteroids) {
      if (oa.alive) { oa.angle += oa.orbitSpeed; oa.rotation += oa.rotSpeed; }
    }
    return;
  }

  // Phase transition at 50% HP
  if (midBoss.hp / midBoss.maxHp < 0.5 && midBoss.phase === 1) {
    midBoss.phase = 2;
    midBoss.flingTimer = Math.min(midBoss.flingTimer, 80);
    midBoss.mergeTimer = Math.min(midBoss.mergeTimer, 200);
    midBoss.gravPulseCooldown = 180;
    midBoss.gravPulseTimer = Math.min(midBoss.gravPulseTimer, 60);
    midBoss.gravWellPullTimer = 300;
    spawnExplosion(midBoss.x, midBoss.y, 12, ['#ff6600', '#ff0000', '#ffffff']);
  }

  // Gentle hover
  midBoss.y = midBoss.startY + Math.sin(midBoss.frame * 0.018) * 45;

  // HP bar hit flash + ghost drain
  if (midBoss.hitFlash > 0) midBoss.hitFlash--;
  if (midBoss.displayHp > midBoss.hp) midBoss.displayHp = Math.max(midBoss.hp, midBoss.displayHp - 0.3);

  // Spin orbiting asteroids; handle grabbed telegraph + respawns
  for (const oa of midBoss.orbitingAsteroids) {
    if (oa.grabbed) {
      // Wiggle fast in orbit position, then fire straight at player
      oa.rotation += oa.rotSpeed * 6;
      oa.grabTimer--;
      if (oa.grabTimer <= 0) {
        const wx = midBoss.x + Math.cos(oa.angle) * oa.orbitRadius;
        const wy = midBoss.y + Math.sin(oa.angle) * oa.orbitRadius;
        const dx = player.x - wx, dy = player.y - wy;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        let aimAngle = Math.atan2(dy, dx);
        // Shotgun spread
        if (oa.shotgunIndex !== undefined) {
          const spread = 0.2;
          aimAngle += spread * (oa.shotgunIndex - (oa.shotgunTotal - 1) / 2);
          delete oa.shotgunIndex;
          delete oa.shotgunTotal;
        }
        const spd = 4.5 + midBoss.phase * 0.8;
        enemyBullets.push({
          x: wx, y: wy,
          vx: Math.cos(aimAngle) * spd, vy: Math.sin(aimAngle) * spd,
          radius: oa.orbitRadius > 60 ? 12 : 9,
          alive: true,
          verts: oa.verts, cracks: oa.cracks,
          rotation: oa.rotation, rotSpeed: oa.rotSpeed
        });
        oa.grabbed = false;
        oa.alive = false;
        oa.respawnTimer = oa.respawnFrames;
      }
    } else if (oa.alive) {
      oa.angle += oa.orbitSpeed;
      oa.rotation += oa.rotSpeed;
    } else if (!oa.merging && oa.respawnTimer > 0) {
      oa.respawnTimer--;
      if (oa.respawnTimer === 0) {
        oa.alive = true;
        oa.merging = false;
        oa.mergeProgress = 0;
      }
    }
  }

  // === GRAVITY CAPTURE — pull passing asteroids into orbit (capped at 14) ===
  if (midBoss.entered && midBoss.orbitingAsteroids.length < 14) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (!ASTEROID_TYPES.has(e.type)) continue;
      const dx = midBoss.x - e.x, dy = midBoss.y - e.y;
      if (Math.sqrt(dx * dx + dy * dy) < 210) {
        const angle = Math.atan2(e.y - midBoss.y, e.x - midBoss.x);
        const d = e.type === 'charger' ? generateAsteroidData(14) : generateAsteroidData(10);
        midBoss.orbitingAsteroids.push({
          angle,
          orbitRadius: 50 + Math.random() * 34,
          orbitSpeed: 0.018 + Math.random() * 0.014,
          verts: e.verts || d.verts,
          cracks: e.cracks || d.cracks,
          rotation: e.rotation || 0,
          rotSpeed: (Math.random() * 0.04 + 0.02) * (Math.random() < 0.5 ? 1 : -1),
          alive: true, respawnTimer: 0, respawnFrames: 260,
          merging: false, mergeProgress: 0, grabbed: false, grabTimer: 0
        });
        spawnExplosion(e.x, e.y, 5, ['#cc00ff', '#aaeeff', '#ffffff']);
        enemies.splice(i, 1);
      }
    }
  }

  // === INBOUND ASTEROIDS FROM LEFT — suctioned into Shepherd's orbit ===
  if (midBoss.entered) {
    midBoss.inboundTimer--;
    if (midBoss.inboundTimer <= 0) {
      const y = 80 + Math.random() * (CONFIG.height - 160);
      midBoss.pendingInbounds.push({ y, countdown: 80 });
      midBoss.inboundTimer = midBoss.phase === 2
        ? 240 + Math.floor(Math.random() * 80)    // ~4-5s in phase 2
        : 480 + Math.floor(Math.random() * 120);   // ~8-10s in phase 1
    }
    for (let pi = midBoss.pendingInbounds.length - 1; pi >= 0; pi--) {
      const pending = midBoss.pendingInbounds[pi];
      pending.countdown--;
      if (pending.countdown <= 0) {
        const d = generateAsteroidData(12);
        enemies.push({
          type: 'charger',
          x: -45, y: pending.y,
          width: 20, height: 20,
          hp: 2, maxHp: 2,
          points: 0,
          frame: 0,
          rotation: Math.random() * Math.PI * 2,
          speed: 4 + Math.random() * 1.5,
          verts: d.verts, cracks: d.cracks,
          ambient: false,
          isShepherdInbound: true,
          triggered: false
        });
        midBoss.pendingInbounds.splice(pi, 1);
      }
    }
  }

  // === GRAVITY PULSE WAVE (bullet pushback) ===
  if (midBoss.gravPulseTelegraph > 0) {
    midBoss.gravPulseTelegraph--;
    if (midBoss.gravPulseTelegraph === 0) {
      midBoss.gravityPulses.push({ x: midBoss.x, y: midBoss.y, radius: 0, maxRadius: 300, speed: 5 });
      midBoss.gravPulseTimer = midBoss.gravPulseCooldown;
    }
  } else {
    midBoss.gravPulseTimer--;
    if (midBoss.gravPulseTimer <= 0) {
      midBoss.gravPulseTelegraph = 25;  // brief charge-up before pulse
    }
  }
  for (let pi = midBoss.gravityPulses.length - 1; pi >= 0; pi--) {
    const pulse = midBoss.gravityPulses[pi];
    pulse.radius += pulse.speed;
    if (pulse.radius >= pulse.maxRadius) { midBoss.gravityPulses.splice(pi, 1); continue; }
    // Push back player bullets that are near the wavefront
    for (const b of playerBullets) {
      const dx = b.x - pulse.x, dy = b.y - pulse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(dist - pulse.radius) < 20) {
        const nx = dx / (dist || 1), ny = dy / (dist || 1);
        b.vx += nx * 5;
        b.vy += ny * 5;
        const spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (spd > CONFIG.bulletSpeed * 1.7) {
          b.vx = (b.vx / spd) * CONFIG.bulletSpeed * 1.7;
          b.vy = (b.vy / spd) * CONFIG.bulletSpeed * 1.7;
        }
      }
    }
  }

  // === GRAVITY WELL PULL (phase 2 — tug player toward Shepherd) ===
  if (midBoss.phase === 2 && player.alive) {
    if (midBoss.gravWellPullActive) {
      midBoss.gravWellPullDuration--;
      const dx = midBoss.x - player.x, dy = midBoss.y - player.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      player.vx += (dx / dist) * 0.35;
      player.vy += (dy / dist) * 0.35;
      if (midBoss.gravWellPullDuration <= 0) {
        midBoss.gravWellPullActive = false;
        midBoss.gravWellPullTimer = 420 + Math.floor(Math.random() * 120);
      }
    } else if (midBoss.gravWellPullTelegraph > 0) {
      midBoss.gravWellPullTelegraph--;
      if (midBoss.gravWellPullTelegraph === 0) {
        midBoss.gravWellPullActive = true;
        midBoss.gravWellPullDuration = 120;
      }
    } else {
      midBoss.gravWellPullTimer--;
      if (midBoss.gravWellPullTimer <= 0) {
        midBoss.gravWellPullTelegraph = 90;
      }
    }
  }

  // === FLING ATTACK ===
  midBoss.flingTimer--;
  if (midBoss.flingTimer <= 0 && midBoss.mergeState === 'idle') {
    if (midBoss.phase === 2 && midBoss.flingCount % 3 === 0) {
      midBossShotgunFling();
    } else {
      midBossFling();
    }
    midBoss.flingCount++;
    midBoss.flingTimer = midBoss.phase === 1 ? 180 : 120;
  }

  // === MERGE ATTACK ===
  if (midBoss.mergeState === 'idle') {
    midBoss.mergeTimer--;
    if (midBoss.mergeTimer <= 0) {
      startMidBossMerge();
    }
  } else if (midBoss.mergeState === 'converging') {
    midBoss.mergeProgress += 1 / 80;  // 80 frames to converge
    if (midBoss.mergeProgress >= 1) {
      midBoss.mergeProgress = 1;
      // Merge at Shepherd's core — flash, then hold as 'charging' before firing at player
      midBoss.mergeMidX = midBoss.x;
      midBoss.mergeMidY = midBoss.y;
      spawnLocalFlash(midBoss.mergeMidX, midBoss.mergeMidY, 40);
      const mergedData = generateAsteroidData(22);
      midBoss.pendingShot = { verts: mergedData.verts, cracks: mergedData.cracks };
      midBoss.chargeTimer = 40;
      midBoss.mergeState = 'charging';

      // Kill source asteroids, start respawn
      for (const idx of midBoss.mergeTargets) {
        const oa = midBoss.orbitingAsteroids[idx];
        oa.alive = false;
        oa.merging = false;
        oa.mergeProgress = 0;
        oa.respawnTimer = oa.respawnFrames * 2;  // longer cooldown after merge
      }
    }
  } else if (midBoss.mergeState === 'charging') {
    midBoss.chargeTimer--;
    if (midBoss.chargeTimer <= 0 && player.alive && midBoss.pendingShot) {
      const dx = player.x - midBoss.x, dy = player.y - midBoss.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const spd = 11 + midBoss.phase;
      spawnLocalFlash(midBoss.x, midBoss.y, 50);
      enemyBullets.push({
        x: midBoss.x, y: midBoss.y,
        vx: (dx / dist) * spd, vy: (dy / dist) * spd,
        radius: 20, alive: true,
        verts: midBoss.pendingShot.verts, cracks: midBoss.pendingShot.cracks,
        rotation: 0, rotSpeed: 0.06,
        isMerged: true, phase: 'incoming'
      });
      midBoss.pendingShot = null;
      midBoss.mergeState = 'idle';
      midBoss.mergeTimer = midBoss.phase === 1 ? 380 : 260;
    }
  }
}

function drawMidBoss() {
  if (!midBoss || !midBoss.alive) return;
  ctx.save();

  const mb = midBoss;
  const pulse = Math.sin(mb.frame * 0.06) * 0.5 + 0.5;
  const energyFrac = mb.hp / mb.maxHp;

  // Tractor beams to nearby ambient asteroids (gravity pull telegraph)
  if (mb.entered) {
    ctx.setLineDash([3, 9]);
    ctx.lineWidth = 1;
    for (const e of enemies) {
      if (!ASTEROID_TYPES.has(e.type)) continue;
      const edx = mb.x - e.x, edy = mb.y - e.y;
      const edist = Math.sqrt(edx * edx + edy * edy);
      if (edist < 320) {
        const alpha = 0.12 + (1 - edist / 320) * 0.3;
        ctx.strokeStyle = `rgba(180,80,255,${alpha})`;
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#cc00ff';
        ctx.beginPath();
        ctx.moveTo(mb.x, mb.y);
        ctx.lineTo(e.x, e.y);
        ctx.stroke();
      }
    }
    ctx.setLineDash([]);
  }

  // Tractor beams to alive orbiting asteroids
  ctx.setLineDash([5, 6]);
  ctx.lineWidth = 1;
  for (const oa of mb.orbitingAsteroids) {
    if (!oa.alive) continue;
    const wx = mb.x + Math.cos(oa.angle) * oa.orbitRadius;
    const wy = mb.y + Math.sin(oa.angle) * oa.orbitRadius;
    const mergeAlpha = oa.merging ? 0.3 + oa.mergeProgress * 0.5 : 0.2 + pulse * 0.15;
    ctx.strokeStyle = oa.merging
      ? `rgba(255,60,0,${mergeAlpha})`
      : `rgba(180,100,255,${mergeAlpha})`;
    ctx.beginPath();
    ctx.moveTo(mb.x, mb.y);
    ctx.lineTo(wx, wy);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Core body — larger than regular gravwell
  ctx.shadowColor = '#aa00ff';
  ctx.shadowBlur = 18 + pulse * 10;
  ctx.fillStyle = '#1a0030';
  ctx.beginPath();
  ctx.arc(mb.x, mb.y, 30, 0, Math.PI * 2);
  ctx.fill();

  // Outer spinning rings
  for (let r = 0; r < 2; r++) {
    const ringR = 42 + r * 16;
    const rot = mb.frame * (0.02 + r * 0.015) * (r % 2 === 0 ? 1 : -1);
    ctx.strokeStyle = r === 0
      ? `rgba(180,80,255,${0.5 + pulse * 0.3})`
      : `rgba(255,60,0,${0.3 + energyFrac * 0.4})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mb.x, mb.y, ringR, rot, rot + Math.PI * 1.5);
    ctx.stroke();
  }

  // Core gem — pulses brighter when hit
  const coreFlash = mb.hitFlash > 0 ? 1 : 0;
  ctx.shadowColor = coreFlash ? '#ffffff' : '#cc00ff';
  ctx.shadowBlur = 12 + coreFlash * 18 + pulse * 6;
  ctx.fillStyle = coreFlash ? '#ffaaff' : `rgb(${Math.floor(100 + pulse * 60)},0,${Math.floor(150 + pulse * 50)})`;
  ctx.beginPath();
  ctx.arc(mb.x, mb.y, 10, 0, Math.PI * 2);
  ctx.fill();

  // Merge convergence visual — red lines between merging pair + their moving positions
  if (mb.mergeState === 'converging' && mb.mergeTargets.length === 2) {
    const [ia, ib] = mb.mergeTargets;
    const oaA = mb.orbitingAsteroids[ia];
    const oaB = mb.orbitingAsteroids[ib];
    const p = mb.mergeProgress;
    // Lerp each asteroid toward the Shepherd's core — they spiral inward
    const axW = mb.x + Math.cos(oaA.angle) * oaA.orbitRadius;
    const ayW = mb.y + Math.sin(oaA.angle) * oaA.orbitRadius;
    const bxW = mb.x + Math.cos(oaB.angle) * oaB.orbitRadius;
    const byW = mb.y + Math.sin(oaB.angle) * oaB.orbitRadius;
    const midX = mb.x, midY = mb.y;   // convergence at core
    const drawAx = axW + (midX - axW) * p;
    const drawAy = ayW + (midY - ayW) * p;
    const drawBx = bxW + (midX - bxW) * p;
    const drawBy = byW + (midY - byW) * p;

    const redAlpha = 0.5 + p * 0.5;
    ctx.shadowColor = '#ff2200';
    ctx.shadowBlur = 20 + p * 20;
    // Draw a glowing line between the two
    ctx.strokeStyle = `rgba(255,50,0,${redAlpha})`;
    ctx.lineWidth = 2 + p * 3;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(drawAx, drawAy);
    ctx.lineTo(drawBx, drawBy);
    ctx.stroke();

    // Draw each merging asteroid in its lerped position with red tint
    for (const [dx2, dy2, oa] of [[drawAx, drawAy, oaA], [drawBx, drawBy, oaB]]) {
      ctx.save();
      ctx.translate(dx2, dy2);
      ctx.rotate(oa.rotation);
      ctx.shadowColor = '#ff3300';
      ctx.shadowBlur = 14 + p * 20;
      ctx.fillStyle = `rgba(40,0,0,1)`;
      ctx.beginPath();
      ctx.moveTo(oa.verts[0].x, oa.verts[0].y);
      for (let vi = 1; vi < oa.verts.length; vi++) ctx.lineTo(oa.verts[vi].x, oa.verts[vi].y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = `rgba(255,${Math.floor(60 * (1 - p))},0,1)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
    // Growing merge flash at midpoint as p → 1
    if (p > 0.7) {
      const flashAlpha = (p - 0.7) / 0.3;
      const grad = ctx.createRadialGradient(midX, midY, 0, midX, midY, 35 * flashAlpha);
      grad.addColorStop(0, `rgba(255,180,80,${flashAlpha})`);
      grad.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(midX, midY, 35, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Orbiting asteroids (non-merging ones, including grabbed telegraph)
  for (const oa of mb.orbitingAsteroids) {
    if (!oa.alive && !oa.grabbed) continue;
    if (oa.merging) continue;
    const wx = mb.x + Math.cos(oa.angle) * oa.orbitRadius;
    const wy = mb.y + Math.sin(oa.angle) * oa.orbitRadius;
    // Grabbed: shake and shift to red/orange as grabTimer counts down
    const grabFrac = oa.grabbed ? 1 - oa.grabTimer / 38 : 0;
    const shakeX = oa.grabbed ? Math.sin(mb.frame * 1.1) * (4 + grabFrac * 6) : 0;
    const shakeY = oa.grabbed ? Math.cos(mb.frame * 0.9) * (3 + grabFrac * 5) : 0;
    ctx.save();
    ctx.translate(wx + shakeX, wy + shakeY);
    ctx.rotate(oa.rotation);
    ctx.shadowColor = oa.grabbed ? `rgb(255,${Math.floor(100 * (1 - grabFrac))},0)` : CONFIG.colors.asteroid;
    ctx.shadowBlur = oa.grabbed ? 14 + grabFrac * 18 : 8;
    ctx.fillStyle = '#12121e';
    ctx.beginPath();
    ctx.moveTo(oa.verts[0].x, oa.verts[0].y);
    for (let vi = 1; vi < oa.verts.length; vi++) ctx.lineTo(oa.verts[vi].x, oa.verts[vi].y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = oa.grabbed
      ? `rgb(255,${Math.floor(80 * (1 - grabFrac))},0)`
      : CONFIG.colors.asteroid;
    ctx.lineWidth = oa.grabbed ? 2 : 1.5;
    ctx.stroke();
    ctx.restore();
  }

  // Gravity pulse telegraph — rapid purple halo charge-up
  if (mb.gravPulseTelegraph > 0) {
    const tp = 1 - mb.gravPulseTelegraph / 25;
    const flicker = Math.sin(mb.frame * 1.2) * 0.5 + 0.5;
    ctx.save();
    ctx.shadowColor = '#aa00ff';
    ctx.shadowBlur = 20 + tp * 30 + flicker * 15;
    ctx.strokeStyle = `rgba(180,60,255,${0.3 + tp * 0.6 + flicker * 0.1})`;
    ctx.lineWidth = 2 + tp * 3;
    ctx.beginPath();
    ctx.arc(mb.x, mb.y, 32 + tp * 10 + flicker * 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Gravity pulse waves — expanding rings
  for (const pulse of mb.gravityPulses) {
    const progress = pulse.radius / pulse.maxRadius;
    const alpha = (1 - progress) * 0.75;
    ctx.save();
    ctx.shadowColor = '#aa00ff';
    ctx.shadowBlur = 20 * (1 - progress);
    ctx.strokeStyle = `rgba(160,60,255,${alpha.toFixed(2)})`;
    ctx.lineWidth = 3.5 * (1 - progress) + 1;
    ctx.beginPath();
    ctx.arc(pulse.x, pulse.y, pulse.radius, 0, Math.PI * 2);
    ctx.stroke();
    if (pulse.radius > 25) {
      ctx.strokeStyle = `rgba(220,180,255,${(alpha * 0.35).toFixed(2)})`;
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(pulse.x, pulse.y, pulse.radius * 0.75, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Gravity well pull — tractor beam visual
  if (mb.phase === 2 && player.alive) {
    if (mb.gravWellPullTelegraph > 0) {
      // Telegraph: flickering dashed beam
      const tp = 1 - mb.gravWellPullTelegraph / 90;
      ctx.save();
      ctx.setLineDash([8, 12]);
      ctx.lineDashOffset = mb.frame * 3;
      ctx.strokeStyle = `rgba(180,60,255,${0.15 + tp * 0.45})`;
      ctx.lineWidth = 1.5 + tp * 2;
      ctx.shadowColor = '#cc00ff';
      ctx.shadowBlur = 8 + tp * 12;
      ctx.beginPath();
      ctx.moveTo(mb.x, mb.y);
      ctx.lineTo(player.x, player.y);
      ctx.stroke();
      ctx.setLineDash([]);
      // Warning text
      if (tp > 0.3) {
        const textAlpha = Math.sin(mb.frame * 0.3) * 0.3 + 0.5;
        ctx.fillStyle = `rgba(200,100,255,${textAlpha.toFixed(2)})`;
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GRAVITY LOCK', player.x, player.y - 30);
      }
      ctx.restore();
    } else if (mb.gravWellPullActive) {
      // Active pull: thick glowing beam with particle dots
      ctx.save();
      ctx.strokeStyle = 'rgba(180,40,255,0.55)';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#cc00ff';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(mb.x, mb.y);
      ctx.lineTo(player.x, player.y);
      ctx.stroke();
      // Particle dots streaming along beam
      const dx = player.x - mb.x, dy = player.y - mb.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      for (let pi = 0; pi < 6; pi++) {
        const t = ((mb.frame * 0.03 + pi / 6) % 1);
        const px = mb.x + dx * t;
        const py = mb.y + dy * t;
        const dotAlpha = 0.5 + Math.sin(t * Math.PI) * 0.4;
        ctx.fillStyle = `rgba(220,160,255,${dotAlpha.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // Charging merged shot — glowing ring at core that grows and fires
  if (mb.mergeState === 'charging' && mb.pendingShot) {
    const cp = 1 - mb.chargeTimer / 40;
    const chargePulse = Math.sin(mb.frame * 0.5) * 0.5 + 0.5;
    ctx.save();
    ctx.shadowColor = '#ff2200';
    ctx.shadowBlur = 22 + cp * 28 + chargePulse * 12;
    ctx.strokeStyle = `rgba(255, ${Math.floor(120 * (1 - cp))}, 0, ${0.7 + cp * 0.3})`;
    ctx.lineWidth = 2.5 + cp * 3;
    ctx.beginPath();
    ctx.arc(mb.x, mb.y, 18 + cp * 12 + chargePulse * 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // === POLISHED HP BAR ===
  const barW = 440, barH = 14;
  const barX = CONFIG.width / 2 - barW / 2, barY = 46;
  const hpFrac = mb.hp / mb.maxHp;
  const displayFrac = mb.displayHp / mb.maxHp;
  const isLow = hpFrac < 0.33;

  ctx.save();
  ctx.shadowColor = isLow ? '#ff3300' : '#aa00ff';
  ctx.shadowBlur = 10 + pulse * 8;

  // Dark track
  ctx.fillStyle = '#06000e';
  ctx.fillRect(barX, barY, barW, barH);

  // Ghost drain bar (trails behind actual HP)
  if (displayFrac > hpFrac) {
    ctx.fillStyle = isLow ? 'rgba(255,100,0,0.28)' : 'rgba(160,40,255,0.28)';
    ctx.fillRect(barX, barY, barW * displayFrac, barH);
  }

  // Main fill — gradient shifts purple→red as HP drops
  const grad = ctx.createLinearGradient(barX, 0, barX + barW * hpFrac, 0);
  if (isLow) {
    grad.addColorStop(0, '#bb1100'); grad.addColorStop(1, '#ff4400');
  } else if (hpFrac < 0.66) {
    grad.addColorStop(0, '#880099'); grad.addColorStop(1, '#ff3300');
  } else {
    grad.addColorStop(0, '#7700bb'); grad.addColorStop(1, '#cc44ff');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(barX, barY, barW * hpFrac, barH);

  // Hit flash — white blaze over fill
  if (mb.hitFlash > 0) {
    const flashA = mb.hitFlash / 12;
    ctx.fillStyle = `rgba(255,255,255,${flashA * 0.75})`;
    ctx.fillRect(barX, barY, barW * hpFrac, barH);
  }

  // Pulsing bright edge at fill tip
  if (hpFrac > 0.01) {
    const edgeX = barX + barW * hpFrac - 3;
    ctx.fillStyle = `rgba(255,255,255,${0.35 + pulse * 0.55})`;
    ctx.fillRect(edgeX, barY, 3, barH);
  }

  // Segment dividers — 8 chunks of 5 HP each
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  for (let s = 1; s < 8; s++) {
    ctx.fillRect(barX + barW * (s / 8) - 1, barY, 2, barH);
  }

  // Bar border
  ctx.strokeStyle = isLow ? 'rgba(255,80,0,0.55)' : 'rgba(180,60,255,0.45)';
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 5;
  ctx.strokeRect(barX, barY, barW, barH);

  // Corner bracket accents
  const al = 12;
  ctx.strokeStyle = isLow ? '#ff4400' : '#bb00ff';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 10;
  ctx.shadowColor = isLow ? '#ff2200' : '#cc00ff';
  // top-left
  ctx.beginPath(); ctx.moveTo(barX - 5, barY + al); ctx.lineTo(barX - 5, barY - 5); ctx.lineTo(barX + al, barY - 5); ctx.stroke();
  // top-right
  ctx.beginPath(); ctx.moveTo(barX + barW - al, barY - 5); ctx.lineTo(barX + barW + 5, barY - 5); ctx.lineTo(barX + barW + 5, barY + al); ctx.stroke();
  // bottom-left
  ctx.beginPath(); ctx.moveTo(barX - 5, barY + barH - al); ctx.lineTo(barX - 5, barY + barH + 5); ctx.lineTo(barX + al, barY + barH + 5); ctx.stroke();
  // bottom-right
  ctx.beginPath(); ctx.moveTo(barX + barW - al, barY + barH + 5); ctx.lineTo(barX + barW + 5, barY + barH + 5); ctx.lineTo(barX + barW + 5, barY + barH - al); ctx.stroke();

  // Name label
  const nameGlow = isLow ? '#ff4400' : '#cc00ff';
  ctx.shadowColor = nameGlow;
  ctx.shadowBlur = 8 + pulse * 6;
  ctx.fillStyle = isLow
    ? `rgba(255,${Math.floor(80 + pulse * 60)},30,1)`
    : `rgba(${Math.floor(180 + pulse * 50)},${Math.floor(80 + pulse * 40)},255,1)`;
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('— T H E   S H E P H E R D —', CONFIG.width / 2, barY - 8);

  ctx.restore();

  ctx.restore();
}

function drawMidBossInboundAlerts() {
  if (!midBoss || !midBoss.pendingInbounds || midBoss.pendingInbounds.length === 0) return;
  ctx.save();
  for (const pending of midBoss.pendingInbounds) {
    const f = midBoss.frame;
    // Arrow
    const arrowFlash = Math.sin(f * 0.35) * 0.5 + 0.5;
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 8 + arrowFlash * 6;
    ctx.fillStyle = `rgba(255, 200, 0, ${0.5 + arrowFlash * 0.5})`;
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('◄', 8, pending.y + 7);
    // Vector exclamation bar + dot
    const excFlash = Math.sin(f * 0.6) * 0.5 + 0.5;
    const excAlpha = 0.6 + excFlash * 0.4;
    const excX = 36, excY = pending.y - 10;
    ctx.shadowColor = '#ffdd00';
    ctx.shadowBlur = 10 + excFlash * 14;
    ctx.fillStyle = `rgba(255, 220, 0, ${excAlpha})`;
    ctx.fillRect(excX - 3, excY, 6, 16);
    ctx.beginPath();
    ctx.arc(excX, excY + 22, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function destroyMidBoss() {
  midBoss.alive = false;
  score += 3000;
  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      if (!midBoss) return;
      spawnExplosion(
        midBoss.x + (Math.random() - 0.5) * 70,
        midBoss.y + (Math.random() - 0.5) * 70,
        18, ['#cc00ff', '#ff3300', '#ffffff', '#ff6600']
      );
    }, i * 180);
  }
  screenFlash = 20;
  setTimeout(() => {
    midBoss = null;
    // Advance past the mid-boss sentinel wave and resume
    currentWave++;
    waveActive = false;
    waveTimer = 0;
    enemies.length = 0;
    enemyBullets.length = 0;
    gameState = 'GAMEPLAY';
  }, 1200);
}

function drawMidBossWarning() {
  drawBackground();
  updatePlayer();
  drawPlayer();
  drawPlayerBullets();
  drawParticles();
  drawHUD();

  ctx.save();
  ctx.shadowColor = '#cc00ff';
  ctx.shadowBlur = 25;
  ctx.fillStyle = '#cc00ff';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  if (Math.floor(frame / 10) % 2 === 0) {
    ctx.fillText('⚠ THE SHEPHERD APPROACHES ⚠', CONFIG.width / 2, CONFIG.height / 2);
  }
  ctx.restore();
}

// Localized nova burst — radial gradient flash at a world position
const localFlashes = [];
function spawnLocalFlash(x, y, radius) {
  localFlashes.push({ x, y, radius, life: 1.0 });
}
function updateLocalFlashes() {
  for (let i = localFlashes.length - 1; i >= 0; i--) {
    const f = localFlashes[i];
    f.life -= f.fast ? 0.15 : 0.04;
    if (f.life <= 0) localFlashes.splice(i, 1);
  }
}
function drawLocalFlashes() {
  for (const f of localFlashes) {
    const alpha = f.life * 0.85;
    const r = f.radius * (1.1 - f.life * 0.1);
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    if (f.fast) {
      // Bullet impact flash — bright white/cyan
      grad.addColorStop(0,    `rgba(255, 255, 255, ${alpha})`);
      grad.addColorStop(0.3,  `rgba(100, 240, 255, ${alpha * 0.7})`);
      grad.addColorStop(1,    `rgba(0, 180, 255, 0)`);
    } else {
      // Nova flash — purple
      grad.addColorStop(0,    `rgba(255, 220, 255, ${alpha})`);
      grad.addColorStop(0.35, `rgba(210, 130, 255, ${alpha * 0.6})`);
      grad.addColorStop(1,    `rgba(160, 60, 255, 0)`);
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// === TUNNEL GAUNTLET SYSTEM ===
const TUNNEL_SCROLL_SPEED = 2.0;
const TUNNEL_SEGMENT_WIDTH = 120;
const TUNNEL_WALL_COLOR = '#1a0e2a';
const TUNNEL_EDGE_COLOR = '#cc00ff';
const TUNNEL_BLADE_COLOR = '#ff4400';
const TUNNEL_GATE_COLOR = '#ffaa00';

let tunnelActive = false;
let tunnelScrollX = 0;
let tunnelSegments = [];
let tunnelHazards = [];       // active hazard instances
let tunnelWarningTimer = 0;
let tunnelSpawnedHazards = new Set(); // track which segment hazards already spawned

function buildTunnelData() {
  const H = CONFIG.height; // 540
  const segs = [];

  // Helper: push a segment with top/bottom Y values
  function seg(tL, tR, bL, bR, hazards) {
    segs.push({ topLeft: tL, topRight: tR, bottomLeft: bL, bottomRight: bR, hazards: hazards || [] });
  }

  // Helper: lerp
  function lerp(a, b, t) { return a + (b - a) * t; }

  // Passage height guide: H=540.  top=wall ceiling Y, bottom=wall floor Y.
  // Passage = bottomY - topY. Target widths:
  //   Funnel entry: 540→240,  Straight: ~240,  Weave: ~220 swinging hard,
  //   Gauntlet: ~200,  Gates: ~210,  Double Trouble: ~200,  Crucible: ~160,  Exit: opens

  // Section A: "The Funnel" (0-4) — walls close in fast
  seg(0, 0, H, H, []);                            // 0: open sky
  seg(0, 30, H, H - 30, []);                      // 1
  seg(30, 80, H - 30, H - 80, []);                // 2
  seg(80, 130, H - 80, H - 130, []);              // 3
  seg(130, 150, H - 130, H - 150, []);            // 4: passage ~240px

  // Section B: "Straight Shot" (5-12) — ~240px, slight curve down, 1 turret
  seg(150, 155, H - 150, H - 145, []);            // 5
  seg(155, 165, H - 145, H - 135, []);            // 6
  seg(165, 175, H - 135, H - 130, []);            // 7
  seg(175, 180, H - 130, H - 130, [{ type: 'turret', localX: 0.5, y: 200 }]); // 8: turret on top wall
  seg(180, 185, H - 130, H - 135, []);            // 9
  seg(185, 180, H - 135, H - 140, []);            // 10
  seg(180, 170, H - 140, H - 150, []);            // 11
  seg(170, 155, H - 150, H - 155, []);            // 12

  // Section C: "The Weave" (13-24) — aggressive S-curve ~220px passage, 2 turrets
  // Plunge down: center from ~265 to ~410
  seg(155, 170, H - 155, H - 130, []);            // 13
  seg(170, 210, H - 130, H - 100, []);            // 14
  seg(210, 250, H - 100, H - 70, []);             // 15
  seg(250, 280, H - 70, H - 55, [{ type: 'turret', localX: 0.5, y: 295 }]); // 16: turret near top wall
  seg(280, 300, H - 55, H - 50, []);              // 17: deepest — passage centered ~395
  seg(300, 290, H - 50, H - 60, []);              // 18: start climbing back
  // Swing back up hard: center from ~395 to ~150
  seg(290, 260, H - 60, H - 80, []);              // 19
  seg(260, 210, H - 80, H - 120, []);             // 20
  seg(210, 150, H - 120, H - 170, []);            // 21
  seg(150, 90, H - 170, H - 230, [{ type: 'turret', localX: 0.5, y: H - 250 }]); // 22: turret on bottom wall
  seg(90, 60, H - 230, H - 260, []);              // 23: high — passage centered ~165
  seg(60, 70, H - 260, H - 250, []);              // 24

  // Section D: "First Blade" (25-32) — ~260px, straightens, single plasma blade
  seg(70, 90, H - 250, H - 230, []);              // 25
  seg(90, 120, H - 230, H - 200, []);             // 26
  seg(120, 140, H - 200, H - 180, []);            // 27
  seg(140, 145, H - 180, H - 175, [{ type: 'plasmaBlade', localX: 0.5, cy: 290, radius: 100, rotSpeed: 0.025, double: false }]); // 28
  seg(145, 150, H - 175, H - 170, []);            // 29
  seg(150, 155, H - 170, H - 165, []);            // 30
  seg(155, 160, H - 165, H - 160, []);            // 31
  seg(160, 160, H - 160, H - 160, []);            // 32

  // Section E: "The Gauntlet Begins" (33-44) — ~200px, tight S-curves, 2 blades + turret
  seg(160, 180, H - 160, H - 140, []);            // 33
  seg(180, 220, H - 140, H - 110, []);            // 34
  seg(220, 260, H - 110, H - 80, [{ type: 'plasmaBlade', localX: 0.5, cy: 350, radius: 80, rotSpeed: 0.028, double: false }]); // 35
  seg(260, 290, H - 80, H - 60, []);              // 36
  seg(290, 310, H - 60, H - 50, []);              // 37: deep trough
  seg(310, 300, H - 50, H - 60, [{ type: 'turret', localX: 0.4, y: 325 }]); // 38
  seg(300, 270, H - 60, H - 80, []);              // 39
  seg(270, 220, H - 80, H - 120, [{ type: 'plasmaBlade', localX: 0.5, cy: 250, radius: 85, rotSpeed: 0.03, double: false }]); // 40
  seg(220, 170, H - 120, H - 160, []);            // 41
  seg(170, 140, H - 160, H - 180, []);            // 42
  seg(140, 130, H - 180, H - 190, []);            // 43
  seg(130, 135, H - 190, H - 185, []);            // 44

  seg(180, 180, H - 145, H - 145, []);            // 54

  // Section G: "Double Trouble" (55-66) — ~200px, 2 gates + double blade + turret
  seg(180, 190, H - 145, H - 135, [{ type: 'turret', localX: 0.5, y: H - 155 }]); // 55
  seg(190, 200, H - 135, H - 130, []);            // 56
  seg(200, 200, H - 130, H - 130, [{ type: 'gate', localX: 0.5, openGap: 170, cycleTimes: { open: 90, closing: 18, closed: 30, opening: 18 } }]); // 57
  seg(200, 195, H - 130, H - 135, []);            // 58
  seg(195, 190, H - 135, H - 140, [{ type: 'plasmaBlade', localX: 0.5, cy: 300, radius: 75, rotSpeed: 0.03, double: true }]); // 59
  seg(190, 185, H - 140, H - 145, []);            // 60

  seg(180, 180, H - 150, H - 150, [{ type: 'gate', localX: 0.5, openGap: 160, cycleTimes: { open: 85, closing: 18, closed: 35, opening: 18 }, phaseOffset: 80 }]); // 62
  seg(180, 175, H - 150, H - 155, []);            // 63
  seg(175, 165, H - 155, H - 165, []);            // 64
  seg(165, 155, H - 165, H - 170, []);            // 65
  seg(155, 150, H - 170, H - 175, []);            // 66

  // Section H: "The Crucible" (67-78) — ~160px passage, sharp S, hardest
  seg(150, 170, H - 175, H - 155, []);            // 67
  seg(170, 210, H - 155, H - 120, [{ type: 'turret', localX: 0.4, y: 230 }]); // 68
  seg(210, 260, H - 120, H - 80, []);             // 69
  seg(260, 300, H - 80, H - 50, []);              // 70: plunging deep
  seg(300, 320, H - 50, H - 40, [{ type: 'plasmaBlade', localX: 0.5, cy: 370, radius: 70, rotSpeed: 0.035, double: true }]); // 71
  seg(320, 300, H - 40, H - 60, []);              // 72
  seg(300, 250, H - 60, H - 100, [{ type: 'turret', localX: 0.6, y: H - 120 }]); // 73

  seg(160, 140, H - 175, H - 190, []);            // 76

  seg(100, 75, H - 210, H - 170, []);             // 79

  seg(30, 15, H - 40, H - 15, []);                // 82
  seg(15, 0, H - 15, H, []);                      // 83
  seg(0, 0, H, H, []);                            // 84

  return segs;
}

function getTunnelBoundsAtX(screenX) {
  if (!tunnelActive || tunnelSegments.length === 0) return { topY: 0, bottomY: CONFIG.height };
  // Convert screen X to tunnel-space position
  const tunnelX = screenX + tunnelScrollX;
  const segIndex = Math.floor(tunnelX / TUNNEL_SEGMENT_WIDTH);
  if (segIndex < 0) return { topY: tunnelSegments[0].topLeft, bottomY: tunnelSegments[0].bottomLeft };
  if (segIndex >= tunnelSegments.length) {
    const last = tunnelSegments[tunnelSegments.length - 1];
    return { topY: last.topRight, bottomY: last.bottomRight };
  }
  const seg = tunnelSegments[segIndex];
  const t = (tunnelX - segIndex * TUNNEL_SEGMENT_WIDTH) / TUNNEL_SEGMENT_WIDTH;
  return {
    topY: seg.topLeft + (seg.topRight - seg.topLeft) * t,
    bottomY: seg.bottomLeft + (seg.bottomRight - seg.bottomLeft) * t
  };
}

function startTunnel() {
  tunnelActive = true;
  tunnelScrollX = 0;
  tunnelSegments = buildTunnelData();
  tunnelHazards = [];
  tunnelSpawnedHazards = new Set();
  tunnelRockGrid = null; // regenerate rock geometry
  gameState = 'TUNNEL_GAUNTLET';
}

function updateTunnel() {
  if (!tunnelActive) return;
  tunnelScrollX += TUNNEL_SCROLL_SPEED;

  // Spawn hazards as segments scroll into view
  for (let i = 0; i < tunnelSegments.length; i++) {
    const seg = tunnelSegments[i];
    const segScreenX = i * TUNNEL_SEGMENT_WIDTH - tunnelScrollX;
    // Spawn when segment is about to enter the right side of screen
    if (segScreenX < CONFIG.width + 60 && segScreenX > -TUNNEL_SEGMENT_WIDTH - 60) {
      for (let hi = 0; hi < seg.hazards.length; hi++) {
        const hazardKey = i + '_' + hi;
        if (tunnelSpawnedHazards.has(hazardKey)) continue;
        tunnelSpawnedHazards.add(hazardKey);
        const h = seg.hazards[hi];
        const worldX = i * TUNNEL_SEGMENT_WIDTH + h.localX * TUNNEL_SEGMENT_WIDTH;

        if (h.type === 'turret') {
          const e = spawnEnemy('turret', worldX - tunnelScrollX, h.y, { speed: 0 });
          if (e) {
            e.tunnelWorldX = worldX;
            e.tunnelTurret = true;
            e.targetX = e.x; // anchor in place
          }
        } else if (h.type === 'plasmaBlade') {
          // Compute radius to fill the tunnel passage
          const bladeBounds = getTunnelBoundsAtX(worldX - tunnelScrollX);
          const passageHeight = bladeBounds.bottomY - bladeBounds.topY;
          const bladeCenter = (bladeBounds.topY + bladeBounds.bottomY) / 2;
          // Radius = half the passage height (blade tip reaches both walls)
          const bladeRadius = (passageHeight / 2) - 2; // -2px so tip just grazes wall
          tunnelHazards.push({
            type: 'plasmaBlade',
            worldX: worldX,
            cy: bladeCenter,
            radius: bladeRadius,
            angle: Math.random() * Math.PI * 2,
            rotSpeed: h.rotSpeed,
            double: h.double || false,
            active: true
          });
        } else if (h.type === 'gate') {
          const bounds = getTunnelBoundsAtX(worldX - tunnelScrollX);
          const centerY = (bounds.topY + bounds.bottomY) / 2;
          const halfGap = h.openGap / 2;
          tunnelHazards.push({
            type: 'gate',
            worldX: worldX,
            gateWidth: 120,
            topOpenY: centerY - halfGap,
            bottomOpenY: centerY + halfGap,
            topY: centerY - halfGap,
            bottomY: centerY + halfGap,
            centerY: centerY,
            openGap: h.openGap,
            phase: 'open',
            timer: h.phaseOffset || 0,
            cycleTimes: h.cycleTimes,
            active: true
          });
        }
      }
    }
  }

  // Update tunnel turrets — override their x position to scroll with tunnel
  for (const e of enemies) {
    if (e.tunnelTurret) {
      e.x = e.tunnelWorldX - tunnelScrollX;
    }
  }

  // Update hazards
  for (let i = tunnelHazards.length - 1; i >= 0; i--) {
    const h = tunnelHazards[i];
    const screenX = h.worldX - tunnelScrollX;

    if (screenX < -100) {
      tunnelHazards.splice(i, 1);
      continue;
    }

    if (h.type === 'plasmaBlade') {
      h.angle += h.rotSpeed;
    } else if (h.type === 'gate') {
      h.timer++;
      const ct = h.cycleTimes;
      switch (h.phase) {
        case 'open':
          if (h.timer >= ct.open) { h.phase = 'closing'; h.timer = 0; }
          h.topY = h.topOpenY;
          h.bottomY = h.bottomOpenY;
          break;
        case 'closing': {
          const t = h.timer / ct.closing;
          // Ease-in cubic — accelerates as it closes for a forceful slam
          const eased = t * t * t;
          h.topY = h.topOpenY + (h.centerY - h.topOpenY) * eased;
          h.bottomY = h.bottomOpenY + (h.centerY - h.bottomOpenY) * eased;
          if (h.timer >= ct.closing) {
            h.phase = 'closed'; h.timer = 0;
            // Dust plume on slam — wide horizontal burst from center
            const sx = h.worldX - tunnelScrollX;
            for (let p = 0; p < 18; p++) {
              const angle = (Math.random() - 0.5) * Math.PI; // wide horizontal spread
              const speed = 1.5 + Math.random() * 3.5;
              particles.push({
                x: sx + (Math.random() - 0.5) * h.gateWidth * 0.8,
                y: h.centerY + (Math.random() - 0.5) * 12,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed * 0.4,
                life: 25 + Math.random() * 20,
                maxLife: 45,
                color: ['#ff6633', '#ffaa44', '#cc4400', '#ffcc66', '#ff8844'][p % 5],
                size: 2 + Math.random() * 3
              });
            }
            // Wider dust cloud particles
            for (let p = 0; p < 10; p++) {
              particles.push({
                x: sx + (Math.random() - 0.5) * h.gateWidth,
                y: h.centerY + (Math.random() - 0.5) * 6,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 1.5,
                life: 30 + Math.random() * 25,
                maxLife: 55,
                color: ['#886655', '#aa8866', '#665544'][p % 3],
                size: 3 + Math.random() * 4
              });
            }
            triggerScreenShake(4, 8);
          }
          break;
        }
        case 'closed':
          h.topY = h.centerY;
          h.bottomY = h.centerY;
          if (h.timer >= ct.closed) { h.phase = 'opening'; h.timer = 0; }
          break;
        case 'opening': {
          const t = h.timer / ct.opening;
          h.topY = h.centerY + (h.topOpenY - h.centerY) * t;
          h.bottomY = h.centerY + (h.bottomOpenY - h.centerY) * t;
          if (h.timer >= ct.opening) { h.phase = 'open'; h.timer = 0; }
          break;
        }
      }
    }
  }

  // Check if tunnel is complete
  const totalLength = tunnelSegments.length * TUNNEL_SEGMENT_WIDTH;
  if (tunnelScrollX >= totalLength + 60) {
    completeTunnel();
  }
}

function completeTunnel() {
  tunnelActive = false;
  tunnelHazards = [];
  tunnelSpawnedHazards = new Set();
  // Remove any remaining tunnel turrets
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].tunnelTurret) enemies.splice(i, 1);
  }
  enemyBullets.length = 0;
  // Advance wave system and go to boss
  currentWave++;
  waveActive = false;
  waveTimer = 0;
  gameState = 'GAMEPLAY';
}

// Pre-generate seeded random grid for full-wall triangulation
// Grid covers the entire wall area with multiple rows of jittered vertices
let tunnelRockGrid = null;
const TUNNEL_SUBDIV = 4;  // X subdivisions per segment
const TUNNEL_ROWS = 6;    // Y rows of triangles filling each wall

function buildTunnelRockGrid(segCount) {
  let seed = 12345;
  function srand() { seed = (seed * 16807 + 0) % 2147483647; return (seed & 0x7fffffff) / 2147483647; }

  const totalCols = segCount * TUNNEL_SUBDIV + 1;
  // For each column, generate jitter and shade for each row (top wall and bottom wall)
  const top = [];
  const bottom = [];
  for (let c = 0; c < totalCols; c++) {
    const topCol = [];
    const botCol = [];
    for (let r = 0; r <= TUNNEL_ROWS; r++) {
      topCol.push({
        jx: (srand() - 0.5) * 18,  // X jitter
        jy: (srand() - 0.5) * 14,  // Y jitter
        shade: srand()              // brightness 0-1
      });
      botCol.push({
        jx: (srand() - 0.5) * 18,
        jy: (srand() - 0.5) * 14,
        shade: srand()
      });
    }
    top.push(topCol);
    bottom.push(botCol);
  }
  return { top, bottom };
}

// Get the actual vertex position for a grid point in the top wall
function topVertPos(col, row, seg, segIdx, leftX, subW) {
  const grid = tunnelRockGrid.top;
  const v = grid[Math.min(col, grid.length - 1)][row];
  const t = (col - segIdx * TUNNEL_SUBDIV) / TUNNEL_SUBDIV;
  const edgeY = seg.topLeft + (seg.topRight - seg.topLeft) * Math.max(0, Math.min(1, t));
  const screenTop = 0;
  // Row 0 = screen top edge, TUNNEL_ROWS = passage edge
  const baseY = screenTop + (edgeY - screenTop) * (row / TUNNEL_ROWS);
  const baseX = leftX + (col - segIdx * TUNNEL_SUBDIV) * subW;
  // Less jitter at edges (row 0 = screen edge, last row = passage edge), more in middle
  const edgeFactor = row === 0 ? 0.1 : row === TUNNEL_ROWS ? 1.0 : 0.7;
  return {
    x: baseX + v.jx * edgeFactor,
    y: baseY + v.jy * edgeFactor,
    shade: v.shade
  };
}

function bottomVertPos(col, row, seg, segIdx, leftX, subW) {
  const grid = tunnelRockGrid.bottom;
  const v = grid[Math.min(col, grid.length - 1)][row];
  const t = (col - segIdx * TUNNEL_SUBDIV) / TUNNEL_SUBDIV;
  const edgeY = seg.bottomLeft + (seg.bottomRight - seg.bottomLeft) * Math.max(0, Math.min(1, t));
  const screenBot = CONFIG.height;
  // Row 0 = passage edge, TUNNEL_ROWS = screen bottom
  const baseY = edgeY + (screenBot - edgeY) * (row / TUNNEL_ROWS);
  const baseX = leftX + (col - segIdx * TUNNEL_SUBDIV) * subW;
  const edgeFactor = row === TUNNEL_ROWS ? 0.1 : row === 0 ? 1.0 : 0.7;
  return {
    x: baseX + v.jx * edgeFactor,
    y: baseY + v.jy * edgeFactor,
    shade: v.shade
  };
}

function drawTunnel() {
  if (!tunnelActive || tunnelSegments.length === 0) return;
  if (!tunnelRockGrid) tunnelRockGrid = buildTunnelRockGrid(tunnelSegments.length);

  ctx.save();
  const startSeg = Math.max(0, Math.floor(tunnelScrollX / TUNNEL_SEGMENT_WIDTH) - 1);
  const endSeg = Math.min(tunnelSegments.length - 1, Math.ceil((tunnelScrollX + CONFIG.width) / TUNNEL_SEGMENT_WIDTH) + 1);
  const SW = TUNNEL_SEGMENT_WIDTH;
  const subW = SW / TUNNEL_SUBDIV;

  // === Draw all triangles filling both walls ===
  ctx.shadowBlur = 0;
  ctx.lineWidth = 0.5;
  // Base color components for shading
  const bR = 20, bG = 10, bB = 35;

  for (let i = startSeg; i <= endSeg; i++) {
    const seg = tunnelSegments[i];
    const leftX = i * SW - tunnelScrollX;
    const colStart = i * TUNNEL_SUBDIV;

    for (let s = 0; s < TUNNEL_SUBDIV; s++) {
      const c0 = colStart + s;
      const c1 = colStart + s + 1;

      // --- TOP WALL: rows from screen top (row 0) to passage edge (TUNNEL_ROWS) ---
      for (let r = 0; r < TUNNEL_ROWS; r++) {
        const tl = topVertPos(c0, r, seg, i, leftX, subW);
        const tr = topVertPos(c1, r, seg, i, leftX, subW);
        const bl = topVertPos(c0, r + 1, seg, i, leftX, subW);
        const br = topVertPos(c1, r + 1, seg, i, leftX, subW);

        // Depth factor: darker deeper into wall, lighter near passage
        const depthT = r / TUNNEL_ROWS; // 0=deep, 1=passage edge

        // Triangle 1: tl, tr, bl
        const s1 = (tl.shade + tr.shade + bl.shade) / 3;
        const bright1 = depthT * 0.5 + s1 * 0.35;
        const cr1 = Math.floor(bR + bright1 * 50);
        const cg1 = Math.floor(bG + bright1 * 30);
        const cb1 = Math.floor(bB + bright1 * 55);
        ctx.fillStyle = `rgb(${cr1},${cg1},${cb1})`;
        ctx.strokeStyle = `rgba(${cr1 + 15},${cg1 + 10},${cb1 + 20},0.35)`;
        ctx.beginPath();
        ctx.moveTo(tl.x, tl.y);
        ctx.lineTo(tr.x, tr.y);
        ctx.lineTo(bl.x, bl.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Triangle 2: tr, br, bl
        const s2 = (tr.shade + br.shade + bl.shade) / 3;
        const bright2 = depthT * 0.5 + s2 * 0.35;
        const cr2 = Math.floor(bR + bright2 * 45);
        const cg2 = Math.floor(bG + bright2 * 28);
        const cb2 = Math.floor(bB + bright2 * 50);
        ctx.fillStyle = `rgb(${cr2},${cg2},${cb2})`;
        ctx.strokeStyle = `rgba(${cr2 + 15},${cg2 + 10},${cb2 + 20},0.3)`;
        ctx.beginPath();
        ctx.moveTo(tr.x, tr.y);
        ctx.lineTo(br.x, br.y);
        ctx.lineTo(bl.x, bl.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // --- BOTTOM WALL: rows from passage edge (row 0) to screen bottom (TUNNEL_ROWS) ---
      for (let r = 0; r < TUNNEL_ROWS; r++) {
        const tl = bottomVertPos(c0, r, seg, i, leftX, subW);
        const tr = bottomVertPos(c1, r, seg, i, leftX, subW);
        const bl = bottomVertPos(c0, r + 1, seg, i, leftX, subW);
        const br = bottomVertPos(c1, r + 1, seg, i, leftX, subW);

        const depthT = 1.0 - r / TUNNEL_ROWS; // 1=passage edge, 0=deep

        const s1 = (tl.shade + tr.shade + bl.shade) / 3;
        const bright1 = depthT * 0.5 + s1 * 0.35;
        const cr1 = Math.floor(bR + bright1 * 50);
        const cg1 = Math.floor(bG + bright1 * 30);
        const cb1 = Math.floor(bB + bright1 * 55);
        ctx.fillStyle = `rgb(${cr1},${cg1},${cb1})`;
        ctx.strokeStyle = `rgba(${cr1 + 15},${cg1 + 10},${cb1 + 20},0.35)`;
        ctx.beginPath();
        ctx.moveTo(tl.x, tl.y);
        ctx.lineTo(tr.x, tr.y);
        ctx.lineTo(bl.x, bl.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        const s2 = (tr.shade + br.shade + bl.shade) / 3;
        const bright2 = depthT * 0.5 + s2 * 0.35;
        const cr2 = Math.floor(bR + bright2 * 45);
        const cg2 = Math.floor(bG + bright2 * 28);
        const cb2 = Math.floor(bB + bright2 * 50);
        ctx.fillStyle = `rgb(${cr2},${cg2},${cb2})`;
        ctx.strokeStyle = `rgba(${cr2 + 15},${cg2 + 10},${cb2 + 20},0.3)`;
        ctx.beginPath();
        ctx.moveTo(tr.x, tr.y);
        ctx.lineTo(br.x, br.y);
        ctx.lineTo(bl.x, bl.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }
  }

  // === Pass 3: Neon edge glow ===
  ctx.shadowColor = TUNNEL_EDGE_COLOR;
  ctx.shadowBlur = 15;
  ctx.strokeStyle = TUNNEL_EDGE_COLOR;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.8;

  // Top edge — follows jittered rock vertices at passage edge (row = TUNNEL_ROWS)
  ctx.beginPath();
  for (let i = startSeg; i <= endSeg; i++) {
    const seg = tunnelSegments[i];
    const leftX = i * SW - tunnelScrollX;
    for (let s = 0; s <= TUNNEL_SUBDIV; s++) {
      const p = topVertPos(s, TUNNEL_ROWS, seg, i, leftX, subW);
      if (i === startSeg && s === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
  }
  ctx.stroke();

  // Bottom edge — follows jittered rock vertices at passage edge (row = 0)
  ctx.beginPath();
  for (let i = startSeg; i <= endSeg; i++) {
    const seg = tunnelSegments[i];
    const leftX = i * SW - tunnelScrollX;
    for (let s = 0; s <= TUNNEL_SUBDIV; s++) {
      const p = bottomVertPos(s, 0, seg, i, leftX, subW);
      if (i === startSeg && s === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
  }
  ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawTunnelHazards() {
  if (!tunnelActive) return;
  ctx.save();

  for (const h of tunnelHazards) {
    const screenX = h.worldX - tunnelScrollX;
    if (screenX < -100 || screenX > CONFIG.width + 100) continue;

    if (h.type === 'plasmaBlade') {
      // Pivot point
      ctx.shadowColor = TUNNEL_BLADE_COLOR;
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff6622';
      ctx.beginPath();
      ctx.arc(screenX, h.cy, 6, 0, Math.PI * 2);
      ctx.fill();

      // Inner pivot detail
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(screenX, h.cy, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Blade arm(s)
      const bladeCount = h.double ? 2 : 1;
      for (let b = 0; b < bladeCount; b++) {
        const angle = h.angle + b * Math.PI;
        const tipX = screenX + Math.cos(angle) * h.radius;
        const tipY = h.cy + Math.sin(angle) * h.radius;

        // Blade glow
        ctx.shadowColor = TUNNEL_BLADE_COLOR;
        ctx.shadowBlur = 25;
        ctx.strokeStyle = TUNNEL_BLADE_COLOR;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(screenX, h.cy);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        // Bright core line
        ctx.shadowBlur = 8;
        ctx.strokeStyle = '#ffcc88';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(screenX, h.cy);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        // Hot white center
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 4;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(screenX, h.cy);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        // Wall-contact sparks — only when blade tip is near or past the tunnel wall
        const tipBounds = getTunnelBoundsAtX(tipX);
        if (tipY <= tipBounds.topY + 8 || tipY >= tipBounds.bottomY - 8) {
          // Clamp spark position to the wall edge
          const sparkY = tipY <= tipBounds.topY + 8 ? tipBounds.topY : tipBounds.bottomY;
          if (frame % 2 === 0) {
            spawnExplosion(tipX, sparkY, 3, ['#ff4400', '#ff8800', '#ffcc44']);
            spawnExplosion(tipX, sparkY, 2, ['#ffffff', '#ffcc88', '#ff6600']);
          }
        }
      }
    } else if (h.type === 'gate') {
      const gateLeft = screenX - h.gateWidth / 2;
      const gateRight = screenX + h.gateWidth / 2;
      const isClosing = h.phase === 'closing';
      const isClosed = h.phase === 'closed';
      const warningColor = (isClosing || isClosed) ? '#ff2200' : TUNNEL_GATE_COLOR;

      // Get tunnel bounds at multiple X points across gate width for clip path
      const boundsL = getTunnelBoundsAtX(gateLeft);
      const boundsC = getTunnelBoundsAtX(screenX);
      const boundsR = getTunnelBoundsAtX(gateRight);
      const topWallY = boundsC.topY;
      const bottomWallY = boundsC.bottomY;

      // Clip gate rendering to the tunnel passage so edges hide behind rock walls
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(gateLeft, boundsL.topY);
      ctx.lineTo(screenX, boundsC.topY);
      ctx.lineTo(gateRight, boundsR.topY);
      ctx.lineTo(gateRight, boundsR.bottomY);
      ctx.lineTo(screenX, boundsC.bottomY);
      ctx.lineTo(gateLeft, boundsL.bottomY);
      ctx.closePath();
      ctx.clip();

      // Top gate slab: extends from top wall edge down to h.topY
      const topSlabTop = topWallY;
      const topSlabHeight = Math.max(0, h.topY - topWallY);
      ctx.shadowColor = warningColor;
      ctx.shadowBlur = isClosing ? 18 : 10;
      ctx.fillStyle = '#1a1020';
      ctx.fillRect(gateLeft, topSlabTop, h.gateWidth, topSlabHeight);
      ctx.strokeStyle = warningColor;
      ctx.lineWidth = 2;
      ctx.strokeRect(gateLeft, topSlabTop, h.gateWidth, topSlabHeight);

      // Bottom gate slab: extends from h.bottomY down to bottom wall edge
      const bottomSlabHeight = Math.max(0, bottomWallY - h.bottomY);
      ctx.fillRect(gateLeft, h.bottomY, h.gateWidth, bottomSlabHeight);
      ctx.strokeRect(gateLeft, h.bottomY, h.gateWidth, bottomSlabHeight);

      // Closing indicator — pulsing edges
      if (isClosing || isClosed) {
        const pulse = Math.sin(frame * 0.5) * 0.5 + 0.5;
        ctx.shadowBlur = 20 + pulse * 15;
        ctx.strokeStyle = `rgba(255, ${isClosed ? 0 : 100}, 0, ${0.5 + pulse * 0.5})`;
        ctx.lineWidth = 3;
        // Top edge
        ctx.beginPath();
        ctx.moveTo(gateLeft, h.topY);
        ctx.lineTo(gateRight, h.topY);
        ctx.stroke();
        // Bottom edge
        ctx.beginPath();
        ctx.moveTo(gateLeft, h.bottomY);
        ctx.lineTo(gateRight, h.bottomY);
        ctx.stroke();
      }

      // Sparks when closed
      if (isClosed && frame % 3 === 0) {
        spawnExplosion(screenX + (Math.random() - 0.5) * 20, h.centerY, 2, ['#ffffff', '#ff4400', '#ffaa00']);
      }

      ctx.restore();

      // Warning particles before closing
      if (h.phase === 'open' && h.timer > h.cycleTimes.open - 40) {
        const urgency = (h.timer - (h.cycleTimes.open - 40)) / 40;
        if (frame % Math.max(1, Math.floor(6 - urgency * 5)) === 0) {
          spawnExplosion(screenX, h.topOpenY + 5, 1, ['#ffaa00', '#ff6600']);
          spawnExplosion(screenX, h.bottomOpenY - 5, 1, ['#ffaa00', '#ff6600']);
        }
      }
    }
  }

  ctx.restore();
}

function checkTunnelCollisions() {
  if (!tunnelActive || !player.alive) return;

  const phw = player.width * 0.3;  // half hitbox width
  const phh = player.height * 0.3; // half hitbox height

  // Player vs tunnel walls
  const bounds = getTunnelBoundsAtX(player.x);
  let hitWall = false;

  if (player.y - phh < bounds.topY) {
    player.y = bounds.topY + phh;
    player.vy = Math.abs(player.vy) * 0.3;
    hitWall = true;
  }
  if (player.y + phh > bounds.bottomY) {
    player.y = bounds.bottomY - phh;
    player.vy = -Math.abs(player.vy) * 0.3;
    hitWall = true;
  }

  if (hitWall && player.invincible <= 0) {
    killPlayer();
    return;
  }

  // Player vs plasma blades
  for (const h of tunnelHazards) {
    if (h.type !== 'plasmaBlade') continue;
    const screenX = h.worldX - tunnelScrollX;
    const bladeCount = h.double ? 2 : 1;

    for (let b = 0; b < bladeCount; b++) {
      const angle = h.angle + b * Math.PI;
      const tipX = screenX + Math.cos(angle) * h.radius;
      const tipY = h.cy + Math.sin(angle) * h.radius;

      // Point-to-segment distance
      const dist = pointToSegmentDist(player.x, player.y, screenX, h.cy, tipX, tipY);
      if (dist < phw + 3) { // blade has ~3px effective width
        if (player.invincible <= 0) {
          killPlayer();
          return;
        }
      }
    }
  }

  // Player vs closing gates
  for (const h of tunnelHazards) {
    if (h.type !== 'gate') continue;
    const screenX = h.worldX - tunnelScrollX;
    const halfW = h.gateWidth / 2;

    // Is player in the gate's X range?
    if (player.x + phw > screenX - halfW && player.x - phw < screenX + halfW) {
      // Is the player inside the gap? (between topY and bottomY)
      if (player.y - phh < h.topY || player.y + phh > h.bottomY) {
        // Player is touching the gate slabs
        if (h.phase === 'closed' || h.phase === 'closing') {
          // During dash, be forgiving — let them squeeze through if mid-dash
          if (player.dodgeTimer > 0) {
            // Forgiving: don't kill during active dash, just nudge them through
            continue;
          }
          if (player.invincible <= 0) {
            killPlayer();
            return;
          }
        } else {
          // Open/opening — push player out of gate slab
          if (player.y < h.centerY) {
            player.y = h.topY + phh;
          } else {
            player.y = h.bottomY - phh;
          }
        }
      }
    }
  }

  // Bullets vs tunnel walls
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    const wb = getTunnelBoundsAtX(b.x);
    if (b.y < wb.topY || b.y > wb.bottomY) {
      spawnExplosion(b.x, b.y, 3, ['#00cccc', '#004466', '#002233']);
      playerBullets.splice(i, 1);
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    const wb = getTunnelBoundsAtX(b.x);
    if (b.y < wb.topY || b.y > wb.bottomY) {
      spawnExplosion(b.x, b.y, 2, ['#ff4400', '#441100']);
      enemyBullets.splice(i, 1);
    }
  }
}

// Point-to-line-segment distance
function pointToSegmentDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.sqrt((px - ax) * (px - ax) + (py - ay) * (py - ay));
  let t = ((px - ax) * dx + (py - ay) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));
}

// Sprinkles random drones/chargers throughout gameplay independent of waves,
// giving variable density — sometimes lonely, sometimes a cluster.
let ambientAsteroidTimer = 220;

function updateAmbientAsteroids() {
  if (gameState !== 'GAMEPLAY' && gameState !== 'MID_BOSS_FIGHT') return;
  if (tunnelActive) return;
  ambientAsteroidTimer--;
  if (ambientAsteroidTimer > 0) return;

  // Much denser asteroid field during Shepherd fight
  if (gameState === 'MID_BOSS_FIGHT' && midBoss) {
    const p2 = midBoss.phase === 2;
    ambientAsteroidTimer = p2 ? 35 + Math.floor(Math.random() * 65) : 60 + Math.floor(Math.random() * 100);
  } else {
    ambientAsteroidTimer = 160 + Math.floor(Math.random() * 360);
  }

  const inBossFight = gameState === 'MID_BOSS_FIGHT' && midBoss;
  const count = inBossFight
    ? (midBoss.phase === 2 ? 2 + Math.floor(Math.random() * 2) : (Math.random() < 0.4 ? 2 : 1))
    : (Math.random() < 0.25 ? 2 + Math.floor(Math.random() * 2) : 1);
  const baseY = 50 + Math.random() * (CONFIG.height - 140);

  for (let c = 0; c < count; c++) {
    const type = Math.random() < 0.2 ? 'charger' : 'drone';
    const y = Math.max(40, Math.min(CONFIG.height - 40, baseY + (Math.random() - 0.5) * 90));
    const e = spawnEnemy(type, CONFIG.width + 30 + c * 45, y);
    if (e) { e.speed = 1.5 + Math.random() * 2.5; e.ambient = true; }
  }
}

let currentStage = 1;
let currentWave = 0;
let waveTimer = 0;
let waveActive = false;
let score = 0;
let enemiesDestroyed = 0;

function updateWaves() {
  const waves = stageWaves[currentStage];
  if (!waves || currentWave >= waves.length) {
    // All waves done — spawn boss
    if (!boss && gameState === 'GAMEPLAY') {
      gameState = 'BOSS_WARNING';
      bossWarningTimer = 120;
    }
    return;
  }

  // Wait for current wave enemies to be cleared (or mostly cleared) and delay passed
  if (!waveActive) {
    waveTimer++;
    const wave = waves[currentWave];
    // As soon as we start counting down toward the mid-boss, trigger the suction
    if (wave.midBoss && !preMidBoss) preMidBoss = true;
    if (waveTimer >= wave.delay && enemies.filter(e => !e.ambient).length <= 2) {
      if (wave.midBoss) {
        // Trigger mid-boss encounter
        gameState = 'MID_BOSS_WARNING';
        midBossWarningTimer = 150;
        waveActive = true;   // hold here until destroyMidBoss() advances it
        return;
      }
      if (wave.tunnel) {
        // Trigger tunnel gauntlet
        gameState = 'TUNNEL_WARNING';
        tunnelWarningTimer = 120;
        waveActive = true;   // hold here until completeTunnel() advances it
        return;
      }
      // Spawn wave
      for (const e of wave.enemies) {
        spawnEnemy(e.type, e.x, e.y);
      }
      if (wave.pickups) {
        for (const p of wave.pickups) {
          spawnPickup(p.x, p.y, p.type);
        }
      }
      waveActive = true;
    }
  } else {
    // Wave active — check if cleared
    if (enemies.filter(e => !e.ambient).length === 0) {
      waveActive = false;
      waveTimer = 0;
      currentWave++;
    }
  }
}

// === HUD ===
function drawHUD() {
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.fillStyle = CONFIG.colors.hud;
  ctx.font = '16px monospace';

  // Score
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + String(score).padStart(8, '0'), 20, 28);

  // Stage
  ctx.textAlign = 'center';
  ctx.fillText('STAGE ' + currentStage, CONFIG.width / 2, 28);

  // Lives
  ctx.textAlign = 'right';
  let livesStr = 'LIVES: ';
  for (let i = 0; i < player.lives; i++) livesStr += '♦ ';
  ctx.fillText(livesStr, CONFIG.width - 20, 28);

  // Secondary weapon
  if (player.secondary) {
    ctx.textAlign = 'right';
    ctx.font = '12px monospace';
    ctx.fillText(player.secondary + ': ' + player.secondaryAmmo, CONFIG.width - 20, 48);
  }

  // Weapon stats indicator
  ctx.textAlign = 'left';
  ctx.font = '12px monospace';
  ctx.fillStyle = CONFIG.colors.playerBullet;
  let wpnLabel = 'WPN ' + player.weaponLevel + '×';
  if (player.upgrades.fireRate > 0) wpnLabel += ' R' + (player.fireRateOverride || CONFIG.playerFireRate);
  if (player.upgrades.gravLock > 0) wpnLabel += ' G' + player.upgrades.gravLock;
  ctx.fillText(wpnLabel, 20, 48);

  // Shield status
  if (player.upgrades.shieldRegen > 0) {
    if (player.shieldActive) {
      ctx.fillStyle = '#ffee88';
      ctx.shadowColor = '#ffee88';
      ctx.shadowBlur = 6;
      ctx.fillText('SHIELD ●', 20, 64);
      ctx.shadowBlur = 0;
    } else if (player.shieldRechargeTimer > 0) {
      const secsLeft = Math.ceil(player.shieldRechargeTimer / 60);
      ctx.fillStyle = 'rgba(255, 220, 80, 0.4)';
      ctx.fillText('SHIELD ' + secsLeft + 's', 20, 64);
    }
  }

  // Score multiplier (shown when above 1x)
  {
    const baseMultiplier = 1 + (player.xpLevel - 1) * 0.25;
    const totalMult = baseMultiplier * player.scoreMultBonus;
    if (totalMult > 1.01) {
      ctx.fillStyle = '#00ffee';
      ctx.shadowColor = '#00ffee';
      ctx.shadowBlur = 6;
      ctx.fillText('×' + totalMult.toFixed(2), 20, player.upgrades.shieldRegen > 0 ? 80 : 64);
      ctx.shadowBlur = 0;
    }
  }

  // Dodge cooldown bar — lower left
  {
    const dodgeReady = player.dodgeCooldown <= 0;
    const cooldownPct = dodgeReady ? 1 : 1 - (player.dodgeCooldown / player.dodgeCooldownBase);
    const barX = 20, barY = CONFIG.height - 32;
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = dodgeReady ? '#00ffff' : 'rgba(0,200,255,0.4)';
    ctx.shadowBlur = 0;
    ctx.fillText('DODGE', barX, barY - 4);
    // Background
    ctx.fillStyle = '#112233';
    ctx.fillRect(barX, barY, 60, 7);
    // Fill
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = dodgeReady ? 8 : 2;
    ctx.fillStyle = dodgeReady ? '#00ffff' : '#006688';
    ctx.fillRect(barX, barY, Math.round(60 * cooldownPct), 7);
    ctx.shadowBlur = 0;
  }

  // XP bar — lower right
  {
    const xpPct = player.xp / player.xpToNext;
    const barW = 100;
    const barX = CONFIG.width - 20 - barW;
    const barY = CONFIG.height - 32;
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#88ffee';
    ctx.fillText('LV' + player.xpLevel + ' XP', CONFIG.width - 20, barY - 4);
    // Background
    ctx.fillStyle = '#0a2220';
    ctx.fillRect(barX, barY, barW, 7);
    // Fill
    ctx.shadowColor = '#00ffee';
    ctx.shadowBlur = xpPct > 0.9 ? 12 : 4;
    ctx.fillStyle = xpPct > 0.9 ? '#ffffff' : '#00ddcc';
    ctx.fillRect(barX, barY, Math.round(barW * xpPct), 7);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// === SCREENS ===
function drawTitleScreen() {
  drawBackground();

  const cx = CONFIG.width / 2;
  const cy = CONFIG.height / 2 - 30;
  const t = frame * 0.02;
  const pulse = Math.sin(t * 2) * 0.5 + 0.5;
  const slowPulse = Math.sin(t * 0.7) * 0.5 + 0.5;

  ctx.save();

  // Radial light burst behind title
  const burstGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, 280);
  burstGrad.addColorStop(0, `rgba(0, 240, 255, ${0.08 + slowPulse * 0.06})`);
  burstGrad.addColorStop(0.4, `rgba(0, 120, 255, ${0.04 + slowPulse * 0.03})`);
  burstGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = burstGrad;
  ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

  // === DIAGNOSTICS HUD FRAME ===
  const scanAlpha = 0.15 + pulse * 0.1;
  const diagColor = `rgba(0, 240, 255, ${scanAlpha})`;
  const diagColorDim = `rgba(0, 180, 255, ${scanAlpha * 0.5})`;
  ctx.strokeStyle = diagColor;
  ctx.lineWidth = 1;
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 4;

  // Targeting corners — top-left, top-right, bottom-left, bottom-right
  const tl = { x: cx - 255, y: cy - 100 };
  const br = { x: cx + 255, y: cy + 95 };
  const cLen = 30;
  // TL
  ctx.beginPath();
  ctx.moveTo(tl.x + cLen, tl.y); ctx.lineTo(tl.x, tl.y); ctx.lineTo(tl.x, tl.y + cLen);
  ctx.stroke();
  // TR
  ctx.beginPath();
  ctx.moveTo(br.x - cLen, tl.y); ctx.lineTo(br.x, tl.y); ctx.lineTo(br.x, tl.y + cLen);
  ctx.stroke();
  // BL
  ctx.beginPath();
  ctx.moveTo(tl.x + cLen, br.y); ctx.lineTo(tl.x, br.y); ctx.lineTo(tl.x, br.y - cLen);
  ctx.stroke();
  // BR
  ctx.beginPath();
  ctx.moveTo(br.x - cLen, br.y); ctx.lineTo(br.x, br.y); ctx.lineTo(br.x, br.y - cLen);
  ctx.stroke();

  // Horizontal sweep line — scans down through the title area
  const sweepCycle = (frame % 180) / 180; // 0→1 over 3 seconds
  const sweepY = tl.y + sweepCycle * (br.y - tl.y);
  const sweepAlpha = Math.sin(sweepCycle * Math.PI) * 0.35;
  ctx.strokeStyle = `rgba(0, 240, 255, ${sweepAlpha})`;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(tl.x + 5, sweepY);
  ctx.lineTo(br.x - 5, sweepY);
  ctx.stroke();
  // Faint glow band at sweep line
  const sweepGrad = ctx.createLinearGradient(0, sweepY - 12, 0, sweepY + 12);
  sweepGrad.addColorStop(0, 'rgba(0,240,255,0)');
  sweepGrad.addColorStop(0.5, `rgba(0,240,255,${sweepAlpha * 0.3})`);
  sweepGrad.addColorStop(1, 'rgba(0,240,255,0)');
  ctx.fillStyle = sweepGrad;
  ctx.fillRect(tl.x, sweepY - 12, br.x - tl.x, 24);

  // Diagnostic micro-text — system readout along left edge
  ctx.shadowBlur = 0;
  ctx.font = '8px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = diagColorDim;
  const diagLines = ['SYS.BOOT', 'NAV_LOCK', 'WPN.RDY', 'SHLD.OK', 'FTL:STANDBY'];
  for (let d = 0; d < diagLines.length; d++) {
    const dy = tl.y + 14 + d * 11;
    // Staggered reveal based on frame
    if (frame > 30 + d * 12) {
      ctx.fillText(diagLines[d], tl.x + 6, dy);
      // Status pip
      ctx.fillStyle = d < 4 ? `rgba(0, 255, 120, ${scanAlpha})` : `rgba(255, 200, 0, ${scanAlpha})`;
      ctx.fillRect(tl.x + 58, dy - 5, 4, 4);
      ctx.fillStyle = diagColorDim;
    }
  }

  // Signal strength bars — right edge
  ctx.textAlign = 'right';
  ctx.fillText('SIG', br.x - 6, tl.y + 14);
  for (let b = 0; b < 5; b++) {
    const bh = 4 + b * 2;
    const bx = br.x - 40 + b * 7;
    const by = tl.y + 24 + (14 - bh);
    const active = b < 3 + Math.floor(slowPulse * 2.5);
    ctx.fillStyle = active ? `rgba(0, 255, 120, ${scanAlpha})` : `rgba(60, 80, 100, ${scanAlpha})`;
    ctx.fillRect(bx, by, 5, bh);
  }

  // Coordinate readout — bottom right
  ctx.fillStyle = diagColorDim;
  ctx.textAlign = 'right';
  const coordX = (Math.sin(t * 0.3) * 42 + 127.4).toFixed(1);
  const coordY = (Math.cos(t * 0.5) * 18 + 63.2).toFixed(1);
  ctx.fillText(`${coordX}  ${coordY}`, br.x - 6, br.y - 6);

  ctx.textAlign = 'center';
  ctx.shadowBlur = 0;

  // "SPACE" — large, skewed italic, racing forward
  ctx.textAlign = 'center';

  // Apply a forward-lean skew transform for the title
  ctx.save();
  ctx.translate(cx, cy);
  ctx.transform(1, 0, -0.22, 1, 0, 0); // horizontal shear — italic lean
  ctx.translate(-cx, -cy);

  ctx.font = 'bold 68px monospace';

  // Multi-layer glow: outer blur
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 40 + pulse * 20;
  ctx.fillStyle = `rgba(0, 200, 255, ${0.25 + pulse * 0.15})`;
  ctx.fillText('S P A C E', cx, cy - 25);

  // Speed streak ghosts — trailing copies offset left with decreasing alpha
  ctx.shadowBlur = 0;
  for (let g = 3; g >= 1; g--) {
    ctx.fillStyle = `rgba(0, 180, 255, ${0.04 * g})`;
    ctx.fillText('S P A C E', cx - g * 8, cy - 25);
  }

  // Mid glow layer
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 18 + pulse * 8;
  ctx.fillStyle = `rgba(0, 240, 255, ${0.6 + pulse * 0.2})`;

  // Speed streak ghosts

  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 18 + pulse * 8;
  ctx.fillStyle = `rgba(0, 240, 255, ${0.6 + pulse * 0.2})`;
  ctx.fillText('T O O T S', cx, cy + 45);

  ctx.shadowBlur = 6;

  ctx.shadowBlur = 0;
