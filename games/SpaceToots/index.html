<!DOCTYPE html>
<html lang="en">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas {
    display: block;
    margin: auto;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    image-rendering: pixelated;
    touch-action: none;
  }

  /* Portrait orientation overlay for mobile */
  #rotate-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #0a0a1a;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: monospace;
    color: #e0e0ff;
    text-align: center;
  }
  #rotate-overlay .phone-icon {
    width: 60px;
    height: 100px;
    border: 3px solid #00f0ff;
    border-radius: 10px;
    position: relative;
    animation: tilt-phone 2s ease-in-out infinite;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
  }
  #rotate-overlay .phone-icon::after {
    content: '';
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #00f0ff;
  }
  #rotate-overlay .phone-icon::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 3px;
    border-radius: 2px;
    background: #00f0ff;
  }
  @keyframes tilt-phone {
    0%, 15%  { transform: rotate(0deg); }
    40%, 60% { transform: rotate(-90deg); }
    85%, 100% { transform: rotate(0deg); }
  }
  #rotate-overlay .rotate-msg {
    font-size: 16px;
    opacity: 0.8;
    letter-spacing: 2px;
  }
  #rotate-overlay .rotate-sub {
    font-size: 11px;
    opacity: 0.4;
  }

  /* Back to site link on title screen */
  #back-link {
    display: none;
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(180, 180, 220, 0.35);
    text-decoration: none;
    padding: 8px 16px;
    transition: color 0.2s;
  }
  #back-link:hover, #back-link:active {
    color: rgba(0, 240, 255, 0.7);
  }

  @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
    #rotate-overlay { display: flex; }
  }
</style>
</head>
<body>
<div id="rotate-overlay">
  <div class="phone-icon"></div>
  <div class="rotate-msg">ROTATE TO PLAY</div>
  <div class="rotate-sub">SPACE TOOTS IS BEST IN LANDSCAPE</div>
</div>
<a id="back-link" href="https://charleswilke.com">&#8592; CHARLESWILKE.COM</a>
<canvas id="game"></canvas>
<script>
// ============================================================
//  SPACE TOOTS — A side-scrolling bullet hell for the web
//  Pure Canvas API + vanilla JS. No dependencies.
// ============================================================

// === CONFIG ===
const CONFIG = {
  width: 960,
  height: 540,
  playerSpeed: 5,
  playerFireRate: 48,       // frames between shots (~0.8 sec at 60fps)
  bulletSpeed: 10,
  enemyBulletSpeed: 4,
  maxBullets: 200,
  maxEnemies: 30,
  maxParticles: 250,
  colors: {
    bg:          '#0a0a1a',
    grid:        '#2a1040',
    player:      '#00f0ff',
    playerBullet:'#a0ff00',
    enemy:       '#ff00aa',
    enemyBullet: '#ff4400',
    asteroid:    '#aaeeff',
    pickup:      '#ffd700',
    boss:        '#ffffff',
    hud:         '#e0e0ff'
  },
  weapons: {
    secondary: {
      homing:  { name: "The Bloodhound",        flavor: "Good boy. Good, deadly boy.",          ammo: 20 },
      wave:    { name: "The Silent But Deadly",  flavor: "You'll smell it before you see it.",   ammo: 15 },
      spread:  { name: "Astro's Revenge",        flavor: "He remembers what you did to his toy.",ammo: 10 },
      shield:  { name: "Doc's Bubble",           flavor: "Personal space is non-negotiable.",    duration: 15 },
      laser:   { name: "The Full Send",          flavor: "No half measures.",                    ammo: 3 }
    }
  },
  enemies: {
    drone:   { name: "Buzzkill",     hp: 1, points: 100 },
    weaver:  { name: "The Wobbler",  hp: 2, points: 200 },
    charger: { name: "Karen",        hp: 3, points: 300 },
    turret:  { name: "The Intern",   hp: 4, points: 250 },
    spawner: { name: "The HOA",      hp: 5, points: 500 },
    bomber:  { name: "Oops",         hp: 3, points: 350 },
    gravwell: { name: "The Shepherd", hp: 5, points: 550 }
  },
  bosses: {
    stage1: { name: "THE BIG CHUNGUS",  title: "Keeper of the Void" },
    stage2: { name: "CAPTAIN CRAMP",    title: "Terror of the Reef" },
    stage3: { name: "EL JEFE GRANDE",   title: "The Final Flatulence" }
  }
};

// === DODGE & XP CONSTANTS ===
const DODGE_DURATION = 18;    // frames of active dash
const DODGE_COOLDOWN = 120;   // frames before next dodge (2 sec at 60fps, upgradeable)
const DODGE_IMPULSE  = 9;     // velocity impulse (above maxVel of 6)
const DODGE_KEY      = 'ShiftLeft';
const DODGE_KEY_ALT  = 'ShiftRight';

const XP_ATTRACT_RADIUS = 45;   // px — magnetic pull starts here
const XP_ATTRACT_ACCEL  = 0.8;  // acceleration toward player per frame
const XP_ATTRACT_DRAG   = 0.88; // drag on orb velocity (caps attraction speed)
const XP_ORB_DRIFT      = 0.6;  // baseline leftward scroll speed (px/frame)

// === LEVEL-UP UPGRADES ===
const UPGRADES = {
  spread:      { name: 'Spread Shot',      icon: '⚔', desc: 'Spread & power up',         color: '#00ffff', maxTier: 5,
                 tiers: ['2-Way','3-Way','Power ×1.2','Power ×1.4','Power ×1.7'] },
  fireRate:    { name: 'Fire Rate',        icon: '↑', desc: 'Shoot faster',               color: '#44ddff', maxTier: 5,
                 tiers: ['36f','26f','18f','12f','8f'], values: [36, 26, 18, 12, 8] },
  gravLock:    { name: 'Grav Lock',        icon: '◉', desc: 'Bullets curve to enemies',   color: '#dd44ff', maxTier: 5,
                 tiers: ['Weak','Med','Strong','Homing','Max'],
                 values: [
                   { radius: 80,  force: 0.15 },
                   { radius: 120, force: 0.3 },
                   { radius: 160, force: 0.5 },
                   { radius: 220, force: 0.8 },
                   { radius: 280, force: 1.2 }
                 ]},
  xpMagnet:    { name: 'XP Magnet',        icon: '◎', desc: 'Attract XP from further',   color: '#00ffee', maxTier: 5,
                 tiers: ['45px','65px','90px','120px','160px'], values: [45, 65, 90, 120, 160] },
  boostDur:    { name: 'Boost Duration',   icon: '»', desc: 'Longer dodge dash',          color: '#ff8800', maxTier: 5,
                 tiers: ['18f','22f','26f','30f','34f'], values: [18, 22, 26, 30, 34] },
  boostRecharge: { name: 'Boost Recharge', icon: '↻', desc: 'Faster dodge cooldown',     color: '#ffaa44', maxTier: 5,
                 tiers: ['105f','90f','80f','70f','55f'], values: [105, 90, 80, 70, 55] },
  speed:       { name: 'Thruster Power',   icon: '⚡', desc: 'Increase max speed',        color: '#44ff44', maxTier: 5,
                 tiers: ['6.0','6.8','7.6','8.4','9.2'], values: [6, 6.8, 7.6, 8.4, 9.2] },
  shieldRegen: { name: 'Shield Systems',   icon: '◈', desc: 'Faster shield recharge',    color: '#ffee88', maxTier: 5,
                 tiers: ['30s','24s','18s','13s','9s'], values: [30, 24, 18, 13, 9] },
  scoreMult:   { name: 'Score Bonus',      icon: '★', desc: 'Multiply score earned',     color: '#ff44ff', maxTier: 5,
                 tiers: ['1.0×','1.25×','1.5×','1.75×','2.0×'], values: [1.0, 1.25, 1.5, 1.75, 2.0] }
};

// === ENGINE ===
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const backLink = document.getElementById('back-link');
canvas.width = CONFIG.width;
canvas.height = CONFIG.height;

function resizeCanvas() {
  const scaleX = window.innerWidth / CONFIG.width;
  const scaleY = window.innerHeight / CONFIG.height;
  const scale = Math.min(scaleX, scaleY);
  canvas.style.width = (CONFIG.width * scale) + 'px';
  canvas.style.height = (CONFIG.height * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Mobile detection
let isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

function screenToGame(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / rect.width * CONFIG.width,
    y: (clientY - rect.top) / rect.height * CONFIG.height
  };
}

// Input
const keys = {};
const _doubleTap = {};   // tracks last tap time per direction key
const DOUBLE_TAP_MS = 250;
const DOUBLE_TAP_DIRS = {
  ArrowRight: { dx: 1, dy: 0 }, KeyD: { dx: 1, dy: 0 },
  ArrowUp:    { dx: 0, dy:-1 }, KeyW: { dx: 0, dy:-1 },
  ArrowDown:  { dx: 0, dy: 1 }, KeyS: { dx: 0, dy: 1 }
};

window.addEventListener('keydown', e => {
  if (!keys[e.code] && DOUBLE_TAP_DIRS[e.code]) {
    const now = performance.now();
    const dir = DOUBLE_TAP_DIRS[e.code];
    // Normalize so ArrowRight and KeyD share the same slot
    const slot = dir.dx + ',' + dir.dy;
    if (_doubleTap[slot] && now - _doubleTap[slot] < DOUBLE_TAP_MS) {
      player._doubleTapDodge = dir;
      _doubleTap[slot] = 0;
    } else {
      _doubleTap[slot] = now;
    }
  }
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Mouse position in game coords (for hover effects)
const mousePos = { x: -1, y: -1 };

// Mouse drag input state
const mouseDrag = {
  active: false,
  startX: 0, startY: 0,
  shipStartX: 0, shipStartY: 0,
  currentX: 0, currentY: 0,
  lastClickTime: 0,
  lastClickX: 0, lastClickY: 0,
  dodgePending: null
};

// Scroll wheel for level-up card selection
canvas.addEventListener('wheel', e => {
  if (gameState !== 'LEVEL_UP' || levelUpAnimTimer < 22) return;
  e.preventDefault();
  if (e.deltaY > 0 || e.deltaX > 0) {
    levelUpSelection = Math.min(levelUpCards.length - 1, levelUpSelection + 1);
  } else if (e.deltaY < 0 || e.deltaX < 0) {
    levelUpSelection = Math.max(0, levelUpSelection - 1);
  }
}, { passive: false });

// Right-click for secondary fire
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (isMobile) return;
  if (['GAMEPLAY', 'MID_BOSS_FIGHT', 'BOSS_FIGHT', 'TUNNEL_GAUNTLET'].includes(gameState)) {
    mouseDrag.secondaryFired = true;
  }
});

canvas.addEventListener('mousedown', e => {
  if (isMobile) return;
  if (e.button === 2) return; // right-click handled by contextmenu
  const pos = screenToGame(e.clientX, e.clientY);
  // Click to start/retry/continue on menu screens
  if (['TITLE', 'GAME_OVER', 'WIN', 'STAGE_CLEAR'].includes(gameState)) {
    keys['Enter'] = true;
    setTimeout(() => { keys['Enter'] = false; }, 50);
    return;
  }
  // Pause button click
  if (['GAMEPLAY', 'MID_BOSS_FIGHT', 'BOSS_FIGHT', 'TUNNEL_GAUNTLET'].includes(gameState)) {
    if (pos.x >= 10 && pos.x <= 46 && pos.y >= 80 && pos.y <= 116) {
      paused = !paused;
      return;
    }
    // Mute button click
    if (pos.x >= 10 && pos.x <= 46 && pos.y >= 122 && pos.y <= 158) {
      muted = !muted;
      if (audioCtx) {
        if (muted) { audioCtx.suspend(); } else { audioCtx.resume(); }
      }
      return;
    }
  }
  // Click anywhere to unpause
  if (paused) {
    paused = false;
    return;
  }
  // Level-up card click — select card under cursor, click again to confirm
  if (gameState === 'LEVEL_UP' && levelUpAnimTimer >= 22) {
    const cardW = 180, cardH = 240, gap = 24;
    const cardCount = levelUpCards.length;
    const totalW = cardCount * cardW + (cardCount - 1) * gap;
    const startX = (CONFIG.width - totalW) / 2;
    const cardY = 140;
    for (let i = 0; i < cardCount; i++) {
      const cardX = startX + i * (cardW + gap);
      if (pos.x >= cardX && pos.x <= cardX + cardW && pos.y >= cardY && pos.y <= cardY + cardH) {
        if (levelUpSelection === i) {
          keys['Enter'] = true;
          setTimeout(() => { keys['Enter'] = false; }, 50);
        } else {
          levelUpSelection = i;
        }
        return;
      }
    }
    return;
  }
  // Double-click dodge — direction from player toward click position
  if (['GAMEPLAY', 'MID_BOSS_FIGHT', 'BOSS_FIGHT', 'TUNNEL_GAUNTLET'].includes(gameState)) {
    const now = performance.now();
    if (now - mouseDrag.lastClickTime < DOUBLE_TAP_MS) {
      const dx = pos.x - player.x;
      const dy = pos.y - player.y;
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len > 0) {
        mouseDrag.dodgePending = { dx: dx / len, dy: dy / len };
      }
      mouseDrag.lastClickTime = 0;
    } else {
      mouseDrag.lastClickTime = now;
    }
  }
  // Only start drag during active gameplay states
  if (['GAMEPLAY', 'MID_BOSS_FIGHT', 'BOSS_FIGHT', 'TUNNEL_GAUNTLET'].includes(gameState)) {
    mouseDrag.active = true;
    mouseDrag.startX = pos.x;
    mouseDrag.startY = pos.y;
    mouseDrag.shipStartX = player.x;
    mouseDrag.shipStartY = player.y;
    mouseDrag.currentX = pos.x;
    mouseDrag.currentY = pos.y;
  }
});

window.addEventListener('mousemove', e => {
  const pos = screenToGame(e.clientX, e.clientY);
  mousePos.x = pos.x;
  mousePos.y = pos.y;
  // Cursor style — pointer on interactive elements
  const inGameplay = ['GAMEPLAY', 'MID_BOSS_FIGHT', 'BOSS_FIGHT', 'TUNNEL_GAUNTLET'].includes(gameState);
  const overPause = inGameplay && pos.x >= 10 && pos.x <= 80 && pos.y >= 80 && pos.y <= 115;
  const overCard = gameState === 'LEVEL_UP' && levelUpAnimTimer >= 22 && pos.y >= 140 && pos.y <= 380;
  canvas.style.cursor = overPause || overCard ? 'pointer' : '';
  // Level-up card hover — highlight card under cursor
  if (gameState === 'LEVEL_UP' && levelUpAnimTimer >= 22) {
    const cardW = 180, cardH = 240, gap = 24;
    const cardCount = levelUpCards.length;
    const totalW = cardCount * cardW + (cardCount - 1) * gap;
    const startX = (CONFIG.width - totalW) / 2;
    const cardY = 140;
    for (let i = 0; i < cardCount; i++) {
      const cardX = startX + i * (cardW + gap);
      if (pos.x >= cardX && pos.x <= cardX + cardW && pos.y >= cardY && pos.y <= cardY + cardH) {
        levelUpSelection = i;
        break;
      }
    }
  }
  if (!mouseDrag.active) return;
  mouseDrag.currentX = pos.x;
  mouseDrag.currentY = pos.y;
});

window.addEventListener('mouseup', (e) => {
  if (e.button === 0) mouseDrag.active = false; // only end drag on left button release
});

// Touch input state
const touch = {
  active: false,
  startX: 0, startY: 0,
  shipStartX: 0, shipStartY: 0,
  currentX: 0, currentY: 0,
  swipeStartX: 0, swipeStartY: 0, swipeStartTime: 0,
  swipeDodge: null,
  secondaryTapped: false,
  secondaryDebounce: 0,
  secondaryArrivalWindow: 0
};

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  // Two-finger tap = secondary fire
  if (e.touches.length >= 2) {
    touch.secondaryTapped = true;
    return;
  }
  // Second finger arriving within 100ms also counts
  if (touch.secondaryArrivalWindow > 0 && e.touches.length >= 1) {
    touch.secondaryTapped = true;
    touch.secondaryArrivalWindow = 0;
    return;
  }

  const pos = screenToGame(e.touches[0].clientX, e.touches[0].clientY);

  // Tap-to-start on menu screens
  if (['TITLE', 'GAME_OVER', 'WIN', 'STAGE_CLEAR'].includes(gameState)) {
    keys['Enter'] = true;
    setTimeout(() => { keys['Enter'] = false; }, 50);
    return;
  }

  // Pause button tap
  if (gameState === 'GAMEPLAY' || gameState === 'BOSS_FIGHT' || gameState === 'MID_BOSS_FIGHT' || gameState === 'TUNNEL_GAUNTLET') {
    if (pos.x >= 10 && pos.x <= 46 && pos.y >= 80 && pos.y <= 116) {
      paused = !paused;
      return;
    }
    // Mute button tap
    if (pos.x >= 10 && pos.x <= 46 && pos.y >= 122 && pos.y <= 158) {
      muted = !muted;
      if (audioCtx) {
        if (muted) { audioCtx.suspend(); } else { audioCtx.resume(); }
      }
      return;
    }
  }

  // Unpause on tap when paused
  if (paused) {
    paused = false;
    return;
  }

  // Level-up card tap selection
  if (gameState === 'LEVEL_UP' && levelUpAnimTimer >= 22) {
    const cardW = 180, cardH = 240, gap = 24;
    const cardCount = levelUpCards.length;
    const totalW = cardCount * cardW + (cardCount - 1) * gap;
    const startX = (CONFIG.width - totalW) / 2;
    const cardY = 140;
    for (let i = 0; i < cardCount; i++) {
      const cardX = startX + i * (cardW + gap);
      if (pos.x >= cardX && pos.x <= cardX + cardW && pos.y >= cardY && pos.y <= cardY + cardH) {
        if (levelUpSelection === i) {
          // Tap on already-selected card = confirm
          keys['Enter'] = true;
          setTimeout(() => { keys['Enter'] = false; }, 50);
        } else {
          levelUpSelection = i;
        }
        return;
      }
    }
    return;
  }

  // Movement: record start position
  touch.active = true;
  touch.startX = pos.x;
  touch.startY = pos.y;
  touch.shipStartX = player.x;
  touch.shipStartY = player.y;
  touch.currentX = pos.x;
  touch.currentY = pos.y;
  touch.swipeStartX = pos.x;
  touch.swipeStartY = pos.y;
  touch.swipeStartTime = performance.now();
  touch.secondaryArrivalWindow = 6; // frames (~100ms) for second finger
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (touch.active && e.touches.length >= 1) {
    const pos = screenToGame(e.touches[0].clientX, e.touches[0].clientY);
    touch.currentX = pos.x;
    touch.currentY = pos.y;
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (e.touches.length === 0) {
    // Check for swipe dodge before clearing
    if (touch.active) {
      const endTime = performance.now();
      const duration = endTime - touch.swipeStartTime;
      const dx = touch.currentX - touch.swipeStartX;
      const dy = touch.currentY - touch.swipeStartY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const speed = distance / duration; // px/ms in game coords

      if (duration < 250 && distance > 25 && speed > 0.15) {
        touch.swipeDodge = { dx: dx / distance, dy: dy / distance };
      }
    }
    touch.active = false;
  }
}, { passive: false });

canvas.addEventListener('touchcancel', e => {
  e.preventDefault();
  touch.active = false;
}, { passive: false });

// Frame counter
let frame = 0;

// === SCREEN SHAKE & HITSTOP ===
let screenShakeX = 0, screenShakeY = 0, screenShakeTimer = 0, screenShakeIntensity = 0;
let hitStopFrames = 0;

function triggerScreenShake(intensity, duration) {
  screenShakeIntensity = Math.max(screenShakeIntensity, intensity);
  screenShakeTimer = Math.max(screenShakeTimer, duration);
}

function triggerHitStop(frames) {
  hitStopFrames = Math.max(hitStopFrames, frames);
}

function updateScreenShake() {
  if (screenShakeTimer > 0) {
    screenShakeX = (Math.random() - 0.5) * 2 * screenShakeIntensity;
    screenShakeY = (Math.random() - 0.5) * 2 * screenShakeIntensity;
    screenShakeTimer--;
    screenShakeIntensity *= 0.85;
  } else {
    screenShakeX = 0;
    screenShakeY = 0;
    screenShakeIntensity = 0;
  }
}

// === UTILITY HELPERS ===
// O(1) removal from array during reverse iteration (swap with last element and pop)
function swapRemove(arr, i) {
  arr[i] = arr[arr.length - 1];
  arr.pop();
}

function dist(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return Math.sqrt(dx * dx + dy * dy);
}

function distSq(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy;
}

// Shared suction logic for pre-mid-boss asteroid pull effect (drone + charger)
function updateSuctionPhase(e) {
  if (!e.suctionPhase) {
    if (e.suctionDelay === undefined)
      e.suctionDelay = Math.random() < 0.1 ? 40 + Math.floor(Math.random() * 120) : -1;
    if (e.suctionDelay > 0) e.suctionDelay--;
    if (e.suctionDelay === 0) e.suctionPhase = 'slowing';
    e.x -= e.speed;
  } else if (e.suctionPhase === 'slowing') {
    e.speed = Math.max(0, e.speed - 0.09);
    e.x -= e.speed;
    if (e.speed <= 0) { e.suctionPhase = 'wiggling'; e.suctionTimer = 40; }
  } else if (e.suctionPhase === 'wiggling') {
    e.suctionTimer--;
    if (e.suctionTimer <= 0) {
      e.suctionPhase = 'sucked'; e.speed = 0.5;
      if (!shepherdMusicTriggered) {
        shepherdMusicTriggered = true;
        shepherdTrackChoice = Math.random() < 0.5 ? 'shepherd1' : 'shepherd2';
        crossfadeTo(shepherdTrackChoice);
      }
    }
  } else if (e.suctionPhase === 'sucked') {
    e.speed = Math.min(e.speed + 0.55, 16);
    e.x += e.speed;
  }
}

// Shared asteroid shape drawing (used by enemies, gravwell orbitals, mid-boss orbitals)
function drawAsteroidShape(verts, cracks, glowColor, shadowBlur) {
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = shadowBlur;
  ctx.fillStyle = '#12121e';
  ctx.beginPath();
  ctx.moveTo(verts[0].x, verts[0].y);
  for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = glowColor;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  if (cracks) {
    ctx.lineWidth = 1;
    ctx.shadowBlur = Math.min(shadowBlur, 5);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const c of cracks) {
      ctx.beginPath();
      ctx.moveTo(c.x1, c.y1);
      ctx.lineTo(c.xm, c.ym);
      ctx.lineTo(c.x2, c.y2);
      ctx.stroke();
    }
  }
}

// === SCHEDULED ACTIONS (frame-based timers, respects hitstop/pause) ===
const scheduledActions = [];

function scheduleAction(framesDelay, action) {
  scheduledActions.push({ framesRemaining: framesDelay, action });
}

function updateScheduledActions() {
  for (let i = scheduledActions.length - 1; i >= 0; i--) {
    scheduledActions[i].framesRemaining--;
    if (scheduledActions[i].framesRemaining <= 0) {
      scheduledActions[i].action();
      swapRemove(scheduledActions, i);
    }
  }
}

// === MOON TERRAIN (procedural parallax landscapes) ===
// Generates a jagged ridgeline with craters scooped in
function generateTerrain(segWidth, baseY, jaggedness, craterChance, craterMaxW, craterMaxD, totalWidth) {
  const points = [];
  const numSegs = Math.ceil(totalWidth / segWidth) + 1;
  for (let i = 0; i <= numSegs; i++) {
    let y = baseY + (Math.random() - 0.5) * jaggedness;
    // Occasional crater dip
    if (Math.random() < craterChance) {
      const cw = Math.random() * craterMaxW + craterMaxW * 0.4;
      const cd = Math.random() * craterMaxD + craterMaxD * 0.3;
      const halfSegs = Math.max(1, Math.round(cw / segWidth / 2));
      // Push the crater rim up slightly, then scoop down
      points.push({ x: i * segWidth, y: y - cd * 0.15 }); // rim
      for (let c = 1; c <= halfSegs * 2; c++) {
        const ct = c / (halfSegs * 2);
        const craterY = Math.sin(ct * Math.PI) * cd;
        i++;
        points.push({ x: i * segWidth, y: y + craterY });
      }
      points.push({ x: i * segWidth, y: y - cd * 0.1 }); // far rim
    } else {
      points.push({ x: i * segWidth, y });
    }
  }
  return points;
}

// Build a per-vertex jitter/shade grid for faceted terrain mesh
function buildTerrainMeshGrid(layer) {
  let seed = 54321 + layer.meshRows * 7; // different seed per layer
  function srand() { seed = (seed * 16807 + 0) % 2147483647; return (seed & 0x7fffffff) / 2147483647; }
  const cols = layer.points.length;
  const grid = [];
  for (let c = 0; c < cols; c++) {
    const col = [];
    for (let r = 0; r <= layer.meshRows; r++) {
      col.push({
        jx: (srand() - 0.5) * layer.meshJitterX,
        jy: (srand() - 0.5) * layer.meshJitterY,
        shade: srand()
      });
    }
    grid.push(col);
  }
  return grid;
}

// Compute vertex position for terrain mesh
function getTerrainVertPos(layer, col, row) {
  const pt = layer.points[col];
  const g = layer.meshGrid[col][row];
  // Row 0 = ridgeline, row meshRows = screen bottom
  const t = row / layer.meshRows;
  const baseY = pt.y + (CONFIG.height - pt.y) * t;
  // Jitter tapers: full at ridge (row 0), minimal at bottom
  const edgeFactor = 1.0 - t * 0.85;
  return {
    x: pt.x + g.jx * edgeFactor,
    y: baseY + g.jy * edgeFactor,
    shade: g.shade
  };
}

// Pre-render a terrain layer's faceted mesh to an offscreen canvas
function renderTerrainMeshToCanvas(layer) {
  const cvs = document.createElement('canvas');
  cvs.width = terrainWidth;
  cvs.height = CONFIG.height;
  const c = cvs.getContext('2d');
  const pts = layer.points;
  const bR = layer.meshBaseR, bG = layer.meshBaseG, bB = layer.meshBaseB;
  const mR = layer.meshBrightR, mG = layer.meshBrightG, mB = layer.meshBrightB;

  c.lineWidth = 0.5;

  for (let col = 0; col < pts.length - 1; col++) {
    for (let row = 0; row < layer.meshRows; row++) {
      const tl = getTerrainVertPos(layer, col, row);
      const tr = getTerrainVertPos(layer, col + 1, row);
      const bl = getTerrainVertPos(layer, col, row + 1);
      const br = getTerrainVertPos(layer, col + 1, row + 1);

      // Depth: 1.0 at ridge (row 0), 0.0 at bottom
      const depthT = 1.0 - row / layer.meshRows;

      // Triangle 1: tl, tr, bl
      const s1 = (tl.shade + tr.shade + bl.shade) / 3;
      const b1 = depthT * 0.5 + s1 * 0.35;
      const r1 = Math.floor(bR + b1 * mR);
      const g1 = Math.floor(bG + b1 * mG);
      const b1c = Math.floor(bB + b1 * mB);
      c.fillStyle = `rgb(${r1},${g1},${b1c})`;
      c.strokeStyle = `rgba(${r1 + 12},${g1 + 8},${b1c + 15},0.3)`;
      c.beginPath();
      c.moveTo(tl.x, tl.y);
      c.lineTo(tr.x, tr.y);
      c.lineTo(bl.x, bl.y);
      c.closePath();
      c.fill();
      c.stroke();

      // Triangle 2: tr, br, bl
      const s2 = (tr.shade + br.shade + bl.shade) / 3;
      const b2 = depthT * 0.5 + s2 * 0.35;
      const r2 = Math.floor(bR + b2 * mR * 0.9);
      const g2 = Math.floor(bG + b2 * mG * 0.9);
      const b2c = Math.floor(bB + b2 * mB * 0.9);
      c.fillStyle = `rgb(${r2},${g2},${b2c})`;
      c.strokeStyle = `rgba(${r2 + 12},${g2 + 8},${b2c + 15},0.25)`;
      c.beginPath();
      c.moveTo(tr.x, tr.y);
      c.lineTo(br.x, br.y);
      c.lineTo(bl.x, bl.y);
      c.closePath();
      c.fill();
      c.stroke();
    }
  }

  // Ridgeline stroke
  c.strokeStyle = layer.ridgeColor;
  c.lineWidth = layer.ridgeWidth;
  if (layer.ridgeGlow) {
    c.shadowColor = 'rgba(0, 247, 194, 0.15)';
    c.shadowBlur = 6;
  }
  c.beginPath();
  for (let col = 0; col < pts.length; col++) {
    const v = getTerrainVertPos(layer, col, 0);
    if (col === 0) c.moveTo(v.x, v.y);
    else c.lineTo(v.x, v.y);
  }
  c.stroke();
  c.shadowBlur = 0;

  return cvs;
}

// Pre-generate terrain — wide enough to scroll seamlessly (2x screen width for tiling)
const terrainWidth = CONFIG.width * 2;
for (const layer of terrainLayers) {
  layer.points = generateTerrain(
    layer.segWidth, layer.baseY, layer.jaggedness,
    layer.craterChance, layer.craterMaxW, layer.craterMaxD, terrainWidth
  );
  layer.offset = 0;
  // Seamless tiling: force last point to match first
  if (layer.points.length > 1) {
    layer.points[layer.points.length - 1].y = layer.points[0].y;
  }
  // Build mesh grid and pre-render to offscreen canvas
  layer.meshGrid = buildTerrainMeshGrid(layer);
  // Copy first column's grid values to last column for seamless tiling
  if (layer.meshGrid.length > 1) {
    layer.meshGrid[layer.meshGrid.length - 1] = layer.meshGrid[0].map(v => ({ ...v }));
  }
  layer.meshCanvas = renderTerrainMeshToCanvas(layer);
}

function drawTerrainLayer(layer) {
  const w = terrainWidth;
  const ox = -(layer.offset % w);

  ctx.save();
  ctx.globalAlpha = layer.alpha;
  for (let copy = 0; copy < 2; copy++) {
    ctx.drawImage(layer.meshCanvas, ox + copy * w, 0);
  }
  ctx.restore();

  // Advance scroll
  layer.offset += layer.speed;
  if (layer.offset >= w) layer.offset -= w;
}

function drawBackground() {
  // Fill
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

  // Layer 1: Stars
  for (const star of stars) {
    star.x -= 0.2;
    if (star.x < 0) { star.x = CONFIG.width; star.y = Math.random() * CONFIG.height; }
    ctx.fillStyle = `rgba(255,255,255,${star.brightness})`;
    ctx.fillRect(star.x, star.y, star.size, star.size);
  }

  // Layer 2: Synthwave grid
  gridOffset += 0.5;
  if (gridOffset > 40) gridOffset -= 40;

  ctx.save();
  // Horizon line at 60% from top
  const horizon = CONFIG.height * 0.6;

  // Vertical grid lines with perspective
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  const numVLines = 20;
  const vanishX = CONFIG.width * 0.5;
  for (let i = -numVLines; i <= numVLines; i++) {
    const baseX = vanishX + i * 80;
    ctx.beginPath();
    ctx.moveTo(vanishX, horizon);
    ctx.lineTo(baseX, CONFIG.height);
    ctx.globalAlpha = 0.4;
    ctx.stroke();
  }

  // Horizontal grid lines — recede toward horizon
  for (let i = 0; i < 12; i++) {
    const t = (i * 40 + gridOffset) / (12 * 40);
    const y = horizon + (CONFIG.height - horizon) * (t * t + t) * 0.8;
    if (y > horizon && y < CONFIG.height) {
      ctx.globalAlpha = 0.2 + t * 0.3;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(CONFIG.width, y);
      ctx.stroke();
    }
  }
  ctx.restore();

  // Layer 3: Nebula clouds
  for (const neb of nebulae) {
    neb.x -= neb.speed;
    if (neb.x < -neb.radius * 2) { neb.x = CONFIG.width + neb.radius * 2; neb.y = Math.random() * CONFIG.height; }
    const grad = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.radius);
    grad.addColorStop(0, neb.color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(neb.x - neb.radius, neb.y - neb.radius, neb.radius * 2, neb.radius * 2);
  }

  // Layer 3.5: Moon terrain (suppressed during tunnel gauntlet)
  if (!tunnelActive) {
    for (const layer of terrainLayers) {
      drawTerrainLayer(layer);
    }
  }

  // Layer 4: Foreground debris streaks
  for (const d of debris) {
    d.x -= d.speed * 1.2;
    if (d.x < -d.length) { d.x = CONFIG.width + d.length; d.y = Math.random() * CONFIG.height; }
    ctx.strokeStyle = `rgba(255,255,255,${d.brightness})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.length, d.y);
    ctx.stroke();
  }
}

function drawPlayer() {
  if (!player.alive) return;

  // Blink when invincible (but not during a dodge — roll animation communicates that)
  if (player.invincible > 0 && player.dodgeTimer <= 0 && Math.floor(frame / 4) % 2 === 0) return;

  const px = player.x;
  const py = player.y;

  ctx.save();

  // Pitch — tilt based on vertical velocity
  const pitchAngle = (player.vy / player.maxVel) * 0.35; // max ~20 degrees
  // Bank — squash vertical scale to fake 3D wing tilt
  const bankFactor = 1 - Math.abs(player.vy / player.maxVel) * 0.3; // squish to 70% at max speed
  ctx.translate(px, py);
  ctx.rotate(pitchAngle);
  ctx.scale(1, bankFactor);
  // Barrel roll overlay — cos(0→2π) = 1→-1→1, a full visual flip over the dodge duration
  if (player.dodgeTimer > 0) {
    ctx.scale(1, Math.cos(player.dodgeRoll));
  }
  ctx.translate(-px, -py);

  // Glow — boosted and flickering during dodge, normal idle pulse otherwise
  const glowIntensity = player.dodgeTimer > 0
    ? 25 + Math.sin(frame * 0.3) * 8
    : 10 + Math.sin(frame * 0.08) * 5;
  ctx.shadowColor = CONFIG.colors.player;
  ctx.shadowBlur = glowIntensity;

  // === TWIN ENGINE NACELLES ===
  // Top nacelle
  ctx.fillStyle = '#006080';
  ctx.beginPath();
  ctx.moveTo(px - 6, py - 10);
  ctx.lineTo(px - 14, py - 14);
  ctx.lineTo(px - 18, py - 13);
  ctx.lineTo(px - 18, py - 7);
  ctx.lineTo(px - 6, py - 6);
  ctx.closePath();
  ctx.fill();
  // Bottom nacelle
  ctx.beginPath();
  ctx.moveTo(px - 6, py + 10);
  ctx.lineTo(px - 14, py + 14);
  ctx.lineTo(px - 18, py + 13);
  ctx.lineTo(px - 18, py + 7);
  ctx.lineTo(px - 6, py + 6);
  ctx.closePath();
  ctx.fill();

  // === ENGINE EXHAUST (twin flames) ===
  // Boost flame size/glow when thrusting right
  const thrustFactor = Math.max(0, player.vx / player.maxVel); // 0..1
  const flameBase = 6 + thrustFactor * 10;
  const flameRand = 8 + thrustFactor * 8;
  const flameGlow = 12 + thrustFactor * 18;
  ctx.shadowBlur = flameGlow;
  ctx.shadowColor = thrustFactor > 0.3 ? '#44ccff' : '#00aaff';
  ctx.fillStyle = thrustFactor > 0.5 ? '#88eeff' : '#00ddff';
  const f1 = Math.random() * flameRand + flameBase;
  const f2 = Math.random() * flameRand + flameBase;
  // Top engine flame
  ctx.beginPath();
  ctx.moveTo(px - 18, py - 9);
  ctx.lineTo(px - 18 - f1, py - 10);
  ctx.lineTo(px - 18, py - 12);
  ctx.closePath();
  ctx.fill();
  // Bottom engine flame
  ctx.beginPath();
  ctx.moveTo(px - 18, py + 9);
  ctx.lineTo(px - 18 - f2, py + 10);
  ctx.lineTo(px - 18, py + 12);
  ctx.closePath();
  ctx.fill();
  // Inner hot core of flames
  ctx.fillStyle = '#ffffff';
  ctx.shadowBlur = 6 + thrustFactor * 10;
  ctx.beginPath();
  ctx.moveTo(px - 18, py - 9.5);
  ctx.lineTo(px - 18 - f1 * 0.4, py - 10);
  ctx.lineTo(px - 18, py - 11);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(px - 18, py + 9.5);
  ctx.lineTo(px - 18 - f2 * 0.4, py + 10);
  ctx.lineTo(px - 18, py + 11);
  ctx.closePath();
  ctx.fill();

  // === WINGS ===
  ctx.shadowBlur = glowIntensity;
  ctx.shadowColor = CONFIG.colors.player;
  // Top wing — swept back
  ctx.fillStyle = '#008899';
  ctx.beginPath();
  ctx.moveTo(px + 2, py - 5);       // wing root front
  ctx.lineTo(px - 10, py - 18);     // wing tip
  ctx.lineTo(px - 16, py - 17);     // wing tip trailing edge
  ctx.lineTo(px - 8, py - 5);       // wing root rear
  ctx.closePath();
  ctx.fill();
  // Bottom wing

  ctx.moveTo(px + 2, py + 5);
  ctx.lineTo(px - 10, py + 18);
  ctx.lineTo(px - 16, py + 17);
  ctx.lineTo(px - 8, py + 5);

  // Wing tip accents

  ctx.moveTo(px + 22, py);          // nose tip

  ctx.lineTo(px - 4, py - 7);       // upper body
  ctx.lineTo(px - 10, py - 5);      // rear upper
  ctx.lineTo(px - 10, py + 5);      // rear lower
  ctx.lineTo(px - 4, py + 7);       // lower body
  ctx.lineTo(px + 10, py + 6);      // lower nose slope
  ctx.closePath();
  ctx.fill();

  // Hull panel lines
  ctx.strokeStyle = 'rgba(0,240,255,0.3)';

  ctx.moveTo(px + 4, py - 6);
  ctx.lineTo(px + 4, py + 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px - 4, py - 7);
  ctx.lineTo(px - 4, py + 7);
  ctx.stroke();

  // === COCKPIT CANOPY ===
  ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(px + 16, py);
  ctx.lineTo(px + 8, py - 3);
  ctx.lineTo(px + 4, py - 2.5);
  ctx.lineTo(px + 4, py + 2.5);
  ctx.lineTo(px + 8, py + 3);
  ctx.closePath();
  ctx.fill();
  // Canopy glare
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.moveTo(px + 14, py - 0.5);
  ctx.lineTo(px + 9, py - 2);
  ctx.lineTo(px + 7, py - 1);
  ctx.lineTo(px + 12, py + 0.5);
  ctx.closePath();
  ctx.fill();

  // === NOSE ACCENT ===
  ctx.fillStyle = CONFIG.colors.player;
  ctx.shadowBlur = glowIntensity;
  ctx.beginPath();
  ctx.moveTo(px + 22, py);
  ctx.lineTo(px + 18, py - 1.5);
  ctx.lineTo(px + 18, py + 1.5);
  ctx.closePath();
  ctx.fill();

  // === GRAV PULL WARNING ===
  if (playerGravPull.active) {
    const s = Math.min(1, playerGravPull.strength / 2);
    const pullAngle = Math.atan2(playerGravPull.fromY - py, playerGravPull.fromX - px);
    // Partial arcs facing the pull source — quarter of the circle
    const arcSpan = Math.PI * 0.5; // 90 degrees
    const ringCount = 2 + Math.floor(s * 2);
    const flicker = 0.5 + Math.sin(frame * 0.4) * 0.3;
    ctx.shadowColor = '#cc44ff';
    ctx.lineCap = 'round';
    for (let k = 0; k < ringCount; k++) {
      const phase = ((frame * 0.04 + k * 0.33) % 1);
      const radius = 18 + phase * 28;
      const ringAlpha = s * flicker * (1 - phase) * 0.8;
      ctx.strokeStyle = `rgba(200, 60, 255, ${ringAlpha.toFixed(2)})`;
      ctx.shadowBlur = 6 + s * 10;
      ctx.lineWidth = 1.5 + s * (1 - phase);
      ctx.beginPath();
      ctx.arc(px, py, radius, pullAngle - arcSpan / 2, pullAngle + arcSpan / 2);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawShield() {
  if (!player.alive) return;
  if (player.shieldActive) {
    const pulse = 0.7 + Math.sin(frame * 0.07) * 0.3;
    const r = 35;
    ctx.save();
    ctx.shadowColor = '#ffee88';
    ctx.shadowBlur = 18 * pulse;
    ctx.strokeStyle = `rgba(255, 235, 120, ${0.55 + pulse * 0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, r, 0, Math.PI * 2);
    ctx.stroke();
    // Softer inner fill glow
    ctx.shadowBlur = 6;
    ctx.strokeStyle = `rgba(255, 255, 200, ${0.15 + pulse * 0.15})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(player.x, player.y, r - 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  } else if (player.shieldRechargeTimer > 0 && player.upgrades.shieldRegen > 0) {
    // Dim broken-ring indicator while recharging
    const progress = 1 - player.shieldRechargeTimer / (player.shieldRechargeSeconds * 60);
    ctx.save();
    ctx.shadowColor = '#ffee88';
    ctx.shadowBlur = 4;
    ctx.strokeStyle = `rgba(255, 220, 80, 0.2)`;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    // Arc grows as recharge progresses
    ctx.arc(player.x, player.y, 35, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function updatePlayer() {
  if (!player.alive) {
    player.respawnTimer--;
    if (player.respawnTimer <= 0 && player.lives > 0) {
      player.alive = true;
      player.x = 100;
      if (tunnelActive) {
        // Respawn at tunnel center with extra i-frames
        const bounds = getTunnelBoundsAtX(100);
        player.y = (bounds.topY + bounds.bottomY) / 2;
        player.invincible = 180; // 3 seconds during tunnel
      } else {
        player.y = CONFIG.height / 2;
        player.invincible = 120; // 2 seconds at 60fps
      }
      player.vx = 0;
      player.vy = 0;
      // Restore shield if player has the upgrade
      if (player.upgrades.shieldRegen > 0) {
        player.shieldActive = true;
        player.shieldRechargeTimer = 0;
      }
    }
    return;
  }

  if (player.invincible > 0) player.invincible--;
  if (player.dodgeTimer > 0) player.dodgeTimer--;
  if (player.dodgeCooldown > 0) player.dodgeCooldown--;
  if (player.shieldRechargeTimer > 0) {
    player.shieldRechargeTimer--;
    if (player.shieldRechargeTimer === 0 && player.upgrades.shieldRegen > 0) {
      player.shieldActive = true;
      screenFlash = 8;
      spawnExplosion(player.x, player.y, 10, ['#ffffff', '#ffee88', '#ffcc44']);
    }
  }

  // Advance barrel roll angle during active dodge
  if (player.dodgeTimer > 0) {
    player.dodgeRoll += (Math.PI * 2) / player.dodgeDuration;
  }

  // Movement — velocity-based with acceleration and drag
  let ix = 0, iy = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) ix = -1;
  if (keys['ArrowRight'] || keys['KeyD']) ix = 1;
  if (keys['ArrowUp']    || keys['KeyW']) iy = -1;
  if (keys['ArrowDown']  || keys['KeyS']) iy = 1;

  // Touch movement — relative offset driving acceleration
  if (touch.active) {
    const targetX = touch.shipStartX + (touch.currentX - touch.startX);
    const targetY = touch.shipStartY + (touch.currentY - touch.startY);
    ix = Math.max(-1, Math.min(1, (targetX - player.x) / 20));
    iy = Math.max(-1, Math.min(1, (targetY - player.y) / 20));
  }

  // Mouse drag movement
  if (mouseDrag.active) {
    const rawX = mouseDrag.currentX, rawY = mouseDrag.currentY;
    const outOfBounds = rawX < 0 || rawX > CONFIG.width || rawY < 0 || rawY > CONFIG.height;
    if (outOfBounds) {
      // Mouse is outside canvas — pin a virtual cursor to the nearest edge
      // and drive full-strength toward it
      const edgeX = Math.max(20, Math.min(CONFIG.width - 20, rawX));
      const edgeY = Math.max(15, Math.min(CONFIG.height - 15, rawY));
      const dx = edgeX - player.x, dy = edgeY - player.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d > 2) {
        ix = dx / d;
        iy = dy / d;
      }
      // Re-anchor so returning inside the canvas is seamless
      mouseDrag.startX = rawX;
      mouseDrag.startY = rawY;
      mouseDrag.shipStartX = player.x;
      mouseDrag.shipStartY = player.y;
    } else {
      // Normal relative offset when inside canvas
      const targetX = mouseDrag.shipStartX + (rawX - mouseDrag.startX);
      const targetY = mouseDrag.shipStartY + (rawY - mouseDrag.startY);
      ix = Math.max(-1, Math.min(1, (targetX - player.x) / 20));
      iy = Math.max(-1, Math.min(1, (targetY - player.y) / 20));

      // Gentle anchor correction — slowly close the gap between the ship's
      // "home" position and where the cursor actually is, without touching ix/iy.
      // The relative offset target is: shipStart + (raw - start)
      // The gap between that target and the cursor is: shipStart - start
      // Lerping shipStart toward start gradually zeroes that gap.
      mouseDrag.shipStartX += (mouseDrag.startX - mouseDrag.shipStartX) * 0.02;
      mouseDrag.shipStartY += (mouseDrag.startY - mouseDrag.shipStartY) * 0.02;
    }
  }

  // Tick down touch secondary arrival window
  if (touch.secondaryArrivalWindow > 0) touch.secondaryArrivalWindow--;

  // Normalize diagonal input
  if (ix !== 0 && iy !== 0) {
    ix *= 0.707;
    iy *= 0.707;
  }

  // Accelerate toward input direction
  player.vx += ix * player.accel;
  player.vy += iy * player.accel;

  // Apply drag (always — this is what makes it floaty)
  player.vx *= player.drag;
  player.vy *= player.drag;

  // Clamp velocity
  const vel = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  if (vel > player.maxVel) {
    player.vx = (player.vx / vel) * player.maxVel;
    player.vy = (player.vy / vel) * player.maxVel;
  }

  // Kill tiny residual drift
  if (Math.abs(player.vx) < 0.05) player.vx = 0;
  if (Math.abs(player.vy) < 0.05) player.vy = 0;

  // Keep pitch angle in sync with vertical velocity for bullet direction
  player.pitchAngle = (player.vy / player.maxVel) * 0.05;

  player.x += player.vx;
  player.y += player.vy;

  // Bounds — soft bounce off edges
  if (player.x < 20)  { player.x = 20; player.vx *= -0.3; }
  if (player.x > CONFIG.width - 20)  { player.x = CONFIG.width - 20; player.vx *= -0.3; }
  if (player.y < 15)  { player.y = 15; player.vy *= -0.3; }
  if (player.y > CONFIG.height - 15) { player.y = CONFIG.height - 15; player.vy *= -0.3; }

  // Re-anchor touch offset on boundary collision to prevent drift
  if (touch.active) {
    touch.shipStartX = player.x;
    touch.shipStartY = player.y;
    touch.startX = touch.currentX;
    touch.startY = touch.currentY;
  }


  // Firing — suppress during warning screens
  const warningScreen = gameState === 'MID_BOSS_WARNING' || gameState === 'BOSS_WARNING' || gameState === 'TUNNEL_WARNING';
  if (!warningScreen) {
    if (player.fireTimer > 0) player.fireTimer--;
    if (player.fireTimer <= 0) {
      firePlayerWeapon();
      player.fireTimer = player.fireRateOverride || CONFIG.playerFireRate;
    }

    // Secondary fire
    if (keys['KeyX'] || keys['Space']) {
      fireSecondary();
    }
  }

  // Touch: two-finger tap for secondary
  if (touch.secondaryDebounce > 0) touch.secondaryDebounce--;
  if (touch.secondaryTapped && touch.secondaryDebounce <= 0) {
    touch.secondaryTapped = false;
    touch.secondaryDebounce = 15;
    fireSecondary();
  } else if (touch.secondaryTapped) {
    touch.secondaryTapped = false;
  }

  // Dodge — triggered by Shift key or double-tap direction
  if ((keys[DODGE_KEY] || keys[DODGE_KEY_ALT]) && !keys._dodgeHeld && player.dodgeCooldown <= 0) {
    keys._dodgeHeld = true;
    // Read current input direction; default to forward if no input
    let dx = 0, dy = 0;
    if (keys['ArrowLeft']  || keys['KeyA']) dx = -1;
    if (keys['ArrowRight'] || keys['KeyD']) dx =  1;
    if (keys['ArrowUp']    || keys['KeyW']) dy = -1;
    if (keys['ArrowDown']  || keys['KeyS']) dy =  1;
    if (dx === 0 && dy === 0) dx = 1;
    triggerDodge(dx, dy);
  } else if (!keys[DODGE_KEY] && !keys[DODGE_KEY_ALT]) {
    keys._dodgeHeld = false;
  }

  // Double-tap dodge check (set by keydown listener)
  if (player._doubleTapDodge) {
    const dt = player._doubleTapDodge;
    player._doubleTapDodge = null;
    if (player.dodgeCooldown <= 0) {
      triggerDodge(dt.dx, dt.dy);
    }
  }

  // Touch swipe dodge
  if (touch.swipeDodge) {
    const sd = touch.swipeDodge;
    touch.swipeDodge = null;
    if (player.dodgeCooldown <= 0) {
      triggerDodge(sd.dx, sd.dy);
    }
  }

  // Mouse double-click dodge
  if (mouseDrag.dodgePending) {
    const md = mouseDrag.dodgePending;
    mouseDrag.dodgePending = null;
    if (player.dodgeCooldown <= 0) {
      triggerDodge(md.dx, md.dy);
    }
  }

  // Mouse right-click secondary fire
  if (mouseDrag.secondaryFired) {
    mouseDrag.secondaryFired = false;
    fireSecondary();
  }
}

function triggerDodge(dx, dy) {
  if (player.dodgeTimer > 0) return; // already dodging
  const dlen = Math.sqrt(dx * dx + dy * dy);
  if (dlen === 0) { dx = 1; dy = 0; }
  const nx = dlen === 0 ? 1 : dx / dlen;
  const ny = dlen === 0 ? 0 : dy / dlen;

  player.dodgeVx = nx * DODGE_IMPULSE;
  player.dodgeVy = ny * DODGE_IMPULSE;
  player.vx = player.dodgeVx;
  player.vy = player.dodgeVy;
  player.dodgeTimer    = player.dodgeDuration;
  player.dodgeCooldown = player.dodgeCooldownBase;
  player.invincible    = player.dodgeDuration + 2;
  player.dodgeRoll     = 0;

  // Engine blast — directional burst opposite the dash
  for (let i = 0; i < 14; i++) {
    const spread = (Math.random() - 0.5) * 1.2;
    const spd    = Math.random() * 5 + 3;
    const angle  = Math.atan2(-player.dodgeVy, -player.dodgeVx) + spread;
    particles.push({
      x: player.x, y: player.y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1.0,
      decay: Math.random() * 0.04 + 0.03,
      size: Math.random() * 5 + 2,
      colors: ['#ffffff', '#44ddff', '#0088bb']
    });
  }
}

function firePlayerWeapon() {
  playSFX('player-shoot', SFX_VOLUMES['player-shoot']);
  const lvl = player.weaponLevel;
  const bx = player.x + 20;
  const by = player.y;
  const p = player.pitchAngle || 0;

  // Divide base damage across bullet count, then multiply by power tier
  const bulletCount = Math.min(lvl, 3);
  const perBulletDmg = (1 / bulletCount) * player.bulletPower;

  // Helper: spawn a bullet at a given angle (pitch-relative)
  function fire(x, y, angle) {
    spawnPlayerBullet(x, y,
      CONFIG.bulletSpeed * Math.cos(angle),
      CONFIG.bulletSpeed * Math.sin(angle),
      perBulletDmg);
  }

  // Spread caps at 3 bullets; beyond that, upgrades add power
  if (lvl === 1) {
    fire(bx, by, p);
  } else if (lvl === 2) {
    fire(bx, by - 3, p);
    fire(bx, by + 3, p);
  } else {
    // lvl 3+ all fire the same 3-way spread
    fire(bx, by,     p);
    fire(bx, by - 3, p - 0.12);
    fire(bx, by + 3, p + 0.12);
  }
  player.shotsFired++;
}

function spawnPlayerBullet(x, y, vx, vy, dmg) {
  if (playerBullets.length >= CONFIG.maxBullets) return;
  playerBullets.push({
    x, y, vx, vy, width: 18, height: 6, alive: true,
    damage: dmg != null ? dmg : player.bulletPower,
    color: player.bulletColor,
    glow: player.bulletGlow
  });
}

let secondaryFireTimer = 0;
function fireSecondary() {
  if (!player.secondary || player.secondaryAmmo <= 0 || secondaryFireTimer > 0) return;
  const type = player.secondary;

  switch (type) {
    case 'homing': {
      // Fire a homing missile
      secondaryProjectiles.push({
        type: 'homing', x: player.x + 20, y: player.y,
        vx: 7, vy: 0, life: 300, damage: 3, radius: 8
      });
      player.secondaryAmmo--;
      secondaryFireTimer = 12;
      break;
    }
    case 'wave': {
      // Fire an expanding wave pulse
      secondaryProjectiles.push({
        type: 'wave', x: player.x + 30, y: player.y,
        vx: 4, vy: 0, life: 90, damage: 2, radius: 20, maxRadius: 60, startRadius: 20
      });
      player.secondaryAmmo--;
      secondaryFireTimer = 20;
      break;
    }
    case 'spread': {
      // Burst of 7 projectiles in a wide fan
      for (let i = -3; i <= 3; i++) {
        const angle = i * 0.18;
        secondaryProjectiles.push({
          type: 'spread', x: player.x + 20, y: player.y,
          vx: 9 * Math.cos(angle), vy: 9 * Math.sin(angle),
          life: 45, damage: 2, radius: 5
        });
      }
      player.secondaryAmmo--;
      secondaryFireTimer = 18;
      break;
    }
    case 'shield': {
      // Activate bubble shield — ammo is duration in frames
      secondaryProjectiles.push({
        type: 'shield', x: player.x, y: player.y,
        vx: 0, vy: 0, life: Math.min(player.secondaryAmmo, 300),
        damage: 1, radius: 40
      });
      player.secondaryAmmo = 0; // consumes all remaining
      player.secondary = null;
      secondaryFireTimer = 30;
      break;
    }
    case 'laser': {
      // Powerful piercing beam — stays active for 40 frames
      secondaryProjectiles.push({
        type: 'laser', x: player.x + 25, y: player.y,
        vx: 0, vy: 0, life: 40, damage: 5, radius: 10,
        width: CONFIG.width, hitCooldowns: new Map()
      });
      player.secondaryAmmo--;
      secondaryFireTimer = 10;
      break;
    }
  }
  if (player.secondaryAmmo <= 0 && player.secondary) {
    player.secondary = null;
  }
}

function updateSecondaryProjectiles() {
  if (secondaryFireTimer > 0) secondaryFireTimer--;
  for (let i = secondaryProjectiles.length - 1; i >= 0; i--) {
    const p = secondaryProjectiles[i];
    p.life--;
    if (p.life <= 0) { swapRemove(secondaryProjectiles, i); continue; }

    switch (p.type) {
      case 'homing': {
        // Seek nearest enemy
        let nearD = 300, nearE = null;
        for (const e of enemies) {
          const d = dist(p.x, p.y, e.x, e.y);
          if (d < nearD) { nearD = d; nearE = e; }
        }
        if (midBoss && midBoss.alive) {
          const d = dist(p.x, p.y, midBoss.x, midBoss.y);
          if (d < nearD) { nearD = d; nearE = midBoss; }
        }
        if (boss && boss.alive) {
          const d = dist(p.x, p.y, boss.x, boss.y);
          if (d < nearD) { nearD = d; nearE = boss; }
        }
        if (nearE) {
          const dx = nearE.x - p.x, dy = nearE.y - p.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d > 0) { p.vx += (dx / d) * 0.6; p.vy += (dy / d) * 0.6; }
          const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          if (spd > 8) { p.vx = (p.vx / spd) * 8; p.vy = (p.vy / spd) * 8; }
        }
        p.x += p.vx; p.y += p.vy;
        // Trail particles
        if (p.life % 2 === 0) {
          particles.push({
            x: p.x - p.vx * 0.5, y: p.y - p.vy * 0.5,
            vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
            life: 0.6, decay: 0.08, size: 3, colors: ['#dd44ff', '#aa22cc', '#551166']
          });
        }
        break;
      }
      case 'wave': {
        p.x += p.vx;
        // Expand radius over lifetime
        const progress = 1 - p.life / 90;
        p.radius = p.startRadius + (p.maxRadius - p.startRadius) * progress;
        break;
      }
      case 'spread':
        p.x += p.vx; p.y += p.vy;
        break;
      case 'shield':
        // Follow player
        p.x = player.x; p.y = player.y;
        // Destroy nearby enemy bullets
        for (let bi = enemyBullets.length - 1; bi >= 0; bi--) {
          const b = enemyBullets[bi];
          if (dist(p.x, p.y, b.x, b.y) < p.radius + b.radius) {
            spawnExplosion(b.x, b.y, 4, ['#44ddff', '#88eeff', '#ffffff']);
            swapRemove(enemyBullets, bi);
          }
        }
        break;
      case 'laser':
        // Follow player Y, extend from player X
        p.x = player.x + 25; p.y = player.y;
        // Decrement hit cooldowns
        for (const [id, cd] of p.hitCooldowns) {
          if (cd <= 1) p.hitCooldowns.delete(id);
          else p.hitCooldowns.set(id, cd - 1);
        }
        break;
    }

    // Off-screen removal (not for shield/laser which track player)
    if (p.type !== 'shield' && p.type !== 'laser') {
      if (p.x > CONFIG.width + 40 || p.x < -40 || p.y < -40 || p.y > CONFIG.height + 40) {
        swapRemove(secondaryProjectiles, i);
      }
    }
  }
}

function drawSecondaryProjectiles() {
  if (secondaryProjectiles.length === 0) return;
  ctx.save();
  for (const p of secondaryProjectiles) {
    switch (p.type) {
      case 'homing': {
        // Glowing purple missile
        const angle = Math.atan2(p.vy, p.vx);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        ctx.shadowColor = '#dd44ff';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#dd44ff';
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.quadraticCurveTo(4, -5, -8, -4);
        ctx.quadraticCurveTo(-4, 0, -8, 4);
        ctx.quadraticCurveTo(4, 5, 10, 0);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.ellipse(2, 0, 3, 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'wave': {
        // Expanding ring pulse
        const alpha = Math.max(0.1, p.life / 90);
        ctx.strokeStyle = `rgba(68, 255, 136, ${alpha.toFixed(2)})`;
        ctx.lineWidth = 3 + (1 - p.life / 90) * 2;
        ctx.shadowColor = '#44ff88';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.stroke();
        // Inner fill
        ctx.fillStyle = `rgba(68, 255, 136, ${(alpha * 0.15).toFixed(2)})`;
        ctx.fill();
        break;
      }
      case 'spread': {
        // Small orange bolts
        ctx.shadowColor = '#ff8844';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ff8844';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * 0.5, 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      case 'shield': {
        // Protective bubble around player
        const pulse = Math.sin(p.life * 0.15) * 3;
        const alpha = Math.min(0.4, p.life / 60);
        ctx.strokeStyle = `rgba(68, 221, 255, ${alpha.toFixed(2)})`;
        ctx.lineWidth = 2;
        ctx.shadowColor = '#44ddff';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = `rgba(68, 221, 255, ${(alpha * 0.12).toFixed(2)})`;
        ctx.fill();
        break;
      }
      case 'laser': {
        // Full-width beam from player
        const pulse = Math.sin(p.life * 0.5) * 2;
        const beamH = p.radius + pulse;
        ctx.shadowColor = '#ff4444';
        ctx.shadowBlur = 20;
        ctx.fillStyle = 'rgba(255, 68, 68, 0.3)';
        ctx.fillRect(p.x, p.y - beamH * 1.5, CONFIG.width, beamH * 3);
        ctx.fillStyle = 'rgba(255, 100, 100, 0.6)';
        ctx.fillRect(p.x, p.y - beamH, CONFIG.width, beamH * 2);
        ctx.fillStyle = 'rgba(255, 220, 220, 0.9)';
        ctx.fillRect(p.x, p.y - beamH * 0.4, CONFIG.width, beamH * 0.8);
        break;
      }
    }
  }
  ctx.restore();
}

function checkSecondaryCollisions() {
  for (let pi = secondaryProjectiles.length - 1; pi >= 0; pi--) {
    const p = secondaryProjectiles[pi];
    if (p.type === 'shield') continue; // shield handles bullets in update

    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      let hit = false;

      if (p.type === 'laser') {
        // Beam: hits anything at player's Y within beam height
        const beamH = p.radius;
        if (e.x > p.x && Math.abs(e.y - p.y) < beamH + e.height / 2) {
          // Check cooldown — laser hits same enemy every 8 frames
          const eId = ei + '_' + e.type;
          if (!p.hitCooldowns.has(eId)) {
            hit = true;
            p.hitCooldowns.set(eId, 8);
          }
        }
      } else {
        // Circle-rect collision for other projectile types
        const dx = Math.abs(p.x - e.x);
        const dy = Math.abs(p.y - e.y);
        if (dx < p.radius + e.width / 2 && dy < p.radius + e.height / 2) {
          hit = true;
        }
      }

      if (hit) {
        e.hp -= p.damage;
        spawnImpactSparks(e.x, e.y, p.vx || 5, p.vy || 0, 8, ['#ffffff', SECONDARY_META[p.type]?.color || '#ff4444']);
        spawnHitFlash(e.x, e.y, 18);
        e.hitFlash = 5;
        triggerScreenShake(2, 3);
        if (e.hp <= 0) {
          destroyEnemy(e, ei);
          triggerHitStop(2);
        }
        // Consume projectile (except laser and wave which pierce)
        if (p.type !== 'laser' && p.type !== 'wave') {
          spawnExplosion(p.x, p.y, 8, ['#ffffff', SECONDARY_META[p.type]?.color || '#ff8844']);
          swapRemove(secondaryProjectiles, pi);
          break;
        }
      }
    }
  }
}

function updatePlayerBullets() {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    // Gravitational deflection near gravwells
    for (const e of enemies) {
      if (e.type !== 'gravwell') continue;
      const dx = e.x - b.x;
      const dy = e.y - b.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq);
      if (dist < 160 && dist > 14) {
        const force = 1600 / distSq;
        b.vx += (dx / dist) * force;
        b.vy += (dy / dist) * force;
        // Cap so bullets don't go supersonic
        const spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (spd > CONFIG.bulletSpeed * 1.7) {
          b.vx = (b.vx / spd) * CONFIG.bulletSpeed * 1.7;
          b.vy = (b.vy / spd) * CONFIG.bulletSpeed * 1.7;
        }
      }
    }
    // Grav Lock — steer bullets toward nearest enemy
    if (player.gravLock.radius > 0) {
      let nearDist = player.gravLock.radius;
      let nearDx = 0, nearDy = 0;
      let found = false;
      for (const e of enemies) {
        const dx = e.x - b.x;
        const dy = e.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < nearDist) {
          nearDist = dist;
          nearDx = dx / dist;
          nearDy = dy / dist;
          found = true;
        }
      }
      // Also check mid-boss and boss
      if (midBoss && midBoss.alive) {
        const dx = midBoss.x - b.x, dy = midBoss.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < nearDist) { nearDist = dist; nearDx = dx / dist; nearDy = dy / dist; found = true; }
      }
      if (boss && boss.alive) {
        const dx = boss.x - b.x, dy = boss.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < nearDist) { nearDist = dist; nearDx = dx / dist; nearDy = dy / dist; found = true; }
      }
      if (found) {
        b.vx += nearDx * player.gravLock.force;
        b.vy += nearDy * player.gravLock.force;
        // Maintain bullet speed — normalize to original speed
        const spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        const targetSpd = CONFIG.bulletSpeed;
        if (spd > 0) {
          b.vx = (b.vx / spd) * targetSpd;
          b.vy = (b.vy / spd) * targetSpd;
        }
      }
    }

    b.x += b.vx;
    b.y += b.vy;
    if (b.x > CONFIG.width + 20 || b.x < -20 || b.y < -20 || b.y > CONFIG.height + 20) {
      swapRemove(playerBullets, i);
    }
  }
}

function drawPlayerBullets() {
  if (playerBullets.length === 0) return;
  ctx.save();
  const defaultColor = CONFIG.colors.playerBullet;
  const defaultGlow  = 'rgba(0, 255, 255, 0.2)';
  for (const b of playerBullets) {
    const bColor = b.color || defaultColor;
    const bGlow  = b.glow  || defaultGlow;
    const hw = b.width / 2, hh = b.height / 2;
    // Pass 1: Outer neon bloom
    ctx.shadowColor = bColor;
    ctx.shadowBlur = 22;
    ctx.fillStyle = bGlow;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, hw + 4, hh + 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // Pass 2: Main plasma body — tapered ellipse with a pointed nose
    ctx.shadowBlur = 14;
    ctx.fillStyle = bColor;
    ctx.beginPath();
    ctx.moveTo(b.x - hw, b.y);
    ctx.quadraticCurveTo(b.x - hw, b.y - hh, b.x, b.y - hh);
    ctx.quadraticCurveTo(b.x + hw * 0.6, b.y - hh * 0.6, b.x + hw, b.y);
    ctx.quadraticCurveTo(b.x + hw * 0.6, b.y + hh * 0.6, b.x, b.y + hh);
    ctx.quadraticCurveTo(b.x - hw, b.y + hh, b.x - hw, b.y);
    ctx.fill();
    // Pass 3: Hot white core
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.beginPath();
    ctx.ellipse(b.x - b.width * 0.08, b.y, b.width * 0.35, b.height * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// === ENEMY BULLETS ===
function spawnEnemyBullet(x, y, vx, vy) {
  if (enemyBullets.length >= CONFIG.maxBullets) return;
  enemyBullets.push({ x, y, vx, vy, radius: 4, alive: true });
}

function updateEnemyBullets() {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.rotSpeed !== undefined) b.rotation += b.rotSpeed;

    if (b.phase === 'exiting' && b.x > CONFIG.width + 55) {
      // Sucked off screen — re-enter from the right aimed at player's current Y
      b.phase = 'incoming';
      b.x = CONFIG.width + 28;
      b.y = player.y + (Math.random() - 0.5) * 30;
      const spd = b.isMerged ? 9 : 7;
      b.vx = -spd;
      b.vy = 0;
    } else if (b.phase !== 'exiting') {
      // Normal out-of-bounds removal (don't remove exiting bullets heading right)
      if (b.x < -30 || b.x > CONFIG.width + 30 || b.y < -30 || b.y > CONFIG.height + 30) {
        swapRemove(enemyBullets, i);
      }
    }
  }
}

function drawEnemyBullets() {
  ctx.save();
  for (const b of enemyBullets) {
    if (b.verts) {
      // Flung asteroid projectile (isMerged = brighter, red, larger glow)
      const isMerged = b.isMerged;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rotation);
      ctx.shadowColor = isMerged ? '#ff0000' : '#ff6600';
      ctx.shadowBlur = isMerged ? 28 : 14;
      ctx.fillStyle = isMerged ? '#1a0000' : '#12121e';
      ctx.beginPath();
      ctx.moveTo(b.verts[0].x, b.verts[0].y);
      for (let i = 1; i < b.verts.length; i++) ctx.lineTo(b.verts[i].x, b.verts[i].y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = isMerged ? '#ff2200' : '#ff6600';
      ctx.lineWidth = isMerged ? 2.5 : 1.5;
      ctx.stroke();
      if (isMerged) {
        // Pulsing corona — makes the merged rock glow like a charged projectile
        const coronaPulse = Math.sin(frame * 0.22) * 0.5 + 0.5;
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 40 + coronaPulse * 20;
        ctx.strokeStyle = `rgba(255, ${Math.floor(60 * (1 - coronaPulse))}, 0, ${0.35 + coronaPulse * 0.45})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, b.radius + 5 + coronaPulse * 5, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (b.cracks) {
        ctx.strokeStyle = isMerged ? '#ff6644' : '#ff8833';
        ctx.lineWidth = 0.8;
        ctx.shadowBlur = isMerged ? 10 : 5;
        for (const c of b.cracks) {
          ctx.beginPath();
          ctx.moveTo(c.x1, c.y1);
          ctx.lineTo(c.xm, c.ym);
          ctx.lineTo(c.x2, c.y2);
          ctx.stroke();
        }
      }
      ctx.restore();
    } else {
      // Outer neon bloom
      ctx.shadowColor = CONFIG.colors.enemyBullet;
      ctx.shadowBlur = 22;
      ctx.fillStyle = 'rgba(255, 68, 0, 0.2)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius + 3, 0, Math.PI * 2);
      ctx.fill();

      // Main bullet body
      ctx.shadowBlur = 14;
      ctx.fillStyle = CONFIG.colors.enemyBullet;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();

      // Hot white-yellow core
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 6;
      ctx.fillStyle = 'rgba(255, 220, 150, 0.75)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// === SPACE MINES ===
function spawnSpaceMine(x, y) {
  spaceMines.push({
    x, y,
    frame: 0,
    fuseTime: 90,     // 1.5s idle before pull starts
    pullTime: 50,      // ~0.8s visible gravity pull-in
    radius: 6,
    alive: true,
    phase: 'idle',     // idle → pulling → detonating
    pullFrame: 0,
    detonateFrame: 0
  });
}

let playerGravPull = { active: false, strength: 0, fromX: 0, fromY: 0 };

function updateSpaceMines() {
  playerGravPull.active = false;
  playerGravPull.strength = 0;
  for (let i = spaceMines.length - 1; i >= 0; i--) {
    const m = spaceMines[i];
    m.frame++;
    // Drift very slowly left with the background
    m.x -= 0.3;

    if (m.phase === 'idle') {
      if (m.frame >= m.fuseTime) {
        m.phase = 'pulling';
        m.pullFrame = 0;
      }
    } else if (m.phase === 'pulling') {
      m.pullFrame++;
      // Gravitational pull on player — gets stronger as detonation approaches
      if (player.alive) {
        const dx = m.x - player.x;
        const dy = m.y - player.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        const pullRadius = 240;
        if (d < pullRadius && d > 5) {
          const pullProgress = m.pullFrame / m.pullTime;
          const strength = (0.5 + pullProgress * 1.0) * (1 - d / pullRadius);
          const force = strength * 2.8;
          player.x += (dx / d) * force;
          player.y += (dy / d) * force;
          // Track strongest pull for visual effect
          if (force > playerGravPull.strength) {
            playerGravPull.active = true;
            playerGravPull.strength = force;
            playerGravPull.fromX = m.x;
            playerGravPull.fromY = m.y;
          }
        }
      }
      // Spawn inward-streaking particles throughout the pull phase
      if (m.pullFrame % 3 === 0) {
        const count = Math.min(3 + Math.floor(m.pullFrame / 8), 6);
        for (let p = 0; p < count; p++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 80 + Math.random() * 60;
          const spd = 2.5 + Math.random() * 2 + (m.pullFrame / m.pullTime) * 3;
          particles.push({
            x: m.x + Math.cos(angle) * dist,
            y: m.y + Math.sin(angle) * dist,
            vx: -Math.cos(angle) * spd,
            vy: -Math.sin(angle) * spd,
            life: 1.0,
            decay: 0.05 + (m.pullFrame / m.pullTime) * 0.04,
            size: Math.random() * 2.5 + 1,
            colors: ['#cc44ff', '#8800cc', '#440066']
          });
        }
      }
      if (m.pullFrame >= m.pullTime) {
        m.phase = 'detonating';
        m.detonateFrame = 0;
        // Final big implosion burst — lots of particles rushing in fast
        for (let p = 0; p < 24; p++) {
          const angle = (p / 24) * Math.PI * 2;
          const dist = 100 + Math.random() * 40;
          particles.push({
            x: m.x + Math.cos(angle) * dist,
            y: m.y + Math.sin(angle) * dist,
            vx: -Math.cos(angle) * (5 + Math.random() * 3),
            vy: -Math.sin(angle) * (5 + Math.random() * 3),
            life: 1.0,
            decay: 0.07,
            size: Math.random() * 3 + 2,
            colors: ['#ffffff', '#cc44ff', '#8800cc']
          });
        }
      }
    } else if (m.phase === 'detonating') {
      m.detonateFrame++;
      if (m.detonateFrame === 14) {
        // Burst outward — the grav explosion
        spawnExplosion(m.x, m.y, 28, ['#ffffff', '#dd88ff', '#cc44ff', '#440066']);
        spawnHitFlash(m.x, m.y, 45);
        triggerScreenShake(5, 10);
        // Damage zone — kill player if within blast radius
        if (player.alive && player.invincible <= 0) {
          if (dist(player.x, player.y, m.x, m.y) < 90) {
            killPlayer();
          }
        }
        swapRemove(spaceMines, i);
        continue;
      }
    }

    // Remove if off-screen
    if (m.x < -40) {
      swapRemove(spaceMines, i);
    }
  }
}

function drawSpaceMines() {
  ctx.save();
  for (const m of spaceMines) {
    const idleUrgency = Math.min(m.frame / m.fuseTime, 1);
    const fastPulse = Math.sin(m.frame * (0.15 + idleUrgency * 0.4)) * 0.5 + 0.5;

    if (m.phase === 'detonating') {
      // Imploding — shrinking bright core before burst
      const t = m.detonateFrame / 14;
      const shrink = m.radius * (1 - t * 0.7);
      ctx.shadowColor = '#ff88ff';
      ctx.shadowBlur = 30 + t * 25;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(m.x, m.y, shrink, 0, Math.PI * 2);
      ctx.fill();
    } else if (m.phase === 'pulling') {
      // Gravity pull phase — contracting rings + glowing core
      const pullProgress = m.pullFrame / m.pullTime;
      const pullPulse = Math.sin(m.pullFrame * 0.3) * 0.5 + 0.5;

      // Multiple contracting rings — the "get away" signal
      for (let r = 0; r < 3; r++) {
        const ringPhase = ((m.pullFrame * 0.04 + r * 0.33) % 1);
        const ringRadius = 100 * (1 - ringPhase) + 10;
        const ringAlpha = (0.15 + pullProgress * 0.3) * (1 - ringPhase);
        ctx.strokeStyle = `rgba(200, 68, 255, ${ringAlpha.toFixed(2)})`;
        ctx.lineWidth = 1.5 + pullProgress * 1.5;
        ctx.shadowColor = '#cc44ff';
        ctx.shadowBlur = 6 + pullProgress * 10;
        ctx.beginPath();
        ctx.arc(m.x, m.y, ringRadius, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Danger radius ring — shows blast zone, pulses red as it nears detonation
      const dangerAlpha = 0.1 + pullProgress * 0.3;
      ctx.strokeStyle = `rgba(255, 60, 60, ${dangerAlpha.toFixed(2)})`;
      ctx.lineWidth = 1;
      ctx.shadowColor = '#ff3333';
      ctx.shadowBlur = 8;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(m.x, m.y, 90, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Mine body — spiky, brighter during pull
      ctx.fillStyle = '#dd66ff';
      ctx.shadowColor = '#dd66ff';
      ctx.shadowBlur = 14 + pullPulse * 12;
      ctx.beginPath();
      for (let s = 0; s < 6; s++) {
        const a = (s / 6) * Math.PI * 2 + m.frame * 0.04;
        const outerR = m.radius + 4;
        const innerR = m.radius - 2;
        ctx.lineTo(m.x + Math.cos(a) * outerR, m.y + Math.sin(a) * outerR);
        const midA = a + Math.PI / 6;
        ctx.lineTo(m.x + Math.cos(midA) * innerR, m.y + Math.sin(midA) * innerR);
      }
      ctx.closePath();
      ctx.fill();

      // Core — white-hot, growing
      const coreR = 2.5 + pullProgress * 3;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 10 + pullProgress * 15;
      ctx.beginPath();
      ctx.arc(m.x, m.y, coreR, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Idle phase — subtle presence
      // Outer grav distortion ring
      ctx.strokeStyle = `rgba(160, 80, 255, ${0.15 + fastPulse * 0.25})`;
      ctx.lineWidth = 1;
      ctx.shadowColor = '#aa44ff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(m.x, m.y, 14 + fastPulse * 4, 0, Math.PI * 2);
      ctx.stroke();

      // Mine body — spiky shape
      ctx.fillStyle = '#cc44ff';
      ctx.shadowColor = '#cc44ff';
      ctx.shadowBlur = 10 + fastPulse * 8;
      ctx.beginPath();
      for (let s = 0; s < 6; s++) {
        const a = (s / 6) * Math.PI * 2 + m.frame * 0.02;
        const outerR = m.radius + 3;
        const innerR = m.radius - 2;
        ctx.lineTo(m.x + Math.cos(a) * outerR, m.y + Math.sin(a) * outerR);
        const midA = a + Math.PI / 6;
        ctx.lineTo(m.x + Math.cos(midA) * innerR, m.y + Math.sin(midA) * innerR);
      }
      ctx.closePath();
      ctx.fill();

      // Hot core — pulses with urgency
      ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + fastPulse * 0.5})`;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(m.x, m.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// === ENEMIES ===
function generateAsteroidData(baseRadius) {
  const n = 8 + Math.floor(Math.random() * 3);
  const verts = [];
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * (Math.PI / n * 0.8);
    const r = baseRadius * (0.65 + Math.random() * 0.55);
    verts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
  }
  // Interior cracks — glowing fissures radiating from near-center
  const crackCount = 2 + Math.floor(Math.random() * 3);
  const cracks = [];
  for (let i = 0; i < crackCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const startR = baseRadius * 0.05;
    const endR   = baseRadius * (0.4 + Math.random() * 0.3);
    const midA   = angle + (Math.random() - 0.5) * 0.5;
    const midR   = (startR + endR) * (0.45 + Math.random() * 0.2);
    cracks.push({
      x1: Math.cos(angle) * startR, y1: Math.sin(angle) * startR,
      xm: Math.cos(midA)  * midR,   ym: Math.sin(midA)  * midR,
      x2: Math.cos(angle + (Math.random() - 0.5) * 0.35) * endR,
      y2: Math.sin(angle + (Math.random() - 0.5) * 0.35) * endR,
    });
  }
  return { verts, cracks };
}

function spawnEnemy(type, x, y, options = {}) {
  if (enemies.length >= CONFIG.maxEnemies) return;
  const cfg = CONFIG.enemies[type];
  const enemy = {
    type,
    x, y,
    width:  type === 'spawner' ? 50 : type === 'gravwell' ? 30 : 30,
    height: type === 'spawner' ? 40 : type === 'gravwell' ? 30 : 25,
    hp: cfg.hp,
    maxHp: cfg.hp,
    points: cfg.points,
    alive: true,
    frame: 0,
    fireTimer: Math.random() * 60 + 60,
    // Type-specific
    startY: y,
    speed: options.speed || (type === 'weaver' ? 5 : 2),
    arcY: options.arcY || 0,
    triggered: false
  };
  if (type === 'gravwell') {
    enemy.targetX = CONFIG.width - 200;
    enemy.fireTimer = 160 + Math.floor(Math.random() * 80);
    enemy.energy = 0;
    enemy.maxEnergy = 100;
    enemy.orbitingAsteroids = [];
    // Inner ring: 3 small, faster
    for (let i = 0; i < 3; i++) {
      const data = generateAsteroidData(9);
      enemy.orbitingAsteroids.push({
        angle: (i / 3) * Math.PI * 2 + 0.4,
        orbitRadius: 44, orbitSpeed: 0.028,
        verts: data.verts, cracks: data.cracks,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() * 0.04 + 0.02) * (Math.random() < 0.5 ? 1 : -1),
        alive: true, respawnTimer: 0, respawnFrames: 240
      });
    }
    // Outer ring: 2 larger, slower
    for (let i = 0; i < 2; i++) {
      const data = generateAsteroidData(13);
      enemy.orbitingAsteroids.push({
        angle: (i / 2) * Math.PI * 2,
        orbitRadius: 68, orbitSpeed: 0.016,
        verts: data.verts, cracks: data.cracks,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() * 0.03 + 0.01) * (Math.random() < 0.5 ? 1 : -1),
        alive: true, respawnTimer: 0, respawnFrames: 300
      });
    }
  }
  if (type === 'turret') {
    enemy.bodyRotation = Math.random() * Math.PI * 2;
    enemy.rotSpeed = 0.03;
    const respawnFrames = Math.round(3 * Math.PI * 2 / 0.03);
    enemy.armorPlates = [0,1,2,3].map(() => ({ alive: true, respawnTimer: 0, respawnFrames }));
    enemy.targetX = CONFIG.width - 220; // anchor point inside playfield
  }
  const asteroidRadii = { drone: 14, charger: 18, spawner: 26 };
  if (asteroidRadii[type] !== undefined) {
    const data = generateAsteroidData(asteroidRadii[type]);
    enemy.verts = data.verts;
    enemy.cracks = data.cracks;
    enemy.rotation = Math.random() * Math.PI * 2;
    enemy.rotSpeed = (Math.random() * 0.008 + 0.003) * (Math.random() < 0.5 ? 1 : -1);
  }
  enemies.push(enemy);
  return enemy;
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.frame++;

    switch (e.type) {
      case 'drone':
        if (preMidBoss && e.ambient) {
          updateSuctionPhase(e);
        } else {
          e.x -= e.speed;
        }
        break;

      case 'weaver': {
        // Streak across on a shallow arc — fast strafing-run feel
        e.x -= e.speed;
        // Arc: gentle curve using progress across screen
        const progress = 1 - (e.x / (CONFIG.width + 100));
        const arcAmount = e.arcY || 0; // positive = curves down, negative = curves up
        e.y = e.startY + arcAmount * Math.sin(progress * Math.PI);
        // Drop space mines as they streak across
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.x < CONFIG.width - 60 && e.x > 60) {
          spawnSpaceMine(e.x, e.y);
          e.fireTimer = 80 + Math.floor(Math.random() * 40);
        }
        break;
      }

      case 'charger':
        if (e.isShepherdInbound) {
          e.x += e.speed;
          e.rotation += 0.02;
          break;
        }
        if (preMidBoss && e.ambient) {
          updateSuctionPhase(e);
        } else if (!e.triggered) {
          // Drift in slowly
          e.x -= 0.5;
          if (e.x < CONFIG.width - 80) {
            e.triggered = true;
            e.targetY = player.y;
          }
        } else {
          // Rush toward player's Y, then fly left fast
          const dy = e.targetY - e.y;
          e.y += Math.sign(dy) * Math.min(Math.abs(dy), 4);
          e.x -= 6;
        }
        break;

      case 'turret':
        if (!e.tunnelTurret && e.x > e.targetX) e.x -= 2;
        e.bodyRotation += e.rotSpeed;
        for (const plate of e.armorPlates) {
          if (!plate.alive && plate.respawnTimer > 0) {
            plate.respawnTimer--;
            if (plate.respawnTimer === 0) plate.alive = true;
          }
        }
        e.fireTimer--;
        if (e.fireTimer <= 0 && player.alive) {
          for (let s = 0; s < 3; s++) {
            scheduleAction(s * 6, () => { if (e.alive) fireAimedShot(e); });
          }
          e.fireTimer = 180;
        }
        break;

      case 'spawner':
        e.x -= 1;
        break;

      case 'bomber':
        e.x -= e.speed;
        e.fireTimer--;
        if (e.fireTimer <= 0) {
          // Drop bomb downward
          spawnEnemyBullet(e.x, e.y + e.height / 2, -1, 3);
          e.fireTimer = 90;
        }
        break;

      case 'gravwell':
        // Glide to anchor position
        if (e.x > e.targetX) e.x -= 2;
        // Gentle hover
        e.y = e.startY + Math.sin(e.frame * 0.018) * 40;
        // Spin orbit and respawn captured asteroids
        for (const oa of e.orbitingAsteroids) {
          if (oa.alive) {
            oa.angle += oa.orbitSpeed;
            oa.rotation += oa.rotSpeed;
          } else if (oa.respawnTimer > 0) {
            oa.respawnTimer--;
            if (oa.respawnTimer === 0) oa.alive = true;
          }
        }
        // Fling attack
        e.fireTimer--;
        if (e.fireTimer <= 0 && player.alive) {
          const liveOnes = e.orbitingAsteroids.filter(oa => oa.alive);
          if (liveOnes.length > 0) {
            const target = liveOnes[Math.floor(Math.random() * liveOnes.length)];
            const wx = e.x + Math.cos(target.angle) * target.orbitRadius;
            const wy = e.y + Math.sin(target.angle) * target.orbitRadius;
            const dx = player.x - wx;
            const dy = player.y - wy;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const spd = 3.5;
            enemyBullets.push({
              x: wx, y: wy,
              vx: (dx / dist) * spd,
              vy: (dy / dist) * spd,
              radius: 10,
              alive: true,
              verts: target.verts,
              cracks: target.cracks,
              rotation: target.rotation,
              rotSpeed: target.rotSpeed
            });
            target.alive = false;
            target.respawnTimer = target.respawnFrames;
          }
          e.fireTimer = 140 + Math.floor(Math.random() * 80);
        }
        break;
    }
