// === LEVEL-UP CARD SYSTEM ===
let levelUpCards = [];        // array of upgrade keys to display
let levelUpSelection = 1;    // currently highlighted card (0, 1, or 2)
let levelUpAnimTimer = 0;    // entrance animation timer
let levelUpPrevState = '';   // state to return to after selection

const WEAPON_UPGRADES = new Set(['spread', 'fireRate', 'gravLock']);

function generateLevelUpCards() {
  const available = Object.keys(UPGRADES).filter(
    key => player.upgrades[key] < UPGRADES[key].maxTier
  );
  // Fisher-Yates shuffle
  for (let i = available.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [available[i], available[j]] = [available[j], available[i]];
  }
  let picks = available.slice(0, 3);
  // Guarantee at least one weapon upgrade in the choices
  if (picks.length > 1 && !picks.some(k => WEAPON_UPGRADES.has(k))) {
    const weapons = available.filter(k => WEAPON_UPGRADES.has(k));
    if (weapons.length > 0) {
      picks[Math.floor(Math.random() * picks.length)] = weapons[Math.floor(Math.random() * weapons.length)];
    }
  }
  levelUpCards = picks;
  levelUpSelection = levelUpCards.length > 1 ? 1 : 0;
  levelUpAnimTimer = 0;
}

function applyUpgrade(key) {
  player.upgrades[key]++;
  const tier = player.upgrades[key];
  switch (key) {
    case 'spread':
      player.weaponLevel = tier + 1;
      break;
    case 'fireRate':
      player.fireRateOverride = UPGRADES.fireRate.values[tier];
      break;
    case 'gravLock':
      player.gravLock = UPGRADES.gravLock.values[tier];
      break;
    case 'xpMagnet':
      player.xpAttractRadius = UPGRADES.xpMagnet.values[tier];
      break;
    case 'boostDur':
      player.dodgeDuration = UPGRADES.boostDur.values[tier];
      break;
    case 'boostRecharge':
      player.dodgeCooldownBase = UPGRADES.boostRecharge.values[tier];
      break;
    case 'speed':
      player.maxVel = UPGRADES.speed.values[tier];
      break;
    case 'shieldRegen':
      player.shieldRechargeSeconds = UPGRADES.shieldRegen.values[tier];
      // First shield regen upgrade activates the shield
      if (tier === 1 && !player.shieldActive && player.shieldRechargeTimer === 0) {
        player.shieldActive = true;
        screenFlash = 8;
        spawnExplosion(player.x, player.y, 10, ['#ffffff', '#ffee88', '#ffcc44']);
      }
      break;
    case 'scoreMult':
      player.scoreMultBonus = UPGRADES.scoreMult.values[tier];
      break;
  }
}

function drawLevelUpScreen() {
  // Dark overlay
  ctx.save();
  const overlayAlpha = Math.min(0.7, levelUpAnimTimer / 20 * 0.7);
  ctx.fillStyle = `rgba(5, 5, 20, ${overlayAlpha})`;
  ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

  // Entrance animation
  const animPct = Math.min(1, levelUpAnimTimer / 20);
  const easeOut = 1 - Math.pow(1 - animPct, 3);

  // "LEVEL UP" title
  const titleAlpha = Math.min(1, animPct * 2);
  ctx.globalAlpha = titleAlpha;
  ctx.shadowColor = '#00ffee';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#00ffee';
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('L E V E L   U P', CONFIG.width / 2, 70 + (1 - easeOut) * 30);

  ctx.font = '14px monospace';
  ctx.fillStyle = '#88cccc';
  ctx.shadowBlur = 0;
  ctx.fillText('CHOOSE AN UPGRADE', CONFIG.width / 2, 100 + (1 - easeOut) * 30);

  // Cards
  const cardCount = levelUpCards.length;
  const cardW = 180;
  const cardH = 240;
  const gap = 24;
  const totalW = cardCount * cardW + (cardCount - 1) * gap;
  const startX = (CONFIG.width - totalW) / 2;
  const cardY = 140;

  for (let i = 0; i < cardCount; i++) {
    const key = levelUpCards[i];
    const upg = UPGRADES[key];
    const currentTier = player.upgrades[key];
    const selected = i === levelUpSelection;

    // Card slide-up with stagger
    const stagger = i * 4;
    const cardAnim = Math.min(1, Math.max(0, (levelUpAnimTimer - stagger) / 16));
    const cardEase = 1 - Math.pow(1 - cardAnim, 3);
    const cardX = startX + i * (cardW + gap);
    const drawY = cardY + (1 - cardEase) * 80;

    ctx.globalAlpha = cardEase;
    ctx.save();

    // Card background
    const bgAlpha = selected ? 0.25 : 0.12;
    ctx.fillStyle = `rgba(20, 20, 50, ${bgAlpha + 0.6})`;
    ctx.strokeStyle = selected ? upg.color : 'rgba(150, 150, 200, 0.3)';
    ctx.lineWidth = selected ? 2.5 : 1;
    if (selected) {
      ctx.shadowColor = upg.color;
      ctx.shadowBlur = 15 + Math.sin(frame * 0.08) * 5;
    }

    // Rounded rect
    const r = 10;
    ctx.beginPath();
    ctx.moveTo(cardX + r, drawY);
    ctx.lineTo(cardX + cardW - r, drawY);
    ctx.quadraticCurveTo(cardX + cardW, drawY, cardX + cardW, drawY + r);
    ctx.lineTo(cardX + cardW, drawY + cardH - r);
    ctx.quadraticCurveTo(cardX + cardW, drawY + cardH, cardX + cardW - r, drawY + cardH);
    ctx.lineTo(cardX + r, drawY + cardH);
    ctx.quadraticCurveTo(cardX, drawY + cardH, cardX, drawY + cardH - r);
    ctx.lineTo(cardX, drawY + r);
    ctx.quadraticCurveTo(cardX, drawY, cardX + r, drawY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    const cx = cardX + cardW / 2;

    // Icon
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = upg.color;
    ctx.shadowColor = upg.color;
    ctx.shadowBlur = selected ? 12 : 4;
    ctx.fillText(upg.icon, cx, drawY + 45);
    ctx.shadowBlur = 0;

    // Name
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(upg.name, cx, drawY + 85);

    // Description
    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(200, 200, 230, 0.7)';
    ctx.fillText(upg.desc, cx, drawY + 108);

    // Current → Next tier
    ctx.font = '13px monospace';
    if (currentTier === 0) {
      // No current tier — just show what you get
      ctx.fillStyle = upg.color;
      ctx.fillText(upg.tiers[0], cx, drawY + 145);
    } else {
      // Show current → next
      ctx.fillStyle = 'rgba(180,180,200,0.6)';
      ctx.fillText(upg.tiers[currentTier - 1], cx - 30, drawY + 145);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('→', cx, drawY + 145);
      ctx.fillStyle = upg.color;
      ctx.fillText(upg.tiers[currentTier], cx + 30, drawY + 145);
    }

    // Tier pips
    const pipY = drawY + 175;
    const pipGap = 14;
    const pipStart = cx - (upg.maxTier - 1) * pipGap / 2;
    for (let t = 0; t < upg.maxTier; t++) {
      const px = pipStart + t * pipGap;
      if (t < currentTier) {
        // Filled — already purchased
        ctx.fillStyle = upg.color;
      } else if (t === currentTier) {
        // Next tier — pulsing
        const pulse = 0.5 + Math.sin(frame * 0.1) * 0.5;
        ctx.fillStyle = selected ? upg.color : `rgba(150,150,200,${0.3 + pulse * 0.3})`;
      } else {
        ctx.fillStyle = 'rgba(100,100,140,0.3)';
      }
      ctx.beginPath();
      ctx.arc(px, pipY, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Selected indicator
    if (selected && animPct >= 1) {
      ctx.font = '12px monospace';
      ctx.fillStyle = upg.color;
      ctx.shadowColor = upg.color;
      ctx.shadowBlur = 8;
      const blink = Math.floor(frame / 30) % 2 === 0;
      if (blink) ctx.fillText('▼ ENTER ▼', cx, drawY + cardH - 15);
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  // Controls hint
  ctx.globalAlpha = Math.min(1, animPct);
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(180,180,220,0.5)';
  ctx.shadowBlur = 0;
  ctx.fillText('◄ ► SELECT     ENTER CONFIRM', CONFIG.width / 2, CONFIG.height - 40);

  ctx.restore();
}

function updateLevelUpInput() {
  levelUpAnimTimer++;
  if (levelUpAnimTimer < 22) return; // entrance animation still playing

  if ((keys['ArrowLeft'] || keys['KeyA']) && !keys._levelLeftHeld) {
    levelUpSelection = Math.max(0, levelUpSelection - 1);
    keys._levelLeftHeld = true;
  } else if (!keys['ArrowLeft'] && !keys['KeyA']) {
    keys._levelLeftHeld = false;
  }

  if ((keys['ArrowRight'] || keys['KeyD']) && !keys._levelRightHeld) {
    levelUpSelection = Math.min(levelUpCards.length - 1, levelUpSelection + 1);
    keys._levelRightHeld = true;
  } else if (!keys['ArrowRight'] && !keys['KeyD']) {
    keys._levelRightHeld = false;
  }

  if (keys['Enter'] && !keys._levelConfirmHeld) {
    applyUpgrade(levelUpCards[levelUpSelection]);
    player.pendingLevelUps--;
    keys._levelConfirmHeld = true;
    keys['Enter'] = false;
    keys['Space'] = false;
    screenFlash = 10;
    spawnExplosion(player.x, player.y, 12, [UPGRADES[levelUpCards[levelUpSelection]].color, '#ffffff']);

    // Check for more pending level-ups
    const allMaxed = Object.keys(UPGRADES).every(k => player.upgrades[k] >= UPGRADES[k].maxTier);
    if (player.pendingLevelUps > 0 && !allMaxed) {
      generateLevelUpCards();
    } else {
      player.pendingLevelUps = 0;
      gameState = levelUpPrevState;
    }
  } else if (!keys['Enter']) {
    keys._levelConfirmHeld = false;
  }
}

function checkPendingLevelUp() {
  if (player.pendingLevelUps <= 0) return;
  const allMaxed = Object.keys(UPGRADES).every(k => player.upgrades[k] >= UPGRADES[k].maxTier);
  if (allMaxed) { player.pendingLevelUps = 0; return; }
  levelUpPrevState = gameState;
  gameState = 'LEVEL_UP';
  generateLevelUpCards();
}

// === MAIN LOOP ===
let lastFrameTime = 0;
const TARGET_FPS = 60;
const FRAME_MS = 1000 / TARGET_FPS; // ~16.67ms

function gameLoop(timestamp) {
  // Fixed-timestep cap at 60fps
  if (timestamp - lastFrameTime < FRAME_MS) {
    requestAnimationFrame(gameLoop);
    return;
  }
  // Advance by exactly one target frame; catch up if badly behind
  lastFrameTime += FRAME_MS;
  if (timestamp - lastFrameTime > FRAME_MS) lastFrameTime = timestamp;

  frame++;

  // Pause toggle
  if (keys['KeyP'] && (gameState === 'GAMEPLAY' || gameState === 'BOSS_FIGHT' || gameState === 'MID_BOSS_FIGHT' || gameState === 'TUNNEL_GAUNTLET')) {
    if (!keys._pHeld) {
      paused = !paused;
      keys._pHeld = true;
    }
  } else {
    keys._pHeld = false;
  }

  if (paused && (gameState === 'GAMEPLAY' || gameState === 'BOSS_FIGHT' || gameState === 'MID_BOSS_FIGHT' || gameState === 'TUNNEL_GAUNTLET')) {
    // Draw current frame frozen
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
    ctx.fillStyle = CONFIG.colors.hud;
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('P A U S E D', CONFIG.width / 2, CONFIG.height / 2);
    ctx.restore();
    requestAnimationFrame(gameLoop);
    return;
  }

  // Hitstop — skip game updates but still render
  if (hitStopFrames > 0) {
    hitStopFrames--;
    // Still update particles/flashes so they animate during hitstop
    updateParticles();
    updateLocalFlashes();
    updateScreenShake();
  } else {
    updateScreenShake();
  }

  // Apply screen shake
  ctx.save();
  ctx.translate(screenShakeX, screenShakeY);

  switch (gameState) {
    case 'TITLE':
      drawTitleScreen();
      if (keys['Enter']) {
        resetGame();
        startStage();
      }
      break;

    case 'STAGE_INTRO':
      stageIntroTimer--;
      drawStageIntro();
      if (stageIntroTimer <= 0) {
        gameState = 'GAMEPLAY';
      }
      break;

    case 'GAMEPLAY':
      drawBackground();
      if (hitStopFrames <= 0) {
        updatePlayer();
        updatePlayerBullets();
        updateEnemyBullets();
        updateEnemies();
        updateAmbientAsteroids();
        updateWaves();
        updateParticles();
        updatePickups();
        updateXPOrbs();
        updateShockwaves();
        updateLocalFlashes();
        checkCollisions();
      }

      drawEnemies();
      drawShockwaves();
      drawLocalFlashes();
      drawPickups();
      drawXPOrbs();
      drawPlayerBullets();
      drawEnemyBullets();
      drawPlayer();
      drawShield();
      drawParticles();
      drawHUD();
      checkPendingLevelUp();
      break;

    case 'MID_BOSS_WARNING':
      midBossWarningTimer--;
      drawMidBossWarning();
      if (midBossWarningTimer <= 0) {
        gameState = 'MID_BOSS_FIGHT';
        spawnMidBoss();
      }
      break;

    case 'MID_BOSS_FIGHT':
      drawBackground();
      if (hitStopFrames <= 0) {
        updatePlayer();
        updatePlayerBullets();
        updateEnemyBullets();
        updateEnemies();
        updateAmbientAsteroids();
        updateMidBoss();
        updateParticles();
        updateXPOrbs();
        updateShockwaves();
        updateLocalFlashes();
        checkCollisions();
      }

      drawEnemies();
      drawMidBoss();
      drawShockwaves();
      drawLocalFlashes();
      drawXPOrbs();
      drawPlayerBullets();
      drawEnemyBullets();
      drawPlayer();
      drawShield();
      drawParticles();
      drawHUD();
      drawMidBossInboundAlerts();
      checkPendingLevelUp();
      break;

    case 'TUNNEL_WARNING':
      tunnelWarningTimer--;
      drawTunnelWarning();
      if (tunnelWarningTimer <= 0) {
        startTunnel();
      }
      break;

    case 'TUNNEL_GAUNTLET':
      drawBackground();
      drawTunnel();
      if (hitStopFrames <= 0) {
        updatePlayer();
        updateTunnel();
        updatePlayerBullets();
        updateEnemyBullets();
        updateEnemies();
        updateParticles();
        updateXPOrbs();
        updateShockwaves();
        updateLocalFlashes();
        checkCollisions();
        checkTunnelCollisions();
      }
      drawTunnelHazards();
      drawEnemies();
      drawShockwaves();
      drawLocalFlashes();
      drawXPOrbs();
      drawPlayerBullets();
      drawEnemyBullets();
      drawPlayer();
      drawShield();
      drawParticles();
      drawHUD();
      checkPendingLevelUp();
      break;

    case 'BOSS_WARNING':
      bossWarningTimer--;
      drawBossWarning();
      if (bossWarningTimer <= 0) {
        gameState = 'BOSS_FIGHT';
        spawnBoss(currentStage);
      }
      break;

    case 'BOSS_FIGHT':
      drawBackground();
      if (hitStopFrames <= 0) {
        updatePlayer();
        updatePlayerBullets();
        updateEnemyBullets();
        updateBoss();
        updateParticles();
        updateXPOrbs();
        updateShockwaves();
        updateLocalFlashes();
        checkCollisions();
      }

      drawBoss();
      drawShockwaves();
      drawLocalFlashes();
      drawXPOrbs();
      drawPlayerBullets();
      drawEnemyBullets();
      drawPlayer();
      drawShield();
      drawParticles();
      drawHUD();

      // Boss name display for first few seconds
      if (boss && boss.frame < 180) {
        ctx.save();
        ctx.shadowColor = CONFIG.colors.boss;
        ctx.shadowBlur = 10;
        ctx.fillStyle = CONFIG.colors.hud;
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        const alpha = Math.min(1, (180 - boss.frame) / 60);
        ctx.globalAlpha = alpha;
        ctx.fillText(boss.name, CONFIG.width / 2, CONFIG.height - 60);
        ctx.font = '14px monospace';
        ctx.fillText('"' + boss.title + '"', CONFIG.width / 2, CONFIG.height - 35);
        ctx.restore();
      }
      checkPendingLevelUp();
      break;

    case 'LEVEL_UP':
      // Freeze game scene behind the overlay
      drawBackground();
      if (tunnelActive) { drawTunnel(); drawTunnelHazards(); }
      drawEnemies();
      if (boss) drawBoss();
      if (midBoss) drawMidBoss();
      drawShockwaves();
      drawLocalFlashes();
      drawPickups();
      drawXPOrbs();
      drawPlayerBullets();
      drawEnemyBullets();
      drawPlayer();
      drawShield();
      drawParticles();
      drawHUD();
      // Draw card overlay + handle input
      drawLevelUpScreen();
      updateLevelUpInput();
      break;

    case 'STAGE_CLEAR':
      drawStageClear();
      if (keys['Enter']) {
        keys['Enter'] = false;
        if (currentStage >= 3) {
          gameState = 'WIN';
        } else {
          currentStage++;
          startStage();
        }
      }
      break;

    case 'GAME_OVER':
      drawGameOver();
      if (keys['Enter']) {
        keys['Enter'] = false;
        gameState = 'TITLE';
      }
      break;

    case 'WIN':
      drawWinScreen();
      if (keys['Enter']) {
        keys['Enter'] = false;
        gameState = 'TITLE';
      }
      break;
  }

  // Restore screen shake transform
  ctx.restore();

  // Screen flash effect
  if (screenFlash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${screenFlash / 30 * 0.6})`;
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
    screenFlash--;
  }

  requestAnimationFrame(gameLoop);
}

// === DEBUG: shooting range ===
// Call debugRange() from console to spawn a column of enemies in front of the player
function debugRange(type = 'drone', count = 6, spacing = 60) {
  // Start a game if not in one
  if (gameState === 'TITLE' || gameState === 'GAME_OVER') {
    resetGame();
    startStage();
  }
  gameState = 'GAMEPLAY';
  enemies.length = 0;
  enemyBullets.length = 0;
  player.x = 80;
  player.y = CONFIG.height / 2;
  player.lives = 99;
  player.alive = true;
  player.invincible = 60;
  const startY = CONFIG.height / 2 - ((count - 1) * spacing) / 2;
  for (let i = 0; i < count; i++) {
    const e = spawnEnemy(type, 500, startY + i * spacing, { speed: 0 });
    if (e) {
      e.hp = 3; // survive a couple hits so you can see the non-lethal impact effects
      e.maxHp = 3;
      e.fireTimer = 99999; // don't shoot back
    }
  }
}

// === DEBUG: tunnel test ===
// Call debugTunnel() from console to jump straight to the tunnel gauntlet
function debugTunnel() {
  if (gameState === 'TITLE' || gameState === 'GAME_OVER') {
    resetGame();
    startStage();
  }
  enemies.length = 0;
  enemyBullets.length = 0;
  player.x = 80;
  player.y = CONFIG.height / 2;
  player.lives = 99;
  player.alive = true;
  player.invincible = 60;
  gameState = 'TUNNEL_WARNING';
  tunnelWarningTimer = 60;
}

// === INIT ===
gameLoop();

</script>
