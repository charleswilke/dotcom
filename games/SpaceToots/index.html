// Localized nova burst — radial gradient flash at a world position
const localFlashes = [];
function spawnLocalFlash(x, y, radius) {
  localFlashes.push({ x, y, radius, life: 1.0 });
}
function updateLocalFlashes() {
  for (let i = localFlashes.length - 1; i >= 0; i--) {
    const f = localFlashes[i];
    f.life -= f.fast ? 0.15 : 0.04;
    if (f.life <= 0) swapRemove(localFlashes, i);
  }
}
function drawLocalFlashes() {
  for (const f of localFlashes) {
    const alpha = f.life * 0.85;
    const r = f.radius * (1.1 - f.life * 0.1);
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    if (f.fast) {
      // Bullet impact flash — bright white/cyan
      grad.addColorStop(0,    `rgba(255, 255, 255, ${alpha})`);
      grad.addColorStop(0.3,  `rgba(100, 240, 255, ${alpha * 0.7})`);
      grad.addColorStop(1,    `rgba(0, 180, 255, 0)`);
    } else {
      // Nova flash — purple
      grad.addColorStop(0,    `rgba(255, 220, 255, ${alpha})`);
      grad.addColorStop(0.35, `rgba(210, 130, 255, ${alpha * 0.6})`);
      grad.addColorStop(1,    `rgba(160, 60, 255, 0)`);
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// === TUNNEL GAUNTLET SYSTEM ===
const TUNNEL_SCROLL_SPEED = 2.0;
const TUNNEL_SEGMENT_WIDTH = 120;
const TUNNEL_WALL_COLOR = '#1a0e2a';
const TUNNEL_EDGE_COLOR = '#cc00ff';
const TUNNEL_BLADE_COLOR = '#ff4400';
const TUNNEL_GATE_COLOR = '#ffaa00';

let tunnelActive = false;
let tunnelScrollX = 0;
let tunnelSegments = [];
let tunnelHazards = [];       // active hazard instances
let tunnelWarningTimer = 0;
let tunnelSpawnedHazards = new Set(); // track which segment hazards already spawned

function buildTunnelData() {
  const H = CONFIG.height; // 540
  // Compact format: [topLeft, topRight, bottomOffset_L, bottomOffset_R, hazards?]
  // bottomLeft = H - bottomOffset_L, bottomRight = H - bottomOffset_R
  // Hazard shorthands: T=turret, B=plasmaBlade, G=gate
  const T = (localX, y) => ({ type: 'turret', localX, y });
  const B = (localX, cy, radius, rotSpeed, double) => ({ type: 'plasmaBlade', localX, cy, radius, rotSpeed, double });
  const G = (localX, openGap, cycleTimes, phaseOffset) => {
    const h = { type: 'gate', localX, openGap, cycleTimes };
    if (phaseOffset) h.phaseOffset = phaseOffset;
    return h;
  };

  // [topL, topR, botOffL, botOffR, hazards?]
  const data = [
    // A: "The Funnel" (0-4)
    [0,0,0,0], [0,30,30,30], [30,80,80,80], [80,130,130,130], [130,150,150,150],
    // B: "Straight Shot" (5-12)
    [150,155,150,145], [155,165,145,135], [165,175,135,130],
    [175,180,130,130, T(0.5,200)],
    [180,185,130,135], [185,180,135,140], [180,170,140,150], [170,155,150,155],
    // C: "The Weave" (13-24)
    [155,170,155,130], [170,210,130,100], [210,250,100,70],
    [250,280,70,55, T(0.5,295)],
    [280,300,55,50], [300,290,50,60], [290,260,60,80], [260,210,80,120], [210,150,120,170],
    [150,90,170,230, T(0.5,H-250)],
    [90,60,230,260], [60,70,260,250],
    // D: "First Blade" (25-32)
    [70,90,250,230], [90,120,230,200], [120,140,200,180],
    [140,145,180,175, B(0.5,290,100,0.025,false)],
    [145,150,175,170], [150,155,170,165], [155,160,165,160], [160,160,160,160],
    // E: "The Gauntlet Begins" (33-44)
    [160,180,160,140], [180,220,140,110],
    [220,260,110,80, B(0.5,350,80,0.028,false)],
    [260,290,80,60], [290,310,60,50],
    [310,300,50,60, T(0.4,325)],
    [300,270,60,80],
    [270,220,80,120, B(0.5,250,85,0.03,false)],
    [220,170,120,160], [170,140,160,180], [140,130,180,190], [130,135,190,185],
    // F: "Gate Check" (45-54)
    [135,140,185,180], [140,150,180,170], [150,160,170,160],
    [160,160,160,160, G(0.5,180,{open:100,closing:20,closed:35,opening:20})],
    [160,160,160,160], [160,165,160,155],
    [165,170,155,155, T(0.5,190)],
    [170,175,155,150], [175,180,150,145], [180,180,145,145],
    // G: "Double Trouble" (55-66)
    [180,190,145,135, T(0.5,H-155)],
    [190,200,135,130],
    [200,200,130,130, G(0.5,170,{open:90,closing:18,closed:30,opening:18})],
    [200,195,130,135],
    [195,190,135,140, B(0.5,300,75,0.03,true)],
    [190,185,140,145], [185,180,145,150],
    [180,180,150,150, G(0.5,160,{open:85,closing:18,closed:35,opening:18},80)],
    [180,175,150,155], [175,165,155,165], [165,155,165,170], [155,150,170,175],
    // H: "The Crucible" (67-78)
    [150,170,175,155],
    [170,210,155,120, T(0.4,230)],
    [210,260,120,80], [260,300,80,50],
    [300,320,50,40, B(0.5,370,70,0.035,true)],
    [320,300,40,60],
    [300,250,60,100, T(0.6,H-120)],
    [250,180,100,160],
    [180,160,160,175, G(0.5,140,{open:65,closing:16,closed:30,opening:16})],
    [160,140,175,190], [140,120,190,200], [120,100,200,210],
    // I: "The Exit" (79-84)
    [100,75,210,170], [75,50,170,100], [50,30,100,40], [30,15,40,15], [15,0,15,0], [0,0,0,0]
  ];

  return data.map(d => ({
    topLeft: d[0], topRight: d[1],
    bottomLeft: H - d[2], bottomRight: H - d[3],
    hazards: d[4] ? [d[4]] : []
  }));
}

function getTunnelBoundsAtX(screenX) {
  if (!tunnelActive || tunnelSegments.length === 0) return { topY: 0, bottomY: CONFIG.height };
  // Convert screen X to tunnel-space position
  const tunnelX = screenX + tunnelScrollX;
  const segIndex = Math.floor(tunnelX / TUNNEL_SEGMENT_WIDTH);
  if (segIndex < 0) return { topY: tunnelSegments[0].topLeft, bottomY: tunnelSegments[0].bottomLeft };
  if (segIndex >= tunnelSegments.length) {
    const last = tunnelSegments[tunnelSegments.length - 1];
    return { topY: last.topRight, bottomY: last.bottomRight };
  }
  const seg = tunnelSegments[segIndex];
  const t = (tunnelX - segIndex * TUNNEL_SEGMENT_WIDTH) / TUNNEL_SEGMENT_WIDTH;
  return {
    topY: seg.topLeft + (seg.topRight - seg.topLeft) * t,
    bottomY: seg.bottomLeft + (seg.bottomRight - seg.bottomLeft) * t
  };
}

function startTunnel() {
  tunnelActive = true;
  tunnelScrollX = 0;
  tunnelSegments = buildTunnelData();
  tunnelHazards = [];
  tunnelSpawnedHazards = new Set();
  tunnelRockGrid = null; // regenerate rock geometry
  gameState = 'TUNNEL_GAUNTLET';
}

function updateTunnel() {
  if (!tunnelActive) return;
  tunnelScrollX += TUNNEL_SCROLL_SPEED;

  // Spawn hazards as segments scroll into view
  for (let i = 0; i < tunnelSegments.length; i++) {
    const seg = tunnelSegments[i];
    const segScreenX = i * TUNNEL_SEGMENT_WIDTH - tunnelScrollX;
    // Spawn when segment is about to enter the right side of screen
    if (segScreenX < CONFIG.width + 60 && segScreenX > -TUNNEL_SEGMENT_WIDTH - 60) {
      for (let hi = 0; hi < seg.hazards.length; hi++) {
        const hazardKey = i + '_' + hi;
        if (tunnelSpawnedHazards.has(hazardKey)) continue;
        tunnelSpawnedHazards.add(hazardKey);
        const h = seg.hazards[hi];
        const worldX = i * TUNNEL_SEGMENT_WIDTH + h.localX * TUNNEL_SEGMENT_WIDTH;

        if (h.type === 'turret') {
          const e = spawnEnemy('turret', worldX - tunnelScrollX, h.y, { speed: 0 });
          if (e) {
            e.tunnelWorldX = worldX;
            e.tunnelTurret = true;
            e.targetX = e.x; // anchor in place
          }
        } else if (h.type === 'plasmaBlade') {
          // Compute radius to fill the tunnel passage
          const bladeBounds = getTunnelBoundsAtX(worldX - tunnelScrollX);
          const passageHeight = bladeBounds.bottomY - bladeBounds.topY;
          const bladeCenter = (bladeBounds.topY + bladeBounds.bottomY) / 2;
          // Radius = half the passage height (blade tip reaches both walls)
          const bladeRadius = (passageHeight / 2) - 2; // -2px so tip just grazes wall
          tunnelHazards.push({
            type: 'plasmaBlade',
            worldX: worldX,
            cy: bladeCenter,
            radius: bladeRadius,
            angle: Math.random() * Math.PI * 2,
            rotSpeed: h.rotSpeed,
            double: h.double || false,
            active: true
          });
        } else if (h.type === 'gate') {
          const bounds = getTunnelBoundsAtX(worldX - tunnelScrollX);
          const centerY = (bounds.topY + bounds.bottomY) / 2;
          const halfGap = h.openGap / 2;
          tunnelHazards.push({
            type: 'gate',
            worldX: worldX,
            gateWidth: 120,
            topOpenY: centerY - halfGap,
            bottomOpenY: centerY + halfGap,
            topY: centerY - halfGap,
            bottomY: centerY + halfGap,
            centerY: centerY,
            openGap: h.openGap,
            phase: 'open',
            timer: h.phaseOffset || 0,
            cycleTimes: h.cycleTimes,
            active: true
          });
        }
      }
    }
  }

  // Update tunnel turrets — override their x position to scroll with tunnel
  for (const e of enemies) {
    if (e.tunnelTurret) {
      e.x = e.tunnelWorldX - tunnelScrollX;
    }
  }

  // Update hazards
  for (let i = tunnelHazards.length - 1; i >= 0; i--) {
    const h = tunnelHazards[i];
    const screenX = h.worldX - tunnelScrollX;

    if (screenX < -100) {
      swapRemove(tunnelHazards, i);
      continue;
    }

    if (h.type === 'plasmaBlade') {
      h.angle += h.rotSpeed;
    } else if (h.type === 'gate') {
      h.timer++;
      const ct = h.cycleTimes;
      switch (h.phase) {
        case 'open':
          if (h.timer >= ct.open) { h.phase = 'closing'; h.timer = 0; }
          h.topY = h.topOpenY;
          h.bottomY = h.bottomOpenY;
          break;
        case 'closing': {
          const t = h.timer / ct.closing;
          // Ease-in cubic — accelerates as it closes for a forceful slam
          const eased = t * t * t;
          h.topY = h.topOpenY + (h.centerY - h.topOpenY) * eased;
          h.bottomY = h.bottomOpenY + (h.centerY - h.bottomOpenY) * eased;
          if (h.timer >= ct.closing) {
            h.phase = 'closed'; h.timer = 0;
            // Dust plume on slam — wide horizontal burst from center
            const sx = h.worldX - tunnelScrollX;
            for (let p = 0; p < 18; p++) {
              const angle = (Math.random() - 0.5) * Math.PI; // wide horizontal spread
              const speed = 1.5 + Math.random() * 3.5;
              particles.push({
                x: sx + (Math.random() - 0.5) * h.gateWidth * 0.8,
                y: h.centerY + (Math.random() - 0.5) * 12,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed * 0.4,
                life: 25 + Math.random() * 20,
                maxLife: 45,
                color: ['#ff6633', '#ffaa44', '#cc4400', '#ffcc66', '#ff8844'][p % 5],
                size: 2 + Math.random() * 3
              });
            }
            // Wider dust cloud particles
            for (let p = 0; p < 10; p++) {
              particles.push({
                x: sx + (Math.random() - 0.5) * h.gateWidth,
                y: h.centerY + (Math.random() - 0.5) * 6,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 1.5,
                life: 30 + Math.random() * 25,
                maxLife: 55,
                color: ['#886655', '#aa8866', '#665544'][p % 3],
                size: 3 + Math.random() * 4
              });
            }
            triggerScreenShake(4, 8);
          }
          break;
        }
        case 'closed':
          h.topY = h.centerY;
          h.bottomY = h.centerY;
          if (h.timer >= ct.closed) { h.phase = 'opening'; h.timer = 0; }
          break;
        case 'opening': {
          const t = h.timer / ct.opening;
          h.topY = h.centerY + (h.topOpenY - h.centerY) * t;
          h.bottomY = h.centerY + (h.bottomOpenY - h.centerY) * t;
          if (h.timer >= ct.opening) { h.phase = 'open'; h.timer = 0; }
          break;
        }
      }
    }
  }

  // Check if tunnel is complete
  const totalLength = tunnelSegments.length * TUNNEL_SEGMENT_WIDTH;
  if (tunnelScrollX >= totalLength + 60) {
    completeTunnel();
  }
}

function completeTunnel() {
  tunnelActive = false;
  tunnelHazards = [];
  tunnelSpawnedHazards = new Set();
  // Remove any remaining tunnel turrets
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].tunnelTurret) swapRemove(enemies, i);
  }
  enemyBullets.length = 0;
  spaceMines.length = 0;
  secondaryProjectiles.length = 0;
  // Advance wave system and go to boss
  currentWave++;
  waveActive = false;
  waveTimer = 0;
  gameState = 'GAMEPLAY';
}

// Pre-generate seeded random grid for full-wall triangulation
// Grid covers the entire wall area with multiple rows of jittered vertices
let tunnelRockGrid = null;
const TUNNEL_SUBDIV = 4;  // X subdivisions per segment
const TUNNEL_ROWS = 6;    // Y rows of triangles filling each wall

function buildTunnelRockGrid(segCount) {
  let seed = 12345;
  function srand() { seed = (seed * 16807 + 0) % 2147483647; return (seed & 0x7fffffff) / 2147483647; }

  const totalCols = segCount * TUNNEL_SUBDIV + 1;
  // For each column, generate jitter and shade for each row (top wall and bottom wall)
  const top = [];
  const bottom = [];
  for (let c = 0; c < totalCols; c++) {
    const topCol = [];
    const botCol = [];
    for (let r = 0; r <= TUNNEL_ROWS; r++) {
      topCol.push({
        jx: (srand() - 0.5) * 18,  // X jitter
        jy: (srand() - 0.5) * 14,  // Y jitter
        shade: srand()              // brightness 0-1
      });
      botCol.push({
        jx: (srand() - 0.5) * 18,
        jy: (srand() - 0.5) * 14,
        shade: srand()
      });
    }
    top.push(topCol);
    bottom.push(botCol);
  }
  return { top, bottom };
}

// Get the actual vertex position for a grid point in the top wall
function topVertPos(col, row, seg, segIdx, leftX, subW) {
  const grid = tunnelRockGrid.top;
  const v = grid[Math.min(col, grid.length - 1)][row];
  const t = (col - segIdx * TUNNEL_SUBDIV) / TUNNEL_SUBDIV;
  const edgeY = seg.topLeft + (seg.topRight - seg.topLeft) * Math.max(0, Math.min(1, t));
  const screenTop = 0;
  // Row 0 = screen top edge, TUNNEL_ROWS = passage edge
  const baseY = screenTop + (edgeY - screenTop) * (row / TUNNEL_ROWS);
  const baseX = leftX + (col - segIdx * TUNNEL_SUBDIV) * subW;
  // Less jitter at edges (row 0 = screen edge, last row = passage edge), more in middle
  const edgeFactor = row === 0 ? 0.1 : row === TUNNEL_ROWS ? 1.0 : 0.7;
  return {
    x: baseX + v.jx * edgeFactor,
    y: baseY + v.jy * edgeFactor,
    shade: v.shade
  };
}

function bottomVertPos(col, row, seg, segIdx, leftX, subW) {
  const grid = tunnelRockGrid.bottom;
  const v = grid[Math.min(col, grid.length - 1)][row];
  const t = (col - segIdx * TUNNEL_SUBDIV) / TUNNEL_SUBDIV;
  const edgeY = seg.bottomLeft + (seg.bottomRight - seg.bottomLeft) * Math.max(0, Math.min(1, t));
  const screenBot = CONFIG.height;
  // Row 0 = passage edge, TUNNEL_ROWS = screen bottom
  const baseY = edgeY + (screenBot - edgeY) * (row / TUNNEL_ROWS);
  const baseX = leftX + (col - segIdx * TUNNEL_SUBDIV) * subW;
  const edgeFactor = row === TUNNEL_ROWS ? 0.1 : row === 0 ? 1.0 : 0.7;
  return {
    x: baseX + v.jx * edgeFactor,
    y: baseY + v.jy * edgeFactor,
    shade: v.shade
  };
}

function drawTunnel() {
  if (!tunnelActive || tunnelSegments.length === 0) return;
  if (!tunnelRockGrid) tunnelRockGrid = buildTunnelRockGrid(tunnelSegments.length);

  ctx.save();
  const startSeg = Math.max(0, Math.floor(tunnelScrollX / TUNNEL_SEGMENT_WIDTH) - 1);
  const endSeg = Math.min(tunnelSegments.length - 1, Math.ceil((tunnelScrollX + CONFIG.width) / TUNNEL_SEGMENT_WIDTH) + 1);
  const SW = TUNNEL_SEGMENT_WIDTH;
  const subW = SW / TUNNEL_SUBDIV;

  // === Draw all triangles filling both walls ===
  ctx.shadowBlur = 0;
  ctx.lineWidth = 0.5;
  // Base color components for shading
  const bR = 20, bG = 10, bB = 35;

  for (let i = startSeg; i <= endSeg; i++) {
    const seg = tunnelSegments[i];
    const leftX = i * SW - tunnelScrollX;
    const colStart = i * TUNNEL_SUBDIV;

    for (let s = 0; s < TUNNEL_SUBDIV; s++) {
      const c0 = colStart + s;
      const c1 = colStart + s + 1;

      // --- TOP WALL: rows from screen top (row 0) to passage edge (TUNNEL_ROWS) ---
      for (let r = 0; r < TUNNEL_ROWS; r++) {
        const tl = topVertPos(c0, r, seg, i, leftX, subW);
        const tr = topVertPos(c1, r, seg, i, leftX, subW);
        const bl = topVertPos(c0, r + 1, seg, i, leftX, subW);
        const br = topVertPos(c1, r + 1, seg, i, leftX, subW);

        // Depth factor: darker deeper into wall, lighter near passage
        const depthT = r / TUNNEL_ROWS; // 0=deep, 1=passage edge

        // Triangle 1: tl, tr, bl
        const s1 = (tl.shade + tr.shade + bl.shade) / 3;
        const bright1 = depthT * 0.5 + s1 * 0.35;
        const cr1 = Math.floor(bR + bright1 * 50);
        const cg1 = Math.floor(bG + bright1 * 30);
        const cb1 = Math.floor(bB + bright1 * 55);
        ctx.fillStyle = `rgb(${cr1},${cg1},${cb1})`;
        ctx.strokeStyle = `rgba(${cr1 + 15},${cg1 + 10},${cb1 + 20},0.35)`;
        ctx.beginPath();
        ctx.moveTo(tl.x, tl.y);
        ctx.lineTo(tr.x, tr.y);
        ctx.lineTo(bl.x, bl.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Triangle 2: tr, br, bl
        const s2 = (tr.shade + br.shade + bl.shade) / 3;
        const bright2 = depthT * 0.5 + s2 * 0.35;
        const cr2 = Math.floor(bR + bright2 * 45);
        const cg2 = Math.floor(bG + bright2 * 28);
        const cb2 = Math.floor(bB + bright2 * 50);
        ctx.fillStyle = `rgb(${cr2},${cg2},${cb2})`;
        ctx.strokeStyle = `rgba(${cr2 + 15},${cg2 + 10},${cb2 + 20},0.3)`;
        ctx.beginPath();
        ctx.moveTo(tr.x, tr.y);
        ctx.lineTo(br.x, br.y);
        ctx.lineTo(bl.x, bl.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // --- BOTTOM WALL: rows from passage edge (row 0) to screen bottom (TUNNEL_ROWS) ---
      for (let r = 0; r < TUNNEL_ROWS; r++) {
        const tl = bottomVertPos(c0, r, seg, i, leftX, subW);
        const tr = bottomVertPos(c1, r, seg, i, leftX, subW);
        const bl = bottomVertPos(c0, r + 1, seg, i, leftX, subW);
        const br = bottomVertPos(c1, r + 1, seg, i, leftX, subW);

        const depthT = 1.0 - r / TUNNEL_ROWS; // 1=passage edge, 0=deep

        const s1 = (tl.shade + tr.shade + bl.shade) / 3;
        const bright1 = depthT * 0.5 + s1 * 0.35;
        const cr1 = Math.floor(bR + bright1 * 50);
        const cg1 = Math.floor(bG + bright1 * 30);
        const cb1 = Math.floor(bB + bright1 * 55);
        ctx.fillStyle = `rgb(${cr1},${cg1},${cb1})`;
        ctx.strokeStyle = `rgba(${cr1 + 15},${cg1 + 10},${cb1 + 20},0.35)`;
        ctx.beginPath();
        ctx.moveTo(tl.x, tl.y);
        ctx.lineTo(tr.x, tr.y);
        ctx.lineTo(bl.x, bl.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        const s2 = (tr.shade + br.shade + bl.shade) / 3;
        const bright2 = depthT * 0.5 + s2 * 0.35;
        const cr2 = Math.floor(bR + bright2 * 45);
        const cg2 = Math.floor(bG + bright2 * 28);
        const cb2 = Math.floor(bB + bright2 * 50);
        ctx.fillStyle = `rgb(${cr2},${cg2},${cb2})`;
        ctx.strokeStyle = `rgba(${cr2 + 15},${cg2 + 10},${cb2 + 20},0.3)`;
        ctx.beginPath();
        ctx.moveTo(tr.x, tr.y);
        ctx.lineTo(br.x, br.y);
        ctx.lineTo(bl.x, bl.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }
  }

  // === Pass 3: Neon edge glow ===
  ctx.shadowColor = TUNNEL_EDGE_COLOR;
  ctx.shadowBlur = 15;
  ctx.strokeStyle = TUNNEL_EDGE_COLOR;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.8;

  // Top edge — follows jittered rock vertices at passage edge (row = TUNNEL_ROWS)
  ctx.beginPath();
  for (let i = startSeg; i <= endSeg; i++) {
    const seg = tunnelSegments[i];
    const leftX = i * SW - tunnelScrollX;
    for (let s = 0; s <= TUNNEL_SUBDIV; s++) {
      const p = topVertPos(s, TUNNEL_ROWS, seg, i, leftX, subW);
      if (i === startSeg && s === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
  }
  ctx.stroke();

  // Bottom edge — follows jittered rock vertices at passage edge (row = 0)
  ctx.beginPath();
  for (let i = startSeg; i <= endSeg; i++) {
    const seg = tunnelSegments[i];
    const leftX = i * SW - tunnelScrollX;
    for (let s = 0; s <= TUNNEL_SUBDIV; s++) {
      const p = bottomVertPos(s, 0, seg, i, leftX, subW);
      if (i === startSeg && s === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
  }
  ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawTunnelHazards() {
  if (!tunnelActive) return;
  ctx.save();

  for (const h of tunnelHazards) {
    const screenX = h.worldX - tunnelScrollX;
    if (screenX < -100 || screenX > CONFIG.width + 100) continue;

    if (h.type === 'plasmaBlade') {
      // Pivot point
      ctx.shadowColor = TUNNEL_BLADE_COLOR;
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff6622';
      ctx.beginPath();
      ctx.arc(screenX, h.cy, 6, 0, Math.PI * 2);
      ctx.fill();

      // Inner pivot detail
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(screenX, h.cy, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Blade arm(s)
      const bladeCount = h.double ? 2 : 1;
      for (let b = 0; b < bladeCount; b++) {
        const angle = h.angle + b * Math.PI;
        const tipX = screenX + Math.cos(angle) * h.radius;
        const tipY = h.cy + Math.sin(angle) * h.radius;

        // Blade glow
        ctx.shadowColor = TUNNEL_BLADE_COLOR;
        ctx.shadowBlur = 25;
        ctx.strokeStyle = TUNNEL_BLADE_COLOR;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(screenX, h.cy);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        // Bright core line
        ctx.shadowBlur = 8;
        ctx.strokeStyle = '#ffcc88';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(screenX, h.cy);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        // Hot white center
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 4;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(screenX, h.cy);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        // Wall-contact sparks — only when blade tip is near or past the tunnel wall
        const tipBounds = getTunnelBoundsAtX(tipX);
        if (tipY <= tipBounds.topY + 8 || tipY >= tipBounds.bottomY - 8) {
          // Clamp spark position to the wall edge
          const sparkY = tipY <= tipBounds.topY + 8 ? tipBounds.topY : tipBounds.bottomY;
          if (frame % 2 === 0) {
            spawnExplosion(tipX, sparkY, 3, ['#ff4400', '#ff8800', '#ffcc44']);
            spawnExplosion(tipX, sparkY, 2, ['#ffffff', '#ffcc88', '#ff6600']);
          }
        }
      }
    } else if (h.type === 'gate') {
      const gateLeft = screenX - h.gateWidth / 2;
      const gateRight = screenX + h.gateWidth / 2;
      const isClosing = h.phase === 'closing';
      const isClosed = h.phase === 'closed';
      const warningColor = (isClosing || isClosed) ? '#ff2200' : TUNNEL_GATE_COLOR;

      // Get tunnel bounds at multiple X points across gate width for clip path
      const boundsL = getTunnelBoundsAtX(gateLeft);
      const boundsC = getTunnelBoundsAtX(screenX);
      const boundsR = getTunnelBoundsAtX(gateRight);
      const topWallY = boundsC.topY;
      const bottomWallY = boundsC.bottomY;

      // Clip gate rendering to the tunnel passage so edges hide behind rock walls
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(gateLeft, boundsL.topY);
      ctx.lineTo(screenX, boundsC.topY);
      ctx.lineTo(gateRight, boundsR.topY);
      ctx.lineTo(gateRight, boundsR.bottomY);
      ctx.lineTo(screenX, boundsC.bottomY);
      ctx.lineTo(gateLeft, boundsL.bottomY);
      ctx.closePath();
      ctx.clip();

      // Top gate slab: extends from top wall edge down to h.topY
      const topSlabTop = topWallY;
      const topSlabHeight = Math.max(0, h.topY - topWallY);
      ctx.shadowColor = warningColor;
      ctx.shadowBlur = isClosing ? 18 : 10;
      ctx.fillStyle = '#1a1020';
      ctx.fillRect(gateLeft, topSlabTop, h.gateWidth, topSlabHeight);
      ctx.strokeStyle = warningColor;
      ctx.lineWidth = 2;
      ctx.strokeRect(gateLeft, topSlabTop, h.gateWidth, topSlabHeight);

      // Bottom gate slab: extends from h.bottomY down to bottom wall edge
      const bottomSlabHeight = Math.max(0, bottomWallY - h.bottomY);
      ctx.fillRect(gateLeft, h.bottomY, h.gateWidth, bottomSlabHeight);
      ctx.strokeRect(gateLeft, h.bottomY, h.gateWidth, bottomSlabHeight);

      // Closing indicator — pulsing edges
      if (isClosing || isClosed) {
        const pulse = Math.sin(frame * 0.5) * 0.5 + 0.5;
        ctx.shadowBlur = 20 + pulse * 15;
        ctx.strokeStyle = `rgba(255, ${isClosed ? 0 : 100}, 0, ${0.5 + pulse * 0.5})`;
        ctx.lineWidth = 3;
        // Top edge
        ctx.beginPath();
        ctx.moveTo(gateLeft, h.topY);
        ctx.lineTo(gateRight, h.topY);
        ctx.stroke();
        // Bottom edge
        ctx.beginPath();
        ctx.moveTo(gateLeft, h.bottomY);
        ctx.lineTo(gateRight, h.bottomY);
        ctx.stroke();
      }

      // Sparks when closed
      if (isClosed && frame % 3 === 0) {
        spawnExplosion(screenX + (Math.random() - 0.5) * 20, h.centerY, 2, ['#ffffff', '#ff4400', '#ffaa00']);
      }

      ctx.restore();

      // Warning particles before closing
      if (h.phase === 'open' && h.timer > h.cycleTimes.open - 40) {
        const urgency = (h.timer - (h.cycleTimes.open - 40)) / 40;
        if (frame % Math.max(1, Math.floor(6 - urgency * 5)) === 0) {
          spawnExplosion(screenX, h.topOpenY + 5, 1, ['#ffaa00', '#ff6600']);
          spawnExplosion(screenX, h.bottomOpenY - 5, 1, ['#ffaa00', '#ff6600']);
        }
      }
    }
  }

  ctx.restore();
}

function checkTunnelCollisions() {
  if (!tunnelActive || !player.alive) return;

  const phw = player.width * 0.3;  // half hitbox width
  const phh = player.height * 0.3; // half hitbox height

  // Player vs tunnel walls
  const bounds = getTunnelBoundsAtX(player.x);
  let hitWall = false;

  if (player.y - phh < bounds.topY) {
    player.y = bounds.topY + phh;
    player.vy = Math.abs(player.vy) * 0.3;
    hitWall = true;
  }
  if (player.y + phh > bounds.bottomY) {
    player.y = bounds.bottomY - phh;
    player.vy = -Math.abs(player.vy) * 0.3;
    hitWall = true;
  }

  if (hitWall && player.invincible <= 0) {
    killPlayer();
    return;
  }

  // Player vs plasma blades
  for (const h of tunnelHazards) {
    if (h.type !== 'plasmaBlade') continue;
    const screenX = h.worldX - tunnelScrollX;
    const bladeCount = h.double ? 2 : 1;

    for (let b = 0; b < bladeCount; b++) {
      const angle = h.angle + b * Math.PI;
      const tipX = screenX + Math.cos(angle) * h.radius;
      const tipY = h.cy + Math.sin(angle) * h.radius;

      // Point-to-segment distance
      const dist = pointToSegmentDist(player.x, player.y, screenX, h.cy, tipX, tipY);
      if (dist < phw + 3) { // blade has ~3px effective width
        if (player.invincible <= 0) {
          killPlayer();
          return;
        }
      }
    }
  }

  // Player vs closing gates
  for (const h of tunnelHazards) {
    if (h.type !== 'gate') continue;
    const screenX = h.worldX - tunnelScrollX;
    const halfW = h.gateWidth / 2;

    // Is player in the gate's X range?
    if (player.x + phw > screenX - halfW && player.x - phw < screenX + halfW) {
      // Is the player inside the gap? (between topY and bottomY)
      if (player.y - phh < h.topY || player.y + phh > h.bottomY) {
        // Player is touching the gate slabs
        if (h.phase === 'closed' || h.phase === 'closing') {
          // During dash, be forgiving — let them squeeze through if mid-dash
          if (player.dodgeTimer > 0) {
            // Forgiving: don't kill during active dash, just nudge them through
            continue;
          }
          if (player.invincible <= 0) {
            killPlayer();
            return;
          }
        } else {
          // Open/opening — push player out of gate slab
          if (player.y < h.centerY) {
            player.y = h.topY + phh;
          } else {
            player.y = h.bottomY - phh;
          }
        }
      }
    }
  }

  // Bullets vs tunnel walls
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    const wb = getTunnelBoundsAtX(b.x);
    if (b.y < wb.topY || b.y > wb.bottomY) {
      spawnExplosion(b.x, b.y, 3, ['#00cccc', '#004466', '#002233']);
      swapRemove(playerBullets, i);
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    const wb = getTunnelBoundsAtX(b.x);
    if (b.y < wb.topY || b.y > wb.bottomY) {
      spawnExplosion(b.x, b.y, 2, ['#ff4400', '#441100']);
      swapRemove(enemyBullets, i);
    }
  }
}

// Point-to-line-segment distance
function pointToSegmentDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.sqrt((px - ax) * (px - ax) + (py - ay) * (py - ay));
  let t = ((px - ax) * dx + (py - ay) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));
}

function drawTunnelWarning() {
  drawBackground();
  updatePlayer();
  drawPlayer();
  drawPlayerBullets();
  drawParticles();
  drawHUD();

  ctx.save();
  ctx.shadowColor = '#ff4400';
  ctx.shadowBlur = 25;
  ctx.fillStyle = '#ff4400';
  ctx.font = 'bold 38px monospace';
  ctx.textAlign = 'center';
  if (Math.floor(frame / 10) % 2 === 0) {
    ctx.fillText('ENTERING THE GAUNTLET', CONFIG.width / 2, CONFIG.height / 2 - 10);
  }
  ctx.font = '16px monospace';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#ffaa66';
  ctx.fillText('NAVIGATE THE TUNNEL — WATCH FOR HAZARDS', CONFIG.width / 2, CONFIG.height / 2 + 25);
  ctx.restore();
}

// === AMBIENT ASTEROID SPAWNER ===
// Sprinkles random drones/chargers throughout gameplay independent of waves,
// giving variable density — sometimes lonely, sometimes a cluster.
let ambientAsteroidTimer = 220;

function updateAmbientAsteroids() {
  if (gameState !== 'GAMEPLAY' && gameState !== 'MID_BOSS_FIGHT') return;
  if (tunnelActive) return;
  ambientAsteroidTimer--;
  if (ambientAsteroidTimer > 0) return;

  // Much denser asteroid field during Shepherd fight
  if (gameState === 'MID_BOSS_FIGHT' && midBoss) {
    const p2 = midBoss.phase === 2;
    ambientAsteroidTimer = p2 ? 35 + Math.floor(Math.random() * 65) : 60 + Math.floor(Math.random() * 100);
  } else {
    ambientAsteroidTimer = 160 + Math.floor(Math.random() * 360);
  }

  const inBossFight = gameState === 'MID_BOSS_FIGHT' && midBoss;
  const count = inBossFight
    ? (midBoss.phase === 2 ? 2 + Math.floor(Math.random() * 2) : (Math.random() < 0.4 ? 2 : 1))
    : (Math.random() < 0.25 ? 2 + Math.floor(Math.random() * 2) : 1);
  // Keep the tutorial area clear — push asteroids to lower half while tutorial is showing
  const tutorialActive = autofireFlash.active || mouseTutorial.active;
  const minY = tutorialActive ? CONFIG.height * 0.5 : 50;
  const baseY = minY + Math.random() * (CONFIG.height - minY - 90);

  for (let c = 0; c < count; c++) {
    const type = Math.random() < 0.2 ? 'charger' : 'drone';
    const y = Math.max(minY, Math.min(CONFIG.height - 40, baseY + (Math.random() - 0.5) * 90));
    const e = spawnEnemy(type, CONFIG.width + 30 + c * 45, y);
    if (e) { e.speed = 1.5 + Math.random() * 2.5; e.ambient = true; }
  }
}

let currentStage = 1;
let currentWave = 0;
let waveTimer = 0;
let waveActive = false;
let score = 0;
let enemiesDestroyed = 0;

function updateWaves() {
  const waves = stageWaves[currentStage];
  if (!waves || currentWave >= waves.length) {
    // All waves done — spawn boss
    if (!boss && gameState === 'GAMEPLAY') {
      gameState = 'BOSS_WARNING';
      bossWarningTimer = 120;
      playerBullets.length = 0;
      enemyBullets.length = 0;
    }
    return;
  }

  // Wait for current wave enemies to be cleared (or mostly cleared) and delay passed
  if (!waveActive) {
    waveTimer++;
    const wave = waves[currentWave];
    // As soon as we start counting down toward the mid-boss, trigger the suction
    if (wave.midBoss && !preMidBoss) preMidBoss = true;
    if (waveTimer >= wave.delay && enemies.filter(e => !e.ambient).length <= 2) {
      if (wave.midBoss) {
        // Trigger mid-boss encounter — start shepherd music on warning
        if (!shepherdMusicTriggered) {
          shepherdMusicTriggered = true;
          shepherdTrackChoice = Math.random() < 0.5 ? 'shepherd1' : 'shepherd2';
          crossfadeTo(shepherdTrackChoice);
        }
        gameState = 'MID_BOSS_WARNING';
        midBossWarningTimer = 150;
        playerBullets.length = 0;
        enemyBullets.length = 0;
        waveActive = true;   // hold here until destroyMidBoss() advances it
        return;
      }
      if (wave.tunnel) {
        // Trigger tunnel gauntlet
        gameState = 'TUNNEL_WARNING';
        tunnelWarningTimer = 120;
        playerBullets.length = 0;
        enemyBullets.length = 0;
        waveActive = true;   // hold here until completeTunnel() advances it
        return;
      }
      // Spawn wave
      for (const e of wave.enemies) {
        spawnEnemy(e.type, e.x, e.y, { arcY: e.arcY, speed: e.speed });
      }
      if (wave.pickups) {
        for (const p of wave.pickups) {
          spawnPickup(p.x, p.y, p.type);
        }
      }
      waveActive = true;
    }
  } else {
    // Wave active — check if cleared
    if (enemies.filter(e => !e.ambient).length === 0) {
      waveActive = false;
      waveTimer = 0;
      currentWave++;
    }
  }
}

// === HUD ===
// Barrel distortion — nudge a point inward based on distance from center
function crtWarp(x, y) {
  const cx = CONFIG.width / 2, cy = CONFIG.height / 2;
  const nx = (x - cx) / cx, ny = (y - cy) / cy; // -1..1 normalized
  const r2 = nx * nx + ny * ny;
  const strength = 0.012; // gentle barrel push — enough to feel, not enough to clip
  const wx = x + (x - cx) * r2 * strength;
  const wy = y + (y - cy) * r2 * strength;
  return { x: wx, y: wy };
}

function drawHUD() {
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.fillStyle = CONFIG.colors.hud;
  ctx.font = '16px monospace';

  // HUD margin — keep elements inside the vignette
  const hMargin = 40, vMargin = 34;

  // Score — top-left, warp position
  const scorePos = crtWarp(hMargin, vMargin);
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + String(score).padStart(8, '0'), scorePos.x, scorePos.y);

  // Stage — top-center (minimal warp since it's centered)
  const stagePos = crtWarp(CONFIG.width / 2, vMargin);
  ctx.textAlign = 'center';
  ctx.fillText('STAGE ' + currentStage, stagePos.x, stagePos.y);

  // Lives — top-right
  const livesPos = crtWarp(CONFIG.width - hMargin, vMargin);
  ctx.textAlign = 'right';
  let livesStr = 'LIVES: ';
  for (let i = 0; i < player.lives; i++) livesStr += '♦ ';
  ctx.fillText(livesStr, livesPos.x, livesPos.y);

  // Secondary weapon HUD badge
  if (player.secondary) {
    const meta = SECONDARY_META[player.secondary];
    const wDef = CONFIG.weapons.secondary[player.secondary];
    const maxAmmo = wDef.ammo || Math.round((wDef.duration || 10) * 60);
    const ammoFrac = player.secondaryAmmo / maxAmmo;
    const bx = CONFIG.width - 155, by = 42;
    const bw = 135, bh = 22;

    // Flash effect on new pickup
    if (player.secondaryFlash > 0) player.secondaryFlash--;
    const flashAlpha = player.secondaryFlash > 0 ? Math.sin(player.secondaryFlash * 0.3) * 0.3 : 0;

    // Ongoing "use me!" pulse when ammo is still full (hasn't been fired yet)
    const unusedPulse = (ammoFrac >= 1.0 && player.secondaryFlash <= 0)
      ? 0.15 + 0.15 * Math.sin(frame * 0.1)
      : 0;

    // Badge background
    ctx.fillStyle = `rgba(10, 6, 20, 0.7)`;
    ctx.strokeStyle = meta.color;
    ctx.lineWidth = unusedPulse > 0 ? 2.5 : 1.5;
    ctx.shadowColor = meta.color;
    ctx.shadowBlur = flashAlpha > 0 ? 15 : unusedPulse > 0 ? 10 + unusedPulse * 30 : 6;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 4);
    ctx.fill();
    ctx.stroke();

    // Flash overlay
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha.toFixed(2)})`;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 4);
      ctx.fill();
    }

    // "Use me!" pulse overlay when ammo is full
    if (unusedPulse > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${unusedPulse.toFixed(3)})`;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 4);
      ctx.fill();
    }

    // Icon circle
    ctx.fillStyle = meta.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(bx + 14, by + bh / 2, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = 0;
    ctx.fillText(meta.icon, bx + 14, by + bh / 2);

    // Weapon name
    ctx.fillStyle = meta.color;
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(wDef.name.toUpperCase(), bx + 26, by + 9);

    // Ammo bar
    const barX = bx + 26, barY = by + 14, barW = bw - 32, barH = 4;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = meta.color;
    ctx.shadowColor = meta.color;
    ctx.shadowBlur = 4;
    ctx.fillRect(barX, barY, barW * ammoFrac, barH);
    ctx.shadowBlur = 0;

    // [X] key hint
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '9px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(isMobile ? '' : '[SPC]', bx + barW + 18, by + bh / 2 + 1);
  }

  // Weapon stats indicator — CRT-warped
  const wpnPos = crtWarp(hMargin, vMargin + 18);
  ctx.textAlign = 'left';
  ctx.font = '12px monospace';
  ctx.fillStyle = CONFIG.colors.playerBullet;
  let wpnLabel = 'WPN ' + player.weaponLevel + '×';
  if (player.upgrades.fireRate > 0) wpnLabel += ' R' + (player.fireRateOverride || CONFIG.playerFireRate);
  if (player.upgrades.gravLock > 0) wpnLabel += ' G' + player.upgrades.gravLock;
  ctx.fillText(wpnLabel, wpnPos.x, wpnPos.y);

  // Shield status — CRT-warped
  if (player.upgrades.shieldRegen > 0) {
    const shieldPos = crtWarp(hMargin, vMargin + 34);
    if (player.shieldActive) {
      ctx.fillStyle = '#ffee88';
      ctx.shadowColor = '#ffee88';
      ctx.shadowBlur = 6;
      ctx.fillText('SHIELD ●', shieldPos.x, shieldPos.y);
      ctx.shadowBlur = 0;
    } else if (player.shieldRechargeTimer > 0) {
      const secsLeft = Math.ceil(player.shieldRechargeTimer / 60);
      ctx.fillStyle = 'rgba(255, 220, 80, 0.4)';
      ctx.fillText('SHIELD ' + secsLeft + 's', shieldPos.x, shieldPos.y);
    }
  }

  // Score multiplier (shown when above 1x)
  {
    const baseMultiplier = 1 + (player.xpLevel - 1) * 0.25;
    const totalMult = baseMultiplier * player.scoreMultBonus;
    if (totalMult > 1.01) {
      ctx.fillStyle = '#00ffee';
      ctx.shadowColor = '#00ffee';
      ctx.shadowBlur = 6;
      ctx.fillText('×' + totalMult.toFixed(2), 20, player.upgrades.shieldRegen > 0 ? 80 : 64);
      ctx.shadowBlur = 0;
    }
  }

  // Dodge cooldown bar — lower left, CRT-warped
  {
    const dodgeReady = player.dodgeCooldown <= 0;
    const cooldownPct = dodgeReady ? 1 : 1 - (player.dodgeCooldown / player.dodgeCooldownBase);
    const dWarp = crtWarp(hMargin, CONFIG.height - vMargin);
    const barX = dWarp.x, barY = dWarp.y;
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = dodgeReady ? '#00ffff' : 'rgba(0,200,255,0.4)';
    ctx.shadowBlur = 0;
    ctx.fillText('DODGE', barX, barY - 4);
    // Background
    ctx.fillStyle = '#112233';
    ctx.fillRect(barX, barY, 60, 7);
    // Fill
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = dodgeReady ? 8 : 2;
    ctx.fillStyle = dodgeReady ? '#00ffff' : '#006688';
    ctx.fillRect(barX, barY, Math.round(60 * cooldownPct), 7);
    ctx.shadowBlur = 0;
  }

  // Level progress bar — lower right, shows score progress to next level-up
  {
    const range = player.nextLevelScore - player.prevLevelScore;
    const progress = range > 0 ? (score - player.prevLevelScore) / range : 0;
    const lvlPct = Math.min(1, Math.max(0, progress));
    const barW = 100;
    const lvlWarp = crtWarp(CONFIG.width - hMargin - barW, CONFIG.height - vMargin);
    const lvlLabelWarp = crtWarp(CONFIG.width - hMargin, CONFIG.height - vMargin);
    const barX = lvlWarp.x, barY = lvlWarp.y;
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#88ffee';
    ctx.fillText('LV ' + player.xpLevel, lvlLabelWarp.x, lvlLabelWarp.y - 4);
    // Background
    ctx.fillStyle = '#0a2220';
    ctx.fillRect(barX, barY, barW, 7);
    // Fill
    ctx.shadowColor = '#00ffee';
    ctx.shadowBlur = lvlPct > 0.9 ? 12 : 4;
    ctx.fillStyle = lvlPct > 0.9 ? '#ffffff' : '#00ddcc';
    ctx.fillRect(barX, barY, Math.round(barW * lvlPct), 7);
    ctx.shadowBlur = 0;
  }

  // Pause button — icon only, larger hit area
  {
    const pbX = 10, pbY = 80, pbW = 36, pbH = 36;
    const hovered = !isMobile && mousePos.x >= pbX && mousePos.x <= pbX + pbW && mousePos.y >= pbY && mousePos.y <= pbY + pbH;
    const alpha = hovered ? 0.8 : 0.35;
    if (hovered) {
      ctx.fillStyle = 'rgba(224, 224, 255, 0.08)';
      ctx.beginPath();
      ctx.roundRect(pbX, pbY, pbW, pbH, 6);
      ctx.fill();
    }
    ctx.fillStyle = `rgba(224, 224, 255, ${alpha})`;
    ctx.shadowColor = hovered ? '#00f0ff' : 'transparent';
    ctx.shadowBlur = hovered ? 8 : 0;
    // Two pause bars — centered in button
    ctx.fillRect(pbX + 10, pbY + 8, 6, 20);
    ctx.fillRect(pbX + 20, pbY + 8, 6, 20);
    ctx.shadowBlur = 0;
  }

  // Mute button — icon only, below pause
  {
    const mbX = 10, mbY = 122, mbW = 36, mbH = 36;
    const hovered = !isMobile && mousePos.x >= mbX && mousePos.x <= mbX + mbW && mousePos.y >= mbY && mousePos.y <= mbY + mbH;
    const alpha = hovered ? 0.8 : 0.35;
    if (hovered) {
      ctx.fillStyle = 'rgba(224, 224, 255, 0.08)';
      ctx.beginPath();
      ctx.roundRect(mbX, mbY, mbW, mbH, 6);
      ctx.fill();
    }
    ctx.fillStyle = `rgba(224, 224, 255, ${alpha})`;
    ctx.strokeStyle = `rgba(224, 224, 255, ${alpha})`;
    ctx.shadowColor = hovered ? '#00f0ff' : 'transparent';
    ctx.shadowBlur = hovered ? 8 : 0;
    // Speaker body — centered, larger
    const sx = mbX + 6, sy = mbY + 8;
    ctx.beginPath();
    ctx.rect(sx, sy + 6, 5, 8);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx + 5, sy + 6);
    ctx.lineTo(sx + 13, sy);
    ctx.lineTo(sx + 13, sy + 20);
    ctx.lineTo(sx + 5, sy + 14);
    ctx.closePath();
    ctx.fill();
    if (!muted) {
      // Sound wave arcs
      for (let w = 0; w < 3; w++) {
        const r = 6 + w * 6;
        const a = alpha * (1 - w * 0.25);
        ctx.strokeStyle = `rgba(224, 224, 255, ${a.toFixed(2)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(sx + 13, sy + 10, r, -Math.PI * 0.35, Math.PI * 0.35);
        ctx.stroke();
      }
    } else {
      // Strikethrough line
      ctx.strokeStyle = `rgba(255, 80, 80, ${alpha})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(sx - 2, sy + 20);
      ctx.lineTo(sx + 26, sy);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  ctx.restore();

  // Velocity indicator — 1-3 stacked chevrons showing momentum direction & strength
  if (player.alive && ['GAMEPLAY', 'MID_BOSS_FIGHT', 'BOSS_FIGHT', 'TUNNEL_GAUNTLET'].includes(gameState)) {
    const speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
    if (speed > 0.3) {
      const nx = player.vx / speed, ny = player.vy / speed;
      const angle = Math.atan2(ny, nx);
      // 1 chevron at low speed, 2 at medium, 3 at high
      const chevrons = speed < 2 ? 1 : speed < 4 ? 2 : 3;
      const baseAlpha = Math.min(0.6, (speed - 0.3) / 3);
      ctx.save();
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 4;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      for (let c = 0; c < chevrons; c++) {
        const dist = 25 + c * 10;
        const cx = player.x + nx * dist;
        const cy = player.y + ny * dist;
        // Each successive chevron is slightly more transparent
        const a = baseAlpha * (1 - c * 0.25);
        ctx.strokeStyle = `rgba(0, 240, 255, ${a.toFixed(2)})`;
        ctx.beginPath();
        ctx.moveTo(cx - Math.cos(angle - 0.6) * 7, cy - Math.sin(angle - 0.6) * 7);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx - Math.cos(angle + 0.6) * 7, cy - Math.sin(angle + 0.6) * 7);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

// --- Desktop mouse icon ---
function drawMouseBody(cx, cy, scale, leftPressed, rightPressed) {
  const s = scale;
  ctx.fillStyle = 'rgba(180, 180, 200, 0.15)';
  ctx.strokeStyle = 'rgba(200, 200, 220, 0.5)';
  ctx.lineWidth = 1.5 * s;
  ctx.beginPath();
  ctx.roundRect(cx - 18 * s, cy - 28 * s, 36 * s, 56 * s, 12 * s);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = 'rgba(200, 200, 220, 0.3)';
  ctx.lineWidth = 1 * s;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 28 * s);
  ctx.lineTo(cx, cy - 4 * s);
  ctx.stroke();

  ctx.fillStyle = leftPressed ? 'rgba(0, 240, 255, 0.5)' : 'rgba(200, 200, 220, 0.08)';
  ctx.shadowColor = leftPressed ? '#00f0ff' : 'transparent';
  ctx.shadowBlur = leftPressed ? 10 : 0;
  ctx.beginPath();
  ctx.roundRect(cx - 16 * s, cy - 26 * s, 15 * s, 20 * s, [8 * s, 0, 0, 0]);
  ctx.fill();

  ctx.fillStyle = rightPressed ? 'rgba(200, 60, 255, 0.5)' : 'rgba(200, 200, 220, 0.08)';
  ctx.shadowColor = rightPressed ? '#cc44ff' : 'transparent';
  ctx.shadowBlur = rightPressed ? 10 : 0;
  ctx.beginPath();
  ctx.roundRect(cx + 1 * s, cy - 26 * s, 15 * s, 20 * s, [0, 8 * s, 0, 0]);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(200, 200, 220, 0.3)';
  ctx.beginPath();
  ctx.roundRect(cx - 2.5 * s, cy - 22 * s, 5 * s, 8 * s, 2 * s);
  ctx.fill();
}

// --- Mobile: radiant touch circles ---
function drawTouchRadiance(cx, cy, f, tapped, color) {
  const ringCount = 3;
  for (let i = 0; i < ringCount; i++) {
    const phase = ((f * 0.03 + i * 0.33) % 1);
    const radius = 12 + phase * 35;
    const a = (1 - phase) * (tapped ? 0.6 : 0.2);
    ctx.strokeStyle = `rgba(${color}, ${a.toFixed(2)})`;
    ctx.shadowColor = `rgba(${color}, 0.4)`;
    ctx.shadowBlur = tapped ? 12 : 4;
    ctx.lineWidth = tapped ? 2.5 * (1 - phase) : 1.5 * (1 - phase);
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Center dot
  ctx.fillStyle = `rgba(${color}, ${tapped ? 0.7 : 0.3})`;
  ctx.shadowBlur = tapped ? 10 : 0;
  ctx.beginPath();
  ctx.arc(cx, cy, tapped ? 6 : 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawAutofireFlash() {
  if (!autofireFlash.active) return;
  autofireFlash.frame++;
  if (autofireFlash.frame > autofireFlash.duration) {
    autofireFlash.active = false;
    // Chain into the mouse/touch tutorial
    mouseTutorial.active = true;
    mouseTutorial.frame = 0;
    mouseTutorial.shown = true;
    return;
  }

  const f = autofireFlash.frame;
  const cx = CONFIG.width / 2, cy = CONFIG.height * 0.3;

  // Sharp punch-in, hold, then fade
  const punchIn = Math.min(1, f / 8); // fast snap in
  const holdEnd = autofireFlash.duration - 30;
  const fadeOut = f > holdEnd ? 1 - (f - holdEnd) / 30 : 1;
  const alpha = punchIn * fadeOut;
  if (alpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = alpha;

  // Expanding reticle ring on punch-in
  const ringRadius = 30 + (1 - punchIn) * 60;
  const ringAlpha = punchIn * fadeOut * 0.4;
  ctx.strokeStyle = `rgba(160, 255, 0, ${ringAlpha.toFixed(2)})`;
  ctx.shadowColor = '#a0ff00';
  ctx.shadowBlur = 15;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
  ctx.stroke();

  // Crosshair ticks around the ring
  const tickLen = 8;
  for (let i = 0; i < 4; i++) {
    const angle = (i * Math.PI / 2) + f * 0.01;
    const inner = ringRadius - tickLen;
    const outer = ringRadius + tickLen;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
    ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
    ctx.stroke();
  }

  // Pulsing center dot
  const dotPulse = 3 + Math.sin(f * 0.2) * 1.5;
  ctx.fillStyle = `rgba(160, 255, 0, ${(0.6 * alpha).toFixed(2)})`;
  ctx.beginPath();
  ctx.arc(cx, cy, dotPulse, 0, Math.PI * 2);
  ctx.fill();

  // "AUTOFIRE ENABLED" text — distinct blocky style
  ctx.shadowColor = '#a0ff00';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#a0ff00';
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'center';
  ctx.letterSpacing = '4px';
  ctx.fillText('A U T O F I R E', cx, cy + 55);
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = 'rgba(160, 255, 0, 0.7)';
  ctx.shadowBlur = 10;
  ctx.fillText('E N A B L E D', cx, cy + 75);

  // Horizontal scan line sweep across the text area
  const sweepY = cy + 40 + (f % 50) * 0.8;
  ctx.strokeStyle = `rgba(160, 255, 0, ${(0.15 * alpha).toFixed(2)})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 120, sweepY);
  ctx.lineTo(cx + 120, sweepY);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawMouseTutorial() {
  if (!mouseTutorial.active) return;
  mouseTutorial.frame++;
  if (mouseTutorial.frame > mouseTutorial.duration) {
    mouseTutorial.active = false;
    return;
  }

  const f = mouseTutorial.frame;
  const fadeIn = Math.min(1, f / 30);
  const fadeOut = Math.min(1, (mouseTutorial.duration - f) / 40);
  const alpha = fadeIn * fadeOut;
  if (alpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = alpha;

  // --- "HOW TO MOVE" neon header — bright and eye-catching ---
  {
    const hx = isMobile ? CONFIG.width * 0.7 : CONFIG.width * 0.75;
    const hy = (isMobile ? CONFIG.height * 0.3 : CONFIG.height * 0.28) - 55;
    const neonPulse = 0.6 + 0.4 * Math.sin(f * 0.18);
    const flicker = Math.random() > 0.9 ? 0.3 : 1;
    ctx.save();
    ctx.globalAlpha = alpha * neonPulse * flicker;
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    // Triple-pass neon: wide glow → medium glow → crisp text
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 35 * neonPulse;
    ctx.fillStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.fillText('HOW TO MOVE', hx, hy);
    ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(100, 255, 255, 0.7)';
    ctx.fillText('HOW TO MOVE', hx, hy);
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('HOW TO MOVE', hx, hy);
    // Underline glow bar
    const barW = 110;
    const barPulse = 0.5 + 0.5 * Math.sin(f * 0.12 + 1);
    ctx.shadowBlur = 10 * barPulse;
    ctx.shadowColor = '#00f0ff';
    ctx.strokeStyle = `rgba(0, 240, 255, ${(0.3 * barPulse).toFixed(2)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(hx - barW, hy + 6);
    ctx.lineTo(hx + barW, hy + 6);
    ctx.stroke();
    ctx.restore();
  }

  if (isMobile) {
    // --- Mobile: tap then drag with radiant circles ---
    const cx = CONFIG.width * 0.7;
    const cy = CONFIG.height * 0.3;
    // Phases: 0-80 tap, 80-240 drag, 240+ fade
    const phase = f < 80 ? 'tap' : f < 240 ? 'drag' : 'fade';
    const tapped = phase === 'tap' && Math.sin(f * 0.25) > 0;

    if (phase === 'drag') {
      // Inner circle bumps outward during drag
      const t = (f - 80) / 160;
      const dragX = Math.sin(t * Math.PI * 2) * 35;
      const dragY = Math.cos(t * Math.PI * 3) * 20;
      // Trail
      for (let i = 6; i >= 0; i--) {
        const tt = t - i * 0.018;
        if (tt < 0) break;
        const tx = cx + Math.sin(tt * Math.PI * 2) * 35;
        const ty = cy + Math.cos(tt * Math.PI * 3) * 20;
        const ta = (1 - i / 7) * 0.3;
        ctx.fillStyle = `rgba(0, 240, 255, ${ta.toFixed(2)})`;
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 3;
        ctx.beginPath();
        ctx.arc(tx, ty, 3 - i * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      // Inner radiance at drag position
      drawTouchRadiance(cx + dragX, cy + dragY, f, true, '0, 240, 255');
    } else {
      drawTouchRadiance(cx, cy, f, tapped, '0, 240, 255');
    }
    // Spark burst helper for mobile
    function drawMobileSparkBurst(bx, by, startFrame, duration) {
      if (f < startFrame || f >= startFrame + duration) return;
      const sparkAge = (f - startFrame) / duration;
      const sparkColors = ['#ffffff', '#ffee88', '#00f0ff', '#44ddff'];
      const sparkCount = 14;
      for (let s = 0; s < sparkCount; s++) {
        const angle = (s / sparkCount) * Math.PI * 2 + s * 0.618;
        const speed = 1.2 + (s % 3) * 0.7;
        const dist = sparkAge * speed * 35;
        const sparkLife = Math.max(0, 1 - sparkAge * (0.8 + (s % 4) * 0.07));
        if (sparkLife <= 0) continue;
        const sx = bx + Math.cos(angle) * dist;
        const sy = by + Math.sin(angle) * dist;
        const color = sparkColors[s % sparkColors.length];
        const size = (2 + (s % 3)) * sparkLife;
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha * sparkLife * 0.9;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8 * sparkLife;
        ctx.beginPath();
        ctx.arc(sx, sy, size, 0, Math.PI * 2);
        ctx.fill();
      }
      if (f < startFrame + 8) {
        const flashAlpha = (1 - (f - startFrame) / 8) * 0.7;
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = alpha * flashAlpha;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(bx, by, 10 * (1 - (f - startFrame) / 8), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = 0;
    }
    // Spark 1: on first tap
    drawMobileSparkBurst(cx, cy, 10, 35);
    // Spark 2: at drag start
    drawMobileSparkBurst(cx, cy, 80, 35);

    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    if (phase === 'tap') {
      ctx.fillText('TAP + HOLD', cx, cy + 55);
    } else if (phase === 'drag') {
      ctx.fillText('DRAG TO STEER', cx, cy + 55);
    }
    ctx.shadowBlur = 0;

  } else {
    // --- Desktop: mouse icon in upper-right quadrant ---
    const cx = CONFIG.width * 0.75;
    const cy = CONFIG.height * 0.28;
    const scale = 1.2;

    // Phase: first click at f=10 triggers big spark, then hold, then drag
    const phase = f < 60 ? 'click' : f < 90 ? 'hold' : f < 240 ? 'drag' : 'fade';
    const leftPressed = phase === 'click' ? Math.sin(f * 0.3) > 0 : phase !== 'fade';

    let dragOffX = 0, dragOffY = 0;
    const trail = [];
    if (phase === 'drag') {
      const t = (f - 90) / 150;
      dragOffX = Math.sin(t * Math.PI * 2) * 40;
      dragOffY = Math.sin(t * Math.PI * 4) * 20;
      for (let i = 0; i < 8; i++) {
        const tt = t - i * 0.015;
        if (tt < 0) break;
        trail.push({
          x: cx + Math.sin(tt * Math.PI * 2) * 40,
          y: cy + Math.sin(tt * Math.PI * 4) * 20,
          alpha: 1 - i / 8
        });
      }
    }

    for (let i = trail.length - 1; i >= 0; i--) {
      const tp = trail[i];
      ctx.fillStyle = `rgba(0, 240, 255, ${(tp.alpha * 0.3).toFixed(2)})`;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, 3 - i * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    drawMouseBody(cx + dragOffX, cy + dragOffY, scale, leftPressed, false);

    // Spark burst helper — draws radiating particles centered at (bx, by)
    function drawSparkBurst(bx, by, startFrame, duration) {
      if (f < startFrame || f >= startFrame + duration) return;
      const sparkAge = (f - startFrame) / duration;
      const sparkColors = ['#ffffff', '#ffee88', '#00f0ff', '#44ddff'];
      const sparkCount = 16;
      for (let s = 0; s < sparkCount; s++) {
        const angle = (s / sparkCount) * Math.PI * 2 + s * 0.618;
        const speed = 1.5 + (s % 3) * 0.8;
        const dist = sparkAge * speed * 40;
        const sparkLife = Math.max(0, 1 - sparkAge * (0.8 + (s % 4) * 0.07));
        if (sparkLife <= 0) continue;
        const sx = bx + Math.cos(angle) * dist;
        const sy = by + Math.sin(angle) * dist;
        const color = sparkColors[s % sparkColors.length];
        const size = (2.5 + (s % 3)) * sparkLife;
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha * sparkLife * 0.9;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10 * sparkLife;
        ctx.beginPath();
        ctx.arc(sx, sy, size, 0, Math.PI * 2);
        ctx.fill();
      }
      if (f < startFrame + 8) {
        const flashAlpha = (1 - (f - startFrame) / 8) * 0.7;
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = alpha * flashAlpha;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(bx, by, 12 * (1 - (f - startFrame) / 8), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = 0;
    }
    // Spark 1: on first click press
    drawSparkBurst(cx, cy - 16, 10, 35);
    // Spark 2: at drag start
    drawSparkBurst(cx, cy - 16, 90, 35);


    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    if (phase === 'click') {
      ctx.fillText('CLICK + HOLD', cx, cy + 55);
    } else if (phase === 'hold' || phase === 'drag') {
      ctx.fillText('DRAG TO STEER', cx + dragOffX, cy + dragOffY + 55);
    }
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function drawSecondaryTutorial() {
  if (!secondaryTutorial.active) return;
  secondaryTutorial.frame++;
  if (secondaryTutorial.frame > secondaryTutorial.duration) {
    secondaryTutorial.active = false;
    return;
  }

  const f = secondaryTutorial.frame;
  const fadeIn = Math.min(1, f / 30);
  const fadeOut = Math.min(1, (secondaryTutorial.duration - f) / 40);
  const alpha = fadeIn * fadeOut;
  if (alpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = alpha;

  const cx = isMobile ? CONFIG.width * 0.7 : CONFIG.width * 0.75;
  const cy = isMobile ? CONFIG.height * 0.3 : CONFIG.height * 0.28;

  // --- Neon "SECONDARY WEAPON" header ---
  {
    const hy = cy - 55;
    const neonPulse = 0.6 + 0.4 * Math.sin(f * 0.18);
    const flicker = Math.random() > 0.9 ? 0.3 : 1;
    ctx.save();
    ctx.globalAlpha = alpha * neonPulse * flicker;
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#cc44ff';
    ctx.shadowBlur = 30 * neonPulse;
    ctx.fillStyle = 'rgba(200, 60, 255, 0.4)';
    ctx.fillText('DEPLOY WEAPON', cx, hy);
    ctx.shadowBlur = 14;
    ctx.fillStyle = 'rgba(220, 140, 255, 0.7)';
    ctx.fillText('DEPLOY WEAPON', cx, hy);
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('DEPLOY WEAPON', cx, hy);
    ctx.restore();
    ctx.globalAlpha = alpha;
  }

  if (isMobile) {
    // Two-finger tap radiance
    const tapped = Math.sin(f * 0.15) > 0;
    drawTouchRadiance(cx - 20, cy, f, tapped, '200, 60, 255');
    drawTouchRadiance(cx + 20, cy, f, tapped, '200, 60, 255');

    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#cc44ff';
    ctx.shadowColor = '#cc44ff';
    ctx.shadowBlur = 12;
    ctx.fillText('TWO-FINGER TAP', cx, cy + 55);
  } else {
    const rightPressed = Math.sin(f * 0.15) > 0;
    drawMouseBody(cx, cy, 1.2, false, rightPressed);

    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#cc44ff';
    ctx.shadowColor = '#cc44ff';
    ctx.shadowBlur = 12;
    ctx.fillText('RIGHT-CLICK TO DEPLOY', cx, cy + 55);
  }

  ctx.shadowBlur = 0;
  ctx.restore();
}

// === SCREENS ===
function drawTitleScreen() {
  drawBackground();

  const cx = CONFIG.width / 2;
  const cy = CONFIG.height / 2 - 30;
  const t = frame * 0.02;
  const pulse = Math.sin(t * 2) * 0.5 + 0.5;
  const slowPulse = Math.sin(t * 0.7) * 0.5 + 0.5;

  ctx.save();

  // Radial light burst behind title
  const burstGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, 280);
  burstGrad.addColorStop(0, `rgba(0, 240, 255, ${0.08 + slowPulse * 0.06})`);
  burstGrad.addColorStop(0.4, `rgba(0, 120, 255, ${0.04 + slowPulse * 0.03})`);
  burstGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = burstGrad;
  ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

  // === DIAGNOSTICS HUD FRAME ===
  const scanAlpha = 0.15 + pulse * 0.1;
  const diagColor = `rgba(0, 240, 255, ${scanAlpha})`;
  const diagColorDim = `rgba(0, 180, 255, ${scanAlpha * 0.5})`;
  ctx.strokeStyle = diagColor;
  ctx.lineWidth = 1;
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 4;

  // Targeting corners — top-left, top-right, bottom-left, bottom-right
  const tl = { x: cx - 255, y: cy - 100 };
  const br = { x: cx + 255, y: cy + 95 };
  const cLen = 30;
  // TL
  ctx.beginPath();
  ctx.moveTo(tl.x + cLen, tl.y); ctx.lineTo(tl.x, tl.y); ctx.lineTo(tl.x, tl.y + cLen);
  ctx.stroke();
  // TR
  ctx.beginPath();
  ctx.moveTo(br.x - cLen, tl.y); ctx.lineTo(br.x, tl.y); ctx.lineTo(br.x, tl.y + cLen);
  ctx.stroke();
  // BL
  ctx.beginPath();
  ctx.moveTo(tl.x + cLen, br.y); ctx.lineTo(tl.x, br.y); ctx.lineTo(tl.x, br.y - cLen);
  ctx.stroke();
  // BR
  ctx.beginPath();
  ctx.moveTo(br.x - cLen, br.y); ctx.lineTo(br.x, br.y); ctx.lineTo(br.x, br.y - cLen);
  ctx.stroke();

  // Horizontal sweep line — scans down through the title area
  const sweepCycle = (frame % 180) / 180; // 0→1 over 3 seconds
  const sweepY = tl.y + sweepCycle * (br.y - tl.y);
  const sweepAlpha = Math.sin(sweepCycle * Math.PI) * 0.35;
  ctx.strokeStyle = `rgba(0, 240, 255, ${sweepAlpha})`;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(tl.x + 5, sweepY);
  ctx.lineTo(br.x - 5, sweepY);
  ctx.stroke();
  // Faint glow band at sweep line
  const sweepGrad = ctx.createLinearGradient(0, sweepY - 12, 0, sweepY + 12);
  sweepGrad.addColorStop(0, 'rgba(0,240,255,0)');
  sweepGrad.addColorStop(0.5, `rgba(0,240,255,${sweepAlpha * 0.3})`);
  sweepGrad.addColorStop(1, 'rgba(0,240,255,0)');
  ctx.fillStyle = sweepGrad;
  ctx.fillRect(tl.x, sweepY - 12, br.x - tl.x, 24);

  // Diagnostic micro-text — system readout along left edge
  ctx.shadowBlur = 0;
  ctx.font = '8px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = diagColorDim;
  const diagLines = ['SYS.BOOT', 'NAV_LOCK', 'WPN.RDY', 'SHLD.OK', 'FTL:STANDBY'];
  for (let d = 0; d < diagLines.length; d++) {
    const dy = tl.y + 14 + d * 11;
    // Staggered reveal based on frame
    if (frame > 30 + d * 12) {
      ctx.fillText(diagLines[d], tl.x + 6, dy);
      // Status pip
      ctx.fillStyle = d < 4 ? `rgba(0, 255, 120, ${scanAlpha})` : `rgba(255, 200, 0, ${scanAlpha})`;
      ctx.fillRect(tl.x + 58, dy - 5, 4, 4);
      ctx.fillStyle = diagColorDim;
    }
  }

  // Signal strength bars — right edge
  ctx.textAlign = 'right';
  ctx.fillText('SIG', br.x - 6, tl.y + 14);
  for (let b = 0; b < 5; b++) {
    const bh = 4 + b * 2;
    const bx = br.x - 40 + b * 7;
    const by = tl.y + 24 + (14 - bh);
    const active = b < 3 + Math.floor(slowPulse * 2.5);
    ctx.fillStyle = active ? `rgba(0, 255, 120, ${scanAlpha})` : `rgba(60, 80, 100, ${scanAlpha})`;
    ctx.fillRect(bx, by, 5, bh);
  }

  // Coordinate readout — bottom right
  ctx.fillStyle = diagColorDim;
  ctx.textAlign = 'right';
  const coordX = (Math.sin(t * 0.3) * 42 + 127.4).toFixed(1);
  const coordY = (Math.cos(t * 0.5) * 18 + 63.2).toFixed(1);
  ctx.fillText(`${coordX}  ${coordY}`, br.x - 6, br.y - 6);

  ctx.textAlign = 'center';
  ctx.shadowBlur = 0;

  // "SPACE" — large, skewed italic, racing forward
  ctx.textAlign = 'center';

  // Apply a forward-lean skew transform for the title
  ctx.save();
  ctx.translate(cx, cy);
  ctx.transform(1, 0, -0.22, 1, 0, 0); // horizontal shear — italic lean
  ctx.translate(-cx, -cy);

  ctx.font = 'bold 68px monospace';

  // Multi-layer glow: outer blur
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 40 + pulse * 20;
  ctx.fillStyle = `rgba(0, 200, 255, ${0.25 + pulse * 0.15})`;
  ctx.fillText('S P A C E', cx, cy - 25);

  // Speed streak ghosts — trailing copies offset left with decreasing alpha
  ctx.shadowBlur = 0;
  for (let g = 3; g >= 1; g--) {
    ctx.fillStyle = `rgba(0, 180, 255, ${0.04 * g})`;
    ctx.fillText('S P A C E', cx - g * 8, cy - 25);
  }

  // Mid glow layer
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 18 + pulse * 8;
  ctx.fillStyle = `rgba(0, 240, 255, ${0.6 + pulse * 0.2})`;
  ctx.fillText('S P A C E', cx, cy - 25);

  // Core text — bright white-cyan
  ctx.shadowBlur = 6;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('S P A C E', cx, cy - 25);

  // "TOOTS" — same treatment
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 40 + pulse * 20;
  ctx.fillStyle = `rgba(0, 200, 255, ${0.25 + pulse * 0.15})`;
  ctx.fillText('T O O T S', cx, cy + 45);

  // Speed streak ghosts
  ctx.shadowBlur = 0;
  for (let g = 3; g >= 1; g--) {
    ctx.fillStyle = `rgba(0, 180, 255, ${0.04 * g})`;
    ctx.fillText('T O O T S', cx - g * 8, cy + 45);
  }

  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 18 + pulse * 8;
  ctx.fillStyle = `rgba(0, 240, 255, ${0.6 + pulse * 0.2})`;
  ctx.fillText('T O O T S', cx, cy + 45);

  ctx.shadowBlur = 6;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('T O O T S', cx, cy + 45);

  ctx.restore(); // pop the skew transform

  // "PRESS ENTER" — breathing fade
  ctx.shadowBlur = 0;
  const enterAlpha = 0.4 + Math.sin(frame * 0.06) * 0.4;
  ctx.font = '18px monospace';
  ctx.fillStyle = `rgba(224, 224, 255, ${enterAlpha})`;
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = enterAlpha * 10;
  ctx.fillText(isMobile ? 'TAP TO START' : 'CLICK TO START', cx, cy + 130);
  ctx.shadowBlur = 0;

  // Controls — dimmer, more compact
  ctx.font = '12px monospace';
  ctx.fillStyle = 'rgba(180, 180, 220, 0.35)';
  if (isMobile) {

// === LEVEL-UP CARD SYSTEM ===
let levelUpCards = [];        // array of upgrade keys to display
let levelUpSelection = 1;    // currently highlighted card (0, 1, or 2)
let levelUpAnimTimer = 0;    // entrance animation timer
let levelUpPrevState = '';   // state to return to after selection

const WEAPON_UPGRADES = new Set(['spread', 'fireRate', 'gravLock']);

function generateLevelUpCards() {
  const available = Object.keys(UPGRADES).filter(
    key => player.upgrades[key] < UPGRADES[key].maxTier
  );
  // Fisher-Yates shuffle
  for (let i = available.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [available[i], available[j]] = [available[j], available[i]];
  }
  let picks = available.slice(0, 3);
  // Guarantee at least one weapon upgrade in the choices
  if (picks.length > 1 && !picks.some(k => WEAPON_UPGRADES.has(k))) {
    const weapons = available.filter(k => WEAPON_UPGRADES.has(k));
    if (weapons.length > 0) {
      picks[Math.floor(Math.random() * picks.length)] = weapons[Math.floor(Math.random() * weapons.length)];
    }
  }
  levelUpCards = picks;
  levelUpSelection = levelUpCards.length > 1 ? 1 : 0;
  levelUpAnimTimer = 0;
}

function applyUpgrade(key) {
  player.upgrades[key]++;
  const tier = player.upgrades[key];
  switch (key) {
    case 'spread':
      if (tier <= 2) {
        // Tiers 1-2: add more bullets (weaponLevel 2 → 3)
        player.weaponLevel = tier + 1;
      } else {
        // Tiers 3-5: power upgrade — change color and multiply damage
        const POWER_COLORS = ['#ffcc00', '#ff8800', '#ff2266'];
        const POWER_GLOW   = ['rgba(255,204,0,0.2)', 'rgba(255,136,0,0.2)', 'rgba(255,34,102,0.2)'];
        const POWER_MULTS  = [1.2, 1.44, 1.73];
        const powerTier = tier - 3; // 0, 1, 2
        player.bulletPower = POWER_MULTS[powerTier];
        player.bulletColor = POWER_COLORS[powerTier];
        player.bulletGlow  = POWER_GLOW[powerTier];
      }
      break;
    case 'fireRate':
      player.fireRateOverride = UPGRADES.fireRate.values[tier];
      break;
    case 'gravLock':
      player.gravLock = UPGRADES.gravLock.values[tier];
      break;
    case 'xpMagnet':
      player.xpAttractRadius = UPGRADES.xpMagnet.values[tier];
      break;
    case 'boostDur':
      player.dodgeDuration = UPGRADES.boostDur.values[tier];
      break;
    case 'boostRecharge':
      player.dodgeCooldownBase = UPGRADES.boostRecharge.values[tier];
      break;
    case 'speed':
      player.maxVel = UPGRADES.speed.values[tier];
      break;
    case 'shieldRegen':
      player.shieldRechargeSeconds = UPGRADES.shieldRegen.values[tier];
      // First shield regen upgrade activates the shield
      if (tier === 1 && !player.shieldActive && player.shieldRechargeTimer === 0) {
        player.shieldActive = true;
        screenFlash = 8;
        spawnExplosion(player.x, player.y, 10, ['#ffffff', '#ffee88', '#ffcc44']);
      }
      break;
    case 'scoreMult':
      player.scoreMultBonus = UPGRADES.scoreMult.values[tier];
      break;
  }
}

function drawLevelUpScreen() {
  // Dark overlay
  ctx.save();
  const overlayAlpha = Math.min(0.7, levelUpAnimTimer / 20 * 0.7);
  ctx.fillStyle = `rgba(5, 5, 20, ${overlayAlpha})`;
  ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

  // Entrance animation
  const animPct = Math.min(1, levelUpAnimTimer / 20);
  const easeOut = 1 - Math.pow(1 - animPct, 3);

  // "LEVEL UP" title
  const titleAlpha = Math.min(1, animPct * 2);
  ctx.globalAlpha = titleAlpha;
  ctx.shadowColor = '#00ffee';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#00ffee';
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('L E V E L   U P', CONFIG.width / 2, 70 + (1 - easeOut) * 30);

  ctx.font = '14px monospace';
  ctx.fillStyle = '#88cccc';
  ctx.shadowBlur = 0;
  ctx.fillText('CHOOSE AN UPGRADE', CONFIG.width / 2, 100 + (1 - easeOut) * 30);

  // Cards
  const cardCount = levelUpCards.length;
  const cardW = 180;
  const cardH = 240;
  const gap = 24;
  const totalW = cardCount * cardW + (cardCount - 1) * gap;
  const startX = (CONFIG.width - totalW) / 2;
  const cardY = 140;

  for (let i = 0; i < cardCount; i++) {
    const key = levelUpCards[i];
    const upg = UPGRADES[key];
    const currentTier = player.upgrades[key];
    const selected = i === levelUpSelection;

    // Card slide-up with stagger
    const stagger = i * 4;
    const cardAnim = Math.min(1, Math.max(0, (levelUpAnimTimer - stagger) / 16));
    const cardEase = 1 - Math.pow(1 - cardAnim, 3);
    const cardX = startX + i * (cardW + gap);
    const drawY = cardY + (1 - cardEase) * 80;

    ctx.globalAlpha = cardEase;
    ctx.save();

    // Card background
    const bgAlpha = selected ? 0.25 : 0.12;
    ctx.fillStyle = `rgba(20, 20, 50, ${bgAlpha + 0.6})`;
    ctx.strokeStyle = selected ? upg.color : 'rgba(150, 150, 200, 0.3)';
    ctx.lineWidth = selected ? 2.5 : 1;
    if (selected) {
      ctx.shadowColor = upg.color;
      ctx.shadowBlur = 15 + Math.sin(frame * 0.08) * 5;
    }

    // Rounded rect
    const r = 10;
    ctx.beginPath();
    ctx.moveTo(cardX + r, drawY);
    ctx.lineTo(cardX + cardW - r, drawY);
    ctx.quadraticCurveTo(cardX + cardW, drawY, cardX + cardW, drawY + r);
    ctx.lineTo(cardX + cardW, drawY + cardH - r);
    ctx.quadraticCurveTo(cardX + cardW, drawY + cardH, cardX + cardW - r, drawY + cardH);
    ctx.lineTo(cardX + r, drawY + cardH);
    ctx.quadraticCurveTo(cardX, drawY + cardH, cardX, drawY + cardH - r);
    ctx.lineTo(cardX, drawY + r);
    ctx.quadraticCurveTo(cardX, drawY, cardX + r, drawY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    const cx = cardX + cardW / 2;

    // Icon
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = upg.color;
    ctx.shadowColor = upg.color;
    ctx.shadowBlur = selected ? 12 : 4;
    ctx.fillText(upg.icon, cx, drawY + 45);
    ctx.shadowBlur = 0;

    // Name
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(upg.name, cx, drawY + 85);

    // Description
    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(200, 200, 230, 0.7)';
    ctx.fillText(upg.desc, cx, drawY + 108);

    // Current → Next tier
    ctx.font = '13px monospace';
    if (currentTier === 0) {
      // No current tier — just show what you get
      ctx.fillStyle = upg.color;
      ctx.fillText(upg.tiers[0], cx, drawY + 145);
    } else {
      // Show current → next
      ctx.fillStyle = 'rgba(180,180,200,0.6)';
      ctx.fillText(upg.tiers[currentTier - 1], cx - 30, drawY + 145);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('→', cx, drawY + 145);
      ctx.fillStyle = upg.color;
      ctx.fillText(upg.tiers[currentTier], cx + 30, drawY + 145);
    }

    // Tier pips
    const pipY = drawY + 175;
    const pipGap = 14;
    const pipStart = cx - (upg.maxTier - 1) * pipGap / 2;
    for (let t = 0; t < upg.maxTier; t++) {
      const px = pipStart + t * pipGap;
      if (t < currentTier) {
        // Filled — already purchased
        ctx.fillStyle = upg.color;
      } else if (t === currentTier) {
        // Next tier — pulsing
        const pulse = 0.5 + Math.sin(frame * 0.1) * 0.5;
        ctx.fillStyle = selected ? upg.color : `rgba(150,150,200,${0.3 + pulse * 0.3})`;
      } else {
        ctx.fillStyle = 'rgba(100,100,140,0.3)';
      }
      ctx.beginPath();
      ctx.arc(px, pipY, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Selected indicator
    if (selected && animPct >= 1) {
      ctx.font = '12px monospace';
      ctx.fillStyle = upg.color;
      ctx.shadowColor = upg.color;
      ctx.shadowBlur = 8;
      const blink = Math.floor(frame / 30) % 2 === 0;
      if (blink) ctx.fillText(isMobile ? '▼ TAP ▼' : '▼ CLICK ▼', cx, drawY + cardH - 15);
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  // Controls hint
  ctx.globalAlpha = Math.min(1, animPct);
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(180,180,220,0.5)';
  ctx.shadowBlur = 0;
  ctx.fillText(isMobile ? 'TAP TO SELECT  ·  TAP AGAIN TO CONFIRM' : 'SCROLL SELECT  ·  CLICK / ENTER CONFIRM', CONFIG.width / 2, CONFIG.height - 40);

  ctx.restore();
}

function updateLevelUpInput() {
  levelUpAnimTimer++;
  if (levelUpAnimTimer < 22) return; // entrance animation still playing

  if ((keys['ArrowLeft'] || keys['KeyA']) && !keys._levelLeftHeld) {
    levelUpSelection = Math.max(0, levelUpSelection - 1);
    keys._levelLeftHeld = true;
  } else if (!keys['ArrowLeft'] && !keys['KeyA']) {
    keys._levelLeftHeld = false;
  }

  if ((keys['ArrowRight'] || keys['KeyD']) && !keys._levelRightHeld) {
    levelUpSelection = Math.min(levelUpCards.length - 1, levelUpSelection + 1);
    keys._levelRightHeld = true;
  } else if (!keys['ArrowRight'] && !keys['KeyD']) {
    keys._levelRightHeld = false;
  }

  if (keys['Enter'] && !keys._levelConfirmHeld) {
    applyUpgrade(levelUpCards[levelUpSelection]);
    player.pendingLevelUps--;
    keys._levelConfirmHeld = true;
    keys['Enter'] = false;
    keys['Space'] = false;
    screenFlash = 10;
    spawnExplosion(player.x, player.y, 12, [UPGRADES[levelUpCards[levelUpSelection]].color, '#ffffff']);

    // Check for more pending level-ups
    const allMaxed = Object.keys(UPGRADES).every(k => player.upgrades[k] >= UPGRADES[k].maxTier);
    if (player.pendingLevelUps > 0 && !allMaxed) {
      generateLevelUpCards();
    } else {
      player.pendingLevelUps = 0;
      gameState = levelUpPrevState;
    }
  } else if (!keys['Enter']) {
    keys._levelConfirmHeld = false;
  }
}

function checkPendingLevelUp() {
  if (player.pendingLevelUps <= 0) return;
  const allMaxed = Object.keys(UPGRADES).every(k => player.upgrades[k] >= UPGRADES[k].maxTier);
  if (allMaxed) { player.pendingLevelUps = 0; return; }
  levelUpPrevState = gameState;
  gameState = 'LEVEL_UP';
  generateLevelUpCards();
}
