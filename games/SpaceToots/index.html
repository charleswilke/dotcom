    if (e.rotSpeed !== undefined) e.rotation += e.rotSpeed;

    // Remove if off-screen (either side)
    if (e.x < -60 || e.x > CONFIG.width + 80) {
      swapRemove(enemies, i);
    }
  }
}

function fireAimedShot(enemy) {
  if (!player.alive) return;
  const dx = player.x - enemy.x;
  const dy = player.y - enemy.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  spawnEnemyBullet(
    enemy.x,
    enemy.y,
    (dx / dist) * CONFIG.enemyBulletSpeed,
    (dy / dist) * CONFIG.enemyBulletSpeed
  );
}

const ASTEROID_TYPES = new Set(['drone', 'charger', 'spawner']);

function drawAsteroidEnemy(e) {
  const triggered = e.type === 'charger' && e.triggered;
  // Ambient asteroids being sucked by the approaching Shepherd glow red
  const sucked = e.suctionPhase != null;
  const glowColor = triggered ? '#ff8844' : sucked ? '#ff4400' : CONFIG.colors.asteroid;
  const shadowBlur = triggered ? 16 : sucked ? 22 : 12;

  // Wiggle effect while caught in suction
  const wiggleX = e.suctionPhase === 'wiggling' ? Math.sin(e.frame * 1.3) * 5 : 0;
  const wiggleY = e.suctionPhase === 'wiggling' ? Math.cos(e.frame * 0.9) * 3 : 0;
  ctx.translate(e.x + wiggleX, e.y + wiggleY);
  ctx.rotate(e.rotation);

  drawAsteroidShape(e.verts, e.cracks, glowColor, shadowBlur);
}

function drawCraftEnemy(e) {
  ctx.shadowColor = CONFIG.colors.enemy;
  ctx.shadowBlur = 8;
  ctx.fillStyle = CONFIG.colors.enemy;

  switch (e.type) {
    case 'weaver': {
      // Double-delta interceptor, nose pointing left
      ctx.beginPath();
      ctx.moveTo(e.x - 18, e.y);
      ctx.lineTo(e.x - 8,  e.y - 5);
      ctx.lineTo(e.x + 2,  e.y - 5);
      ctx.lineTo(e.x + 6,  e.y - 16);   // outer wing tip
      ctx.lineTo(e.x + 12, e.y - 5);
      ctx.lineTo(e.x + 16, e.y - 9);    // tail fin
      ctx.lineTo(e.x + 16, e.y);
      ctx.lineTo(e.x + 16, e.y + 9);
      ctx.lineTo(e.x + 12, e.y + 5);
      ctx.lineTo(e.x + 6,  e.y + 16);
      ctx.lineTo(e.x + 2,  e.y + 5);
      ctx.lineTo(e.x - 8,  e.y + 5);
      ctx.closePath();
      ctx.fill();
      // Engine glows at rear
      ctx.shadowColor = '#ff6600';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(255,100,0,0.8)';
      ctx.beginPath();
      ctx.arc(e.x + 16, e.y - 5, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e.x + 16, e.y + 5, 2.5, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'turret': {
      const spread = 0.55;
      // Ghost plates — dim outline showing where plates will respawn
      ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const plate = e.armorPlates[i];
        if (plate.alive || plate.respawnTimer <= 0) continue;
        const progress = 1 - plate.respawnTimer / plate.respawnFrames;
        const alpha = 0.08 + progress * 0.22;
        ctx.strokeStyle = `rgba(255,0,170,${alpha.toFixed(2)})`;
        ctx.lineWidth = 6;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 15, e.bodyRotation + i * Math.PI / 2 - spread,
                                e.bodyRotation + i * Math.PI / 2 + spread);
        ctx.stroke();
      }
      // Active armor plates
      ctx.strokeStyle = CONFIG.colors.enemy;
      ctx.lineWidth = 6;
      ctx.shadowColor = CONFIG.colors.enemy;
      ctx.shadowBlur = 10;
      for (let i = 0; i < 4; i++) {
        if (!e.armorPlates[i].alive) continue;
        const a = e.bodyRotation + i * Math.PI / 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 15, a - spread, a + spread);
        ctx.stroke();
      }
      // Center sphere — pulses and goes white-hot when fully exposed
      const exposed = e.armorPlates.every(p => !p.alive);
      const pulse = Math.sin(e.frame * 0.28);
      const coreRadius = exposed ? 6 + pulse * 3.5 : 6;
      const coreColor  = exposed ? '#ffffff' : CONFIG.colors.enemy;
      const coreGlow   = exposed ? 14 + pulse * 10 : 8;
      ctx.fillStyle = coreColor;
      ctx.shadowColor = coreColor;
      ctx.shadowBlur = coreGlow;
      ctx.beginPath();
      ctx.arc(e.x, e.y, coreRadius, 0, Math.PI * 2);
      ctx.fill();
      // Barrel — independently tracks player
      if (player.alive) {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        ctx.strokeStyle = CONFIG.colors.enemy;
        ctx.lineWidth = 4;
        ctx.lineCap = 'square';
        ctx.shadowColor = CONFIG.colors.enemy;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(e.x + Math.cos(angle) * 6, e.y + Math.sin(angle) * 6);
        ctx.lineTo(e.x + Math.cos(angle) * 24, e.y + Math.sin(angle) * 24);
        ctx.stroke();
      }
      break;
    }

    case 'gravwell': {
      const pulse = Math.sin(e.frame * 0.07) * 0.5 + 0.5;
      const energyFrac = e.energy / e.maxEnergy;
      // Pulse faster as energy builds
      const chargePulse = Math.sin(e.frame * (0.07 + energyFrac * 0.18)) * 0.5 + 0.5;

      // Tractor beams to each alive orbiting asteroid
      ctx.setLineDash([5, 6]);
      ctx.lineWidth = 1;
      for (const oa of e.orbitingAsteroids) {
        if (!oa.alive) continue;
        const wx = e.x + Math.cos(oa.angle) * oa.orbitRadius;
        const wy = e.y + Math.sin(oa.angle) * oa.orbitRadius;
        ctx.strokeStyle = `rgba(160, 80, 255, ${0.18 + pulse * 0.18})`;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(wx, wy);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Gravity pulse rings
      ctx.strokeStyle = `rgba(160, 80, 255, ${0.15 + pulse * 0.25})`;
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 30 + pulse * 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(160, 80, 255, ${0.08 + pulse * 0.12})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 50 + pulse * 8, 0, Math.PI * 2);
      ctx.stroke();

      // Energy charge ring — glows when near nova
      if (energyFrac > 0) {
        ctx.strokeStyle = `rgba(255, ${Math.floor(100 + (1-energyFrac)*100)}, 255, ${0.15 + energyFrac * 0.5})`;
        ctx.lineWidth = 1.5 + energyFrac * 2;
        ctx.shadowColor = energyFrac > 0.6 ? '#ffaaff' : '#cc66ff';
        ctx.shadowBlur = 8 + energyFrac * 20;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 17 + chargePulse * (2 + energyFrac * 6), 0, Math.PI * 2);
        ctx.stroke();
      }

      // Warped scanlines — gravitational lensing effect
      const warpR = 84;
      ctx.shadowBlur = 0;
      for (let dy = -warpR; dy <= warpR; dy += 4) {
        const halfW = Math.sqrt(Math.max(0, warpR * warpR - dy * dy));
        if (halfW < 1) continue;
        const sy = e.y + dy;
        if (sy < 0 || sy > CONFIG.height) continue;
        const distFactor = 1 - (Math.abs(dy) / warpR);
        const bend = (18 + chargePulse * 10 + energyFrac * 12) * distFactor * distFactor;
        const ctrlY = sy - Math.sign(dy || 1) * bend;
        const alpha = (0.07 + distFactor * 0.10) * (1 + energyFrac * 0.8);
        const g = Math.floor(100 + (1 - energyFrac) * 80);
        ctx.strokeStyle = `rgba(180, ${g}, 255, ${Math.min(0.35, alpha).toFixed(2)})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(e.x - halfW, sy);
        ctx.quadraticCurveTo(e.x, ctrlY, e.x + halfW, sy);
        ctx.stroke();
      }

      // Outer hull ring
      ctx.strokeStyle = '#aa44ff';
      ctx.shadowColor = '#aa44ff';
      ctx.shadowBlur = 8 + pulse * 6;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 14, 0, Math.PI * 2);
      ctx.stroke();

      // Hull struts (4 arms)
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = e.frame * 0.012 + i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(e.x + Math.cos(a) * 7, e.y + Math.sin(a) * 7);
        ctx.lineTo(e.x + Math.cos(a) * 14, e.y + Math.sin(a) * 14);
        ctx.stroke();
      }

      // Dark core fill
      ctx.fillStyle = '#110022';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 12, 0, Math.PI * 2);
      ctx.fill();

      // Energy-charged core — swells and shifts color toward white-hot
      const coreR = 5 + energyFrac * 14 + chargePulse * (2 + energyFrac * 3);
      const rr = Math.floor(200 + energyFrac * 55);
      const rg = Math.floor(120 - energyFrac * 60);
      const rb = 255;
      const coreAlpha = 0.5 + chargePulse * 0.5;
      ctx.fillStyle = `rgba(${rr}, ${rg}, ${rb}, ${coreAlpha})`;
      ctx.shadowColor = energyFrac > 0.5 ? '#ffaaff' : '#cc66ff';
      ctx.shadowBlur = 14 + energyFrac * 22 + chargePulse * (10 + energyFrac * 8);
      ctx.beginPath();
      ctx.arc(e.x, e.y, coreR, 0, Math.PI * 2);
      ctx.fill();
      // White-hot inner flare at high energy
      if (energyFrac > 0.5) {
        ctx.fillStyle = `rgba(255, 255, 255, ${(energyFrac - 0.5) * 2 * chargePulse})`;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(e.x, e.y, coreR * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }

      // Orbiting asteroids
      for (const oa of e.orbitingAsteroids) {
        if (!oa.alive) continue;
        const wx = e.x + Math.cos(oa.angle) * oa.orbitRadius;
        const wy = e.y + Math.sin(oa.angle) * oa.orbitRadius;
        ctx.save();
        ctx.translate(wx, wy);
        ctx.rotate(oa.rotation);
        drawAsteroidShape(oa.verts, oa.cracks, '#aaeeff', 10);
        ctx.restore();
      }
      break;
    }

    case 'bomber': {
      // Heavy fuselage with swept wings (tighter vertical span)
      ctx.beginPath();
      ctx.moveTo(e.x - 18, e.y);         // nose
      ctx.lineTo(e.x - 8,  e.y - 5);     // upper fuselage
      ctx.lineTo(e.x + 4,  e.y - 5);     // wing root upper
      ctx.lineTo(e.x + 8,  e.y - 13);    // wing tip upper
      ctx.lineTo(e.x + 18, e.y - 7);     // trailing wing upper
      ctx.lineTo(e.x + 20, e.y);         // tail
      ctx.lineTo(e.x + 18, e.y + 7);     // trailing wing lower
      ctx.lineTo(e.x + 8,  e.y + 13);    // wing tip lower
      ctx.lineTo(e.x + 4,  e.y + 5);     // wing root lower
      ctx.lineTo(e.x - 8,  e.y + 5);     // lower fuselage
      ctx.closePath();
      ctx.fill();
      // Bomb bay slit
      ctx.fillStyle = '#0a0a1a';
      ctx.shadowBlur = 0;
      ctx.fillRect(e.x - 6, e.y - 2, 14, 4);
      // Active bomb indicator
      ctx.fillStyle = CONFIG.colors.enemyBullet;
      ctx.shadowColor = CONFIG.colors.enemyBullet;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(e.x + 2, e.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
  }

  // Scanline overlay (weaver + bomber only — turret/gravwell are ring shapes, not filled bodies)
  if (e.type !== 'turret' && e.type !== 'gravwell') {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.shadowBlur = 0;
    const ex = e.x - e.width / 2;
    const ey = e.y - e.height / 2;
    for (let sy = ey; sy < ey + e.height; sy += 4) {
      ctx.fillRect(ex - 2, sy, e.width + 4, 2);
    }
  }
}

function drawEnemies() {
  ctx.save();
  for (const e of enemies) {
    ctx.save();
    if (ASTEROID_TYPES.has(e.type)) {
      drawAsteroidEnemy(e);
    } else {
      drawCraftEnemy(e);
    }
    // Hit flash — bright white glow burst around enemy on hit
    if (e.hitFlash > 0) {
      const flashAlpha = e.hitFlash / 5 * 0.6;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 25 * (e.hitFlash / 5);
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, Math.max(e.width, e.height) * 0.6, 0, Math.PI * 2);
      ctx.fill();
      e.hitFlash--;
    }
    ctx.restore();
  }
  ctx.restore();
}

// === PARTICLES / EXPLOSIONS ===
function spawnExplosion(x, y, count, colorSequence) {
  for (let i = 0; i < count && particles.length < CONFIG.maxParticles; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: Math.random() * 0.03 + 0.02,
      size: Math.random() * 4 + 2,
      colors: colorSequence
    });
  }
}

// Directional impact sparks — spray particles along bullet direction with spread
function spawnImpactSparks(x, y, bvx, bvy, count, colorSequence) {
  const bulletAngle = Math.atan2(bvy, bvx);
  for (let i = 0; i < count && particles.length < CONFIG.maxParticles; i++) {
    // Sparks fly forward (bullet dir) with a wide cone + some reverse splash
    const forward = Math.random() > 0.25;
    const spread = forward ? (Math.random() - 0.5) * Math.PI * 0.8 : Math.PI + (Math.random() - 0.5) * Math.PI * 0.5;
    const angle = bulletAngle + spread;
    const speed = forward ? Math.random() * 6 + 3 : Math.random() * 3 + 1;
    const isSpark = Math.random() < 0.4;
    particles.push({
      x: x + (Math.random() - 0.5) * 4,
      y: y + (Math.random() - 0.5) * 4,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: isSpark ? Math.random() * 0.04 + 0.05 : Math.random() * 0.03 + 0.02,
      size: isSpark ? Math.random() * 2 + 1 : Math.random() * 4 + 2,
      colors: colorSequence
    });
  }
}

// Quick bright flash at impact point
function spawnHitFlash(x, y, radius) {
  localFlashes.push({ x, y, radius, life: 1.0, fast: true });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.life -= p.decay;
    if (p.life <= 0) swapRemove(particles, i);
  }
}

function drawParticles() {
  ctx.save();
  // Disable shadow for small particles — massive perf win, minimal visual difference
  ctx.shadowBlur = 0;
  let lastColor = '';
  for (const p of particles) {
    const colors = p.colors;
    const idx = Math.min(Math.floor((1 - p.life) * colors.length), colors.length - 1);
    const color = colors[idx];
    if (color !== lastColor) {
      ctx.fillStyle = color;
      lastColor = color;
    }
    ctx.globalAlpha = p.life;

    // Small fast particles render as velocity streaks (sparks)
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (p.size <= 2.5 && speed > 2) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      const streakLen = Math.min(speed * 2.5, 12);
      ctx.fillRect(-streakLen / 2, -p.size / 2, streakLen, p.size);
      ctx.restore();
    } else {
      // Only apply glow to larger particles (size > 4)
      if (p.size > 4) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 6;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.shadowBlur = 0;
      } else {
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
    }
  }
  ctx.restore();
}

const explosionColors = ['#ffffff', '#00ffff', '#ff00aa', '#2a1040'];

// === PICKUPS ===
function spawnPickup(x, y, type) {
  pickups.push({ x, y, type, width: 20, height: 20, alive: true, frame: 0 });
}

function updatePickups() {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.x -= 1; // drift left
    p.frame++;
    if (p.x < -30) { swapRemove(pickups, i); continue; }

    // Collect on contact (circle-to-circle, generous)
    if (player.alive) {
      if (dist(p.x, p.y, player.x, player.y) < 30) {
        applyPickup(p);
        swapRemove(pickups, i);
      }
    }
  }
}

// Secondary weapon pickup metadata (color + icon for pickup diamond and HUD)
const SECONDARY_META = {
  homing:  { icon: '◎', color: '#dd44ff', glowColor: '#aa22cc' },
  wave:    { icon: '≋', color: '#44ff88', glowColor: '#22cc66' },
  spread:  { icon: '✺', color: '#ff8844', glowColor: '#cc6622' },
  shield:  { icon: '◇', color: '#44ddff', glowColor: '#22aacc' },
  laser:   { icon: '▸', color: '#ff4444', glowColor: '#cc2222' }
};

function applyPickup(p) {
  switch (p.type) {
    case 'life':
      player.lives++;
      break;
    case 'score':
      score += 1000;
      checkLevelUp();
      break;
    case 'speed': {
      const baseMaxVel = player.maxVel;
      player.maxVel = baseMaxVel + 2;
      scheduleAction(600, () => { player.maxVel = baseMaxVel; }); // 10 seconds at 60fps
      break;
    }
    case 'homing':
    case 'wave':
    case 'spread':
    case 'shield':
    case 'laser': {
      const wDef = CONFIG.weapons.secondary[p.type];
      player.secondary = p.type;
      player.secondaryAmmo = wDef.ammo || Math.round((wDef.duration || 10) * 60); // duration→frames for shield
      player.secondaryFlash = 90; // HUD flash timer for new pickup
      if (!secondaryTutorial.shown) {
        secondaryTutorial.active = true;
        secondaryTutorial.frame = 0;
        secondaryTutorial.shown = true;
      }
      break;
    }
  }
  // Pickup sparkle — use weapon color if secondary, gold otherwise
  const meta = SECONDARY_META[p.type];
  const colors = meta
    ? ['#ffffff', meta.color, meta.glowColor]
    : ['#ffd700', '#ffaa00', '#ffffff'];
  spawnExplosion(p.x, p.y, 8, colors);
}

function drawPickups() {
  ctx.save();
  for (const p of pickups) {
    const bob = Math.sin(p.frame * 0.1) * 3;
    const px = p.x;
    const py = p.y + bob;
    const meta = SECONDARY_META[p.type];
    const color = meta ? meta.color : CONFIG.colors.pickup;

    ctx.shadowColor = color;
    ctx.shadowBlur = meta ? 14 : 10;
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    // Diamond outline
    ctx.beginPath();
    ctx.moveTo(px, py - 12);
    ctx.lineTo(px + 10, py);
    ctx.lineTo(px, py + 12);
    ctx.lineTo(px - 10, py);
    ctx.closePath();
    ctx.stroke();
    // Secondary pickups get a filled translucent diamond
    if (meta) {
      ctx.fillStyle = color.replace(')', ',0.2)').replace('rgb', 'rgba').replace('#', '');
      // Simple approach: just use low-alpha fill
      ctx.globalAlpha = 0.2;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Letter inside
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    const label = meta ? meta.icon : (p.type === 'life' ? '♦' : p.type === 'score' ? '★' : '⚡');
    ctx.fillText(label, px, py);
  }
  ctx.restore();
}

// === COLLISION DETECTION ===
function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function checkCollisions() {
  if (!player.alive) return;

  // Player hitbox (60% of visual)
  const phw = player.width * 0.6;
  const phh = player.height * 0.6;
  const phx = player.x - phw / 2;
  const phy = player.y - phh / 2;

  // Player bullets vs enemies
  for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
    const b = playerBullets[bi];
    let consumed = false;
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];

      if (e.type === 'gravwell') {
        const dx = b.x - e.x;
        const dy = b.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 13) {
          // Core hit — charge energy (scaled by bullet power)
          e.energy = Math.min(e.maxEnergy, e.energy + 20 * (b.damage || 1));
          player.shotsHit++;
          spawnExplosion(e.x, e.y, 6, ['#ffffff', '#dd88ff', '#aa44ff']);
          spawnImpactSparks(b.x, b.y, b.vx, b.vy, 6, ['#ffffff', '#dd88ff', '#aa44ff']);
          spawnHitFlash(e.x, e.y, 22);
          triggerScreenShake(2, 3);
          triggerHitStop(1);
          consumed = true;
          if (e.energy >= e.maxEnergy) {
            triggerGravNova(e, ei);
          }
          break;
        } else if (dist < 22) {
          // Struck the outer hull ring — deflect, no damage
          spawnExplosion(b.x, b.y, 3, ['#aa44ff', '#551188']);
          spawnImpactSparks(b.x, b.y, b.vx, b.vy, 5, ['#aa44ff', '#ffffff', '#551188']);
          consumed = true;
          break;
        }
        // Outside hull — bullet passes through (gravity already bent it)
        continue;
      } else if (e.type === 'turret') {
        // Angular collision — core kill, plate block, or gap pass-through
        const dx = b.x - e.x;
        const dy = b.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist <= 7) {
          // Direct core hit — instant kill
          destroyEnemy(e, ei);
          player.shotsHit++;
          consumed = true;
          break;
        }
        if (dist > 8 && dist < 22) {
          const bulletAngle = Math.atan2(dy, dx);
          const spread = 0.55;
          for (let pi = 0; pi < 4; pi++) {
            if (!e.armorPlates[pi].alive) continue;
            const plateAngle = e.bodyRotation + pi * Math.PI / 2;
            let diff = Math.abs(bulletAngle - plateAngle);
            if (diff > Math.PI) diff = Math.PI * 2 - diff;
            if (diff < spread) {
              e.armorPlates[pi].alive = false;
              e.armorPlates[pi].respawnTimer = e.armorPlates[pi].respawnFrames;
              player.shotsHit++;
              spawnExplosion(b.x, b.y, 10, ['#ffffff', '#ff00aa', '#440020']);
              spawnImpactSparks(b.x, b.y, b.vx, b.vy, 10, ['#ffffff', '#ff00aa', '#ff4400']);
              spawnHitFlash(b.x, b.y, 20);
              triggerScreenShake(2.5, 4);
              triggerHitStop(2);
              consumed = true;
              break;
            }
          }
        }
        // Bullet threaded the gap — let it continue past the turret
      } else {
        if (rectOverlap(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height,
                         e.x - e.width / 2, e.y - e.height / 2, e.width, e.height)) {
          e.hp -= (b.damage || 1);
          player.shotsHit++;
          if (e.hp <= 0) {
            destroyEnemy(e, ei);
            triggerScreenShake(3, 4);
            triggerHitStop(2);
          } else {
            spawnImpactSparks(b.x, b.y, b.vx, b.vy, 8, ['#ffffff', '#00ffff', CONFIG.colors.playerBullet]);
            spawnHitFlash(b.x, b.y, 18);
            e.hitFlash = 5;
            triggerScreenShake(1.5, 3);
            triggerHitStop(1);
          }
          consumed = true;
          break;
        }
      }

      if (consumed) break;
    }
    if (consumed) swapRemove(playerBullets, bi);
  }

  // Player bullets vs gravwell orbiting asteroids
  for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
    const b = playerBullets[bi];
    let consumed = false;
    for (const e of enemies) {
      if (e.type !== 'gravwell') continue;
      for (const oa of e.orbitingAsteroids) {
        if (!oa.alive) continue;
        const wx = e.x + Math.cos(oa.angle) * oa.orbitRadius;
        const wy = e.y + Math.sin(oa.angle) * oa.orbitRadius;
        if (dist(b.x, b.y, wx, wy) < 11) {
          oa.alive = false;
          oa.respawnTimer = oa.respawnFrames;
          player.shotsHit++;
          spawnExplosion(wx, wy, 8, ['#aaeeff', '#ffffff', '#336688']);
          spawnImpactSparks(wx, wy, b.vx, b.vy, 6, ['#ffffff', '#aaeeff']);
          spawnHitFlash(wx, wy, 14);
          triggerScreenShake(1.5, 3);
          triggerHitStop(1);
          consumed = true;
          break;
        }
      }
      if (consumed) break;
    }
    if (consumed) swapRemove(playerBullets, bi);
  }

  // Player bullets vs mid-boss orbiting asteroids
  if (midBoss && midBoss.alive) {
    for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
      const b = playerBullets[bi];
      let consumed = false;
      for (const oa of midBoss.orbitingAsteroids) {
        if (!oa.alive || oa.merging) continue;
        const wx = midBoss.x + Math.cos(oa.angle) * oa.orbitRadius;
        const wy = midBoss.y + Math.sin(oa.angle) * oa.orbitRadius;
        if (dist(b.x, b.y, wx, wy) < 13) {
          oa.alive = false; oa.respawnTimer = oa.respawnFrames;
          player.shotsHit++;
          spawnExplosion(wx, wy, 8, ['#aaeeff', '#ffffff', '#cc00ff']);
          spawnImpactSparks(wx, wy, b.vx, b.vy, 8, ['#ffffff', '#aaeeff', '#cc00ff']);
          spawnHitFlash(wx, wy, 16);
          triggerScreenShake(2, 3);
          triggerHitStop(1);
          consumed = true; break;
        }
      }
      if (consumed) { swapRemove(playerBullets, bi); continue; }
      // Hit mid-boss core
      if (dist(b.x, b.y, midBoss.x, midBoss.y) < 30 && midBoss.coreExposed) {
        midBoss.hp -= (b.damage || 1);
        midBoss.hitFlash = 12;
        player.shotsHit++;
        spawnExplosion(b.x, b.y, 4, ['#cc00ff', '#ffffff', '#ff3300']);
        spawnImpactSparks(b.x, b.y, b.vx, b.vy, 10, ['#ffffff', '#cc00ff', '#ff3300']);
        spawnHitFlash(b.x, b.y, 25);
        triggerScreenShake(3, 5);
        triggerHitStop(2);
        swapRemove(playerBullets, bi);
        if (midBoss.hp <= 0) destroyMidBoss();
      }
    }
  }

  // Player bullets vs boss
  if (boss && boss.alive) {
    for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
      const b = playerBullets[bi];
      if (rectOverlap(b.x - b.width/2, b.y - b.height/2, b.width, b.height,
                       boss.x - boss.hitW/2, boss.y - boss.hitH/2, boss.hitW, boss.hitH)) {
        // Only damage if core exposed
        if (boss.coreExposed) {
          boss.hp -= (b.damage || 1);
          player.shotsHit++;
          spawnExplosion(b.x, b.y, 4, ['#ffffff', '#ffff00', '#ff00aa']);
          spawnImpactSparks(b.x, b.y, b.vx, b.vy, 12, ['#ffffff', '#ffff00', '#ff00aa']);
          spawnHitFlash(b.x, b.y, 28);
          triggerScreenShake(3.5, 5);
          triggerHitStop(2);
        } else {
          spawnExplosion(b.x, b.y, 2, ['#666666', '#333333']);
          spawnImpactSparks(b.x, b.y, b.vx, b.vy, 5, ['#888888', '#444444']);
          triggerScreenShake(1, 2);
        }
        swapRemove(playerBullets, bi);

        if (boss.hp <= 0) {
          destroyBoss();
        }
        break;
      }
    }
  }

  // Dodge-break — while dodging, player smashes through enemy bodies
  if (player.dodgeTimer > 0) {
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (rectOverlap(phx, phy, phw, phh, e.x - e.width/2, e.y - e.height/2, e.width, e.height)) {
        spawnExplosion(e.x, e.y, 18, ['#ffffff', '#00ffff', '#ff00aa']);
        destroyEnemy(e, ei);
      }
    }
  }

  if (player.invincible > 0) return;

  // Enemy bullets vs player
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (rectOverlap(phx, phy, phw, phh, b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2)) {
      swapRemove(enemyBullets, i);
      killPlayer();
      return;
    }
  }

  // Enemy body vs player
  for (const e of enemies) {
    if (rectOverlap(phx, phy, phw, phh, e.x - e.width/2, e.y - e.height/2, e.width, e.height)) {
      killPlayer();
      return;
    }
  }

  // Mid-boss body vs player
  if (midBoss && midBoss.alive) {
    if (dist(player.x, player.y, midBoss.x, midBoss.y) < 32) { killPlayer(); return; }
  }

  // Boss body vs player
  if (boss && boss.alive) {
    if (rectOverlap(phx, phy, phw, phh, boss.x - boss.hitW/2, boss.y - boss.hitH/2, boss.hitW, boss.hitH)) {
      killPlayer();
      return;
    }
  }
}

// === SHOCKWAVES ===
const shockwaves = [];

function updateShockwaves() {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.radius += (s.maxRadius - s.radius) * 0.10 + 5;
    if (s.radius >= s.maxRadius) swapRemove(shockwaves, i);
  }
}

function drawShockwaves() {
  ctx.save();
  for (const s of shockwaves) {
    const progress = s.radius / s.maxRadius;
    const alpha = (1 - progress) * 0.85;
    ctx.strokeStyle = `rgba(230, 160, 255, ${alpha.toFixed(2)})`;
    ctx.lineWidth = 4 * (1 - progress) + 1;
    ctx.shadowColor = '#cc66ff';
    ctx.shadowBlur = 25 * (1 - progress);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.stroke();
    // Inner softer ring
    if (s.radius > 20) {
      ctx.strokeStyle = `rgba(255, 220, 255, ${(alpha * 0.4).toFixed(2)})`;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius * 0.7, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function triggerGravNova(e, index) {
  const x = e.x, y = e.y;
  const novaRadius = 170;

  // Remove the gravwell first so cascading destroyEnemy calls don't double-splice
  swapRemove(enemies, index);
  score += e.points;
  checkLevelUp();
  enemiesDestroyed++;

  // Massive central explosion
  spawnExplosion(x, y, 45, ['#ffffff', '#dd88ff', '#ff44ff', '#220044']);
  for (let i = 0; i < 5; i++) {
    scheduleAction(i * 6, () => {
      spawnExplosion(
        x + (Math.random() - 0.5) * 50,
        y + (Math.random() - 0.5) * 50,
        18, ['#ffffff', '#cc88ff', '#ff44ff']
      );
    });
  }

  spawnLocalFlash(x, y, 240);
  shockwaves.push({ x, y, radius: 10, maxRadius: novaRadius });

  // Shrapnel: fling all orbiting asteroids outward as projectiles
  for (const oa of e.orbitingAsteroids) {
    if (!oa.alive) continue;
    const wx = x + Math.cos(oa.angle) * oa.orbitRadius;
    const wy = y + Math.sin(oa.angle) * oa.orbitRadius;
    const angle = Math.atan2(wy - y, wx - x);
    enemyBullets.push({
      x: wx, y: wy,
      vx: Math.cos(angle) * 4.5,
      vy: Math.sin(angle) * 4.5,
      radius: 10, alive: true,
      verts: oa.verts, cracks: oa.cracks,
      rotation: oa.rotation, rotSpeed: oa.rotSpeed * 3
    });
  }

  // Area damage — destroy all enemies within nova radius
  for (let ei = enemies.length - 1; ei >= 0; ei--) {
    const other = enemies[ei];
    if (dist(other.x, other.y, x, y) < novaRadius) {
      destroyEnemy(other, ei);
    }
  }
}

function destroyEnemy(e, index) {
  const baseMultiplier = 1 + (player.xpLevel - 1) * 0.25;
  const multiplier = baseMultiplier * player.scoreMultBonus;
  score += Math.round(e.points * multiplier);
  checkLevelUp();
  enemiesDestroyed++;
  spawnExplosion(e.x, e.y, 12, explosionColors);
  if (e.type === 'weaver') playSFX('bomber-death', SFX_VOLUMES['bomber-death']);

  // XP orb — every enemy drops one; size/value proportional to enemy points
  spawnXPOrb(e.x, e.y, Math.max(1, Math.round(e.points / 50)));

  // Drop logic
  if (e.type === 'spawner') {
    // Release 3 drones
    for (let d = 0; d < 3; d++) {
      spawnEnemy('drone', e.x, e.y - 20 + d * 20, { speed: 3 });
    }
  }

  // Secondary weapon drops — bigger enemies drop weapons
  let dropped = false;
  if (e.type === 'charger' && Math.random() < 0.3) {
    spawnPickup(e.x, e.y, 'shield');
    dropped = true;
  } else if (e.type === 'bomber' && Math.random() < 0.35) {
    spawnPickup(e.x, e.y, 'wave');
    dropped = true;
  } else if (e.type === 'spawner' && Math.random() < 0.5) {
    const roll = Math.random();
    spawnPickup(e.x, e.y, roll < 0.4 ? 'homing' : roll < 0.7 ? 'laser' : 'spread');
    dropped = true;
  }

  // 10% chance score bonus (if no weapon dropped)
  if (!dropped && Math.random() < 0.1) {
    spawnPickup(e.x, e.y, 'score');
  }

  swapRemove(enemies, index);
}

function popShield() {
  player.shieldActive = false;
  player.shieldRechargeTimer = player.shieldRechargeSeconds * 60;
  // Shield burst — warm gold explosion ring
  spawnExplosion(player.x, player.y, 16, ['#ffffff', '#ffee88', '#ffaa00', '#442200']);
  shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: 55 });
}

function killPlayer() {
  if (player.invincible > 0) return;
  // Shield absorbs the hit
  if (player.shieldActive) {
    popShield();
    return;
  }
  player.alive = false;
  player.lives--;
  // Upgrades persist across lives — don't reset weaponLevel
  player.shieldActive = false;
  player.shieldRechargeTimer = 0;
  player.secondary = null;
  player.secondaryAmmo = 0;
  // Big death blast — multi-stage explosion
  spawnExplosion(player.x, player.y, 35, ['#ffffff', '#00ffff', '#ff00aa', '#ff4400']);
  spawnExplosion(player.x, player.y, 20, ['#ffffff', '#ffee88', '#ff6600']);
  triggerScreenShake(12, 20);
  triggerHitStop(6);
  screenFlash = 15;
  shockwaves.push({ x: player.x, y: player.y, radius: 8, maxRadius: 90 });
  // Delayed secondary blasts
  const px = player.x, py = player.y;
  for (let i = 1; i <= 3; i++) {
    scheduleAction(i * 7, () => {
      spawnExplosion(
        px + (Math.random() - 0.5) * 50,
        py + (Math.random() - 0.5) * 50,
        12, ['#ff4400', '#ff8800', '#ffcc44', '#ffffff']
      );
    });
  }

  if (player.lives <= 0) {
    gameState = 'GAME_OVER';
    stopMusic(3000);
  } else {
    player.respawnTimer = 90; // 1.5 seconds
  }
}

// === XP ORB SYSTEM ===
function spawnXPOrb(x, y, value) {
  if (xpOrbs.length > 80) return; // soft cap to prevent pile-ups
  const sides = 3 + Math.floor(Math.random() * 3); // 3, 4, or 5 sides
  xpOrbs.push({
    x, y,
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5) * 2,
    value,
    sides,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.07,
    pulseFrame: Math.floor(Math.random() * 60), // stagger pulse timing
    radius: 6 + value * 0.5
  });
}

function updateXPOrbs() {
  for (let i = xpOrbs.length - 1; i >= 0; i--) {
    const o = xpOrbs[i];

    o.x -= XP_ORB_DRIFT;
    if (o.x < -50) { swapRemove(xpOrbs, i); continue; }

    // Magnetic attraction — once locked, never let go
    if (player.alive) {
      const dx = player.x - o.x;
      const dy = player.y - o.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (!o.locked && dist < player.xpAttractRadius) {
        o.locked = true;
      }
      if (o.locked) {
        const nx = dx / dist;
        const ny = dy / dist;
        o.vx += nx * XP_ATTRACT_ACCEL;
        o.vy += ny * XP_ATTRACT_ACCEL;
      }
    }

    o.vx *= XP_ATTRACT_DRAG;
    o.vy *= XP_ATTRACT_DRAG;
    o.x += o.vx;
    o.y += o.vy;
    o.rotation += o.rotSpeed;
    o.pulseFrame++;

    // Collection on contact
    if (player.alive) {
      if (dist(player.x, player.y, o.x, o.y) < o.radius + 8) {
        collectXPOrb(o);
        swapRemove(xpOrbs, i);
      }
    }
  }
}

function collectXPOrb(o) {
  // Orbs add to score — one unified progression
  score += o.value * 50;
  playRandomXPPickup();
  spawnExplosion(o.x, o.y, 5, ['#ffffff', '#00ffee', '#88ffee']);
  checkLevelUp();
}

function checkLevelUp() {
  while (score >= player.nextLevelScore) {
    player.prevLevelScore = player.nextLevelScore;
    player.xpLevel++;
    player.nextLevelScore = Math.round(player.nextLevelScore * 1.5);
    player.pendingLevelUps++;
    screenFlash = 15;
    spawnExplosion(player.x, player.y, 20, ['#ffffff', '#00ffee', '#ffff44']);
  }
}

function drawXPOrbs() {
  ctx.save();
  for (const o of xpOrbs) {
    const pulse = 0.6 + Math.sin(o.pulseFrame * 0.09) * 0.4;

    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.rotation);

    // Outer glow stroke
    ctx.shadowColor = '#00ffee';
    ctx.shadowBlur  = 10 + pulse * 10;
    ctx.strokeStyle = `rgba(0, 255, 220, ${0.4 + pulse * 0.5})`;
    ctx.lineWidth   = 1.5;

    ctx.beginPath();
    for (let s = 0; s < o.sides; s++) {
      const angle = (s / o.sides) * Math.PI * 2;
      const r = o.radius * (1 + pulse * 0.15);
      s === 0 ? ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r)
              : ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
    }
    ctx.closePath();
    ctx.stroke();

    // Translucent fill
    ctx.shadowBlur  = 5;
    ctx.fillStyle   = `rgba(0, 220, 200, ${0.15 + pulse * 0.25})`;
    ctx.beginPath();
    for (let s = 0; s < o.sides; s++) {
      const angle = (s / o.sides) * Math.PI * 2;
      const r = o.radius * 0.6;
      s === 0 ? ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r)
              : ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
    }
    ctx.closePath();
    ctx.fill();

    // Hot white center dot
    ctx.shadowBlur  = 8;
    ctx.fillStyle   = `rgba(255, 255, 255, ${0.6 + pulse * 0.4})`;
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
  ctx.restore();
}

// === BOSS SYSTEM ===
let boss = null;

function spawnBoss(stageNum) {
  const cfg = CONFIG.bosses['stage' + stageNum];
  boss = {
    x: CONFIG.width + 60,
    y: CONFIG.height / 2,
    width: 80,
    height: 80,
    hitW: 70,
    hitH: 70,
    hp: stageNum === 1 ? 80 : stageNum === 2 ? 120 : 180,
    maxHp: stageNum === 1 ? 80 : stageNum === 2 ? 120 : 180,
    name: cfg.name,
    title: cfg.title,
    alive: true,
    phase: 1,
    frame: 0,
    coreExposed: false,
    attackTimer: 0,
    entered: false,
    stageNum,
    // Meteor slam: summons two asteroids that converge and fire as a merged projectile
    slamTimer: 480,
    slamState: 'idle',    // 'idle' | 'telegraphing' | 'converging'
    slamProgress: 0,
    slamAsteroids: []     // [{x,y,tx,ty,verts,rotation,rotSpeed}] — two phantom rocks
  };
}

function updateBoss() {
  if (!boss || !boss.alive) return;
  boss.frame++;

  // Entrance
  if (!boss.entered) {
    boss.x -= 1.5;
    if (boss.x <= CONFIG.width - 120) {
      boss.entered = true;
      boss.attackTimer = 60;
    }
    return;
  }

  // Gentle vertical hover
  boss.y = CONFIG.height / 2 + Math.sin(boss.frame * 0.02) * 60;

  // Phase check
  const hpPct = boss.hp / boss.maxHp;
  if (hpPct < 0.5 && boss.phase === 1) {
    boss.phase = 2;
    boss.attackTimer = 0;
    spawnExplosion(boss.x, boss.y, 15, ['#ffffff', '#ff00aa']);
  }

  // Attack pattern
  boss.attackTimer--;
  if (boss.attackTimer <= 0) {
    if (boss.phase === 1) {
      // Spiral shots
      boss.coreExposed = false;
      const shots = 12;
      for (let i = 0; i < shots; i++) {
        const angle = (boss.frame * 0.05) + (i / shots) * Math.PI * 2;
        spawnEnemyBullet(boss.x, boss.y,
          Math.cos(angle) * 3,
          Math.sin(angle) * 3
        );
      }
      boss.attackTimer = 40;
      // Core exposed between attacks
      scheduleAction(30, () => { if (boss) boss.coreExposed = true; });
      scheduleAction(90, () => { if (boss) boss.coreExposed = false; });
    } else {
      // Phase 2: faster spiral + ring bursts
      boss.coreExposed = false;
      const shots = 16;
      for (let i = 0; i < shots; i++) {
        const angle = (boss.frame * 0.08) + (i / shots) * Math.PI * 2;
        spawnEnemyBullet(boss.x, boss.y,
          Math.cos(angle) * 4,
          Math.sin(angle) * 4
        );
      }
      // Ring burst
      if (boss.frame % 3 === 0) {
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          spawnEnemyBullet(boss.x, boss.y,
            Math.cos(angle) * 2.5,
            Math.sin(angle) * 2.5
          );
        }
      }
      boss.attackTimer = 25;
      scheduleAction(18, () => { if (boss) boss.coreExposed = true; });
      scheduleAction(60, () => { if (boss) boss.coreExposed = false; });
    }
  }

  // === METEOR SLAM — two phantom rocks converge and launch ===
  if (boss.slamState === 'idle') {
    boss.slamTimer--;
    if (boss.slamTimer <= 0) {
      // Spawn two phantom asteroids flanking the boss
      const d1 = generateAsteroidData(14), d2 = generateAsteroidData(14);
      boss.slamAsteroids = [
        { x: boss.x, y: boss.y - 90, verts: d1.verts, cracks: d1.cracks, rotation: 0, rotSpeed: 0.05 },
        { x: boss.x, y: boss.y + 90, verts: d2.verts, cracks: d2.cracks, rotation: 0, rotSpeed: -0.05 }
      ];
      boss.slamState = 'converging';
      boss.slamProgress = 0;
    }
  } else if (boss.slamState === 'converging') {
    boss.slamProgress += 1 / 70;
    for (const sa of boss.slamAsteroids) sa.rotation += sa.rotSpeed;
    if (boss.slamProgress >= 1) {
      // Launch merged asteroid — exits right first, then slams back in
      spawnLocalFlash(boss.x, boss.y, 55);
      const mergedData = generateAsteroidData(20);
      enemyBullets.push({
        x: boss.x, y: boss.y,
        vx: 13, vy: 0,
        radius: 18, alive: true,
        verts: mergedData.verts, cracks: mergedData.cracks,
        rotation: 0, rotSpeed: 0.06,
        isMerged: true, phase: 'exiting'
      });
      boss.slamAsteroids = [];
      boss.slamState = 'idle';
      boss.slamTimer = boss.phase === 1 ? 420 : 280;
    }
  }
}

function drawBoss() {
  if (!boss || !boss.alive) return;

  ctx.save();
  ctx.shadowColor = CONFIG.colors.boss;
  ctx.shadowBlur = 15;

  // Main sphere body
  ctx.fillStyle = CONFIG.colors.enemy;
  ctx.beginPath();
  ctx.arc(boss.x, boss.y, 40, 0, Math.PI * 2);
  ctx.fill();

  // Outer ring
  ctx.strokeStyle = CONFIG.colors.enemy;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(boss.x, boss.y, 50 + Math.sin(boss.frame * 0.05) * 5, 0, Math.PI * 2);
  ctx.stroke();

  // Core — glows when exposed
  if (boss.coreExposed) {
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffffff';
  } else {
    ctx.fillStyle = '#660044';
  }
  ctx.beginPath();
  ctx.arc(boss.x, boss.y, 12, 0, Math.PI * 2);
  ctx.fill();

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  for (let sy = boss.y - 40; sy < boss.y + 40; sy += 4) {
    ctx.fillRect(boss.x - 40, sy, 80, 2);
  }

  // HP bar
  ctx.fillStyle = '#330022';
  ctx.fillRect(boss.x - 40, boss.y - 60, 80, 6);
  ctx.fillStyle = boss.hp / boss.maxHp > 0.5 ? '#ff00aa' : '#ff4400';
  ctx.fillRect(boss.x - 40, boss.y - 60, 80 * (boss.hp / boss.maxHp), 6);

  // Slam asteroids — two converging red rocks during slamState = 'converging'
  if (boss.slamState === 'converging' && boss.slamAsteroids.length === 2) {
    const p = boss.slamProgress;
    for (const sa of boss.slamAsteroids) {
      // Lerp toward boss center
      const drawX = sa.x + (boss.x - sa.x) * p;
      const drawY = sa.y + (boss.y - sa.y) * p;
      ctx.save();
      ctx.translate(drawX, drawY);
      ctx.rotate(sa.rotation);
      ctx.shadowColor = '#ff2200';
      ctx.shadowBlur = 14 + p * 22;
      ctx.fillStyle = '#2a0000';
      ctx.beginPath();
      ctx.moveTo(sa.verts[0].x, sa.verts[0].y);
      for (let vi = 1; vi < sa.verts.length; vi++) ctx.lineTo(sa.verts[vi].x, sa.verts[vi].y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = `rgb(255,${Math.floor(80 * (1 - p))},0)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }

  ctx.restore();
}

function destroyBoss() {
  boss.alive = false;
  score += 5000;
  checkLevelUp();
  // Magnetize all XP orbs to player
  for (const o of xpOrbs) o.locked = true;
  // Big explosion
  for (let i = 0; i < 5; i++) {
    scheduleAction(i * 12, () => {
      spawnExplosion(
        boss.x + (Math.random() - 0.5) * 60,
        boss.y + (Math.random() - 0.5) * 60,
        20, explosionColors
      );
    });
  }
  // Screen flash
  screenFlash = 30;
  // Fade out music as boss explodes
  stopMusic(3000);
  // Transition to stage clear after explosions
  scheduleAction(90, () => {
    gameState = 'STAGE_CLEAR';
  });
}

let screenFlash = 0;

// === MID-BOSS SYSTEM: THE SHEPHERD (enhanced gravwell) ===
let midBoss = null;
let midBossWarningTimer = 0;
let preMidBoss = false;   // true while waiting for mid-boss — asteroids get sucked right

function spawnMidBoss() {
  preMidBoss = false;   // suction phase ends when Shepherd arrives
  // Fallback: trigger shepherd music if the suction asteroid was destroyed before it triggered
  if (!shepherdMusicTriggered) {
    shepherdMusicTriggered = true;
    shepherdTrackChoice = Math.random() < 0.5 ? 'shepherd1' : 'shepherd2';
    crossfadeTo(shepherdTrackChoice);
  }
  const orbData = [];
  // Inner ring: 4 small, fast
  for (let i = 0; i < 4; i++) {
    const d = generateAsteroidData(10);
    orbData.push({
      angle: (i / 4) * Math.PI * 2 + 0.3,
      orbitRadius: 52, orbitSpeed: 0.026,
      verts: d.verts, cracks: d.cracks,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() * 0.04 + 0.02) * (Math.random() < 0.5 ? 1 : -1),
      alive: true, respawnTimer: 0, respawnFrames: 280,
      merging: false, mergeProgress: 0
    });
  }
  // Outer ring: 3 larger, slower
  for (let i = 0; i < 3; i++) {
    const d = generateAsteroidData(15);
    orbData.push({
      angle: (i / 3) * Math.PI * 2,
      orbitRadius: 80, orbitSpeed: 0.014,
      verts: d.verts, cracks: d.cracks,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() * 0.03 + 0.01) * (Math.random() < 0.5 ? 1 : -1),
      alive: true, respawnTimer: 0, respawnFrames: 340,
      merging: false, mergeProgress: 0
    });
  }

  midBoss = {
    x: CONFIG.width + 80,
    y: CONFIG.height / 2,
    startY: CONFIG.height / 2,
    targetX: CONFIG.width - 200,
    hp: 40, maxHp: 40,
    alive: true,
    frame: 0,
    entered: false,
    flingTimer: 220,
    mergeTimer: 380,         // frames until first merge
    mergeState: 'idle',      // 'idle' | 'converging' | 'charging'
    mergeProgress: 0,        // 0→1 during converging
    mergeTargets: [],        // indices of the two merging asteroids
    mergeMidX: 0, mergeMidY: 0,  // world-space convergence point
    orbitingAsteroids: orbData,
    energy: 0, maxEnergy: 100,
    coreExposed: false,
    phase: 1,
    inboundTimer: 840,
    pendingInbounds: [],
    hitFlash: 0,
    displayHp: 40,
    // Gravity pulse wave (bullet pushback)
    gravityPulses: [],
    gravPulseTimer: 360,
    gravPulseCooldown: 360,
    gravPulseTelegraph: 0,
    // Gravity well pull (player tug — phase 2 only)
    gravWellPullTimer: 0,
    gravWellPullActive: false,
    gravWellPullDuration: 0,
    gravWellPullTelegraph: 0,
    // Shotgun fling tracking
    flingCount: 0
  };
}

// Begin the grab telegraph — asteroid wiggles for ~35 frames then exits right
function midBossFling() {
  if (!midBoss || !player.alive) return;
  const live = midBoss.orbitingAsteroids.filter(oa => oa.alive && !oa.merging && !oa.grabbed);
  if (live.length === 0) return;
  const oa = live[Math.floor(Math.random() * live.length)];
  oa.grabbed = true;
  oa.grabTimer = 38;
}

// Shotgun fling — grab 3-4 asteroids with spread aiming
function midBossShotgunFling() {
  if (!midBoss || !player.alive) return;
  const live = midBoss.orbitingAsteroids.filter(oa => oa.alive && !oa.merging && !oa.grabbed);
  const count = Math.min(live.length, 3 + Math.floor(Math.random() * 2));
  if (count < 2) { midBossFling(); return; }
  const shuffled = live.sort(() => Math.random() - 0.5).slice(0, count);
  shuffled.forEach((oa, idx) => {
    oa.grabbed = true;
    oa.grabTimer = 25 + idx * 4;
    oa.shotgunIndex = idx;
    oa.shotgunTotal = count;
  });
}

// Trigger the merge sequence on two live, non-merging asteroids
function startMidBossMerge() {
  if (!midBoss || !player.alive) return;
  const live = midBoss.orbitingAsteroids
    .map((oa, i) => ({ oa, i }))
    .filter(({ oa }) => oa.alive && !oa.merging);
  if (live.length < 2) return;

  // Pick two (prefer one from each ring for visual drama)
  const shuffle = live.sort(() => Math.random() - 0.5);
  const a = shuffle[0], b = shuffle[1];
  a.oa.merging = true; a.oa.mergeProgress = 0;
  b.oa.merging = true; b.oa.mergeProgress = 0;
  midBoss.mergeTargets = [a.i, b.i];
  midBoss.mergeState = 'converging';
  midBoss.mergeProgress = 0;
}

function updateMidBoss() {
  if (!midBoss || !midBoss.alive) return;
  midBoss.frame++;

  // Entrance glide
  if (!midBoss.entered) {
    midBoss.x -= 2;
    if (midBoss.x <= midBoss.targetX) {
      midBoss.entered = true;
      midBoss.coreExposed = true;
    }
    // Still spin orbits during entrance
    for (const oa of midBoss.orbitingAsteroids) {
      if (oa.alive) { oa.angle += oa.orbitSpeed; oa.rotation += oa.rotSpeed; }
    }
    return;
  }

  // Phase transition at 50% HP
  if (midBoss.hp / midBoss.maxHp < 0.5 && midBoss.phase === 1) {
    midBoss.phase = 2;
    midBoss.flingTimer = Math.min(midBoss.flingTimer, 80);
    midBoss.mergeTimer = Math.min(midBoss.mergeTimer, 200);
    midBoss.gravPulseCooldown = 180;
    midBoss.gravPulseTimer = Math.min(midBoss.gravPulseTimer, 60);
    midBoss.gravWellPullTimer = 300;
    spawnExplosion(midBoss.x, midBoss.y, 12, ['#ff6600', '#ff0000', '#ffffff']);
  }

  // Gentle hover
  midBoss.y = midBoss.startY + Math.sin(midBoss.frame * 0.018) * 45;

  // HP bar hit flash + ghost drain
  if (midBoss.hitFlash > 0) midBoss.hitFlash--;
  if (midBoss.displayHp > midBoss.hp) midBoss.displayHp = Math.max(midBoss.hp, midBoss.displayHp - 0.3);

  // Spin orbiting asteroids; handle grabbed telegraph + respawns
  for (const oa of midBoss.orbitingAsteroids) {
    if (oa.grabbed) {
      // Wiggle fast in orbit position, then fire straight at player
      oa.rotation += oa.rotSpeed * 6;
      oa.grabTimer--;
      if (oa.grabTimer <= 0) {
        const wx = midBoss.x + Math.cos(oa.angle) * oa.orbitRadius;
        const wy = midBoss.y + Math.sin(oa.angle) * oa.orbitRadius;
        const dx = player.x - wx, dy = player.y - wy;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        let aimAngle = Math.atan2(dy, dx);
        // Shotgun spread
        if (oa.shotgunIndex !== undefined) {
          const spread = 0.2;
          aimAngle += spread * (oa.shotgunIndex - (oa.shotgunTotal - 1) / 2);
          delete oa.shotgunIndex;
          delete oa.shotgunTotal;
        }
        const spd = 4.5 + midBoss.phase * 0.8;
        enemyBullets.push({
          x: wx, y: wy,
          vx: Math.cos(aimAngle) * spd, vy: Math.sin(aimAngle) * spd,
          radius: oa.orbitRadius > 60 ? 12 : 9,
          alive: true,
          verts: oa.verts, cracks: oa.cracks,
          rotation: oa.rotation, rotSpeed: oa.rotSpeed
        });
        oa.grabbed = false;
        oa.alive = false;
        oa.respawnTimer = oa.respawnFrames;
      }
    } else if (oa.alive) {
      oa.angle += oa.orbitSpeed;
      oa.rotation += oa.rotSpeed;
    } else if (!oa.merging && oa.respawnTimer > 0) {
      oa.respawnTimer--;
      if (oa.respawnTimer === 0) {
        oa.alive = true;
        oa.merging = false;
        oa.mergeProgress = 0;
      }
    }
  }

  // === GRAVITY CAPTURE — pull passing asteroids into orbit (capped at 14) ===
  if (midBoss.entered && midBoss.orbitingAsteroids.length < 14) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (!ASTEROID_TYPES.has(e.type)) continue;
      if (dist(midBoss.x, midBoss.y, e.x, e.y) < 210) {
        const angle = Math.atan2(e.y - midBoss.y, e.x - midBoss.x);
        const d = e.type === 'charger' ? generateAsteroidData(14) : generateAsteroidData(10);
        midBoss.orbitingAsteroids.push({
          angle,
          orbitRadius: 50 + Math.random() * 34,
          orbitSpeed: 0.018 + Math.random() * 0.014,
          verts: e.verts || d.verts,
          cracks: e.cracks || d.cracks,
          rotation: e.rotation || 0,
          rotSpeed: (Math.random() * 0.04 + 0.02) * (Math.random() < 0.5 ? 1 : -1),
          alive: true, respawnTimer: 0, respawnFrames: 260,
          merging: false, mergeProgress: 0, grabbed: false, grabTimer: 0
        });
        spawnExplosion(e.x, e.y, 5, ['#cc00ff', '#aaeeff', '#ffffff']);
        swapRemove(enemies, i);
      }
    }
  }

  // === INBOUND ASTEROIDS FROM LEFT — suctioned into Shepherd's orbit ===
  if (midBoss.entered) {
    midBoss.inboundTimer--;
    if (midBoss.inboundTimer <= 0) {
      const y = 80 + Math.random() * (CONFIG.height - 160);
      midBoss.pendingInbounds.push({ y, countdown: 80 });
      midBoss.inboundTimer = midBoss.phase === 2
        ? 240 + Math.floor(Math.random() * 80)    // ~4-5s in phase 2
        : 480 + Math.floor(Math.random() * 120);   // ~8-10s in phase 1
    }
    for (let pi = midBoss.pendingInbounds.length - 1; pi >= 0; pi--) {
      const pending = midBoss.pendingInbounds[pi];
      pending.countdown--;
      if (pending.countdown <= 0) {
        const d = generateAsteroidData(12);
        enemies.push({
          type: 'charger',
          x: -45, y: pending.y,
          width: 20, height: 20,
          hp: 2, maxHp: 2,
          points: 0,
          frame: 0,
          rotation: Math.random() * Math.PI * 2,
          speed: 4 + Math.random() * 1.5,
          verts: d.verts, cracks: d.cracks,
          ambient: false,
          isShepherdInbound: true,
          triggered: false
        });
        swapRemove(midBoss.pendingInbounds, pi);
      }
    }
  }

  // === GRAVITY PULSE WAVE (bullet pushback) ===
  if (midBoss.gravPulseTelegraph > 0) {
    midBoss.gravPulseTelegraph--;
    if (midBoss.gravPulseTelegraph === 0) {
      midBoss.gravityPulses.push({ x: midBoss.x, y: midBoss.y, radius: 0, maxRadius: 300, speed: 5 });
      midBoss.gravPulseTimer = midBoss.gravPulseCooldown;
    }
  } else {
    midBoss.gravPulseTimer--;
    if (midBoss.gravPulseTimer <= 0) {
      midBoss.gravPulseTelegraph = 25;  // brief charge-up before pulse
    }
  }
  for (let pi = midBoss.gravityPulses.length - 1; pi >= 0; pi--) {
    const pulse = midBoss.gravityPulses[pi];
    pulse.radius += pulse.speed;
    if (pulse.radius >= pulse.maxRadius) { swapRemove(midBoss.gravityPulses, pi); continue; }
    // Push back player bullets that are near the wavefront
    for (const b of playerBullets) {
      const dx = b.x - pulse.x, dy = b.y - pulse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(dist - pulse.radius) < 20) {
        const nx = dx / (dist || 1), ny = dy / (dist || 1);
        b.vx += nx * 5;
        b.vy += ny * 5;
        const spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (spd > CONFIG.bulletSpeed * 1.7) {
          b.vx = (b.vx / spd) * CONFIG.bulletSpeed * 1.7;
          b.vy = (b.vy / spd) * CONFIG.bulletSpeed * 1.7;
        }
      }
    }
  }

  // === GRAVITY WELL PULL (phase 2 — tug player toward Shepherd) ===
  if (midBoss.phase === 2 && player.alive) {
    if (midBoss.gravWellPullActive) {
      midBoss.gravWellPullDuration--;
      const dx = midBoss.x - player.x, dy = midBoss.y - player.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      player.vx += (dx / dist) * 0.35;
      player.vy += (dy / dist) * 0.35;
      if (midBoss.gravWellPullDuration <= 0) {
        midBoss.gravWellPullActive = false;
        midBoss.gravWellPullTimer = 420 + Math.floor(Math.random() * 120);
      }
    } else if (midBoss.gravWellPullTelegraph > 0) {
      midBoss.gravWellPullTelegraph--;
      if (midBoss.gravWellPullTelegraph === 0) {
        midBoss.gravWellPullActive = true;
        midBoss.gravWellPullDuration = 120;
      }
    } else {
      midBoss.gravWellPullTimer--;
      if (midBoss.gravWellPullTimer <= 0) {
        midBoss.gravWellPullTelegraph = 90;
      }
    }
  }

  // === FLING ATTACK ===
  midBoss.flingTimer--;
  if (midBoss.flingTimer <= 0 && midBoss.mergeState === 'idle') {
    if (midBoss.phase === 2 && midBoss.flingCount % 3 === 0) {
      midBossShotgunFling();
    } else {
      midBossFling();
    }
    midBoss.flingCount++;
    midBoss.flingTimer = midBoss.phase === 1 ? 180 : 120;
  }

  // === MERGE ATTACK ===
  if (midBoss.mergeState === 'idle') {
    midBoss.mergeTimer--;
    if (midBoss.mergeTimer <= 0) {
      startMidBossMerge();
    }
  } else if (midBoss.mergeState === 'converging') {
    midBoss.mergeProgress += 1 / 80;  // 80 frames to converge
    if (midBoss.mergeProgress >= 1) {
      midBoss.mergeProgress = 1;
      // Merge at Shepherd's core — flash, then hold as 'charging' before firing at player
      midBoss.mergeMidX = midBoss.x;
      midBoss.mergeMidY = midBoss.y;
      spawnLocalFlash(midBoss.mergeMidX, midBoss.mergeMidY, 40);
      const mergedData = generateAsteroidData(22);
      midBoss.pendingShot = { verts: mergedData.verts, cracks: mergedData.cracks };
      midBoss.chargeTimer = 40;
      midBoss.mergeState = 'charging';

      // Kill source asteroids, start respawn
      for (const idx of midBoss.mergeTargets) {
        const oa = midBoss.orbitingAsteroids[idx];
        oa.alive = false;
        oa.merging = false;
        oa.mergeProgress = 0;
        oa.respawnTimer = oa.respawnFrames * 2;  // longer cooldown after merge
      }
    }
  } else if (midBoss.mergeState === 'charging') {
    midBoss.chargeTimer--;
    if (midBoss.chargeTimer <= 0 && player.alive && midBoss.pendingShot) {
      const dx = player.x - midBoss.x, dy = player.y - midBoss.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const spd = 11 + midBoss.phase;
      spawnLocalFlash(midBoss.x, midBoss.y, 50);
      enemyBullets.push({
        x: midBoss.x, y: midBoss.y,
        vx: (dx / dist) * spd, vy: (dy / dist) * spd,
        radius: 20, alive: true,
        verts: midBoss.pendingShot.verts, cracks: midBoss.pendingShot.cracks,
        rotation: 0, rotSpeed: 0.06,
        isMerged: true, phase: 'incoming'
      });
      midBoss.pendingShot = null;
      midBoss.mergeState = 'idle';
      midBoss.mergeTimer = midBoss.phase === 1 ? 380 : 260;
    }
  }
}

function drawMidBoss() {
  if (!midBoss || !midBoss.alive) return;
  ctx.save();

  const mb = midBoss;
  const pulse = Math.sin(mb.frame * 0.06) * 0.5 + 0.5;
  const energyFrac = mb.hp / mb.maxHp;

  // Tractor beams to nearby ambient asteroids (gravity pull telegraph)
  if (mb.entered) {
    ctx.setLineDash([3, 9]);
    ctx.lineWidth = 1;
    for (const e of enemies) {
      if (!ASTEROID_TYPES.has(e.type)) continue;
      const edx = mb.x - e.x, edy = mb.y - e.y;
      const edist = Math.sqrt(edx * edx + edy * edy);
      if (edist < 320) {
        const alpha = 0.12 + (1 - edist / 320) * 0.3;
        ctx.strokeStyle = `rgba(180,80,255,${alpha})`;
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#cc00ff';
        ctx.beginPath();
        ctx.moveTo(mb.x, mb.y);
        ctx.lineTo(e.x, e.y);
        ctx.stroke();
      }
    }
    ctx.setLineDash([]);
  }

  // Tractor beams to alive orbiting asteroids
  ctx.setLineDash([5, 6]);
  ctx.lineWidth = 1;
  for (const oa of mb.orbitingAsteroids) {
    if (!oa.alive) continue;
    const wx = mb.x + Math.cos(oa.angle) * oa.orbitRadius;
    const wy = mb.y + Math.sin(oa.angle) * oa.orbitRadius;
    const mergeAlpha = oa.merging ? 0.3 + oa.mergeProgress * 0.5 : 0.2 + pulse * 0.15;
    ctx.strokeStyle = oa.merging
      ? `rgba(255,60,0,${mergeAlpha})`
      : `rgba(180,100,255,${mergeAlpha})`;
    ctx.beginPath();
    ctx.moveTo(mb.x, mb.y);
    ctx.lineTo(wx, wy);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Core body — larger than regular gravwell
  ctx.shadowColor = '#aa00ff';
  ctx.shadowBlur = 18 + pulse * 10;
  ctx.fillStyle = '#1a0030';
  ctx.beginPath();
  ctx.arc(mb.x, mb.y, 30, 0, Math.PI * 2);
  ctx.fill();

  // Outer spinning rings
  for (let r = 0; r < 2; r++) {
    const ringR = 42 + r * 16;
    const rot = mb.frame * (0.02 + r * 0.015) * (r % 2 === 0 ? 1 : -1);
    ctx.strokeStyle = r === 0
      ? `rgba(180,80,255,${0.5 + pulse * 0.3})`
      : `rgba(255,60,0,${0.3 + energyFrac * 0.4})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mb.x, mb.y, ringR, rot, rot + Math.PI * 1.5);
    ctx.stroke();
  }

  // Core gem — pulses brighter when hit
  const coreFlash = mb.hitFlash > 0 ? 1 : 0;
  ctx.shadowColor = coreFlash ? '#ffffff' : '#cc00ff';
  ctx.shadowBlur = 12 + coreFlash * 18 + pulse * 6;
  ctx.fillStyle = coreFlash ? '#ffaaff' : `rgb(${Math.floor(100 + pulse * 60)},0,${Math.floor(150 + pulse * 50)})`;
  ctx.beginPath();
  ctx.arc(mb.x, mb.y, 10, 0, Math.PI * 2);
  ctx.fill();

  // Merge convergence visual — red lines between merging pair + their moving positions
  if (mb.mergeState === 'converging' && mb.mergeTargets.length === 2) {
    const [ia, ib] = mb.mergeTargets;
    const oaA = mb.orbitingAsteroids[ia];
    const oaB = mb.orbitingAsteroids[ib];
    const p = mb.mergeProgress;
    // Lerp each asteroid toward the Shepherd's core — they spiral inward
    const axW = mb.x + Math.cos(oaA.angle) * oaA.orbitRadius;
    const ayW = mb.y + Math.sin(oaA.angle) * oaA.orbitRadius;
    const bxW = mb.x + Math.cos(oaB.angle) * oaB.orbitRadius;
    const byW = mb.y + Math.sin(oaB.angle) * oaB.orbitRadius;
    const midX = mb.x, midY = mb.y;   // convergence at core
    const drawAx = axW + (midX - axW) * p;
    const drawAy = ayW + (midY - ayW) * p;
    const drawBx = bxW + (midX - bxW) * p;
    const drawBy = byW + (midY - byW) * p;

    const redAlpha = 0.5 + p * 0.5;
    ctx.shadowColor = '#ff2200';
    ctx.shadowBlur = 20 + p * 20;
    // Draw a glowing line between the two
    ctx.strokeStyle = `rgba(255,50,0,${redAlpha})`;
    ctx.lineWidth = 2 + p * 3;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(drawAx, drawAy);
    ctx.lineTo(drawBx, drawBy);
    ctx.stroke();

    // Draw each merging asteroid in its lerped position with red tint
    for (const [dx2, dy2, oa] of [[drawAx, drawAy, oaA], [drawBx, drawBy, oaB]]) {
      ctx.save();
      ctx.translate(dx2, dy2);
      ctx.rotate(oa.rotation);
      ctx.shadowColor = '#ff3300';
      ctx.shadowBlur = 14 + p * 20;
      ctx.fillStyle = `rgba(40,0,0,1)`;
      ctx.beginPath();
      ctx.moveTo(oa.verts[0].x, oa.verts[0].y);
      for (let vi = 1; vi < oa.verts.length; vi++) ctx.lineTo(oa.verts[vi].x, oa.verts[vi].y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = `rgba(255,${Math.floor(60 * (1 - p))},0,1)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
    // Growing merge flash at midpoint as p → 1
    if (p > 0.7) {
      const flashAlpha = (p - 0.7) / 0.3;
      const grad = ctx.createRadialGradient(midX, midY, 0, midX, midY, 35 * flashAlpha);
      grad.addColorStop(0, `rgba(255,180,80,${flashAlpha})`);
      grad.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(midX, midY, 35, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Orbiting asteroids (non-merging ones, including grabbed telegraph)
  for (const oa of mb.orbitingAsteroids) {
    if (!oa.alive && !oa.grabbed) continue;
    if (oa.merging) continue;
    const wx = mb.x + Math.cos(oa.angle) * oa.orbitRadius;
    const wy = mb.y + Math.sin(oa.angle) * oa.orbitRadius;
    // Grabbed: shake and shift to red/orange as grabTimer counts down
    const grabFrac = oa.grabbed ? 1 - oa.grabTimer / 38 : 0;
    const shakeX = oa.grabbed ? Math.sin(mb.frame * 1.1) * (4 + grabFrac * 6) : 0;
    const shakeY = oa.grabbed ? Math.cos(mb.frame * 0.9) * (3 + grabFrac * 5) : 0;
    ctx.save();
    ctx.translate(wx + shakeX, wy + shakeY);
    ctx.rotate(oa.rotation);
    const oaColor = oa.grabbed ? `rgb(255,${Math.floor(100 * (1 - grabFrac))},0)` : CONFIG.colors.asteroid;
    const oaBlur = oa.grabbed ? 14 + grabFrac * 18 : 8;
    drawAsteroidShape(oa.verts, null, oaColor, oaBlur);
    ctx.restore();
  }

  // Gravity pulse telegraph — rapid purple halo charge-up
  if (mb.gravPulseTelegraph > 0) {
    const tp = 1 - mb.gravPulseTelegraph / 25;
    const flicker = Math.sin(mb.frame * 1.2) * 0.5 + 0.5;
    ctx.save();
    ctx.shadowColor = '#aa00ff';
    ctx.shadowBlur = 20 + tp * 30 + flicker * 15;
    ctx.strokeStyle = `rgba(180,60,255,${0.3 + tp * 0.6 + flicker * 0.1})`;
    ctx.lineWidth = 2 + tp * 3;
    ctx.beginPath();
    ctx.arc(mb.x, mb.y, 32 + tp * 10 + flicker * 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Gravity pulse waves — expanding rings
  for (const pulse of mb.gravityPulses) {
    const progress = pulse.radius / pulse.maxRadius;
    const alpha = (1 - progress) * 0.75;
    ctx.save();
    ctx.shadowColor = '#aa00ff';
    ctx.shadowBlur = 20 * (1 - progress);
    ctx.strokeStyle = `rgba(160,60,255,${alpha.toFixed(2)})`;
    ctx.lineWidth = 3.5 * (1 - progress) + 1;
    ctx.beginPath();
    ctx.arc(pulse.x, pulse.y, pulse.radius, 0, Math.PI * 2);
    ctx.stroke();
    if (pulse.radius > 25) {
      ctx.strokeStyle = `rgba(220,180,255,${(alpha * 0.35).toFixed(2)})`;
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(pulse.x, pulse.y, pulse.radius * 0.75, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Gravity well pull — tractor beam visual
  if (mb.phase === 2 && player.alive) {
    if (mb.gravWellPullTelegraph > 0) {
      // Telegraph: flickering dashed beam
      const tp = 1 - mb.gravWellPullTelegraph / 90;
      ctx.save();
      ctx.setLineDash([8, 12]);
      ctx.lineDashOffset = mb.frame * 3;
      ctx.strokeStyle = `rgba(180,60,255,${0.15 + tp * 0.45})`;
      ctx.lineWidth = 1.5 + tp * 2;
      ctx.shadowColor = '#cc00ff';
      ctx.shadowBlur = 8 + tp * 12;
      ctx.beginPath();
      ctx.moveTo(mb.x, mb.y);
      ctx.lineTo(player.x, player.y);
      ctx.stroke();
      ctx.setLineDash([]);
      // Warning text
      if (tp > 0.3) {
        const textAlpha = Math.sin(mb.frame * 0.3) * 0.3 + 0.5;
        ctx.fillStyle = `rgba(200,100,255,${textAlpha.toFixed(2)})`;
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GRAVITY LOCK', player.x, player.y - 30);
      }
      ctx.restore();
    } else if (mb.gravWellPullActive) {
      // Active pull: thick glowing beam with particle dots
      ctx.save();
      ctx.strokeStyle = 'rgba(180,40,255,0.55)';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#cc00ff';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(mb.x, mb.y);
      ctx.lineTo(player.x, player.y);
      ctx.stroke();
      // Particle dots streaming along beam
      const dx = player.x - mb.x, dy = player.y - mb.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      for (let pi = 0; pi < 6; pi++) {
        const t = ((mb.frame * 0.03 + pi / 6) % 1);
        const px = mb.x + dx * t;
        const py = mb.y + dy * t;
        const dotAlpha = 0.5 + Math.sin(t * Math.PI) * 0.4;
        ctx.fillStyle = `rgba(220,160,255,${dotAlpha.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // Charging merged shot — glowing ring at core that grows and fires
  if (mb.mergeState === 'charging' && mb.pendingShot) {
    const cp = 1 - mb.chargeTimer / 40;
    const chargePulse = Math.sin(mb.frame * 0.5) * 0.5 + 0.5;
    ctx.save();
    ctx.shadowColor = '#ff2200';
    ctx.shadowBlur = 22 + cp * 28 + chargePulse * 12;
    ctx.strokeStyle = `rgba(255, ${Math.floor(120 * (1 - cp))}, 0, ${0.7 + cp * 0.3})`;
    ctx.lineWidth = 2.5 + cp * 3;
    ctx.beginPath();
    ctx.arc(mb.x, mb.y, 18 + cp * 12 + chargePulse * 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // === POLISHED HP BAR ===
  const barW = 440, barH = 14;
  const barX = CONFIG.width / 2 - barW / 2, barY = 46;
  const hpFrac = mb.hp / mb.maxHp;
  const displayFrac = mb.displayHp / mb.maxHp;
  const isLow = hpFrac < 0.33;

  ctx.save();
  ctx.shadowColor = isLow ? '#ff3300' : '#aa00ff';
  ctx.shadowBlur = 10 + pulse * 8;

  // Dark track
  ctx.fillStyle = '#06000e';
  ctx.fillRect(barX, barY, barW, barH);

  // Ghost drain bar (trails behind actual HP)
  if (displayFrac > hpFrac) {
    ctx.fillStyle = isLow ? 'rgba(255,100,0,0.28)' : 'rgba(160,40,255,0.28)';
    ctx.fillRect(barX, barY, barW * displayFrac, barH);
  }

  // Main fill — gradient shifts purple→red as HP drops
  const grad = ctx.createLinearGradient(barX, 0, barX + barW * hpFrac, 0);
  if (isLow) {
    grad.addColorStop(0, '#bb1100'); grad.addColorStop(1, '#ff4400');
  } else if (hpFrac < 0.66) {
    grad.addColorStop(0, '#880099'); grad.addColorStop(1, '#ff3300');
  } else {
    grad.addColorStop(0, '#7700bb'); grad.addColorStop(1, '#cc44ff');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(barX, barY, barW * hpFrac, barH);

  // Hit flash — white blaze over fill
  if (mb.hitFlash > 0) {
    const flashA = mb.hitFlash / 12;
    ctx.fillStyle = `rgba(255,255,255,${flashA * 0.75})`;
    ctx.fillRect(barX, barY, barW * hpFrac, barH);
  }

  // Pulsing bright edge at fill tip
  if (hpFrac > 0.01) {
    const edgeX = barX + barW * hpFrac - 3;
    ctx.fillStyle = `rgba(255,255,255,${0.35 + pulse * 0.55})`;
    ctx.fillRect(edgeX, barY, 3, barH);
  }

  // Segment dividers — 8 chunks of 5 HP each
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  for (let s = 1; s < 8; s++) {
    ctx.fillRect(barX + barW * (s / 8) - 1, barY, 2, barH);
  }

  // Bar border
  ctx.strokeStyle = isLow ? 'rgba(255,80,0,0.55)' : 'rgba(180,60,255,0.45)';
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 5;
  ctx.strokeRect(barX, barY, barW, barH);

  // Corner bracket accents
  const al = 12;
  ctx.strokeStyle = isLow ? '#ff4400' : '#bb00ff';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 10;
  ctx.shadowColor = isLow ? '#ff2200' : '#cc00ff';
  // top-left
  ctx.beginPath(); ctx.moveTo(barX - 5, barY + al); ctx.lineTo(barX - 5, barY - 5); ctx.lineTo(barX + al, barY - 5); ctx.stroke();
  // top-right
  ctx.beginPath(); ctx.moveTo(barX + barW - al, barY - 5); ctx.lineTo(barX + barW + 5, barY - 5); ctx.lineTo(barX + barW + 5, barY + al); ctx.stroke();
  // bottom-left
  ctx.beginPath(); ctx.moveTo(barX - 5, barY + barH - al); ctx.lineTo(barX - 5, barY + barH + 5); ctx.lineTo(barX + al, barY + barH + 5); ctx.stroke();
  // bottom-right
  ctx.beginPath(); ctx.moveTo(barX + barW - al, barY + barH + 5); ctx.lineTo(barX + barW + 5, barY + barH + 5); ctx.lineTo(barX + barW + 5, barY + barH - al); ctx.stroke();

  // Name label
  const nameGlow = isLow ? '#ff4400' : '#cc00ff';
  ctx.shadowColor = nameGlow;
  ctx.shadowBlur = 8 + pulse * 6;
  ctx.fillStyle = isLow
    ? `rgba(255,${Math.floor(80 + pulse * 60)},30,1)`
    : `rgba(${Math.floor(180 + pulse * 50)},${Math.floor(80 + pulse * 40)},255,1)`;
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('— T H E   S H E P H E R D —', CONFIG.width / 2, barY - 8);

  ctx.restore();

  ctx.restore();
}

function drawMidBossInboundAlerts() {
  if (!midBoss || !midBoss.pendingInbounds || midBoss.pendingInbounds.length === 0) return;
  ctx.save();
  for (const pending of midBoss.pendingInbounds) {
    const f = midBoss.frame;

    const arrowFlash = Math.sin(f * 0.35) * 0.5 + 0.5;
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 8 + arrowFlash * 6;
    ctx.fillStyle = `rgba(255, 200, 0, ${0.5 + arrowFlash * 0.5})`;
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('◄', 8, pending.y + 7);

}

function destroyMidBoss() {
  midBoss.alive = false;
  score += 3000;
  checkLevelUp();
  // Magnetize all XP orbs to player
  for (const o of xpOrbs) o.locked = true;
  for (let i = 0; i < 6; i++) {
    scheduleAction(i * 11, () => {
      if (!midBoss) return;
      spawnExplosion(
        midBoss.x + (Math.random() - 0.5) * 70,
        midBoss.y + (Math.random() - 0.5) * 70,
        18, ['#cc00ff', '#ff3300', '#ffffff', '#ff6600']
      );

  screenFlash = 20;
  scheduleAction(72, () => {
    midBoss = null;
    // Advance past the mid-boss sentinel wave and resume
    currentWave++;

    waveTimer = 0;

    enemyBullets.length = 0;

    secondaryProjectiles.length = 0;

}
