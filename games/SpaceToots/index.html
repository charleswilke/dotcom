<script>
// ============================================================
//  SPACE TOOTS — A side-scrolling bullet hell for the web
//  Pure Canvas API + vanilla JS. No dependencies.
// ============================================================

// === CONFIG ===
const CONFIG = {
  width: 960,
  height: 540,
  playerSpeed: 5,
  playerFireRate: 48,       // frames between shots (~0.8 sec at 60fps)
  bulletSpeed: 10,
  enemyBulletSpeed: 4,
  maxBullets: 200,
  maxEnemies: 30,
  maxParticles: 250,
  colors: {
    bg:          '#0a0a1a',
    grid:        '#2a1040',
    player:      '#00f0ff',
    playerBullet:'#00ffff',
    enemy:       '#ff00aa',
    enemyBullet: '#ff4400',
    asteroid:    '#aaeeff',
    pickup:      '#ffd700',
    boss:        '#ffffff',
    hud:         '#e0e0ff'
  },
  weapons: {
    secondary: {
      homing:  { name: "The Bloodhound",        flavor: "Good boy. Good, deadly boy.",          ammo: 20 },
      wave:    { name: "The Silent But Deadly",  flavor: "You'll smell it before you see it.",   ammo: 15 },
      spread:  { name: "Astro's Revenge",        flavor: "He remembers what you did to his toy.",ammo: 10 },
      shield:  { name: "Doc's Bubble",           flavor: "Personal space is non-negotiable.",    duration: 15 },
      laser:   { name: "The Full Send",          flavor: "No half measures.",                    ammo: 3 }
    }
  },
  enemies: {
    drone:   { name: "Buzzkill",     hp: 1, points: 100 },
    weaver:  { name: "The Wobbler",  hp: 2, points: 200 },
    charger: { name: "Karen",        hp: 3, points: 300 },
    turret:  { name: "The Intern",   hp: 4, points: 250 },
    spawner: { name: "The HOA",      hp: 5, points: 500 },
    bomber:  { name: "Oops",         hp: 3, points: 350 },
    gravwell: { name: "The Shepherd", hp: 5, points: 550 }
  },
  bosses: {
    stage1: { name: "THE BIG CHUNGUS",  title: "Keeper of the Void" },
    stage2: { name: "CAPTAIN CRAMP",    title: "Terror of the Reef" },
    stage3: { name: "EL JEFE GRANDE",   title: "The Final Flatulence" }
  }
};

// === DODGE & XP CONSTANTS ===
const DODGE_DURATION = 18;    // frames of active dash
const DODGE_COOLDOWN = 120;   // frames before next dodge (2 sec at 60fps, upgradeable)
const DODGE_IMPULSE  = 9;     // velocity impulse (above maxVel of 6)
const DODGE_KEY      = 'ShiftLeft';
const DODGE_KEY_ALT  = 'ShiftRight';

const XP_ATTRACT_RADIUS = 45;   // px — magnetic pull starts here
const XP_ATTRACT_ACCEL  = 0.8;  // acceleration toward player per frame
const XP_ATTRACT_DRAG   = 0.88; // drag on orb velocity (caps attraction speed)
const XP_ORB_DRIFT      = 0.6;  // baseline leftward scroll speed (px/frame)

// === LEVEL-UP UPGRADES ===
const UPGRADES = {
  spread:      { name: 'Spread Shot',      icon: '⚔', desc: 'More bullets per shot',     color: '#00ffff', maxTier: 5,
                 tiers: ['1','2','3','4','5'] },
  fireRate:    { name: 'Fire Rate',        icon: '↑', desc: 'Shoot faster',               color: '#44ddff', maxTier: 5,
                 tiers: ['36f','26f','18f','12f','8f'], values: [36, 26, 18, 12, 8] },
  gravLock:    { name: 'Grav Lock',        icon: '◉', desc: 'Bullets curve to enemies',   color: '#dd44ff', maxTier: 5,
                 tiers: ['Weak','Med','Strong','Homing','Max'],
                 values: [
                   { radius: 80,  force: 0.15 },
                   { radius: 120, force: 0.3 },
                   { radius: 160, force: 0.5 },
                   { radius: 220, force: 0.8 },
                   { radius: 280, force: 1.2 }
                 ]},
  xpMagnet:    { name: 'XP Magnet',        icon: '◎', desc: 'Attract XP from further',   color: '#00ffee', maxTier: 5,
                 tiers: ['45px','65px','90px','120px','160px'], values: [45, 65, 90, 120, 160] },
  boostDur:    { name: 'Boost Duration',   icon: '»', desc: 'Longer dodge dash',          color: '#ff8800', maxTier: 5,
                 tiers: ['18f','22f','26f','30f','34f'], values: [18, 22, 26, 30, 34] },
  boostRecharge: { name: 'Boost Recharge', icon: '↻', desc: 'Faster dodge cooldown',     color: '#ffaa44', maxTier: 5,
                 tiers: ['105f','90f','80f','70f','55f'], values: [105, 90, 80, 70, 55] },
  speed:       { name: 'Thruster Power',   icon: '⚡', desc: 'Increase max speed',        color: '#44ff44', maxTier: 5,
                 tiers: ['6.0','6.8','7.6','8.4','9.2'], values: [6, 6.8, 7.6, 8.4, 9.2] },
  shieldRegen: { name: 'Shield Systems',   icon: '◈', desc: 'Faster shield recharge',    color: '#ffee88', maxTier: 5,
                 tiers: ['30s','24s','18s','13s','9s'], values: [30, 24, 18, 13, 9] },
  scoreMult:   { name: 'Score Bonus',      icon: '★', desc: 'Multiply score earned',     color: '#ff44ff', maxTier: 5,
                 tiers: ['1.0×','1.25×','1.5×','1.75×','2.0×'], values: [1.0, 1.25, 1.5, 1.75, 2.0] }
};

// === ENGINE ===
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = CONFIG.width;
canvas.height = CONFIG.height;

function resizeCanvas() {
  const scaleX = window.innerWidth / CONFIG.width;
  const scaleY = window.innerHeight / CONFIG.height;
  const scale = Math.min(scaleX, scaleY);
  canvas.style.width = (CONFIG.width * scale) + 'px';
  canvas.style.height = (CONFIG.height * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Input
const keys = {};
const _doubleTap = {};   // tracks last tap time per direction key
const DOUBLE_TAP_MS = 250;
const DOUBLE_TAP_DIRS = {
  ArrowRight: { dx: 1, dy: 0 }, KeyD: { dx: 1, dy: 0 },
  ArrowUp:    { dx: 0, dy:-1 }, KeyW: { dx: 0, dy:-1 },
  ArrowDown:  { dx: 0, dy: 1 }, KeyS: { dx: 0, dy: 1 }
};

window.addEventListener('keydown', e => {
  if (!keys[e.code] && DOUBLE_TAP_DIRS[e.code]) {
    const now = performance.now();
    const dir = DOUBLE_TAP_DIRS[e.code];
    // Normalize so ArrowRight and KeyD share the same slot
    const slot = dir.dx + ',' + dir.dy;
    if (_doubleTap[slot] && now - _doubleTap[slot] < DOUBLE_TAP_MS) {
      player._doubleTapDodge = dir;
      _doubleTap[slot] = 0;
    } else {
      _doubleTap[slot] = now;
    }
  }
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Frame counter
let frame = 0;

// === SCREEN SHAKE & HITSTOP ===
let screenShakeX = 0, screenShakeY = 0, screenShakeTimer = 0, screenShakeIntensity = 0;
let hitStopFrames = 0;

function triggerScreenShake(intensity, duration) {
  screenShakeIntensity = Math.max(screenShakeIntensity, intensity);
  screenShakeTimer = Math.max(screenShakeTimer, duration);
}

function triggerHitStop(frames) {
  hitStopFrames = Math.max(hitStopFrames, frames);
}

function updateScreenShake() {
  if (screenShakeTimer > 0) {
    screenShakeX = (Math.random() - 0.5) * 2 * screenShakeIntensity;
    screenShakeY = (Math.random() - 0.5) * 2 * screenShakeIntensity;
    screenShakeTimer--;
    screenShakeIntensity *= 0.85;
  } else {
    screenShakeX = 0;
    screenShakeY = 0;
    screenShakeIntensity = 0;
  }
}

// === OBJECT POOLS ===
const playerBullets = [];
const enemyBullets = [];
const enemies = [];
const particles = [];
const pickups = [];
const xpOrbs = [];

// === PARALLAX BACKGROUND ===
// Layer 1: Distant star field
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * CONFIG.width,
    y: Math.random() * CONFIG.height,
    size: Math.random() * 1.5 + 0.5,
    brightness: Math.random() * 0.5 + 0.3
  });
}

// Layer 2: Synthwave grid
let gridOffset = 0;

// Layer 3: Nebula clouds
const nebulae = [];
for (let i = 0; i < 6; i++) {
  nebulae.push({
    x: Math.random() * CONFIG.width * 1.5,
    y: Math.random() * CONFIG.height,
    radius: Math.random() * 120 + 60,
    color: Math.random() > 0.5 ? 'rgba(255,0,170,0.04)' : 'rgba(0,240,255,0.03)',
    speed: 0.7
  });
}

// === MOON TERRAIN (procedural parallax landscapes) ===
// Generates a jagged ridgeline with craters scooped in
function generateTerrain(segWidth, baseY, jaggedness, craterChance, craterMaxW, craterMaxD, totalWidth) {
  const points = [];
  const numSegs = Math.ceil(totalWidth / segWidth) + 1;
  for (let i = 0; i <= numSegs; i++) {
    let y = baseY + (Math.random() - 0.5) * jaggedness;
    // Occasional crater dip
    if (Math.random() < craterChance) {
      const cw = Math.random() * craterMaxW + craterMaxW * 0.4;
      const cd = Math.random() * craterMaxD + craterMaxD * 0.3;
      const halfSegs = Math.max(1, Math.round(cw / segWidth / 2));
      // Push the crater rim up slightly, then scoop down
      points.push({ x: i * segWidth, y: y - cd * 0.15 }); // rim
      for (let c = 1; c <= halfSegs * 2; c++) {
        const ct = c / (halfSegs * 2);
        const craterY = Math.sin(ct * Math.PI) * cd;
        i++;
        points.push({ x: i * segWidth, y: y + craterY });
      }
      points.push({ x: i * segWidth, y: y - cd * 0.1 }); // far rim
    } else {
      points.push({ x: i * segWidth, y });
    }
  }
  return points;
}

// Terrain layer config: { speed, baseY, color, fillColor, jaggedness, segWidth }
const terrainLayers = [
  { // Far terrain — slow, dark, tall peaks
    speed: 0.4,
    baseY: CONFIG.height * 0.78,
    color: 'rgba(60,40,80,0.6)',
    fillColor: 'rgba(20,12,35,0.7)',
    jaggedness: 45,
    segWidth: 24,
    craterChance: 0.08,
    craterMaxW: 80,
    craterMaxD: 25
  },
  { // Near terrain — faster, brighter, closer to bottom
    speed: 1.2,
    baseY: CONFIG.height * 0.88,
    color: 'rgba(100,60,140,0.5)',
    fillColor: 'rgba(30,18,50,0.8)',
    jaggedness: 30,
    segWidth: 16,
    craterChance: 0.12,
    craterMaxW: 50,
    craterMaxD: 18
  }
];

// Pre-generate terrain — wide enough to scroll seamlessly (2x screen width for tiling)
const terrainWidth = CONFIG.width * 2;
for (const layer of terrainLayers) {
  layer.points = generateTerrain(
    layer.segWidth, layer.baseY, layer.jaggedness,
    layer.craterChance, layer.craterMaxW, layer.craterMaxD, terrainWidth
  );
  layer.offset = 0;
  // Add some boulders along the ridgeline
  layer.boulders = [];
  for (let i = 0; i < 12; i++) {
    const bx = Math.random() * terrainWidth;
    // Sample terrain height at this x
    const segIdx = Math.min(layer.points.length - 1, Math.floor(bx / layer.segWidth));
    const terrainY = layer.points[segIdx] ? layer.points[segIdx].y : layer.baseY;
    layer.boulders.push({
      x: bx,
      y: terrainY - Math.random() * 6 - 2,
      r: Math.random() * 5 + 2
    });
  }
}

function drawTerrainLayer(layer) {
  const pts = layer.points;
  const w = terrainWidth;
  const ox = -(layer.offset % w);

  ctx.save();
  // Draw two copies for seamless tiling
  for (let copy = 0; copy < 2; copy++) {
    const shift = ox + copy * w;

    // Fill terrain body
    ctx.fillStyle = layer.fillColor;
    ctx.beginPath();
    ctx.moveTo(shift, CONFIG.height); // bottom-left
    for (const pt of pts) {
      ctx.lineTo(shift + pt.x, pt.y);
    }
    ctx.lineTo(shift + w, CONFIG.height); // bottom-right
    ctx.closePath();
    ctx.fill();

    // Ridgeline stroke
    ctx.strokeStyle = layer.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const px = shift + pts[i].x;
      const py = pts[i].y;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Boulders
    ctx.fillStyle = layer.color;
    for (const b of layer.boulders) {
      const bx = shift + b.x;
      if (bx > -10 && bx < CONFIG.width + 10) {
        ctx.beginPath();
        ctx.arc(bx, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  ctx.restore();

  // Advance scroll
  layer.offset += layer.speed;
  if (layer.offset >= w) layer.offset -= w;
}

// Layer 4: Foreground debris streaks
const debris = [];
for (let i = 0; i < 15; i++) {
  debris.push({
    x: Math.random() * CONFIG.width,
    y: Math.random() * CONFIG.height,
    length: Math.random() * 30 + 10,
    speed: Math.random() * 3 + 4,
    brightness: Math.random() * 0.3 + 0.1
  });
}

function drawBackground() {
  // Fill
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

  // Layer 1: Stars
  for (const star of stars) {
    star.x -= 0.2;
    if (star.x < 0) { star.x = CONFIG.width; star.y = Math.random() * CONFIG.height; }
    ctx.fillStyle = `rgba(255,255,255,${star.brightness})`;
    ctx.fillRect(star.x, star.y, star.size, star.size);
  }

  // Layer 2: Synthwave grid
  gridOffset += 0.5;
  if (gridOffset > 40) gridOffset -= 40;

  ctx.save();
  // Horizon line at 60% from top
  const horizon = CONFIG.height * 0.6;

  // Vertical grid lines with perspective
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  const numVLines = 20;
  const vanishX = CONFIG.width * 0.5;
  for (let i = -numVLines; i <= numVLines; i++) {
    const baseX = vanishX + i * 80;
    ctx.beginPath();
    ctx.moveTo(vanishX, horizon);
    ctx.lineTo(baseX, CONFIG.height);
    ctx.globalAlpha = 0.4;
    ctx.stroke();
  }

  // Horizontal grid lines — recede toward horizon
  for (let i = 0; i < 12; i++) {
    const t = (i * 40 + gridOffset) / (12 * 40);
    const y = horizon + (CONFIG.height - horizon) * (t * t + t) * 0.8;
    if (y > horizon && y < CONFIG.height) {
      ctx.globalAlpha = 0.2 + t * 0.3;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(CONFIG.width, y);
      ctx.stroke();
    }
  }
  ctx.restore();

  // Layer 3: Nebula clouds
  for (const neb of nebulae) {
    neb.x -= neb.speed;
    if (neb.x < -neb.radius * 2) { neb.x = CONFIG.width + neb.radius * 2; neb.y = Math.random() * CONFIG.height; }
    const grad = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.radius);
    grad.addColorStop(0, neb.color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(neb.x - neb.radius, neb.y - neb.radius, neb.radius * 2, neb.radius * 2);
  }

  // Layer 3.5: Moon terrain (suppressed during tunnel gauntlet)
  if (!tunnelActive) {
    for (const layer of terrainLayers) {
      drawTerrainLayer(layer);
    }
  }

  // Layer 4: Foreground debris streaks
  for (const d of debris) {
    d.x -= d.speed * 1.2;
    if (d.x < -d.length) { d.x = CONFIG.width + d.length; d.y = Math.random() * CONFIG.height; }
    ctx.strokeStyle = `rgba(255,255,255,${d.brightness})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.length, d.y);
    ctx.stroke();
  }
}

// === PLAYER ===
const player = {
  x: 100,
  y: CONFIG.height / 2,
  vx: 0,             // velocity
  vy: 0,
  accel: 0.7,        // acceleration per frame when input held
  drag: 0.92,        // velocity multiplied by this each frame (lower = floatier)
  maxVel: 6,         // speed cap
  width: 40,
  height: 30,
  speed: CONFIG.playerSpeed,
  lives: 3,
  weaponLevel: 1,
  fireTimer: 0,
  invincible: 0,    // frames of invincibility remaining
  alive: true,
  respawnTimer: 0,
  secondary: null,
  secondaryAmmo: 0,
  shotsFired: 0,
  shotsHit: 0,
  shieldActive: false,
  shieldRechargeTimer: 0,
  dodgeTimer: 0,
  dodgeCooldown: 0,
  dodgeVx: 0,
  dodgeVy: 0,
  dodgeRoll: 0,
  xp: 0,
  xpLevel: 1,
  xpToNext: 10,
  // Level-up upgrade system
  upgrades: { spread: 0, fireRate: 0, gravLock: 0, xpMagnet: 0, boostDur: 0, boostRecharge: 0, speed: 0, shieldRegen: 0, scoreMult: 0 },
  dodgeCooldownBase: DODGE_COOLDOWN,
  pendingLevelUps: 0,
  xpAttractRadius: XP_ATTRACT_RADIUS,
  dodgeDuration: DODGE_DURATION,
  shieldRechargeSeconds: 30,
  scoreMultBonus: 1.0,
  fireRateOverride: null,
  gravLock: { radius: 50, force: 0.06 }
};

function drawPlayer() {
  if (!player.alive) return;

  // Blink when invincible (but not during a dodge — roll animation communicates that)
  if (player.invincible > 0 && player.dodgeTimer <= 0 && Math.floor(frame / 4) % 2 === 0) return;

  const px = player.x;
  const py = player.y;

  ctx.save();

  // Pitch — tilt based on vertical velocity
  const pitchAngle = (player.vy / player.maxVel) * 0.35; // max ~20 degrees
  // Bank — squash vertical scale to fake 3D wing tilt
  const bankFactor = 1 - Math.abs(player.vy / player.maxVel) * 0.3; // squish to 70% at max speed
  ctx.translate(px, py);
  ctx.rotate(pitchAngle);
  ctx.scale(1, bankFactor);
  // Barrel roll overlay — cos(0→2π) = 1→-1→1, a full visual flip over the dodge duration
  if (player.dodgeTimer > 0) {
    ctx.scale(1, Math.cos(player.dodgeRoll));
  }
  ctx.translate(-px, -py);

  // Glow — boosted and flickering during dodge, normal idle pulse otherwise
  const glowIntensity = player.dodgeTimer > 0
    ? 25 + Math.sin(frame * 0.3) * 8
    : 10 + Math.sin(frame * 0.08) * 5;
  ctx.shadowColor = CONFIG.colors.player;
  ctx.shadowBlur = glowIntensity;

  // === TWIN ENGINE NACELLES ===
  // Top nacelle
  ctx.fillStyle = '#006080';
  ctx.beginPath();
  ctx.moveTo(px - 6, py - 10);
  ctx.lineTo(px - 14, py - 14);
  ctx.lineTo(px - 18, py - 13);
  ctx.lineTo(px - 18, py - 7);
  ctx.lineTo(px - 6, py - 6);
  ctx.closePath();
  ctx.fill();
  // Bottom nacelle
  ctx.beginPath();
  ctx.moveTo(px - 6, py + 10);
  ctx.lineTo(px - 14, py + 14);
  ctx.lineTo(px - 18, py + 13);
  ctx.lineTo(px - 18, py + 7);
  ctx.lineTo(px - 6, py + 6);
  ctx.closePath();
  ctx.fill();

  // === ENGINE EXHAUST (twin flames) ===
  // Boost flame size/glow when thrusting right
  const thrustFactor = Math.max(0, player.vx / player.maxVel); // 0..1
  const flameBase = 6 + thrustFactor * 10;
  const flameRand = 8 + thrustFactor * 8;
  const flameGlow = 12 + thrustFactor * 18;
  ctx.shadowBlur = flameGlow;
  ctx.shadowColor = thrustFactor > 0.3 ? '#44ccff' : '#00aaff';
  ctx.fillStyle = thrustFactor > 0.5 ? '#88eeff' : '#00ddff';
  const f1 = Math.random() * flameRand + flameBase;
  const f2 = Math.random() * flameRand + flameBase;
  // Top engine flame
  ctx.beginPath();
  ctx.moveTo(px - 18, py - 9);
  ctx.lineTo(px - 18 - f1, py - 10);
  ctx.lineTo(px - 18, py - 12);
  ctx.closePath();
  ctx.fill();
  // Bottom engine flame
  ctx.beginPath();
  ctx.moveTo(px - 18, py + 9);
  ctx.lineTo(px - 18 - f2, py + 10);
  ctx.lineTo(px - 18, py + 12);
  ctx.closePath();
  ctx.fill();
  // Inner hot core of flames
  ctx.fillStyle = '#ffffff';
  ctx.shadowBlur = 6 + thrustFactor * 10;
  ctx.beginPath();
  ctx.moveTo(px - 18, py - 9.5);
  ctx.lineTo(px - 18 - f1 * 0.4, py - 10);
  ctx.lineTo(px - 18, py - 11);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(px - 18, py + 9.5);
  ctx.lineTo(px - 18 - f2 * 0.4, py + 10);
  ctx.lineTo(px - 18, py + 11);
  ctx.closePath();
  ctx.fill();

  // === WINGS ===
  ctx.shadowBlur = glowIntensity;
  ctx.shadowColor = CONFIG.colors.player;
  // Top wing — swept back
  ctx.fillStyle = '#008899';
  ctx.beginPath();
  ctx.moveTo(px + 2, py - 5);       // wing root front
  ctx.lineTo(px - 10, py - 18);     // wing tip
  ctx.lineTo(px - 16, py - 17);     // wing tip trailing edge
  ctx.lineTo(px - 8, py - 5);       // wing root rear
  ctx.closePath();
  ctx.fill();
  // Bottom wing
  ctx.beginPath();
  ctx.moveTo(px + 2, py + 5);
  ctx.lineTo(px - 10, py + 18);
  ctx.lineTo(px - 16, py + 17);
  ctx.lineTo(px - 8, py + 5);
  ctx.closePath();
  ctx.fill();

  // Wing tip accents
  ctx.fillStyle = CONFIG.colors.player;
  ctx.fillRect(px - 15, py - 18, 5, 1.5);
  ctx.fillRect(px - 15, py + 17, 5, 1.5);

  // === MAIN FUSELAGE ===
  ctx.fillStyle = '#00a0bb';
  ctx.beginPath();
  ctx.moveTo(px + 22, py);          // nose tip
  ctx.lineTo(px + 10, py - 6);      // upper nose slope
  ctx.lineTo(px - 4, py - 7);       // upper body
  ctx.lineTo(px - 10, py - 5);      // rear upper
  ctx.lineTo(px - 10, py + 5);      // rear lower
  ctx.lineTo(px - 4, py + 7);       // lower body
  ctx.lineTo(px + 10, py + 6);      // lower nose slope
  ctx.closePath();
  ctx.fill();

  // Hull panel lines
  ctx.strokeStyle = 'rgba(0,240,255,0.3)';
  ctx.lineWidth = 0.5;
  // Longitudinal seam
  ctx.beginPath();
  ctx.moveTo(px + 18, py);
  ctx.lineTo(px - 8, py);
  ctx.stroke();
  // Cross panel
  ctx.beginPath();
  ctx.moveTo(px + 4, py - 6);
  ctx.lineTo(px + 4, py + 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px - 4, py - 7);
  ctx.lineTo(px - 4, py + 7);
  ctx.stroke();

  // === COCKPIT CANOPY ===
  ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(px + 16, py);
  ctx.lineTo(px + 8, py - 3);
  ctx.lineTo(px + 4, py - 2.5);
  ctx.lineTo(px + 4, py + 2.5);
  ctx.lineTo(px + 8, py + 3);
  ctx.closePath();
  ctx.fill();
  // Canopy glare
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.moveTo(px + 14, py - 0.5);
  ctx.lineTo(px + 9, py - 2);
  ctx.lineTo(px + 7, py - 1);
  ctx.lineTo(px + 12, py + 0.5);
  ctx.closePath();
  ctx.fill();

  // === NOSE ACCENT ===
  ctx.fillStyle = CONFIG.colors.player;
  ctx.shadowBlur = glowIntensity;
  ctx.beginPath();
  ctx.moveTo(px + 22, py);
  ctx.lineTo(px + 18, py - 1.5);
  ctx.lineTo(px + 18, py + 1.5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawShield() {
  if (!player.alive) return;
  if (player.shieldActive) {
    const pulse = 0.7 + Math.sin(frame * 0.07) * 0.3;
    const r = 35;
    ctx.save();
    ctx.shadowColor = '#ffee88';
    ctx.shadowBlur = 18 * pulse;
    ctx.strokeStyle = `rgba(255, 235, 120, ${0.55 + pulse * 0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, r, 0, Math.PI * 2);
    ctx.stroke();
    // Softer inner fill glow
    ctx.shadowBlur = 6;
    ctx.strokeStyle = `rgba(255, 255, 200, ${0.15 + pulse * 0.15})`;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(player.x, player.y, r - 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  } else if (player.shieldRechargeTimer > 0 && player.upgrades.shieldRegen > 0) {
    // Dim broken-ring indicator while recharging
    const progress = 1 - player.shieldRechargeTimer / (player.shieldRechargeSeconds * 60);
    ctx.save();
    ctx.shadowColor = '#ffee88';
    ctx.shadowBlur = 4;
    ctx.strokeStyle = `rgba(255, 220, 80, 0.2)`;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    // Arc grows as recharge progresses
    ctx.arc(player.x, player.y, 35, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function updatePlayer() {
  if (!player.alive) {
    player.respawnTimer--;
    if (player.respawnTimer <= 0 && player.lives > 0) {
      player.alive = true;
      player.x = 100;
      if (tunnelActive) {
        // Respawn at tunnel center with extra i-frames
        const bounds = getTunnelBoundsAtX(100);
        player.y = (bounds.topY + bounds.bottomY) / 2;
        player.invincible = 180; // 3 seconds during tunnel
      } else {
        player.y = CONFIG.height / 2;
        player.invincible = 120; // 2 seconds at 60fps
      }
      player.vx = 0;
      player.vy = 0;
      // Restore shield if player has the upgrade
      if (player.upgrades.shieldRegen > 0) {
        player.shieldActive = true;
        player.shieldRechargeTimer = 0;
      }
    }
    return;
  }

  if (player.invincible > 0) player.invincible--;
  if (player.dodgeTimer > 0) player.dodgeTimer--;
  if (player.dodgeCooldown > 0) player.dodgeCooldown--;
  if (player.shieldRechargeTimer > 0) {
    player.shieldRechargeTimer--;
    if (player.shieldRechargeTimer === 0 && player.upgrades.shieldRegen > 0) {
      player.shieldActive = true;
      screenFlash = 8;
      spawnExplosion(player.x, player.y, 10, ['#ffffff', '#ffee88', '#ffcc44']);
    }
  }

  // Advance barrel roll angle during active dodge
  if (player.dodgeTimer > 0) {
    player.dodgeRoll += (Math.PI * 2) / player.dodgeDuration;
  }

  // Movement — velocity-based with acceleration and drag
  let ix = 0, iy = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) ix = -1;
  if (keys['ArrowRight'] || keys['KeyD']) ix = 1;
  if (keys['ArrowUp']    || keys['KeyW']) iy = -1;
  if (keys['ArrowDown']  || keys['KeyS']) iy = 1;

  // Normalize diagonal input
  if (ix !== 0 && iy !== 0) {
    ix *= 0.707;
    iy *= 0.707;
  }

  // Accelerate toward input direction
  player.vx += ix * player.accel;
  player.vy += iy * player.accel;

  // Apply drag (always — this is what makes it floaty)
  player.vx *= player.drag;
  player.vy *= player.drag;

  // Clamp velocity
  const vel = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  if (vel > player.maxVel) {
    player.vx = (player.vx / vel) * player.maxVel;
    player.vy = (player.vy / vel) * player.maxVel;
  }

  // Kill tiny residual drift
  if (Math.abs(player.vx) < 0.05) player.vx = 0;
  if (Math.abs(player.vy) < 0.05) player.vy = 0;

  // Keep pitch angle in sync with vertical velocity for bullet direction
  player.pitchAngle = (player.vy / player.maxVel) * 0.35;

  player.x += player.vx;
  player.y += player.vy;

  // Bounds — soft bounce off edges
  if (player.x < 20)  { player.x = 20; player.vx *= -0.3; }
  if (player.x > CONFIG.width - 20)  { player.x = CONFIG.width - 20; player.vx *= -0.3; }
  if (player.y < 15)  { player.y = 15; player.vy *= -0.3; }
  if (player.y > CONFIG.height - 15) { player.y = CONFIG.height - 15; player.vy *= -0.3; }


  // Firing
  if (player.fireTimer > 0) player.fireTimer--;
  if (keys['Space'] && player.fireTimer <= 0) {
    firePlayerWeapon();
    player.fireTimer = player.fireRateOverride || CONFIG.playerFireRate;
  }

  // Secondary fire
  if (keys['KeyX']) {
    fireSecondary();
  }

  // Dodge — triggered by Shift key or double-tap direction
  if ((keys[DODGE_KEY] || keys[DODGE_KEY_ALT]) && !keys._dodgeHeld && player.dodgeCooldown <= 0) {
    keys._dodgeHeld = true;
    // Read current input direction; default to forward if no input
    let dx = 0, dy = 0;
    if (keys['ArrowLeft']  || keys['KeyA']) dx = -1;
    if (keys['ArrowRight'] || keys['KeyD']) dx =  1;
    if (keys['ArrowUp']    || keys['KeyW']) dy = -1;
    if (keys['ArrowDown']  || keys['KeyS']) dy =  1;
    if (dx === 0 && dy === 0) dx = 1;
    triggerDodge(dx, dy);
  } else if (!keys[DODGE_KEY] && !keys[DODGE_KEY_ALT]) {
    keys._dodgeHeld = false;
  }

  // Double-tap dodge check (set by keydown listener)
  if (player._doubleTapDodge) {
    const dt = player._doubleTapDodge;
    player._doubleTapDodge = null;
    if (player.dodgeCooldown <= 0) {
      triggerDodge(dt.dx, dt.dy);
    }
  }
}

function triggerDodge(dx, dy) {
  if (player.dodgeTimer > 0) return; // already dodging
  const dlen = Math.sqrt(dx * dx + dy * dy);
  if (dlen === 0) { dx = 1; dy = 0; }
  const nx = dlen === 0 ? 1 : dx / dlen;
  const ny = dlen === 0 ? 0 : dy / dlen;

  player.dodgeVx = nx * DODGE_IMPULSE;
  player.dodgeVy = ny * DODGE_IMPULSE;
  player.vx = player.dodgeVx;
  player.vy = player.dodgeVy;
  player.dodgeTimer    = player.dodgeDuration;
  player.dodgeCooldown = player.dodgeCooldownBase;
  player.invincible    = player.dodgeDuration + 2;
  player.dodgeRoll     = 0;

  // Engine blast — directional burst opposite the dash
  for (let i = 0; i < 14; i++) {
    const spread = (Math.random() - 0.5) * 1.2;
    const spd    = Math.random() * 5 + 3;
    const angle  = Math.atan2(-player.dodgeVy, -player.dodgeVx) + spread;
    particles.push({
      x: player.x, y: player.y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1.0,
      decay: Math.random() * 0.04 + 0.03,
      size: Math.random() * 5 + 2,
      colors: ['#ffffff', '#44ddff', '#0088bb']
    });
  }
}

function firePlayerWeapon() {
  const lvl = player.weaponLevel;
  const bx = player.x + 20;
  const by = player.y;
  const p = player.pitchAngle || 0;

  // Helper: spawn a bullet at a given angle (pitch-relative)
  function fire(x, y, angle) {
    spawnPlayerBullet(x, y,
      CONFIG.bulletSpeed * Math.cos(angle),
      CONFIG.bulletSpeed * Math.sin(angle));
  }

  if (lvl === 1) {
    fire(bx, by, p);
  } else if (lvl === 2) {
    fire(bx, by - 3, p);
    fire(bx, by + 3, p);
  } else if (lvl === 3) {
    fire(bx, by,     p);
    fire(bx, by - 3, p - 0.12);
    fire(bx, by + 3, p + 0.12);
  } else if (lvl === 4) {
    fire(bx, by - 2, p);
    fire(bx, by + 2, p);
    fire(bx, by - 5, p - 0.14);
    fire(bx, by + 5, p + 0.14);
  } else if (lvl >= 5) {
    fire(bx, by, p);
    for (let i = -2; i <= 2; i++) {
      if (i !== 0) fire(bx, by, p + i * 0.09);
    }
  }
  player.shotsFired++;
}

function spawnPlayerBullet(x, y, vx, vy) {
  if (playerBullets.length >= CONFIG.maxBullets) return;
  playerBullets.push({ x, y, vx, vy, width: 12, height: 3, alive: true });
}

function fireSecondary() {
  // Placeholder for secondary weapon system
}

function updatePlayerBullets() {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    // Gravitational deflection near gravwells
    for (const e of enemies) {
      if (e.type !== 'gravwell') continue;
      const dx = e.x - b.x;
      const dy = e.y - b.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq);
      if (dist < 160 && dist > 14) {
        const force = 1600 / distSq;
        b.vx += (dx / dist) * force;
        b.vy += (dy / dist) * force;
        // Cap so bullets don't go supersonic
        const spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (spd > CONFIG.bulletSpeed * 1.7) {
          b.vx = (b.vx / spd) * CONFIG.bulletSpeed * 1.7;
          b.vy = (b.vy / spd) * CONFIG.bulletSpeed * 1.7;
        }
      }
    }
    // Grav Lock — steer bullets toward nearest enemy
    if (player.gravLock.radius > 0) {
      let nearDist = player.gravLock.radius;
      let nearDx = 0, nearDy = 0;
      let found = false;
      for (const e of enemies) {
        const dx = e.x - b.x;
        const dy = e.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < nearDist) {
          nearDist = dist;
          nearDx = dx / dist;
          nearDy = dy / dist;
          found = true;
        }
      }
      // Also check mid-boss and boss
      if (midBoss && midBoss.alive) {
        const dx = midBoss.x - b.x, dy = midBoss.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < nearDist) { nearDist = dist; nearDx = dx / dist; nearDy = dy / dist; found = true; }
      }
      if (boss && boss.alive) {
        const dx = boss.x - b.x, dy = boss.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < nearDist) { nearDist = dist; nearDx = dx / dist; nearDy = dy / dist; found = true; }
      }
      if (found) {
        b.vx += nearDx * player.gravLock.force;
        b.vy += nearDy * player.gravLock.force;
        // Maintain bullet speed — normalize to original speed
        const spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        const targetSpd = CONFIG.bulletSpeed;
        if (spd > 0) {
          b.vx = (b.vx / spd) * targetSpd;
          b.vy = (b.vy / spd) * targetSpd;
        }
      }
    }

    b.x += b.vx;
    b.y += b.vy;
    if (b.x > CONFIG.width + 20 || b.x < -20 || b.y < -20 || b.y > CONFIG.height + 20) {
      playerBullets.splice(i, 1);
    }
  }
}

function drawPlayerBullets() {
  ctx.save();
  for (const b of playerBullets) {
    const bx = b.x - b.width / 2;
    const by = b.y - b.height / 2;

    // Outer neon bloom
    ctx.shadowColor = CONFIG.colors.playerBullet;
    ctx.shadowBlur = 20;
    ctx.fillStyle = 'rgba(0, 255, 255, 0.25)';
    ctx.fillRect(bx - 3, by - 2, b.width + 6, b.height + 4);

    // Main bullet body
    ctx.shadowBlur = 12;
    ctx.fillStyle = CONFIG.colors.playerBullet;
    ctx.fillRect(bx, by, b.width, b.height);

    // Hot white core
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 6;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillRect(bx + 2, by + 0.5, b.width * 0.5, b.height - 1);
  }
  ctx.restore();
}

// === ENEMY BULLETS ===
function spawnEnemyBullet(x, y, vx, vy) {
  if (enemyBullets.length >= CONFIG.maxBullets) return;
  enemyBullets.push({ x, y, vx, vy, radius: 4, alive: true });
}

function updateEnemyBullets() {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.rotSpeed !== undefined) b.rotation += b.rotSpeed;

    if (b.phase === 'exiting' && b.x > CONFIG.width + 55) {
      // Sucked off screen — re-enter from the right aimed at player's current Y
      b.phase = 'incoming';
      b.x = CONFIG.width + 28;
      b.y = player.y + (Math.random() - 0.5) * 30;
      const spd = b.isMerged ? 9 : 7;
      b.vx = -spd;
      b.vy = 0;
    } else if (b.phase !== 'exiting') {
      // Normal out-of-bounds removal (don't remove exiting bullets heading right)
      if (b.x < -30 || b.x > CONFIG.width + 30 || b.y < -30 || b.y > CONFIG.height + 30) {
        enemyBullets.splice(i, 1);
      }
    }
  }
}

function drawEnemyBullets() {
  ctx.save();
  for (const b of enemyBullets) {
    if (b.verts) {
      // Flung asteroid projectile (isMerged = brighter, red, larger glow)
      const isMerged = b.isMerged;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rotation);
      ctx.shadowColor = isMerged ? '#ff0000' : '#ff6600';
      ctx.shadowBlur = isMerged ? 28 : 14;
      ctx.fillStyle = isMerged ? '#1a0000' : '#12121e';
      ctx.beginPath();
      ctx.moveTo(b.verts[0].x, b.verts[0].y);
      for (let i = 1; i < b.verts.length; i++) ctx.lineTo(b.verts[i].x, b.verts[i].y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = isMerged ? '#ff2200' : '#ff6600';
      ctx.lineWidth = isMerged ? 2.5 : 1.5;
      ctx.stroke();
      if (isMerged) {
        // Pulsing corona — makes the merged rock glow like a charged projectile
        const coronaPulse = Math.sin(frame * 0.22) * 0.5 + 0.5;
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 40 + coronaPulse * 20;
        ctx.strokeStyle = `rgba(255, ${Math.floor(60 * (1 - coronaPulse))}, 0, ${0.35 + coronaPulse * 0.45})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, b.radius + 5 + coronaPulse * 5, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (b.cracks) {
        ctx.strokeStyle = isMerged ? '#ff6644' : '#ff8833';
        ctx.lineWidth = 0.8;
        ctx.shadowBlur = isMerged ? 10 : 5;
        for (const c of b.cracks) {
          ctx.beginPath();
          ctx.moveTo(c.x1, c.y1);
          ctx.lineTo(c.xm, c.ym);
          ctx.lineTo(c.x2, c.y2);
          ctx.stroke();
        }
      }
      ctx.restore();
    } else {
      // Outer neon bloom
      ctx.shadowColor = CONFIG.colors.enemyBullet;
      ctx.shadowBlur = 22;
      ctx.fillStyle = 'rgba(255, 68, 0, 0.2)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius + 3, 0, Math.PI * 2);
      ctx.fill();

      // Main bullet body
      ctx.shadowBlur = 14;
      ctx.fillStyle = CONFIG.colors.enemyBullet;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();

      // Hot white-yellow core
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 6;
      ctx.fillStyle = 'rgba(255, 220, 150, 0.75)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// === ENEMIES ===
function generateAsteroidData(baseRadius) {
  const n = 8 + Math.floor(Math.random() * 3);
  const verts = [];
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * (Math.PI / n * 0.8);
    const r = baseRadius * (0.65 + Math.random() * 0.55);
    verts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
  }
  // Interior cracks — glowing fissures radiating from near-center
  const crackCount = 2 + Math.floor(Math.random() * 3);
  const cracks = [];
  for (let i = 0; i < crackCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const startR = baseRadius * 0.05;
    const endR   = baseRadius * (0.4 + Math.random() * 0.3);
    const midA   = angle + (Math.random() - 0.5) * 0.5;
    const midR   = (startR + endR) * (0.45 + Math.random() * 0.2);
    cracks.push({
      x1: Math.cos(angle) * startR, y1: Math.sin(angle) * startR,
      xm: Math.cos(midA)  * midR,   ym: Math.sin(midA)  * midR,
      x2: Math.cos(angle + (Math.random() - 0.5) * 0.35) * endR,
      y2: Math.sin(angle + (Math.random() - 0.5) * 0.35) * endR,
    });
  }
  return { verts, cracks };
}

function spawnEnemy(type, x, y, options = {}) {
  if (enemies.length >= CONFIG.maxEnemies) return;
  const cfg = CONFIG.enemies[type];
  const enemy = {
    type,
    x, y,
    width:  type === 'spawner' ? 50 : type === 'gravwell' ? 30 : 30,
    height: type === 'spawner' ? 40 : type === 'gravwell' ? 30 : 25,
    hp: cfg.hp,
    maxHp: cfg.hp,
    points: cfg.points,
    alive: true,
    frame: 0,
    fireTimer: Math.random() * 60 + 60,
    // Type-specific
    startY: y,
    speed: options.speed || 2,
    triggered: false
  };
  if (type === 'gravwell') {
    enemy.targetX = CONFIG.width - 200;
    enemy.fireTimer = 160 + Math.floor(Math.random() * 80);
    enemy.energy = 0;
    enemy.maxEnergy = 100;
    enemy.orbitingAsteroids = [];
    // Inner ring: 3 small, faster
    for (let i = 0; i < 3; i++) {
      const data = generateAsteroidData(9);
      enemy.orbitingAsteroids.push({
        angle: (i / 3) * Math.PI * 2 + 0.4,
        orbitRadius: 44, orbitSpeed: 0.028,
        verts: data.verts, cracks: data.cracks,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() * 0.04 + 0.02) * (Math.random() < 0.5 ? 1 : -1),
        alive: true, respawnTimer: 0, respawnFrames: 240
      });
    }
    // Outer ring: 2 larger, slower
    for (let i = 0; i < 2; i++) {
      const data = generateAsteroidData(13);
      enemy.orbitingAsteroids.push({
        angle: (i / 2) * Math.PI * 2,
        orbitRadius: 68, orbitSpeed: 0.016,
        verts: data.verts, cracks: data.cracks,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() * 0.03 + 0.01) * (Math.random() < 0.5 ? 1 : -1),
        alive: true, respawnTimer: 0, respawnFrames: 300
      });
    }
  }
  if (type === 'turret') {
    enemy.bodyRotation = Math.random() * Math.PI * 2;
    enemy.rotSpeed = 0.03;
    const respawnFrames = Math.round(3 * Math.PI * 2 / 0.03);
    enemy.armorPlates = [0,1,2,3].map(() => ({ alive: true, respawnTimer: 0, respawnFrames }));
    enemy.targetX = CONFIG.width - 220; // anchor point inside playfield
  }
  const asteroidRadii = { drone: 14, charger: 18, spawner: 26 };
  if (asteroidRadii[type] !== undefined) {
    const data = generateAsteroidData(asteroidRadii[type]);
    enemy.verts = data.verts;
    enemy.cracks = data.cracks;
    enemy.rotation = Math.random() * Math.PI * 2;
    enemy.rotSpeed = (Math.random() * 0.008 + 0.003) * (Math.random() < 0.5 ? 1 : -1);
  }
  enemies.push(enemy);
  return enemy;
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.frame++;

    switch (e.type) {
      case 'drone':
        if (preMidBoss && e.ambient) {
          // ~1 in 10 ambient asteroids get suctioned; rest fly through normally
          if (!e.suctionPhase) {
            if (e.suctionDelay === undefined)
              e.suctionDelay = Math.random() < 0.1 ? 40 + Math.floor(Math.random() * 120) : -1;
            if (e.suctionDelay > 0) e.suctionDelay--;
            if (e.suctionDelay === 0) e.suctionPhase = 'slowing';
            e.x -= e.speed;
          } else if (e.suctionPhase === 'slowing') {
            e.speed = Math.max(0, e.speed - 0.09);
            e.x -= e.speed;
            if (e.speed <= 0) { e.suctionPhase = 'wiggling'; e.suctionTimer = 40; }
          } else if (e.suctionPhase === 'wiggling') {
            e.suctionTimer--;
            if (e.suctionTimer <= 0) { e.suctionPhase = 'sucked'; e.speed = 0.5; }
          } else if (e.suctionPhase === 'sucked') {
            e.speed = Math.min(e.speed + 0.55, 16);
            e.x += e.speed;
          }
        } else {
          e.x -= e.speed;
        }
        break;

      case 'weaver':
        e.x -= e.speed;
        e.y = e.startY + Math.sin(e.frame * 0.05) * 50;
        // Fire aimed shot only when player is in forward cone (~60° half-angle)
        e.fireTimer--;
        if (e.fireTimer <= 0 && e.x < CONFIG.width - 100 && player.alive) {
          const dx = player.x - e.x;
          const dy = player.y - e.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          // Forward is (-1, 0); dot with normalized-to-player = -dx/dist
          // cos(60°) = 0.5 — only fire if player is within 60° of nose
          if (-dx / dist > 0.5) {
            fireAimedShot(e);
          }
          e.fireTimer = 120;
        }
        break;

      case 'charger':
        if (e.isShepherdInbound) {
          e.x += e.speed;
          e.rotation += 0.02;
          break;
        }
        if (preMidBoss && e.ambient) {
          // ~1 in 10 ambient asteroids get suctioned; rest fly through normally
          if (!e.suctionPhase) {
            if (e.suctionDelay === undefined)
              e.suctionDelay = Math.random() < 0.1 ? 40 + Math.floor(Math.random() * 120) : -1;
            if (e.suctionDelay > 0) e.suctionDelay--;
            if (e.suctionDelay === 0) e.suctionPhase = 'slowing';
            e.x -= e.speed;
          } else if (e.suctionPhase === 'slowing') {
            e.speed = Math.max(0, e.speed - 0.09);
            e.x -= e.speed;
            if (e.speed <= 0) { e.suctionPhase = 'wiggling'; e.suctionTimer = 40; }
          } else if (e.suctionPhase === 'wiggling') {
            e.suctionTimer--;
            if (e.suctionTimer <= 0) { e.suctionPhase = 'sucked'; e.speed = 0.5; }
          } else if (e.suctionPhase === 'sucked') {
            e.speed = Math.min(e.speed + 0.55, 16);
            e.x += e.speed;
          }
        } else if (!e.triggered) {
          // Drift in slowly
          e.x -= 0.5;
          if (e.x < CONFIG.width - 80) {
            e.triggered = true;
            e.targetY = player.y;
          }
        } else {
          // Rush toward player's Y, then fly left fast
          const dy = e.targetY - e.y;
          e.y += Math.sign(dy) * Math.min(Math.abs(dy), 4);
          e.x -= 6;
        }
        break;

      case 'turret':
        if (!e.tunnelTurret && e.x > e.targetX) e.x -= 2;
        e.bodyRotation += e.rotSpeed;
        for (const plate of e.armorPlates) {
          if (!plate.alive && plate.respawnTimer > 0) {
            plate.respawnTimer--;
            if (plate.respawnTimer === 0) plate.alive = true;
          }
        }
        e.fireTimer--;
        if (e.fireTimer <= 0 && player.alive) {
          for (let s = 0; s < 3; s++) {
            setTimeout(() => { if (e.alive) fireAimedShot(e); }, s * 100);
          }
          e.fireTimer = 180;
        }
        break;

      case 'spawner':
        e.x -= 1;
        break;

      case 'bomber':
        e.x -= e.speed;
        e.fireTimer--;
        if (e.fireTimer <= 0) {
          // Drop bomb downward
          spawnEnemyBullet(e.x, e.y + e.height / 2, -1, 3);
          e.fireTimer = 90;
        }
        break;

      case 'gravwell':
        // Glide to anchor position
        if (e.x > e.targetX) e.x -= 2;
        // Gentle hover
        e.y = e.startY + Math.sin(e.frame * 0.018) * 40;
        // Spin orbit and respawn captured asteroids
        for (const oa of e.orbitingAsteroids) {
          if (oa.alive) {
            oa.angle += oa.orbitSpeed;
            oa.rotation += oa.rotSpeed;
          } else if (oa.respawnTimer > 0) {
            oa.respawnTimer--;
            if (oa.respawnTimer === 0) oa.alive = true;
          }
        }
        // Fling attack
        e.fireTimer--;
        if (e.fireTimer <= 0 && player.alive) {
          const liveOnes = e.orbitingAsteroids.filter(oa => oa.alive);
          if (liveOnes.length > 0) {
            const target = liveOnes[Math.floor(Math.random() * liveOnes.length)];
            const wx = e.x + Math.cos(target.angle) * target.orbitRadius;
            const wy = e.y + Math.sin(target.angle) * target.orbitRadius;
            const dx = player.x - wx;
            const dy = player.y - wy;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const spd = 3.5;
            enemyBullets.push({
              x: wx, y: wy,
              vx: (dx / dist) * spd,
              vy: (dy / dist) * spd,
              radius: 10,
              alive: true,
              verts: target.verts,
              cracks: target.cracks,
              rotation: target.rotation,
              rotSpeed: target.rotSpeed
            });
            target.alive = false;
            target.respawnTimer = target.respawnFrames;
          }
          e.fireTimer = 140 + Math.floor(Math.random() * 80);
        }
        break;
    }

    if (e.rotSpeed !== undefined) e.rotation += e.rotSpeed;

    // Remove if off-screen (either side)
    if (e.x < -60 || e.x > CONFIG.width + 80) {
      enemies.splice(i, 1);
    }
  }
}

function fireAimedShot(enemy) {
  if (!player.alive) return;
  const dx = player.x - enemy.x;
  const dy = player.y - enemy.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  spawnEnemyBullet(
    enemy.x,
    enemy.y,
    (dx / dist) * CONFIG.enemyBulletSpeed,
    (dy / dist) * CONFIG.enemyBulletSpeed
  );
}

const ASTEROID_TYPES = new Set(['drone', 'charger', 'spawner']);

function drawAsteroidEnemy(e) {
  const triggered = e.type === 'charger' && e.triggered;
  // Ambient asteroids being sucked by the approaching Shepherd glow red
  const sucked = e.suctionPhase != null;
  const glowColor = triggered ? '#ff8844' : sucked ? '#ff4400' : CONFIG.colors.asteroid;

  ctx.shadowColor = glowColor;
  ctx.shadowBlur = triggered ? 16 : sucked ? 22 : 12;

  // Wiggle effect while caught in suction
  const wiggleX = e.suctionPhase === 'wiggling' ? Math.sin(e.frame * 1.3) * 5 : 0;
  const wiggleY = e.suctionPhase === 'wiggling' ? Math.cos(e.frame * 0.9) * 3 : 0;
  ctx.translate(e.x + wiggleX, e.y + wiggleY);
  ctx.rotate(e.rotation);

  // Rocky body
  ctx.fillStyle = '#12121e';
  ctx.beginPath();
  ctx.moveTo(e.verts[0].x, e.verts[0].y);
  for (let i = 1; i < e.verts.length; i++) ctx.lineTo(e.verts[i].x, e.verts[i].y);
  ctx.closePath();
  ctx.fill();

  // Phosphorescent outline
  ctx.strokeStyle = glowColor;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Interior cracks — same neon glow as outline
  ctx.strokeStyle = glowColor;
  ctx.lineWidth = 1;
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const c of e.cracks) {
    ctx.beginPath();
    ctx.moveTo(c.x1, c.y1);
    ctx.lineTo(c.xm, c.ym);
    ctx.lineTo(c.x2, c.y2);
    ctx.stroke();
  }
}

function drawCraftEnemy(e) {
  ctx.shadowColor = CONFIG.colors.enemy;
  ctx.shadowBlur = 8;
  ctx.fillStyle = CONFIG.colors.enemy;

  switch (e.type) {
    case 'weaver': {
      // Double-delta interceptor, nose pointing left
      ctx.beginPath();
      ctx.moveTo(e.x - 18, e.y);
      ctx.lineTo(e.x - 8,  e.y - 5);
      ctx.lineTo(e.x + 2,  e.y - 5);
      ctx.lineTo(e.x + 6,  e.y - 16);   // outer wing tip
      ctx.lineTo(e.x + 12, e.y - 5);
      ctx.lineTo(e.x + 16, e.y - 9);    // tail fin
      ctx.lineTo(e.x + 16, e.y);
      ctx.lineTo(e.x + 16, e.y + 9);
      ctx.lineTo(e.x + 12, e.y + 5);
      ctx.lineTo(e.x + 6,  e.y + 16);
      ctx.lineTo(e.x + 2,  e.y + 5);
      ctx.lineTo(e.x - 8,  e.y + 5);
      ctx.closePath();
      ctx.fill();
      // Engine glows at rear
      ctx.shadowColor = '#ff6600';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(255,100,0,0.8)';
      ctx.beginPath();
      ctx.arc(e.x + 16, e.y - 5, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e.x + 16, e.y + 5, 2.5, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'turret': {
      const spread = 0.55;
      // Ghost plates — dim outline showing where plates will respawn
      ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const plate = e.armorPlates[i];
        if (plate.alive || plate.respawnTimer <= 0) continue;
        const progress = 1 - plate.respawnTimer / plate.respawnFrames;
        const alpha = 0.08 + progress * 0.22;
        ctx.strokeStyle = `rgba(255,0,170,${alpha.toFixed(2)})`;
        ctx.lineWidth = 6;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 15, e.bodyRotation + i * Math.PI / 2 - spread,
                                e.bodyRotation + i * Math.PI / 2 + spread);
        ctx.stroke();
      }
      // Active armor plates
      ctx.strokeStyle = CONFIG.colors.enemy;
      ctx.lineWidth = 6;
      ctx.shadowColor = CONFIG.colors.enemy;
      ctx.shadowBlur = 10;
      for (let i = 0; i < 4; i++) {
        if (!e.armorPlates[i].alive) continue;
        const a = e.bodyRotation + i * Math.PI / 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 15, a - spread, a + spread);
        ctx.stroke();
      }
      // Center sphere — pulses and goes white-hot when fully exposed
      const exposed = e.armorPlates.every(p => !p.alive);
      const pulse = Math.sin(e.frame * 0.28);
      const coreRadius = exposed ? 6 + pulse * 3.5 : 6;
      const coreColor  = exposed ? '#ffffff' : CONFIG.colors.enemy;
      const coreGlow   = exposed ? 14 + pulse * 10 : 8;
      ctx.fillStyle = coreColor;
      ctx.shadowColor = coreColor;
      ctx.shadowBlur = coreGlow;
      ctx.beginPath();
      ctx.arc(e.x, e.y, coreRadius, 0, Math.PI * 2);
      ctx.fill();
      // Barrel — independently tracks player
      if (player.alive) {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        ctx.strokeStyle = CONFIG.colors.enemy;
        ctx.lineWidth = 4;
        ctx.lineCap = 'square';
        ctx.shadowColor = CONFIG.colors.enemy;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(e.x + Math.cos(angle) * 6, e.y + Math.sin(angle) * 6);
        ctx.lineTo(e.x + Math.cos(angle) * 24, e.y + Math.sin(angle) * 24);
        ctx.stroke();
      }
      break;
    }

    case 'gravwell': {
      const pulse = Math.sin(e.frame * 0.07) * 0.5 + 0.5;
      const energyFrac = e.energy / e.maxEnergy;
      // Pulse faster as energy builds
      const chargePulse = Math.sin(e.frame * (0.07 + energyFrac * 0.18)) * 0.5 + 0.5;

      // Tractor beams to each alive orbiting asteroid
      ctx.setLineDash([5, 6]);
      ctx.lineWidth = 1;
      for (const oa of e.orbitingAsteroids) {
        if (!oa.alive) continue;
        const wx = e.x + Math.cos(oa.angle) * oa.orbitRadius;
        const wy = e.y + Math.sin(oa.angle) * oa.orbitRadius;
        ctx.strokeStyle = `rgba(160, 80, 255, ${0.18 + pulse * 0.18})`;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(wx, wy);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Gravity pulse rings
      ctx.strokeStyle = `rgba(160, 80, 255, ${0.15 + pulse * 0.25})`;
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 30 + pulse * 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(160, 80, 255, ${0.08 + pulse * 0.12})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 50 + pulse * 8, 0, Math.PI * 2);
      ctx.stroke();

      // Energy charge ring — glows when near nova
      if (energyFrac > 0) {
        ctx.strokeStyle = `rgba(255, ${Math.floor(100 + (1-energyFrac)*100)}, 255, ${0.15 + energyFrac * 0.5})`;
        ctx.lineWidth = 1.5 + energyFrac * 2;
        ctx.shadowColor = energyFrac > 0.6 ? '#ffaaff' : '#cc66ff';
        ctx.shadowBlur = 8 + energyFrac * 20;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 17 + chargePulse * (2 + energyFrac * 6), 0, Math.PI * 2);
        ctx.stroke();
      }

      // Warped scanlines — gravitational lensing effect
      const warpR = 84;
      ctx.shadowBlur = 0;
      for (let dy = -warpR; dy <= warpR; dy += 4) {
        const halfW = Math.sqrt(Math.max(0, warpR * warpR - dy * dy));
        if (halfW < 1) continue;
        const sy = e.y + dy;
        if (sy < 0 || sy > CONFIG.height) continue;
        const distFactor = 1 - (Math.abs(dy) / warpR);
        const bend = (18 + chargePulse * 10 + energyFrac * 12) * distFactor * distFactor;
        const ctrlY = sy - Math.sign(dy || 1) * bend;
        const alpha = (0.07 + distFactor * 0.10) * (1 + energyFrac * 0.8);
        const g = Math.floor(100 + (1 - energyFrac) * 80);
        ctx.strokeStyle = `rgba(180, ${g}, 255, ${Math.min(0.35, alpha).toFixed(2)})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(e.x - halfW, sy);
        ctx.quadraticCurveTo(e.x, ctrlY, e.x + halfW, sy);
        ctx.stroke();
      }

      // Outer hull ring
      ctx.strokeStyle = '#aa44ff';
      ctx.shadowColor = '#aa44ff';
      ctx.shadowBlur = 8 + pulse * 6;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 14, 0, Math.PI * 2);
      ctx.stroke();

      // Hull struts (4 arms)
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = e.frame * 0.012 + i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(e.x + Math.cos(a) * 7, e.y + Math.sin(a) * 7);
        ctx.lineTo(e.x + Math.cos(a) * 14, e.y + Math.sin(a) * 14);
        ctx.stroke();
      }

      // Dark core fill
      ctx.fillStyle = '#110022';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 12, 0, Math.PI * 2);
      ctx.fill();

      // Energy-charged core — swells and shifts color toward white-hot
      const coreR = 5 + energyFrac * 14 + chargePulse * (2 + energyFrac * 3);
      const rr = Math.floor(200 + energyFrac * 55);
      const rg = Math.floor(120 - energyFrac * 60);
      const rb = 255;
      const coreAlpha = 0.5 + chargePulse * 0.5;
      ctx.fillStyle = `rgba(${rr}, ${rg}, ${rb}, ${coreAlpha})`;
      ctx.shadowColor = energyFrac > 0.5 ? '#ffaaff' : '#cc66ff';
      ctx.shadowBlur = 14 + energyFrac * 22 + chargePulse * (10 + energyFrac * 8);
      ctx.beginPath();
      ctx.arc(e.x, e.y, coreR, 0, Math.PI * 2);
      ctx.fill();
      // White-hot inner flare at high energy
      if (energyFrac > 0.5) {
        ctx.fillStyle = `rgba(255, 255, 255, ${(energyFrac - 0.5) * 2 * chargePulse})`;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(e.x, e.y, coreR * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }

      // Orbiting asteroids
      for (const oa of e.orbitingAsteroids) {
        if (!oa.alive) continue;
        const wx = e.x + Math.cos(oa.angle) * oa.orbitRadius;
        const wy = e.y + Math.sin(oa.angle) * oa.orbitRadius;
        ctx.save();
        ctx.translate(wx, wy);
        ctx.rotate(oa.rotation);
        ctx.shadowColor = '#aaeeff';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#12121e';
        ctx.beginPath();
        ctx.moveTo(oa.verts[0].x, oa.verts[0].y);
        for (let i = 1; i < oa.verts.length; i++) ctx.lineTo(oa.verts[i].x, oa.verts[i].y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#aaeeff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.strokeStyle = '#aaeeff';
        ctx.lineWidth = 0.8;
        ctx.shadowBlur = 4;
        for (const c of oa.cracks) {
          ctx.beginPath();
          ctx.moveTo(c.x1, c.y1);
          ctx.lineTo(c.xm, c.ym);
          ctx.lineTo(c.x2, c.y2);
          ctx.stroke();
        }
        ctx.restore();
      }
      break;
    }

    case 'bomber': {
      // Heavy fuselage with swept wings (tighter vertical span)
      ctx.beginPath();
      ctx.moveTo(e.x - 18, e.y);         // nose
      ctx.lineTo(e.x - 8,  e.y - 5);     // upper fuselage
      ctx.lineTo(e.x + 4,  e.y - 5);     // wing root upper
      ctx.lineTo(e.x + 8,  e.y - 13);    // wing tip upper
      ctx.lineTo(e.x + 18, e.y - 7);     // trailing wing upper
      ctx.lineTo(e.x + 20, e.y);         // tail
      ctx.lineTo(e.x + 18, e.y + 7);     // trailing wing lower
      ctx.lineTo(e.x + 8,  e.y + 13);    // wing tip lower
      ctx.lineTo(e.x + 4,  e.y + 5);     // wing root lower
      ctx.lineTo(e.x - 8,  e.y + 5);     // lower fuselage
      ctx.closePath();
      ctx.fill();
      // Bomb bay slit
      ctx.fillStyle = '#0a0a1a';
      ctx.shadowBlur = 0;
      ctx.fillRect(e.x - 6, e.y - 2, 14, 4);
      // Active bomb indicator
      ctx.fillStyle = CONFIG.colors.enemyBullet;
      ctx.shadowColor = CONFIG.colors.enemyBullet;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(e.x + 2, e.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
  }

  // Scanline overlay (weaver + bomber only — turret/gravwell are ring shapes, not filled bodies)
  if (e.type !== 'turret' && e.type !== 'gravwell') {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.shadowBlur = 0;
    const ex = e.x - e.width / 2;
    const ey = e.y - e.height / 2;
    for (let sy = ey; sy < ey + e.height; sy += 4) {
      ctx.fillRect(ex - 2, sy, e.width + 4, 2);
    }
  }
}

function drawEnemies() {
  ctx.save();
  for (const e of enemies) {
    ctx.save();
    if (ASTEROID_TYPES.has(e.type)) {
      drawAsteroidEnemy(e);
    } else {
      drawCraftEnemy(e);
    }
    // Hit flash — bright white glow burst around enemy on hit
    if (e.hitFlash > 0) {
      const flashAlpha = e.hitFlash / 5 * 0.6;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 25 * (e.hitFlash / 5);
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, Math.max(e.width, e.height) * 0.6, 0, Math.PI * 2);
      ctx.fill();
      e.hitFlash--;
    }
    ctx.restore();
  }
  ctx.restore();
}

// === PARTICLES / EXPLOSIONS ===
function spawnExplosion(x, y, count, colorSequence) {
  for (let i = 0; i < count && particles.length < CONFIG.maxParticles; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: Math.random() * 0.03 + 0.02,
      size: Math.random() * 4 + 2,
      colors: colorSequence
    });
  }
}

// Directional impact sparks — spray particles along bullet direction with spread
function spawnImpactSparks(x, y, bvx, bvy, count, colorSequence) {
  const bulletAngle = Math.atan2(bvy, bvx);
  for (let i = 0; i < count && particles.length < CONFIG.maxParticles; i++) {
    // Sparks fly forward (bullet dir) with a wide cone + some reverse splash
    const forward = Math.random() > 0.25;
    const spread = forward ? (Math.random() - 0.5) * Math.PI * 0.8 : Math.PI + (Math.random() - 0.5) * Math.PI * 0.5;
    const angle = bulletAngle + spread;
    const speed = forward ? Math.random() * 6 + 3 : Math.random() * 3 + 1;
    const isSpark = Math.random() < 0.4;
    particles.push({
      x: x + (Math.random() - 0.5) * 4,
      y: y + (Math.random() - 0.5) * 4,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: isSpark ? Math.random() * 0.04 + 0.05 : Math.random() * 0.03 + 0.02,
      size: isSpark ? Math.random() * 2 + 1 : Math.random() * 4 + 2,
      colors: colorSequence
    });
  }
}

// Quick bright flash at impact point
function spawnHitFlash(x, y, radius) {
  localFlashes.push({ x, y, radius, life: 1.0, fast: true });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  ctx.save();
  for (const p of particles) {
    const colors = p.colors;
    const idx = Math.min(Math.floor((1 - p.life) * colors.length), colors.length - 1);
    ctx.fillStyle = colors[idx];
    ctx.globalAlpha = p.life;
    ctx.shadowColor = colors[idx];
    ctx.shadowBlur = 6;

    // Small fast particles render as velocity streaks (sparks)
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (p.size <= 2.5 && speed > 2) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      const streakLen = Math.min(speed * 2.5, 12);
      ctx.shadowBlur = 10;
      ctx.fillRect(-streakLen / 2, -p.size / 2, streakLen, p.size);
      ctx.restore();
    } else {
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.restore();
}

const explosionColors = ['#ffffff', '#00ffff', '#ff00aa', '#2a1040'];

// === PICKUPS ===
function spawnPickup(x, y, type) {
  pickups.push({ x, y, type, width: 20, height: 20, alive: true, frame: 0 });
}

function updatePickups() {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.x -= 1; // drift left
    p.frame++;
    if (p.x < -30) { pickups.splice(i, 1); continue; }

    // Collect on contact (circle-to-circle, generous)
    if (player.alive) {
      const dx = p.x - player.x;
      const dy = p.y - player.y;
      if (Math.sqrt(dx * dx + dy * dy) < 30) {
        applyPickup(p);
        pickups.splice(i, 1);
      }
    }
  }
}

function applyPickup(p) {
  switch (p.type) {
    case 'life':
      player.lives++;
      break;
    case 'score':
      score += 1000;
      break;
    case 'speed':
      player.speed = CONFIG.playerSpeed + 2;
      setTimeout(() => { player.speed = CONFIG.playerSpeed; }, 10000);
      break;
  }
  // Pickup sparkle
  spawnExplosion(p.x, p.y, 8, ['#ffd700', '#ffaa00', '#ffffff']);
}

function drawPickups() {
  ctx.save();
  for (const p of pickups) {
    const bob = Math.sin(p.frame * 0.1) * 3;
    const px = p.x;
    const py = p.y + bob;

    ctx.shadowColor = CONFIG.colors.pickup;
    ctx.shadowBlur = 10;
    ctx.fillStyle = CONFIG.colors.pickup;
    ctx.strokeStyle = CONFIG.colors.pickup;
    ctx.lineWidth = 2;

    // Diamond outline
    ctx.beginPath();
    ctx.moveTo(px, py - 12);
    ctx.lineTo(px + 10, py);
    ctx.lineTo(px, py + 12);
    ctx.lineTo(px - 10, py);
    ctx.closePath();
    ctx.stroke();

    // Letter inside
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const label = p.type === 'life' ? '♦' : p.type === 'score' ? '★' : '⚡';
    ctx.fillText(label, px, py);
  }
  ctx.restore();
}

// === COLLISION DETECTION ===
function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function checkCollisions() {
  if (!player.alive) return;

  // Player hitbox (60% of visual)
  const phw = player.width * 0.6;
  const phh = player.height * 0.6;
  const phx = player.x - phw / 2;
  const phy = player.y - phh / 2;

  // Player bullets vs enemies
  for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
    const b = playerBullets[bi];
    let consumed = false;
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];

      if (e.type === 'gravwell') {
        const dx = b.x - e.x;
        const dy = b.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 13) {
          // Core hit — charge energy
          e.energy = Math.min(e.maxEnergy, e.energy + 20);
          player.shotsHit++;
          spawnExplosion(e.x, e.y, 6, ['#ffffff', '#dd88ff', '#aa44ff']);
          spawnImpactSparks(b.x, b.y, b.vx, b.vy, 6, ['#ffffff', '#dd88ff', '#aa44ff']);
          spawnHitFlash(e.x, e.y, 22);
          triggerScreenShake(2, 3);
          triggerHitStop(1);
          consumed = true;
          if (e.energy >= e.maxEnergy) {
            triggerGravNova(e, ei);
          }
          break;
        } else if (dist < 22) {
          // Struck the outer hull ring — deflect, no damage
          spawnExplosion(b.x, b.y, 3, ['#aa44ff', '#551188']);
          spawnImpactSparks(b.x, b.y, b.vx, b.vy, 5, ['#aa44ff', '#ffffff', '#551188']);
          consumed = true;
          break;
        }
        // Outside hull — bullet passes through (gravity already bent it)
        continue;
      } else if (e.type === 'turret') {
        // Angular collision — core kill, plate block, or gap pass-through
        const dx = b.x - e.x;
        const dy = b.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist <= 7) {
          // Direct core hit — instant kill
          destroyEnemy(e, ei);
          player.shotsHit++;
          consumed = true;
          break;
        }
        if (dist > 8 && dist < 22) {
          const bulletAngle = Math.atan2(dy, dx);
          const spread = 0.55;
          for (let pi = 0; pi < 4; pi++) {
            if (!e.armorPlates[pi].alive) continue;
            const plateAngle = e.bodyRotation + pi * Math.PI / 2;
            let diff = Math.abs(bulletAngle - plateAngle);
            if (diff > Math.PI) diff = Math.PI * 2 - diff;
            if (diff < spread) {
              e.armorPlates[pi].alive = false;
              e.armorPlates[pi].respawnTimer = e.armorPlates[pi].respawnFrames;
              player.shotsHit++;
              spawnExplosion(b.x, b.y, 10, ['#ffffff', '#ff00aa', '#440020']);
              spawnImpactSparks(b.x, b.y, b.vx, b.vy, 10, ['#ffffff', '#ff00aa', '#ff4400']);
              spawnHitFlash(b.x, b.y, 20);
              triggerScreenShake(2.5, 4);
              triggerHitStop(2);
              consumed = true;
              break;
            }
          }
        }
        // Bullet threaded the gap — let it continue past the turret
      } else {
        if (rectOverlap(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height,
                         e.x - e.width / 2, e.y - e.height / 2, e.width, e.height)) {
          e.hp--;
          player.shotsHit++;
          if (e.hp <= 0) {
            destroyEnemy(e, ei);
            triggerScreenShake(3, 4);
            triggerHitStop(2);
          } else {
            spawnImpactSparks(b.x, b.y, b.vx, b.vy, 8, ['#ffffff', '#00ffff', CONFIG.colors.playerBullet]);
            spawnHitFlash(b.x, b.y, 18);
            e.hitFlash = 5;
            triggerScreenShake(1.5, 3);
            triggerHitStop(1);
          }
          consumed = true;
          break;
        }
      }

      if (consumed) break;
    }
    if (consumed) playerBullets.splice(bi, 1);
  }

  // Player bullets vs gravwell orbiting asteroids
  for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
    const b = playerBullets[bi];
    let consumed = false;
    for (const e of enemies) {
      if (e.type !== 'gravwell') continue;
      for (const oa of e.orbitingAsteroids) {
        if (!oa.alive) continue;
        const wx = e.x + Math.cos(oa.angle) * oa.orbitRadius;
        const wy = e.y + Math.sin(oa.angle) * oa.orbitRadius;
        const dx = b.x - wx;
        const dy = b.y - wy;
        if (Math.sqrt(dx * dx + dy * dy) < 11) {
          oa.alive = false;
          oa.respawnTimer = oa.respawnFrames;
          player.shotsHit++;
          spawnExplosion(wx, wy, 8, ['#aaeeff', '#ffffff', '#336688']);
          spawnImpactSparks(wx, wy, b.vx, b.vy, 6, ['#ffffff', '#aaeeff']);
          spawnHitFlash(wx, wy, 14);
          triggerScreenShake(1.5, 3);
          triggerHitStop(1);
          consumed = true;
          break;
        }
      }
      if (consumed) break;
    }
    if (consumed) playerBullets.splice(bi, 1);
  }

  // Player bullets vs mid-boss orbiting asteroids
  if (midBoss && midBoss.alive) {
    for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
      const b = playerBullets[bi];
      let consumed = false;
      for (const oa of midBoss.orbitingAsteroids) {
        if (!oa.alive || oa.merging) continue;
        const wx = midBoss.x + Math.cos(oa.angle) * oa.orbitRadius;
        const wy = midBoss.y + Math.sin(oa.angle) * oa.orbitRadius;
        const dx = b.x - wx, dy = b.y - wy;
        if (Math.sqrt(dx * dx + dy * dy) < 13) {
          oa.alive = false; oa.respawnTimer = oa.respawnFrames;
          player.shotsHit++;
          spawnExplosion(wx, wy, 8, ['#aaeeff', '#ffffff', '#cc00ff']);
          spawnImpactSparks(wx, wy, b.vx, b.vy, 8, ['#ffffff', '#aaeeff', '#cc00ff']);
          spawnHitFlash(wx, wy, 16);
          triggerScreenShake(2, 3);
          triggerHitStop(1);
          consumed = true; break;
        }
      }
      if (consumed) { playerBullets.splice(bi, 1); continue; }
      // Hit mid-boss core
      const dx = b.x - midBoss.x, dy = b.y - midBoss.y;
      if (Math.sqrt(dx * dx + dy * dy) < 30 && midBoss.coreExposed) {
        midBoss.hp--;
        midBoss.hitFlash = 12;
        player.shotsHit++;
        spawnExplosion(b.x, b.y, 4, ['#cc00ff', '#ffffff', '#ff3300']);
        spawnImpactSparks(b.x, b.y, b.vx, b.vy, 10, ['#ffffff', '#cc00ff', '#ff3300']);
        spawnHitFlash(b.x, b.y, 25);
        triggerScreenShake(3, 5);
        triggerHitStop(2);
        playerBullets.splice(bi, 1);
        if (midBoss.hp <= 0) destroyMidBoss();
      }
    }
  }

  // Player bullets vs boss
  if (boss && boss.alive) {
    for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
      const b = playerBullets[bi];
      if (rectOverlap(b.x - b.width/2, b.y - b.height/2, b.width, b.height,
                       boss.x - boss.hitW/2, boss.y - boss.hitH/2, boss.hitW, boss.hitH)) {
        // Only damage if core exposed
        if (boss.coreExposed) {
          boss.hp--;
          player.shotsHit++;
          spawnExplosion(b.x, b.y, 4, ['#ffffff', '#ffff00', '#ff00aa']);
          spawnImpactSparks(b.x, b.y, b.vx, b.vy, 12, ['#ffffff', '#ffff00', '#ff00aa']);
          spawnHitFlash(b.x, b.y, 28);
          triggerScreenShake(3.5, 5);
          triggerHitStop(2);
        } else {
          spawnExplosion(b.x, b.y, 2, ['#666666', '#333333']);
          spawnImpactSparks(b.x, b.y, b.vx, b.vy, 5, ['#888888', '#444444']);
          triggerScreenShake(1, 2);
        }
        playerBullets.splice(bi, 1);

        if (boss.hp <= 0) {
          destroyBoss();
        }
        break;
      }
    }
  }

  // Dodge-break — while dodging, player smashes through enemy bodies
  if (player.dodgeTimer > 0) {
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (rectOverlap(phx, phy, phw, phh, e.x - e.width/2, e.y - e.height/2, e.width, e.height)) {
        spawnExplosion(e.x, e.y, 18, ['#ffffff', '#00ffff', '#ff00aa']);
        destroyEnemy(e, ei);
      }
    }
  }

  if (player.invincible > 0) return;

  // Enemy bullets vs player
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (rectOverlap(phx, phy, phw, phh, b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2)) {
      enemyBullets.splice(i, 1);
      killPlayer();
      return;
    }
  }

  // Enemy body vs player
  for (const e of enemies) {
    if (rectOverlap(phx, phy, phw, phh, e.x - e.width/2, e.y - e.height/2, e.width, e.height)) {
      killPlayer();
      return;
    }
  }

  // Mid-boss body vs player
  if (midBoss && midBoss.alive) {
    const dx = player.x - midBoss.x, dy = player.y - midBoss.y;
    if (Math.sqrt(dx * dx + dy * dy) < 32) { killPlayer(); return; }
  }

  // Boss body vs player
  if (boss && boss.alive) {
    if (rectOverlap(phx, phy, phw, phh, boss.x - boss.hitW/2, boss.y - boss.hitH/2, boss.hitW, boss.hitH)) {
      killPlayer();
      return;
    }
  }
}

// === SHOCKWAVES ===
const shockwaves = [];

function updateShockwaves() {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.radius += (s.maxRadius - s.radius) * 0.10 + 5;
    if (s.radius >= s.maxRadius) shockwaves.splice(i, 1);
  }
}

function drawShockwaves() {
  ctx.save();
  for (const s of shockwaves) {
    const progress = s.radius / s.maxRadius;
    const alpha = (1 - progress) * 0.85;
    ctx.strokeStyle = `rgba(230, 160, 255, ${alpha.toFixed(2)})`;
    ctx.lineWidth = 4 * (1 - progress) + 1;
    ctx.shadowColor = '#cc66ff';
    ctx.shadowBlur = 25 * (1 - progress);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.stroke();
    // Inner softer ring
    if (s.radius > 20) {
      ctx.strokeStyle = `rgba(255, 220, 255, ${(alpha * 0.4).toFixed(2)})`;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius * 0.7, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function triggerGravNova(e, index) {
  const x = e.x, y = e.y;
  const novaRadius = 170;

  // Remove the gravwell first so cascading destroyEnemy calls don't double-splice
  enemies.splice(index, 1);
  score += e.points;
  enemiesDestroyed++;

  // Massive central explosion
  spawnExplosion(x, y, 45, ['#ffffff', '#dd88ff', '#ff44ff', '#220044']);
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      spawnExplosion(
        x + (Math.random() - 0.5) * 50,
        y + (Math.random() - 0.5) * 50,
        18, ['#ffffff', '#cc88ff', '#ff44ff']
      );
    }, i * 100);
  }

  spawnLocalFlash(x, y, 240);
  shockwaves.push({ x, y, radius: 10, maxRadius: novaRadius });

  // Shrapnel: fling all orbiting asteroids outward as projectiles
  for (const oa of e.orbitingAsteroids) {
    if (!oa.alive) continue;
    const wx = x + Math.cos(oa.angle) * oa.orbitRadius;
    const wy = y + Math.sin(oa.angle) * oa.orbitRadius;
    const angle = Math.atan2(wy - y, wx - x);
    enemyBullets.push({
      x: wx, y: wy,
      vx: Math.cos(angle) * 4.5,
      vy: Math.sin(angle) * 4.5,
      radius: 10, alive: true,
      verts: oa.verts, cracks: oa.cracks,
      rotation: oa.rotation, rotSpeed: oa.rotSpeed * 3
    });
  }

  // Area damage — destroy all enemies within nova radius
  for (let ei = enemies.length - 1; ei >= 0; ei--) {
    const other = enemies[ei];
    const dx = other.x - x;
    const dy = other.y - y;
    if (Math.sqrt(dx * dx + dy * dy) < novaRadius) {
      destroyEnemy(other, ei);
    }
  }
}

function destroyEnemy(e, index) {
  const baseMultiplier = 1 + (player.xpLevel - 1) * 0.25;
  const multiplier = baseMultiplier * player.scoreMultBonus;
  score += Math.round(e.points * multiplier);
  enemiesDestroyed++;
  spawnExplosion(e.x, e.y, 12, explosionColors);

  // XP orb — every enemy drops one; size/value proportional to enemy points
  spawnXPOrb(e.x, e.y, Math.max(1, Math.round(e.points / 50)));

  // Drop logic
  if (e.type === 'spawner') {
    // Release 3 drones
    for (let d = 0; d < 3; d++) {
      spawnEnemy('drone', e.x, e.y - 20 + d * 20, { speed: 3 });
    }
  }

  // 10% chance score bonus
  if (Math.random() < 0.1) {
    spawnPickup(e.x, e.y, 'score');
  }

  enemies.splice(index, 1);
}

function popShield() {
  player.shieldActive = false;
  player.shieldRechargeTimer = player.shieldRechargeSeconds * 60;
  // Shield burst — warm gold explosion ring
  spawnExplosion(player.x, player.y, 16, ['#ffffff', '#ffee88', '#ffaa00', '#442200']);
  shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: 55 });
}

function killPlayer() {
  if (player.invincible > 0) return;
  // Shield absorbs the hit
  if (player.shieldActive) {
    popShield();
    return;
  }
  player.alive = false;
  player.lives--;
  // Upgrades persist across lives — don't reset weaponLevel
  player.shieldActive = false;
  player.shieldRechargeTimer = 0;
  player.secondary = null;
  player.secondaryAmmo = 0;
  // Big death blast — multi-stage explosion
  spawnExplosion(player.x, player.y, 35, ['#ffffff', '#00ffff', '#ff00aa', '#ff4400']);
  spawnExplosion(player.x, player.y, 20, ['#ffffff', '#ffee88', '#ff6600']);
  triggerScreenShake(12, 20);
  triggerHitStop(6);
  screenFlash = 15;
  shockwaves.push({ x: player.x, y: player.y, radius: 8, maxRadius: 90 });
  // Delayed secondary blasts
  const px = player.x, py = player.y;
  for (let i = 1; i <= 3; i++) {
    setTimeout(() => {
      spawnExplosion(
        px + (Math.random() - 0.5) * 50,
        py + (Math.random() - 0.5) * 50,
        12, ['#ff4400', '#ff8800', '#ffcc44', '#ffffff']
      );
    }, i * 120);
  }

  if (player.lives <= 0) {
    gameState = 'GAME_OVER';
  } else {
    player.respawnTimer = 90; // 1.5 seconds
  }
}

// === XP ORB SYSTEM ===
function spawnXPOrb(x, y, value) {
  if (xpOrbs.length > 80) return; // soft cap to prevent pile-ups
  const sides = 3 + Math.floor(Math.random() * 3); // 3, 4, or 5 sides
  xpOrbs.push({
    x, y,
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5) * 2,
    value,
    sides,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.07,
    pulseFrame: Math.floor(Math.random() * 60), // stagger pulse timing
    radius: 6 + value * 0.5
  });
}

function updateXPOrbs() {
  for (let i = xpOrbs.length - 1; i >= 0; i--) {
    const o = xpOrbs[i];

    o.x -= XP_ORB_DRIFT;
    if (o.x < -50) { xpOrbs.splice(i, 1); continue; }

    // Magnetic attraction — once locked, never let go
    if (player.alive) {
      const dx = player.x - o.x;
      const dy = player.y - o.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (!o.locked && dist < player.xpAttractRadius) {
        o.locked = true;
      }
      if (o.locked) {
        const nx = dx / dist;
        const ny = dy / dist;
        o.vx += nx * XP_ATTRACT_ACCEL;
        o.vy += ny * XP_ATTRACT_ACCEL;
      }
    }

    o.vx *= XP_ATTRACT_DRAG;
    o.vy *= XP_ATTRACT_DRAG;
    o.x += o.vx;
    o.y += o.vy;
    o.rotation += o.rotSpeed;
    o.pulseFrame++;

    // Collection on contact
    if (player.alive) {
      const dx = player.x - o.x;
      const dy = player.y - o.y;
      if (Math.sqrt(dx * dx + dy * dy) < o.radius + 8) {
        collectXPOrb(o);
        xpOrbs.splice(i, 1);
      }
    }
  }
}

function collectXPOrb(o) {
  player.xp += o.value;
  spawnExplosion(o.x, o.y, 5, ['#ffffff', '#00ffee', '#88ffee']);

  // Level-up check — queue card selections
  while (player.xp >= player.xpToNext) {
    player.xp      -= player.xpToNext;
    player.xpLevel++;
    player.xpToNext = Math.floor(player.xpToNext * 1.4);
    player.pendingLevelUps++;
    screenFlash = 15;
    spawnExplosion(player.x, player.y, 20, ['#ffffff', '#00ffee', '#ffff44']);
  }
}

function drawXPOrbs() {
  ctx.save();
  for (const o of xpOrbs) {
    const pulse = 0.6 + Math.sin(o.pulseFrame * 0.09) * 0.4;

    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.rotation);

    // Outer glow stroke
    ctx.shadowColor = '#00ffee';
    ctx.shadowBlur  = 10 + pulse * 10;
    ctx.strokeStyle = `rgba(0, 255, 220, ${0.4 + pulse * 0.5})`;
    ctx.lineWidth   = 1.5;

    ctx.beginPath();
    for (let s = 0; s < o.sides; s++) {
      const angle = (s / o.sides) * Math.PI * 2;
      const r = o.radius * (1 + pulse * 0.15);
      s === 0 ? ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r)
              : ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
    }
    ctx.closePath();
    ctx.stroke();

    // Translucent fill
    ctx.shadowBlur  = 5;
    ctx.fillStyle   = `rgba(0, 220, 200, ${0.15 + pulse * 0.25})`;
    ctx.beginPath();
    for (let s = 0; s < o.sides; s++) {
      const angle = (s / o.sides) * Math.PI * 2;
      const r = o.radius * 0.6;
      s === 0 ? ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r)
              : ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
    }
    ctx.closePath();
    ctx.fill();

    // Hot white center dot
    ctx.shadowBlur  = 8;
    ctx.fillStyle   = `rgba(255, 255, 255, ${0.6 + pulse * 0.4})`;
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
  ctx.restore();
}

// === BOSS SYSTEM ===
let boss = null;

function spawnBoss(stageNum) {
  const cfg = CONFIG.bosses['stage' + stageNum];
  boss = {
    x: CONFIG.width + 60,
    y: CONFIG.height / 2,
    width: 80,
    height: 80,
    hitW: 70,
    hitH: 70,
    hp: stageNum === 1 ? 80 : stageNum === 2 ? 120 : 180,
    maxHp: stageNum === 1 ? 80 : stageNum === 2 ? 120 : 180,
    name: cfg.name,
