// === MAIN LOOP ===
let lastFrameTime = 0;
const TARGET_FPS = 60;
const FRAME_MS = 1000 / TARGET_FPS; // ~16.67ms

// === SHARED GAME STATE UPDATE/DRAW ===
// Consolidates the duplicated update/draw sequences across GAMEPLAY, MID_BOSS_FIGHT, TUNNEL_GAUNTLET, BOSS_FIGHT
function updateGameFrame(opts = {}) {
  if (hitStopFrames > 0) return;
  updateScheduledActions();
  updatePlayer();
  if (opts.tunnel) updateTunnel();
  updatePlayerBullets();
  updateEnemyBullets();
  updateSpaceMines();
  updateSecondaryProjectiles();
  if (opts.enemies !== false) updateEnemies();
  if (opts.ambientAsteroids) updateAmbientAsteroids();
  if (opts.waves) updateWaves();
  if (opts.midBoss) updateMidBoss();
  if (opts.boss) updateBoss();
  updateParticles();
  if (opts.pickups) updatePickups();
  updateXPOrbs();
  updateShockwaves();
  updateLocalFlashes();
  checkCollisions();
  checkSecondaryCollisions();
  if (opts.tunnel) checkTunnelCollisions();
}

function drawGameFrame(opts = {}) {
  if (opts.tunnel) { drawTunnel(); drawTunnelHazards(); }
  drawEnemies();
  if (opts.midBoss) drawMidBoss();
  if (opts.boss) drawBoss();
  drawShockwaves();
  drawLocalFlashes();
  if (opts.pickups) drawPickups();
  drawXPOrbs();
  drawSecondaryProjectiles();
  drawPlayerBullets();
  drawEnemyBullets();
  drawSpaceMines();
  drawPlayer();
  drawShield();
  drawParticles();
  drawHUD();
}

function gameLoop(timestamp) {
  // Fixed-timestep cap at 60fps
  if (timestamp - lastFrameTime < FRAME_MS) {
    requestAnimationFrame(gameLoop);
    return;
  }
  // Advance by exactly one target frame; catch up if badly behind
  lastFrameTime += FRAME_MS;
  if (timestamp - lastFrameTime > FRAME_MS) lastFrameTime = timestamp;

  frame++;

  // Pause toggle
  if (keys['KeyP'] && (gameState === 'GAMEPLAY' || gameState === 'BOSS_FIGHT' || gameState === 'MID_BOSS_FIGHT' || gameState === 'TUNNEL_GAUNTLET')) {
    if (!keys._pHeld) {
      paused = !paused;
      keys._pHeld = true;
    }
  } else {
    keys._pHeld = false;
  }

  if (paused && (gameState === 'GAMEPLAY' || gameState === 'BOSS_FIGHT' || gameState === 'MID_BOSS_FIGHT' || gameState === 'TUNNEL_GAUNTLET')) {
    // Draw current frame frozen
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
    ctx.fillStyle = CONFIG.colors.hud;
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('P A U S E D', CONFIG.width / 2, CONFIG.height / 2);
    ctx.font = '14px monospace';
    ctx.fillStyle = 'rgba(224, 224, 255, 0.5)';
    ctx.fillText(isMobile ? 'TAP TO RESUME' : 'CLICK TO RESUME', CONFIG.width / 2, CONFIG.height / 2 + 35);
    ctx.restore();
    drawCRT();
    requestAnimationFrame(gameLoop);
    return;
  }

  // Hitstop — skip game updates but still render
  if (hitStopFrames > 0) {
    hitStopFrames--;
    // Still update particles/flashes so they animate during hitstop
    updateParticles();
    updateLocalFlashes();
    updateScreenShake();
  } else {
    updateScreenShake();
  }

  // Apply screen shake
  ctx.save();
  ctx.translate(screenShakeX, screenShakeY);

  // Show back link on menu screens only
  backLink.style.display = (gameState === 'TITLE' || gameState === 'GAME_OVER' || gameState === 'WIN') ? 'block' : 'none';

  switch (gameState) {
    case 'TITLE':
      drawTitleScreen();
      if (keys['Enter']) {
        ensureAudioCtx();
        if (!musicLoaded) {
          musicLoaded = true;
          Promise.all([loadAllMusic(), loadAllSFX()]).then(() => { playMusic('level'); });
        } else {
          stopMusicImmediate();
          playMusic('level');
        }
        resetGame();
        startStage();
      }
      break;

    case 'STAGE_INTRO':
      stageIntroTimer--;
      drawStageIntro();
      if (stageIntroTimer <= 0) {
        gameState = 'GAMEPLAY';
        if (!autofireFlash.shown) {
          autofireFlash.active = true;
          autofireFlash.frame = 0;
          autofireFlash.shown = true;
        }
      }
      break;

    case 'GAMEPLAY':
      drawBackground();
      updateGameFrame({ waves: true, ambientAsteroids: true, pickups: true });
      drawGameFrame({ pickups: true });
      drawAutofireFlash();
      drawMouseTutorial();
      drawSecondaryTutorial();
      checkPendingLevelUp();
      break;

    case 'MID_BOSS_WARNING':
      midBossWarningTimer--;
      drawMidBossWarning();
      if (midBossWarningTimer <= 0) {
        gameState = 'MID_BOSS_FIGHT';
        spawnMidBoss();
      }
      break;

    case 'MID_BOSS_FIGHT':
      drawBackground();
      updateGameFrame({ ambientAsteroids: true, midBoss: true });
      drawGameFrame({ midBoss: true });
      drawMidBossInboundAlerts();
      drawSecondaryTutorial();
      checkPendingLevelUp();
      break;

    case 'TUNNEL_WARNING':
      tunnelWarningTimer--;
      drawTunnelWarning();
      if (tunnelWarningTimer <= 0) {
        startTunnel();
      }
      break;

    case 'TUNNEL_GAUNTLET':
      drawBackground();
      updateGameFrame({ tunnel: true });
      drawGameFrame({ tunnel: true });
      checkPendingLevelUp();
      break;

    case 'BOSS_WARNING':
      bossWarningTimer--;
      drawBossWarning();
      if (bossWarningTimer <= 0) {
        gameState = 'BOSS_FIGHT';
        spawnBoss(currentStage);
      }
      break;

    case 'BOSS_FIGHT':
      drawBackground();
      updateGameFrame({ boss: true, enemies: false });
      drawGameFrame({ boss: true });

      // Boss name display for first few seconds
      if (boss && boss.frame < 180) {
        ctx.save();
        ctx.shadowColor = CONFIG.colors.boss;
        ctx.shadowBlur = 10;
        ctx.fillStyle = CONFIG.colors.hud;
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        const alpha = Math.min(1, (180 - boss.frame) / 60);
        ctx.globalAlpha = alpha;
        ctx.fillText(boss.name, CONFIG.width / 2, CONFIG.height - 60);
        ctx.font = '14px monospace';
        ctx.fillText('"' + boss.title + '"', CONFIG.width / 2, CONFIG.height - 35);
        ctx.restore();
      }
      checkPendingLevelUp();
      break;

    case 'LEVEL_UP':
      // Freeze game scene behind the overlay
      drawBackground();
      drawGameFrame({
        tunnel: tunnelActive,
        boss: !!boss,
        midBoss: !!midBoss,
        pickups: true
      });
      // Draw card overlay + handle input
      drawLevelUpScreen();
      updateLevelUpInput();
      break;

    case 'STAGE_CLEAR':
      drawStageClear();
      if (keys['Enter']) {
        keys['Enter'] = false;
        if (currentStage >= 3) {
          gameState = 'WIN';
        } else {
          currentStage++;
          shepherdMusicTriggered = false;
          shepherdTrackChoice = null;
          startStage();
          // Fresh level music for the new stage
          crossfadeTo('level');
        }
      }
      break;

    case 'GAME_OVER':
      drawGameOver();
      if (keys['Enter']) {
        keys['Enter'] = false;
        gameState = 'TITLE';
      }
      break;

    case 'WIN':
      drawWinScreen();
      if (keys['Enter']) {
        keys['Enter'] = false;
        gameState = 'TITLE';
      }
      break;
  }

  // Restore screen shake transform
  ctx.restore();

  // Screen flash effect
  if (screenFlash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${screenFlash / 30 * 0.6})`;
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
    screenFlash--;
  }

  // CRT post-processing overlay (scanlines + convex vignette)
  drawCRT();

  requestAnimationFrame(gameLoop);
}

// === CRT POST-PROCESSING ===
function drawCRT() {
  const w = CONFIG.width, h = CONFIG.height;

  // --- Scanlines ---
  ctx.save();
  for (let y = 0; y < h; y += 2) {
    // Every other row gets a dark band
    const alpha = 0.12 + 0.03 * Math.sin(y * 0.5 + frame * 0.02);
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.fillRect(0, y, w, 1);
  }

  // Faint horizontal color fringing on scanlines (RGB shift)
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.015;
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(1, 0, w, h);
  ctx.fillStyle = '#0000ff';
  ctx.fillRect(-1, 0, w, h);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // --- Convex CRT curvature vignette ---
  // Gentle darkening toward edges — enough to feel convex without obscuring HUD
  const grd = ctx.createRadialGradient(w / 2, h / 2, h * 0.35, w / 2, h / 2, h * 0.85);
  grd.addColorStop(0, 'rgba(0,0,0,0)');
  grd.addColorStop(0.6, 'rgba(0,0,0,0.04)');
  grd.addColorStop(0.8, 'rgba(0,0,0,0.10)');
  grd.addColorStop(1, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, w, h);

  // Soft edge darkening — lighter so HUD cuts through
  const edgeFade = 30;
  const topG = ctx.createLinearGradient(0, 0, 0, edgeFade);
  topG.addColorStop(0, 'rgba(0,0,0,0.12)');
  topG.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = topG;
  ctx.fillRect(0, 0, w, edgeFade);
  const botG = ctx.createLinearGradient(0, h, 0, h - edgeFade);
  botG.addColorStop(0, 'rgba(0,0,0,0.12)');
  botG.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = botG;
  ctx.fillRect(0, h - edgeFade, w, edgeFade);

  // Subtle bright highlight in center (CRT phosphor bloom)
  const bloom = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, h * 0.45);
  bloom.addColorStop(0, 'rgba(180,200,255,0.03)');
  bloom.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bloom;
  ctx.fillRect(0, 0, w, h);

  // Corner shadow curves — fully opaque so no game content leaks through
  const cornerR = 80;
  ctx.fillStyle = '#000000';
  // Top-left
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(cornerR, 0); ctx.quadraticCurveTo(0, 0, 0, cornerR); ctx.closePath(); ctx.fill();
  // Top-right
  ctx.beginPath();
  ctx.moveTo(w, 0); ctx.lineTo(w - cornerR, 0); ctx.quadraticCurveTo(w, 0, w, cornerR); ctx.closePath(); ctx.fill();
  // Bottom-left
  ctx.beginPath();
  ctx.moveTo(0, h); ctx.lineTo(cornerR, h); ctx.quadraticCurveTo(0, h, 0, h - cornerR); ctx.closePath(); ctx.fill();
  // Bottom-right
  ctx.beginPath();
  ctx.moveTo(w, h); ctx.lineTo(w - cornerR, h); ctx.quadraticCurveTo(w, h, w, h - cornerR); ctx.closePath(); ctx.fill();

  // Warm edge aura — follows the rounded CRT border
  ctx.globalCompositeOperation = 'screen';
  // Draw many thin layers that feather inward for a dithered, gradual glow
  const layers = 10;
  for (let i = 0; i < layers; i++) {
    const t = i / (layers - 1); // 0 = outermost, 1 = innermost
    const inset = t * 28;
    const r = Math.max(4, cornerR - inset * 1.5);
    // Fade from brightest at edge to nothing inward (smooth cubic falloff)
    const falloff = (1 - t) * (1 - t) * (1 - t);
    const a = (falloff * 0.018).toFixed(4);
    ctx.strokeStyle = `rgba(255,175,90,${a})`;
    ctx.lineWidth = 1.5;
    ctx.shadowColor = `rgba(255,160,80,${(falloff * 0.04).toFixed(4)})`;
    ctx.shadowBlur = 6 * (1 - t);
    ctx.beginPath();
    ctx.moveTo(r + inset, inset);
    ctx.lineTo(w - r - inset, inset);
    ctx.quadraticCurveTo(w - inset, inset, w - inset, r + inset);
    ctx.lineTo(w - inset, h - r - inset);
    ctx.quadraticCurveTo(w - inset, h - inset, w - r - inset, h - inset);
    ctx.lineTo(r + inset, h - inset);
    ctx.quadraticCurveTo(inset, h - inset, inset, h - r - inset);
    ctx.lineTo(inset, r + inset);
    ctx.quadraticCurveTo(inset, inset, r + inset, inset);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();
}

// === DEBUG: shooting range ===
// Call debugRange() from console to spawn a column of enemies in front of the player
function debugRange(type = 'drone', count = 6, spacing = 60) {
  // Start a game if not in one
  if (gameState === 'TITLE' || gameState === 'GAME_OVER') {
    resetGame();
    startStage();
  }
  gameState = 'GAMEPLAY';
  enemies.length = 0;
  enemyBullets.length = 0;
  spaceMines.length = 0;
  secondaryProjectiles.length = 0;
  player.x = 80;
  player.y = CONFIG.height / 2;
  player.lives = 99;
  player.alive = true;
  player.invincible = 60;
  const startY = CONFIG.height / 2 - ((count - 1) * spacing) / 2;
  for (let i = 0; i < count; i++) {
    const e = spawnEnemy(type, 500, startY + i * spacing, { speed: 0 });
    if (e) {
      e.hp = 3; // survive a couple hits so you can see the non-lethal impact effects
      e.maxHp = 3;
      e.fireTimer = 99999; // don't shoot back
    }
  }
}

// === DEBUG: tunnel test ===
// Call debugTunnel() from console to jump straight to the tunnel gauntlet
function debugTunnel() {
  if (gameState === 'TITLE' || gameState === 'GAME_OVER') {
    resetGame();
    startStage();
  }
  enemies.length = 0;
  enemyBullets.length = 0;
  spaceMines.length = 0;
  secondaryProjectiles.length = 0;
  player.x = 80;
  player.y = CONFIG.height / 2;
  player.lives = 99;
  player.alive = true;
  player.invincible = 60;
  gameState = 'TUNNEL_WARNING';
  tunnelWarningTimer = 60;
}

// === MUSIC SYSTEM ===
let audioCtx = null;
const musicTracks = {};       // name → AudioBuffer
let currentMusic = null;      // { source, gain, name }
const MUSIC_VOLUME = 0.4;
const CROSSFADE_MS = 2000;    // 2-second crossfade between tracks
let shepherdTrackChoice = null;
let shepherdMusicTriggered = false;

function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

async function loadMusicTrack(name, url) {
  try {
    const resp = await fetch(url);
    const buf = await resp.arrayBuffer();
    musicTracks[name] = await audioCtx.decodeAudioData(buf);
  } catch (e) {
    console.warn('Failed to load music:', name, e);
  }
}

async function loadAllMusic() {
  ensureAudioCtx();
  await Promise.all([
    loadMusicTrack('level',     'audio/drifting-the-void.mp3'),
    loadMusicTrack('level2',    'audio/drifting-the-void2.mp3'),
    loadMusicTrack('shepherd1', 'audio/the-shepherd.mp3'),
    loadMusicTrack('shepherd2', 'audio/the-shepherd2.mp3'),
  ]);
}

function playMusic(name, { fadeIn = CROSSFADE_MS, loop = true } = {}) {
  if (!audioCtx || !musicTracks[name]) return;
  const buffer = musicTracks[name];
  const gain = audioCtx.createGain();
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(MUSIC_VOLUME, audioCtx.currentTime + fadeIn / 1000);

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.loop = loop;
  source.connect(gain);
  source.start(0);

  currentMusic = { source, gain, name };
}

function stopMusic(fadeOut = CROSSFADE_MS) {
  if (!currentMusic || !audioCtx) return;
  const { gain, source } = currentMusic;
  const now = audioCtx.currentTime;
  gain.gain.cancelScheduledValues(now);
  gain.gain.setValueAtTime(gain.gain.value, now);
  gain.gain.linearRampToValueAtTime(0, now + fadeOut / 1000);
  const s = source;
  setTimeout(() => { try { s.stop(); } catch (_) {} }, fadeOut + 100);
  currentMusic = null;
}

function crossfadeTo(name, duration = CROSSFADE_MS) {
  if (currentMusic && currentMusic.name === name) return;
  stopMusic(duration);
  playMusic(name, { fadeIn: duration });
}

function stopMusicImmediate() {
  if (!currentMusic) return;
  try { currentMusic.source.stop(); } catch (_) {}
  currentMusic = null;
}

// === SFX SYSTEM ===
const sfxBuffers = {};     // name → AudioBuffer
const SFX_VOLUMES = {
  'player-shoot': 0.2,
  'bomber-death': 0.4,
  'xp-pickup':   0.3,
};

async function loadSFX(name, url) {
  try {
    const resp = await fetch(url);
    const buf = await resp.arrayBuffer();
    sfxBuffers[name] = await audioCtx.decodeAudioData(buf);
  } catch (e) {
    console.warn('Failed to load SFX:', name, e);
  }
}

async function loadAllSFX() {
  await Promise.all([
    loadSFX('player-shoot', 'audio/player-shoot.mp3'),
    loadSFX('bomber-death', 'audio/bomber-death.mp3'),
    loadSFX('xp-pickup-1',  'audio/xp-shard-pickup.mp3'),
    loadSFX('xp-pickup-2',  'audio/xp-shard-pickup-2.mp3'),
  ]);
}

function playSFX(name, volume) {
  if (!audioCtx || !sfxBuffers[name]) return;
  const gain = audioCtx.createGain();
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(volume ?? 0.3, audioCtx.currentTime);
  const source = audioCtx.createBufferSource();
  source.buffer = sfxBuffers[name];
  source.connect(gain);
  source.start(0);
}

function playRandomXPPickup() {
  if (Math.random() < 0.5) {
    playSFX('xp-pickup-1', 0.1);
  } else {
    playSFX('xp-pickup-2', 0.9);
  }
}

let musicLoaded = false;

// === INIT ===
gameLoop();
