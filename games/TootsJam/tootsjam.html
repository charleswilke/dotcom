<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toots Jam - Trick Shot City Hoops</title>
  <!-- Open Graph / link preview (Facebook, Discord, Slack, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://charleswilke.com/tootsjam/" />
  <meta property="og:title" content="Toots Jam - Trick Shot City Hoops" />
  <meta property="og:image" content="https://charleswilke.com/images/tootsjam.jpg" />
  <meta property="og:image:width" content="960" />
  <meta property="og:image:height" content="720" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://charleswilke.com/images/tootsjam.jpg" />
  <meta name="twitter:title" content="Toots Jam - Trick Shot City Hoops" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="frame">
    <div id="splash" class="splash">
      <div class="splash-card">
        <h1 id="splashTitle"><img class="splash-title-image" src="images/tootsjam.png" alt="Toots Jam" /></h1>
        <p class="splash-subtitle">Trick Shot City Hoops</p>
        <p id="splashYear">2026</p>
        <p>Created by Charles Wilke</p>
        <div class="splash-actions">
          <label class="level-label" for="startLevel">Level</label>
          <select id="startLevel" class="level-select" disabled>
            <option value="1">1 - Night City</option>
            <option value="2">2 - Sunrise City</option>
            <option value="3">3 - Afternoon City</option>
            <option value="4">4 - Golden Hour City</option>
            <option value="5">5 - Space</option>
            <option value="6">6 - Alien Base</option>
          </select>
          <button id="freeThrowModeBtn" class="toggle-btn" type="button" aria-pressed="false" disabled>Free Throw: Off</button>
          <button id="startBtn" class="toggle-btn splash-start" type="button" disabled>Press Start</button>
        </div>
        <p id="runSummary" class="run-summary hidden"></p>
        <form id="scoreSubmitForm" class="score-submit hidden" novalidate>
          <label class="level-label" for="scoreInitials">Initials</label>
          <input id="scoreInitials" class="initials-input" type="text" inputmode="latin" autocomplete="off" maxlength="3" placeholder="AAA" aria-label="Initials (3 letters)" />
          <button id="submitScoreBtn" class="toggle-btn" type="submit">Post Score</button>
        </form>
        <p id="scoreSubmitStatus" class="score-submit-status hidden"></p>
        <div class="leaderboard-wrap">
          <div class="leaderboard-tabs">
            <button id="leaderboardNormalBtn" class="toggle-btn leaderboard-tab is-active" type="button" aria-pressed="true">Normal</button>
            <button id="leaderboardFreeThrowBtn" class="toggle-btn leaderboard-tab" type="button" aria-pressed="false">Free Throw</button>
          </div>
          <div id="leaderboardTitle" class="leaderboard-title">Top Scores - Normal</div>
          <ol id="leaderboardList" class="leaderboard-list"></ol>
          <p id="leaderboardStatus" class="leaderboard-status">Loading...</p>
        </div>
      </div>
    </div>
    <div class="hud">
      <div id="score">Score: 0</div>
      <div id="combo">Combo: x0</div>
      <div id="timer">Time: 2:00</div>
      <div id="nextLevel">Next: L2 in 20</div>
      <div id="state">Hold to Shoot</div>
    </div>
    <canvas id="game" width="960" height="720"></canvas>
    <div class="controls">
      <button id="muteChargeBtn" class="toggle-btn" type="button">Silence that man</button>
    </div>
    <div class="controls controls-right">
      <button id="sessionResetBtn" class="toggle-btn" type="button">Reset Game</button>
    </div>
    <div class="help">Left click or space: charge shot. Release to throw. Right click: dribble. R: reset ball.</div>
  </div>
  <script src="game.js" defer></script>
</body>
</html>
