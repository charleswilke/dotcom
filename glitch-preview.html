<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Glitch lab — Charles Wilke</title>
    <link rel="stylesheet" href="/styles.css?v=b2040d46">
    <style>
        body { margin: 0; min-height: 100vh; background: #100e24; color: #fff5d5; font-family: system-ui, sans-serif; }
        .lab { max-width: 1100px; margin: auto; padding: 32px 24px 64px; }
        .lab a { color: #81dfff; }
        .lab-heading { margin: 32px 0 12px; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; }
        .lab-intro { color: #bdb6d3; line-height: 1.6; margin-bottom: 28px; }
        .stage { min-height: 260px; display: grid; place-items: center; border: 1px solid #63518c; border-radius: 16px; overflow: hidden; background: linear-gradient(0deg, #49327966, transparent), repeating-linear-gradient(0deg, transparent 0 3px, #0002 3px 4px), radial-gradient(ellipse at center, #34266a, #141126); }
        .stage .header-wordmark { width: min(850px, 86%); margin: 0; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
        .effect { text-align: left; padding: 20px; border: 1px solid #625477; border-radius: 12px; color: #fff5d5; background: #211b36; cursor: pointer; font: inherit; }
        .effect:hover { background: #302447; border-color: #00cfff; }
        .effect:focus-visible, .lab input:focus-visible { outline: 3px solid #00cfff; outline-offset: 4px; }
        .effect[aria-pressed="true"] { border-color: #00cfff; box-shadow: inset 0 3px #00cfff; }
        .effect strong { display: block; margin-bottom: 8px; font-size: 18px; }
        .effect span { display: block; color: #bdb6d3; font-size: 14px; line-height: 1.5; }
        .options { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
        .options label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
        .options input { width: 18px; height: 18px; accent-color: #00cfff; }
        #status { min-height: 24px; margin-top: 20px; color: #bdb6d3; }
        .header-wordmark.slow .wordmark-signal,
        .header-wordmark.slow > img { animation-duration: 1200ms; }
        @media (max-width: 640px) {
            .lab { padding: 24px 16px; }
            .stage { min-height: 180px; }
            .controls { grid-template-columns: 1fr; }
            .effect { padding: 16px; }
        }
    </style>
</head>
<body>
    <main class="lab">
        <a href="/">← Back to the site</a>
        <h1 class="lab-heading">Glitch lab</h1>
        <p class="lab-intro">Tap an effect to fire it. Tap again to replay. The header now mixes color split and soft separation. Signal tear stays here for comparison only.</p>
        <div class="stage">
            <div class="header-wordmark" id="wordmark">
                <img src="/images/charles-wilke-wordmark-v3.svg" alt="Charles Wilke" width="1115" height="175">
                <span class="wordmark-signal" aria-hidden="true" style="--wordmark-art: url('/images/charles-wilke-wordmark-v3.svg')"></span>
            </div>
        </div>
        <div class="controls" aria-label="Glitch effects">
            <button type="button" class="effect" data-effect="chroma" aria-pressed="false"><strong>01 / Color split</strong><span>Red throws left. Cyan throws right. The full-name, 3D-glasses effect.</span></button>
            <button type="button" class="effect" data-effect="tear" aria-pressed="false"><strong>02 / Signal tear</strong><span>A fixed horizontal band snaps sideways, with a tiny sync twitch.</span></button>
            <button type="button" class="effect" data-effect="soft" aria-pressed="false"><strong>03 / Soft separation</strong><span>A tighter coral and mint split, for comparison with the stronger colors.</span></button>
        </div>
        <div class="options">
            <label><input type="checkbox" id="slow"> Slow motion</label>
            <label><input type="checkbox" id="hold"> Hold the peak frame</label>
        </div>
        <p id="status" role="status">Choose an effect. Nothing plays automatically.</p>
    </main>
    <script>
        const wordmark = document.getElementById('wordmark');
        const buttons = [...document.querySelectorAll('[data-effect]')];
        const slow = document.getElementById('slow');
        const hold = document.getElementById('hold');
        const status = document.getElementById('status');
        const motion = matchMedia('(prefers-reduced-motion: reduce)');
        let selected;
        let cleanup;

        function play(effect) {
            clearTimeout(cleanup);
            selected = effect;
            wordmark.className = 'header-wordmark';
            void wordmark.offsetWidth; // Restart even when replaying the same effect.
            buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.effect === effect)));
            if (motion.matches) {
                status.textContent = 'Reduced motion is enabled on your device; animations are paused.';
                return;
            }
            wordmark.classList.toggle('slow', slow.checked);
            wordmark.classList.toggle('signal-soft', effect === 'soft');
            wordmark.classList.add(effect === 'tear' ? 'signal-tear' : 'signal-chroma');
            const name = buttons.find(button => button.dataset.effect === effect).querySelector('strong').textContent;
            if (hold.checked) {
                wordmark.getAnimations({ subtree: true }).forEach(animation => {
                    animation.pause();
                    animation.currentTime = Number(animation.effect.getTiming().duration) * .12;
                });
                status.textContent = name + ' — peak frame held.';
            } else {
                status.textContent = name + (slow.checked ? ' — slow motion.' : ' — playing.');
                cleanup = setTimeout(() => {
                    wordmark.className = 'header-wordmark';
                    status.textContent = name + ' — tap to replay.';
                }, slow.checked ? 1200 : effect === 'tear' ? 300 : 240);
            }
        }
        buttons.forEach(button => button.addEventListener('click', () => play(button.dataset.effect)));
        [slow, hold].forEach(input => input.addEventListener('change', () => { if (selected) play(selected); }));
        motion.addEventListener('change', () => {
            clearTimeout(cleanup);
            wordmark.className = 'header-wordmark';
            status.textContent = motion.matches ? 'Reduced motion is enabled on your device; animations are paused.' : 'Choose an effect to replay.';
        });
    </script>
</body>
</html>
