<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>OG Image Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Space Mono', monospace;
}

.og-card {
    display: flex;
    width: 1200px;
    height: 630px;
    background: #1a1550;
}

/* Left: Portrait */
.og-portrait {
    width: 420px;
    height: 630px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
}

.og-portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    filter: grayscale(0.1) contrast(1.05);
}


/* Right: CRT content — mirrors the rss-feed background on the live site */
.og-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 70px 60px 40px;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 40%, rgba(0, 247, 194, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(255, 90, 54, 0.22) 0%, transparent 60%),
        linear-gradient(180deg, #1a1550 0%, #0e0a36 100%);
}

/* Radar sweep rings + vignette — matches the rss-feed::after on the live site,
   but punched up so the rings actually read at 1200×630 thumbnail sizes */
.og-radar {
    position: absolute;
    inset: 0;
    background-image:
        repeating-radial-gradient(
            circle at -180px 230px,
            transparent 0px,
            transparent 70px,
            rgba(0, 247, 194, 0.85) 70px,
            rgba(0, 247, 194, 0.85) 74px
        );
    pointer-events: none;
    z-index: 1;
}

/* Scanlines — matches the site's rss-feed cadence (1px on 3px) */
.og-content::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0, 247, 194, 0.08) 0px,
        rgba(0, 247, 194, 0.08) 1px,
        transparent 1px,
        transparent 3px
    );
    pointer-events: none;
    z-index: 2;
}

/* SMPTE colorbar accent strip across the bottom */
.og-colorbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 6px;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.16) 0px,
            rgba(0, 0, 0, 0.16) 1px,
            transparent 1px,
            transparent 3px
        ),
        linear-gradient(
            90deg,
            #d8d300 0 14%,
            #18d8d0 14% 29%,
            #00d922 29% 43%,
            #e500cb 43% 58%,
            #d50000 58% 72%,
            #1000d7 72% 86%,
            #0b1036 86% 100%
        );
    z-index: 4;
}


.og-content > * {
    position: relative;
    z-index: 3;
}

.og-name {
    font-size: 52px;
    font-weight: 700;
    color: #f0eee6;
    letter-spacing: 8px;
    text-transform: uppercase;
    text-shadow:
        0 0 10px rgba(0, 247, 194, 0.3),
        0 0 30px rgba(0, 247, 194, 0.15),
        0 0 60px rgba(0, 247, 194, 0.08);
    margin-bottom: 24px;
    line-height: 1.1;
}

.og-divider {
    width: 80px;
    height: 3px;
    background: #00f7c2;
    opacity: 0.6;
    margin-bottom: 28px;
    box-shadow: 0 0 8px rgba(0, 247, 194, 0.4);
}

.og-subtitle {
    font-size: 18px;
    font-weight: 400;
    color: rgba(240, 238, 230, 0.7);
    letter-spacing: 3px;
    text-transform: uppercase;
    line-height: 1.6;
}

.og-subtitle span {
    display: block;
}

.og-slash {
    color: rgba(0, 247, 194, 0.4);
    margin-right: 0.3em;
}

.og-url {
    position: absolute;
    bottom: 36px;
    right: 70px;
    font-size: 14px;
    font-weight: 400;
    color: rgba(240, 238, 230, 0.25);
    letter-spacing: 2px;
    z-index: 3;
}
</style>
</head>
<body>
<div class="og-card">
    <div class="og-portrait">
        <img src="images/cw4.webp" alt="Charles Wilke">
    </div>
    <div class="og-content">
        <div class="og-radar"></div>
        <div class="og-name">Charles<br>Wilke</div>
        <div class="og-divider"></div>
        <div class="og-subtitle">
            <span><span class="og-slash">//</span> product designer - writer - builder</span>
            <span><span class="og-slash">//</span> exploring ai co-creation across mediums</span>
        </div>
        <div class="og-url">charleswilke.com</div>
        <div class="og-colorbar"></div>
    </div>
</div>
</body>
</html>
