<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Recently — mobile sticker set</title>
  <link rel="stylesheet" href="/styles.css?v=20261028-mobile-pause-fade-1">
  <link rel="stylesheet" href="/recently-stickers.css?v=20261027-mobile-1">
  <style>
    body.sticker-study { margin: 0; background: #100f18; color: #f8e9d2; }
    .study-intro { max-width: 780px; margin: auto; padding: 24px 20px; }
    .study-intro h1 { font: 600 20px/1.3 Arial,sans-serif; margin: 0 0 10px; }
    .study-intro p { font: 12px/1.7 'Space Mono',monospace; margin: 0; color: #b9abbf; }
    .study-intro a { color: #f8e9d2; text-underline-offset: 4px; }
    .sticker-study .dimensional-showcase { padding: 32px 20px 48px; min-height: 600px; }
    .sticker-gallery { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px 36px; max-width: 716px; margin: auto; }
    .sticker-gallery img { display: block; width: 100%; height: auto; }
    .study-note { font: 11px/1.7 'Space Mono',monospace; color: #b6a9bd; margin: 20px 0 0; }
    @media (max-width: 600px) {
      .sticker-gallery { grid-template-columns: minmax(0,1fr); max-width: 340px; gap: 14px; }
      .sticker-study .dimensional-showcase { padding: 28px 22px 40px; }
    }
  </style>
</head>
<body class="sticker-study">
  <div class="study-intro">
    <h1>Recently, in sticker form.</h1>
    <p>All six at phone width. <a href="/index.html?recently=posters#portfolio">Back to the poster edition ↗</a></p>
  </div>
  <main>
    <section class="dimensional-showcase" aria-label="Six Recently stickers at mobile width">
      <div class="sticker-gallery">
        <article>
          <h2 class="sr-only">Toast IQ</h2>
          <a class="sticker-sample sticker-toast" href="https://pos.toasttab.com/blog/data/restaurant-ai-report" target="_blank" rel="noopener noreferrer" aria-label="Toast IQ — view the Restaurant AI Report">
            <span class="sticker-cutout">
              <span class="sticker-art">
                <img src="/images/recently-stickers/toast-iq.webp" width="1080" height="360" alt="" fetchpriority="high">
              </span>
            </span>
          </a>
        </article>
        <article>
          <h2 class="sr-only">The Before Times</h2>
          <a class="sticker-sample sticker-before" href="/before-times.html" aria-label="The Before Times — enter the archive">
            <span class="sticker-cutout"><span class="sticker-art"><img src="/images/recently-stickers/before-times.webp" width="1080" height="360" alt=""></span></span>
          </a>
        </article>
        <article>
          <h2 class="sr-only">Junkyard Cabaret</h2>
          <a class="sticker-sample sticker-cabaret" href="/index.html?recently=posters#junkyard-cabaret" aria-label="Junkyard Cabaret — open the album">
            <span class="sticker-cutout"><span class="sticker-art"><img src="/images/recently-stickers/junkyard-cabaret.webp" width="1080" height="360" alt="" decoding="async"></span></span>
          </a>
        </article>
        <article>
          <h2 class="sr-only">Grief Without Ritual</h2>
          <a class="sticker-sample sticker-grief" href="/index.html?recently=posters#gwor" aria-label="Grief Without Ritual — open the album">
            <span class="sticker-cutout"><span class="sticker-art"><img src="/images/recently-stickers/grief-without-ritual.webp" width="1080" height="360" alt="" decoding="async"></span></span>
          </a>
        </article>
        <article>
          <h2 class="sr-only">Spectator to Initiator</h2>
          <a class="sticker-sample sticker-spectator" href="/index.html?recently=posters#s2i" aria-label="Spectator to Initiator — display the talk">
            <span class="sticker-cutout"><span class="sticker-art"><img src="/images/recently-stickers/spectator-to-initiator.webp" width="1080" height="360" alt="" decoding="async"></span></span>
          </a>
        </article>
        <article>
          <h2 class="sr-only">Space Toots</h2>
          <a class="sticker-sample sticker-space" href="/games/SpaceToots/index.html" aria-label="Space Toots — launch the arcade">
            <span class="sticker-cutout"><span class="sticker-art"><img src="/images/recently-stickers/space-toots.webp" width="1080" height="360" alt="" decoding="async"></span></span>
          </a>
        </article>
      </div>
      <div class="study-intro"><p class="study-note">Square cut edges. Six ink palettes. About 100px of sticker per project.</p></div>
    </section>
  </main>
</body>
</html>
